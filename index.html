.opts{display:flex; flex-direction:column; gap:9px; margin-top:20px}
.opt{display:block; width:100%; text-align:left; cursor:pointer;

.opt .lab{font-weight:500}
.opt .hint{display:block; font-size:12.5px; color:var(--ink-3); margin-top:2px}

.btn{cursor:pointer; font:inherit; font-weight:500; border-radius:3px; padding:11px 22px;

.btn:hover{opacity:.86}
.btn:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
.btn.ghost{background:transparent; color:var(--ink); border-color:var(--line-2)}

/* ---- outcome ---- */
.outcome{margin-top:18px; padding:15px 18px; border-left:3px solid var(--accent);

.deltas{display:flex; flex-wrap:wrap; gap:7px; margin-top:13px}

.stat .val{font-size:12.5px; font-weight:600; flex:0 0 26px; text-align:right}

.kv{display:flex; justify-content:space-between; gap:10px; padding:5px 0; font-size:13.5px; border-bottom:1px dotted var(--line)}

.kv .k{color:var(--ink-3)}
.kv .v{font-weight:600; text-align:right}

.hud .hv{font-size:14px; font-weight:600; font-family:"JetBrains Mono",monospace; font-variant-numeric:tabular-nums}

.pick .m{font-size:11.5px; color:var(--accent); margin-top:7px; letter-spacing:.02em}

/* ---- MBTI 選擇 ---- */
.mbti-row{margin-bottom:9px}
.mbti-pair{display:grid; grid-template-columns:1fr 1fr; gap:9px}
.mbti-b{cursor:pointer; text-align:left; background:var(--surface-2); border:1px solid var(--line-2);

.mbti-b.on{background:var(--accent-wash); border-color:var(--accent)}

.fbfield{width:100%; margin-top:8px; padding:11px 13px; font:inherit; font-size:14.5px; color:var(--ink);

.verdict{font-family:"Noto Serif TC",Georgia,serif; font-size:19px; line-height:1.9; margin:0 0 4px}

let SEED = 0, rngState = 0;
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

/* ============ 版本紀錄（開場頁腳可展開） ============ */
const GAME_VERSION = 'v25';

/* ===== 公司 ESG 評分（item 6）=====
   仿 CSA／DJSI 的做法：0–100、產業相對、底部很重（多數落在 25–45，頂標才 70+）。
   分數會隨「年份（法規推著跑）」與「有人投入去做」而緩步上升——這也是為什麼
   你進去做實事，公司的評分會慢慢往上爬。基準值 esg0 存在各公司資料裡。 */
function industryPush(emp, y){
  // 指標品牌帶動 + 產業成熟度：越成熟的產業，同儕被逼著往上跑（item 8）
  const yrsIn = Math.max(0, (y + indMat(emp.ind)) - 2018);
  return Math.min(14, yrsIn * 0.9);   // 產業成熟帶動，但收斂上限讓頂標仍有層次
}
/* ===== 公司 ESG 三面向與評比參與（item 1, 2）=====
   真實世界最大的分數落差不是「做得好不好」，而是<有沒有填那份問卷>：
   有參與評比的重工業（水泥、鋼鐵、航空）常在 84-90，
   不參與的科技或食品大廠只拿到 30-40 的公開資訊評分，未受評的中小企業則根本沒有分數。
   這也給了玩家一個真實的槓桿：把一家沒在做評比的公司推上評比，分數會跳一大階。 */
function csaState(emp){
  if(!emp || !emp.esg) return null;
  if(S && S.csaFlip && S.csaFlip[emp.id]) return 1;   // 玩家推動公司開始參與
  return emp.csa;
}
function esgDims(emp, y){
  if(!emp || !emp.esg) return null;
  y = y || (S && S.year) || 2024;
  const push = industryPush(emp, y);
  const st = csaState(emp);
  const boost = (S && S.esgBoost && S.esgBoost[emp.id]) || 0;
  const bd = (S && S.esgBoostDim && S.esgBoostDim[emp.id]) || {};
  const out={};
  ['e','s','g'].forEach(function(k){
    let v = emp.esg[k] + push + boost*0.5 + (bd[k]||0);
    if(st===0) v *= 0.62;                 // 沒參與評比：只拿得到公開資訊的分數
    else if(st===1 && emp.csa===0) v *= 1.0;  // 玩家推動後，回到實際水準
    out[k]=Math.max(3, Math.min(95, Math.round(v)));
  });
  return out;
}
function companyESG(emp, y){
  const st = csaState(emp);
  if(st===-1) return null;                // 未受評
  const d = esgDims(emp, y);
  if(!d) return null;
  return Math.round((d.e + d.s + d.g)/3);
}
/* 職缺的面向（item 2）：分數高、有制度的公司職缺分得細；

function roleFocus(emp){
  const st = csaState(emp), sc = companyESG(emp, S.year);
  if(st===-1 || sc===null || sc<50 || st===0) return {k:'all', n:'全包'};
  const d = esgDims(emp, S.year);

  if(tz<=3) return {k:'all', n:'全包'};

  arr.sort(function(a,b){ return d[b[0]]-d[a[0]] });
  const pickd = arr[0];
  return {k:pickd[0], n:pickd[1], stat:pickd[2]};
}
function esgBand(v){
  if(v==null) return '';

}

/* 四大：只以顏色代稱，畫面與程式碼皆不出現任何事務所本名 */
function isBig4(e){ return !!(e && e.big4) }
const BIG4 = ['b4y','b4o','b4g','b4b'];
/* 四大四間出現機率相同 */
function pickBig4(){
  const w = {b4y:3, b4o:3, b4g:3, b4b:3};
  const ids = BIG4.slice(); let tot=0; ids.forEach(function(k){ tot+=w[k] });
  let r=rnd()*tot;
  for(const k of ids){ r-=w[k]; if(r<=0) return EMP.find(function(e){ return e.id===k }) }
  return EMP.find(function(e){ return e.id==='b4y' });
}

/* ===== 真實薪資分布（item 4）=====
   來源：業界公開的永續職涯薪資調查。
   永續年資 0-2 年 中位 75 萬／3-5 年 中位 85 萬／6-11 年 中位 135 萬；
   全體分布（人數）：50↓12、50-70:37、70-90:40、90-110:17、110-130:11、130-150:6、150-200:8、200↑6。
   遊戲用它來（a）校準職級基準（b）在結局告訴玩家「你在真實分布裡的位置」。 */
const REAL_SALARY_BUCKETS = [
 {hi:50,  n:12}, {hi:70,  n:37}, {hi:90,  n:40}, {hi:110, n:17},
 {hi:130, n:11}, {hi:150, n:6},  {hi:200, n:8},  {hi:9999,n:6}
];
const REAL_MEDIAN_BY_ESGYRS = [[2,75],[5,85],[11,135]];
function realMedianFor(yrs){
  for(const [y,m] of REAL_MEDIAN_BY_ESGYRS){ if(yrs<=y) return m }
  return 135;
}
/* 這份調查的整體中位數（用來把分布平移到「跟你同年資的人」身上） */
const REAL_SURVEY_MEDIAN = 80;
/* 最高一段（200 萬以上）的實際上緣。原本寫 9999，導致任何人破兩百萬都卡在 PR96
   ——因為那一段幾乎不累積人數。改成有限上緣，PR 才會在高薪區continue分辨。 */
const REAL_TOP_HI = 520;
/* 你在真實分布裡的位置。
   玩家都是四十歲、十幾年年資，拿他去比「所有年資混在一起」的分布並不公平，
   所以先依年資把分布整體平移（同年資的人薪水本來就比較高），再算百分位。 */
function salaryPercentile(pay, yrs){
  const scale = Math.max(1, realMedianFor(yrs===undefined ? (S?S.esgYrs:0) : yrs) / REAL_SURVEY_MEDIAN);
  const tot = REAL_SALARY_BUCKETS.reduce(function(a,b){return a+b.n},0);
  let below=0, prevHi=0;
  for(const b of REAL_SALARY_BUCKETS){
    const hi = (b.hi>=9999 ? REAL_TOP_HI : b.hi) * scale;
    if(pay < hi){
      const span=hi-prevHi, into=Math.max(0,pay-prevHi);
      below += b.n * (span>0? into/span : 0);
      break;
    }
    below += b.n; prevHi=hi;
  }
  return Math.max(1, Math.min(99, Math.round(below/tot*100)));
}

const LEVELS = [
 {t:'永續專員',      base:66, cap:118, need:{cw:0,  yr:0}},
 {t:'資深永續專員',  base:82, cap:155, need:{cw:50, yr:3}},

];
/* ===== 薪資天花板 =====
   這一行真實的薪資是有頂的：職級 × 產業係數決定上限，超過的部分視為一次性獎金，
   隔年會被拉回。沒有這道閘門，靠跳槽複利可以滾到不合理的數字。 */
function payCap(){
  const lv = LEVELS[Math.max(0,Math.min(LEVELS.length-1,S.level))];
  const ind = (S.emp && IND[S.emp.ind]) || {c:1};
  let c = lv.cap * Math.min(1.22, Math.max(0.85, ind.c));
  /* 極少數的頂：真正的集團級永續長（護國神山、大金控、外商總部線）年薪可以到七、八百萬。
     這條路要同時滿足「在那幾家公司」＋「坐上永續長」＋「拿到集團層級的頭銜」，
     所以在真實分布裡它是個位數的人——但它存在，而且應該讓玩家看得到。 */
  if(S.apexTitle && S.level>=4 && S.emp && S.emp.apex) c = 735;
  if(isFreelance()) c = lv.cap * 1.18;      // 接案：沒有職級紅利，但接得動就有
  if(!S.inESG) c = 235;                      // 非永續職另計
  if(S.polit) c = 260;                       // 公職薪資法定，不套企業職級天花板
  return Math.round(c);
}
function clampPay(){
  const cap = payCap();
  if(S.pay > cap){
    S.pay = Math.round(cap + (S.pay - cap) * 0.22);   // 溢出的部分逐年回歸
    if(S.pay > cap*1.06) S.pay = Math.round(cap*1.06);
  }
  return S.pay;
}

/* ===== 關係力 =====
   上限 30，但越往上越難推：認識的人到一個程度之後，多認識一個人的邊際效益是遞減的。
   （原本上限 20 且線性成長，中期就頂到天花板，後面所有社交選擇都失去意義。）*/
/* 冷門產業：永續職缺少、討論度低，但待久了會變成「全台灣少數懂的人」 */
const NICHE_IND = ['steel','chem','text','food','build','ship','air','util','pharma','retail','green','pub'];
const REL_MAX = 30;
function relRate(v){
  if(v < 10) return 1;
  if(v < 15) return 0.68;
  if(v < 20) return 0.44;
  if(v < 25) return 0.26;
  return 0.14;
}
function relAdd(v){
  if(!v) return 0;
  if(v < 0){ const before=S.rel; S.rel=Math.max(0,S.rel+v); return S.rel-before; }
  /* 逐點套用遞減率，零頭累積起來不浪費 */
  let acc = (S.relFrac||0);
  for(let i=0;i<v;i++) acc += relRate(S.rel + Math.floor(acc));
  const gain = Math.min(Math.floor(acc), REL_MAX - S.rel);
  S.relFrac = acc - Math.floor(acc);
  S.rel = Math.min(REL_MAX, S.rel + Math.max(0,gain));
  return Math.max(0, gain);
}

/* ============ 薪資 ============ */
function calcPay(emp, level){
  const ind = IND[emp.ind]||{c:1};
  const m = mk(S.year)[1];
  const tenureBonus = Math.min(.35, (S.workYrs - S.esgYrs) * .05);
  let p = LEVELS[level].base * ind.c * emp.mult * (.80 + m/250) * (1+tenureBonus);
  p *= (0.94 + rnd()*0.16);
  return Math.round(p);
}
function tryPromote(){
  if(!S.emp) return false;          // 收攤／離職當年沒有雇主，不做升遷判定
  if(S.polit) return false;         // 公職的升遷是選票與內閣改組決定的，不走企業職級
  const nxt = LEVELS[S.level+1];
  if(!nxt) return false;
  const n = nxt.need;
  /* 四大的升遷是有時程表的（item 6，對齊真實調查）：
     顧問 →約2年→ 資深顧問 →再2-3年→ 副理／經理。制度化，但上面越來越窄。 */
  const b4 = S.emp && S.emp.big4;
  const needYr = b4 ? [0,2,5,9,13][S.level+1] : n.yr;
  const needCw = b4 ? Math.round(n.cw*0.88) : n.cw;
  if(cw()>=needCw && S.esgYrs>=needYr && (!n.G||S.G>=n.G) && (!n.rel||S.rel>=n.rel)){
    let pr = .30 + S.luck*.010 + S.rel*.008 + (S.level===3?.06:0);
    if(S.crossTitle) pr += .14;      // 本業 x 永續 = 不可取代
    if(S.stampPath==='strategy') pr += .12;   // 破關後走策略線 → 升遷邏輯站你這邊
    if(S.stampPath==='stall') pr -= .12;      // 停在原地 → 難再往上
    if(isAdrift()) pr -= .22;        // 全方位但無定位
    /* 位子是有限的：協理以上，小公司根本沒有那麼多層 */
    if(S.level>=3 && S.emp && S.emp.tier==='中後段' && !S.crossTitle) pr *= 0.45;
    if(S.level>=3 && isFreelance()) pr *= 0.6;
    if(b4 && S.level<=2) pr += .14;     // 四大前段升遷制度化，快而穩
    if(b4 && S.level>=3) pr -= .10;     // 但協理以上位子少，多數人在這裡離開
    /* 永續長普及率（item 8）：2022 年僅 9% 企業專設永續長（金融 16.7% 最高）。
       ESG 分數低的公司，多半連這個位子都沒有——天花板不是你，是組織圖。 */
    if(S.level===3 && !b4 && S.emp.esg){
      const sc = companyESG(S.emp, S.year) || 0;
      const need = S.emp.ind==='fin' ? 50 : 58;
      /* 但如果這些年是「你」把公司的分數推上去的，那個位子多半也是你做出來的 */
      const lifted = (S.esgBoost && S.esgBoost[S.emp.id]) || 0;
      if(sc < need) pr *= (lifted>=10 ? 0.75 : lifted>=5 ? 0.55 : 0.40);
    }
    if(rnd() < pr){
      S.level++; S.pay = Math.max(S.pay, calcPay(S.emp,S.level)); clampPay();
      return true;
    }
  }
  return false;
}

/* ===== 永續團隊人數 =====
   由公司層級、產業成熟度與年份共同決定。
   一人部門什麼都碰但碰不深；大團隊分工細，你只會很懂一塊。 */
function teamSize(emp){
  if(!emp) return 0;
  if(emp.id==='free') return 0;
  if(emp.ind==='cons') return 30;
  const my = S.year + indMat(emp.ind);
  let base = my<2015 ? 0.6 : my<2019 ? 1.2 : my<2022 ? 2.2 : my<2025 ? 4.5 : 6.5;
  if(emp.tier==='龍頭') base *= 2.4;
  else if(emp.tier==='外商') base *= 0.8;
  else if(emp.tier==='中後段') base *= 0.7;
  else if(emp.tier==='公部門') base *= 2.0;
  /* ESG 評分越高的公司，通常真的養得起越大的團隊（item 5）。
     但有特例：分數低卻剛被客戶逼著擴編、或分數高卻只靠兩個人硬撐。 */
  const esg = companyESG(emp, S.year);
  if(esg!=null){
    base *= (0.55 + esg/70);
    if(emp.leanTeam) base *= 0.45;     // 特例：分數好看，但實際上人很少
  }
  return Math.max(1, Math.round(base));
}
function teamWord(n){
  if(n<=1) return '一人部門';
  if(n<=3) return String(n)+' 人小組';
  if(n<=8) return String(n)+' 人團隊';
  if(n<=20) return String(n)+' 人部門';
  return String(n)+' 人以上';
}
function teamNote(n){
  if(n<=1) return '整件事都是你的。沒有人可以問，也沒有人跟你搶。';
  if(n<=3) return '三個人分掉所有的事。你什麼都碰得到，但沒有一項碰得夠深。';
  if(n<=8) return '開始有分工了。你負責的那一塊會越做越熟。';
  if(n<=20) return '分工很細。你很懂自己那一塊，但公司的全貌只有主管看得到。';
  return '大到你不會認識所有同事。要出頭得先在內部被看見。';
}

/* ============ 完整英文版：翻譯字典與渲染攔截 ============
   TR 以「中文原文 → 英文」對照。渲染時在唯一的出口統一替換，
   沒有翻到的字串會原樣保留（fallback 中文），因此可以分批補譯而不會壞掉。
   台灣在地梗保留原味，必要時在英文裡加一句括號說明。 */
const TR = {};
let TR_KEYS = [];
function trRegister(map){
  Object.keys(map).forEach(function(k){ TR[k] = map[k] });
  TR_KEYS = Object.keys(TR).sort(function(a,b){ return b.length - a.length });   // 長字串優先，避免部分覆蓋
}
function tr(str){
  if(LANG!=='en' || !str) return str;
  return TR[str] || str;
}
/* 把整段 HTML 裡已知的中文片語換成英文（長的先換） */
/* 「萬」在英文版要換算成看得懂的金額，而不是留一個外國人不認識的字。
   字典是字串替換，換算不了數字，所以在替換之後再跑一次數值轉換：
   5 萬 → NT$50k、120 萬 → NT$1.2M、1,000 萬 → NT$10M。 */
function localizeMoney(html){
  return html.replace(/(\d[\d,]*(?:\.\d+)?)\s*萬/g, function(m, num){
    const v = parseFloat(String(num).replace(/,/g,''));
    if(!isFinite(v)) return m;
    const nt = v * 10000;
    if(nt >= 1000000){
      let s = (nt/1000000).toFixed(1).replace(/\.0$/,'');
      return 'NT$' + s + 'M';
    }
    if(nt >= 1000) return 'NT$' + Math.round(nt/1000) + 'k';
    return 'NT$' + Math.round(nt);
  });
}
function localizeHTML(html){
  if(LANG!=='en' || !html || !TR_KEYS.length) return html;
  let out = html;
  for(let i=0;i<TR_KEYS.length;i++){
    const k = TR_KEYS[i];
    if(out.indexOf(k) >= 0) out = out.split(k).join(TR[k]);
  }
  return localizeMoney(out);
}

"★ TCFD 氣候相關財務揭露建議書發布，把氣候從 CSR 議題變成財務議題。資本額 50–100 億公司納入編製範圍。年底台灣永續指數發布。": "★ TCFD publishes its recommendations on climate-related financial disclosure, turning climate from a CSR topic into a financial one. Companies capitalized at NT$5–10 billion are brought into the reporting scope. The Taiwan Sustainability Index launches at year end.",
"★ 全體上市櫃公司揭露 IFRS 永續資訊，含溫室氣體盤查及確信。查驗證機構人力需求高峰。三張揭露框架至此到齊：氣候看 S2、自然看 TNFD、人看 TISFD。": "★ All listed and OTC companies disclose IFRS sustainability information, including GHG inventory and assurance. Demand for verification and assurance body staff peaks. The three disclosure frameworks are now complete: S2 for climate, TNFD for nature, TISFD for people.",
"★ 碳費三項子法八月底公告、費率十月底拍板：一般費率每噸 300 元。台灣碳權交易所國內減量額度 10 月上路。年底永續經濟活動認定指引出到第二版，涵蓋的金融機構授信餘額從 28.4% 拉到 64.3%。永續經濟活動認定指引出到第二版。TCFD 任務結束，監測責任移交 ISSB——會 TCFD 的人得改口說 S2 了。九月 TISFD 正式啟動，把「不平等與人」納入財務揭露。GCSF 主軸轉向「公正、有序、公平的轉型」。當年出版報告書中 73.2% 取得第三方確信。": "★ The three carbon fee sub-regulations are announced at the end of August and the rates settled at the end of October: a general rate of NT$300 per tonne. The Taiwan Carbon Solution Exchange launches domestic offset credits in October. By year end the Sustainable Economic Activities Guidelines reach their second edition, lifting covered lending balances at financial institutions from 28.4% to 64.3%. The Sustainable Economic Activities Guidelines reach their second edition. TCFD's mandate ends and monitoring passes to the ISSB—people who knew TCFD now have to say S2 instead. TISFD formally launches in September, bringing \"inequality and people\" into financial disclosure. GCSF's theme shifts to \"A Just, Orderly and Equitable Transition.\" Of the sustainability reports published that year, 73.2% obtained third-party assurance.",
"★ 碳費費率 1/1 生效（一般 300 元／噸，有自主減量計畫可享 50 或 100 元優惠費率）。資本額 20 億以下上市櫃納入，全體上市櫃都要編永續報告書。<br>歐盟二月拋出 <em>Omnibus 簡化草案</em>，要大砍 CSRD／CSDDD 的適用範圍——歐洲客戶問的問題，一夜之間從「你們揭露了嗎」變成「這還要不要做」。美國那邊反 ESG 聲浪同步升溫。全球企業永續論壇（GCSF）今年主軸轉向「邁向自然正向未來」。綠領職缺 29,305 個。": "★ Carbon fee rates take effect 1/1 (general rate NT$300／tonne; NT$50 or NT$100 preferential rates with an approved voluntary reduction plan). Listed and OTC companies capitalized under NT$2 billion are brought in — every listed and OTC company must now produce a sustainability report.<br>In February the EU floats its <em>Omnibus simplification proposal</em>, set to slash the scope of CSRD／CSDDD—overnight, the question from European customers goes from \"have you disclosed?\" to \"do we still have to do this?\" Anti-ESG noise in the US rises in step. The Global Corporate Sustainability Forum (GCSF) shifts this year's theme to \"Toward a Nature-Positive Future.\" 29,305 green-collar job openings.",
"★ 總統宣示 2050 淨零。COP26 上 IFRS 基金會宣布成立 ISSB；同年 TNFD 自然相關財務揭露工作小組成立——氣候之後，下一個是自然。綠領職缺跳到 15,109 個，一年增三成六。": "★ The President declares net zero by 2050. At COP26 the IFRS Foundation announces the creation of the ISSB; the same year the Taskforce on Nature-related Financial Disclosures (TNFD) is set up—after climate, nature is next. Green-collar openings jump to 15,109, up 36% in a year.",
"★ 聯合國 SDGs 發布、巴黎協定通過。溫室氣體減量及管理法施行。全台出版 384 本報告書。": "★ The UN releases the SDGs; the Paris Agreement is adopted. The GHG Reduction and Management Act takes effect. 384 sustainability reports published nationwide.",
"★ 路徑圖目標年：全體上市櫃完成溫室氣體盤查。IFRS S 第二階段：資本額 50–100 億的 107 家公司適用，年報與財報同時申報。範疇三最快自本年起強制揭露。TISFD 首個公開版框架問世，國際客戶的問卷開始出現「人」的欄位。<br>台灣的總量管制與交易（ETS）試行計畫已經排定 2028 年啟動，碳交所的交易平台先行上線——碳有價正要從「繳費」走向「交易」，會算碳的人開始學怎麼買賣碳。會做溫盤的人也開始變多。": "★ Roadmap target year: all listed and OTC companies complete their GHG inventory. IFRS S phase two: 107 companies capitalized at NT$5–10 billion are covered, filing sustainability information together with the financial statements. Scope 3 disclosure becomes mandatory from this year at the earliest. TISFD's first public framework arrives, and \"people\" columns start showing up in international customers' questionnaires.<br>Taiwan's cap-and-trade (ETS) pilot is already scheduled to start in 2028, with the carbon exchange's trading platform going live first—priced carbon is moving from \"paying a fee\" to \"trading,\" and people who can count carbon start learning how to buy and sell it. People who can run a GHG inventory are getting more common too.",
"★ 金管會發布「公司治理 3.0—永續發展藍圖」，ESG 正式進入監理語彙。疫情把「韌性」與「供應鏈斷鏈」推上檯面；歐盟、日韓、中國接連宣布淨零承諾。CSR 報告書辦法修訂，氣候風險成為必要揭露。綠領職缺 11,131 個。": "★ The FSC issues \"Corporate Governance 3.0—Sustainable Development Roadmap\" and ESG formally enters the regulator's vocabulary. The pandemic pushes \"resilience\" and \"supply chain disruption\" to the front; the EU, Japan, Korea and China announce net zero pledges one after another. The CSR reporting rules are amended and climate risk becomes a required disclosure. 11,131 green-collar job openings.",
"★ 食品、化工、金融與資本額百億以上公司強制編製 CSR 報告書。永續職缺第一次真正出現。": "★ Food, chemicals, financials and companies capitalized at NT$10 billion or more must now produce CSR reports. Sustainability job openings appear for real for the first time.",
"★★ 準則大爆發的一年：ISSB 六月正式發布 IFRS S1／S2；TNFD 九月發布最終建議 v1.0，把 TCFD 的四支柱從氣候擴大到自然；金管會八月發布我國接軌藍圖，採直接採用。同年一月氣候變遷因應法三讀、二月公布施行（2050 淨零正式入法，碳費有了法源），八月環境部升格、十月 CBAM 進入過渡期、台灣碳權交易所成立並開國際碳權交易。GCSF 主軸「全球變遷中的加速轉型」。報告書首度破千，1,006 本。": "★★ The year the standards exploded: the ISSB formally releases IFRS S1／S2 in June; TNFD publishes final recommendations v1.0 in September, widening TCFD's four pillars from climate to nature; the FSC issues Taiwan's convergence roadmap in August, opting for direct adoption. The same year, the Climate Change Response Act clears its third reading in January and is promulgated in February (2050 net zero written into law, the carbon fee gets its legal basis); in August the Ministry of Environment is upgraded, in October CBAM enters its transition period, and the Taiwan Carbon Solution Exchange is founded and opens trading in international carbon credits. GCSF's theme: \"Accelerating Transformation in a Changing World.\" Sustainability reports top a thousand for the first time — 1,006.",
"★★ 碳費首度開徵，240 家企業、461 座工廠五月底前繳費，首輪收了 49.7 億。IFRS S1／S2 第一階段上路：資本額百億以上 119 家（含 14 家金控、24 家本國銀行）適用，永續資訊與財報同規格。CBAM 正式徵收；台灣碳費理論上可扣抵，但歐盟尚未認可我國碳價，實際上抵不到。ETS 試行平台預計下半年上線。<br>歐盟 Omnibus <em>二月正式通過</em>：CSRD 適用家數大砍（門檻拉到員工千人＋營收 4.5 億歐元）、盡職調查只留最大型企業。美國退出巴黎協定生效、SEC 提案廢止氣候揭露規則——「漂綠」變成「漂靜」，做還是照做，只是不敢大聲說。顧問圈的關注重心換了邊：人權與勞動的討論度首度超過淨零。綠領職缺 29,733 個，技能缺口 23 萬人，但徵才明顯轉為「低招募、低解僱」。": "★★ The carbon fee is collected for the first time: 240 companies and 461 plants pay by the end of May, NT$4.97 billion in the first round. IFRS S1／S2 phase one begins: 119 companies capitalized above NT$10 billion (including 14 financial holding companies and 24 domestic banks) are covered, with sustainability information held to the same standard as the financial statements. CBAM starts charging for real; Taiwan's carbon fee is deductible in theory, but the EU has yet to recognize our carbon price, so in practice it isn't. The ETS pilot platform is expected to go live in the second half.<br>The EU Omnibus <em>formally passes in February</em>: the number of companies in CSRD scope is slashed (threshold raised to 1,000 employees ＋ €450 million revenue) and due diligence is left to the largest firms only. The US withdrawal from the Paris Agreement takes effect and the SEC proposes repealing its climate disclosure rule—\"greenwashing\" becomes \"greenhushing\": the work still gets done, just not out loud. The consulting crowd's centre of gravity switches sides — human rights and labour outpace net zero in airtime for the first time. 29,733 green-collar openings and a skills gap of 230,000 people, but hiring has clearly turned to \"low hiring, low firing.\"",
"★★ 金管會發布永續發展路徑圖：2027 全體上市櫃完成溫盤、2029 完成確信。CSR 報告書正式更名永續報告書。ISSB 發布 S1／S2 徵求意見稿，TNFD beta 框架陸續問世。氣候變遷因應法草案在立法院闖關，2050 淨零入法與碳費法源就差臨門一腳。全球企業永續論壇（GCSF）主軸「邁向淨零之路」，亞太永續博覽會首度登場。綠領職缺暴增至 22,111 個（＋46%），報告書 777 本。": "★★ The FSC issues the Sustainable Development Roadmap: all listed and OTC companies complete GHG inventory by 2027 and assurance by 2029. CSR reports are formally renamed sustainability reports. The ISSB publishes the S1／S2 exposure drafts and TNFD beta frameworks roll out one after another. The Climate Change Response Act draft fights its way through the Legislative Yuan — writing 2050 net zero into law and giving the carbon fee a legal basis are one step away. The Global Corporate Sustainability Forum (GCSF) takes \"Path to Net Zero\" as its theme, and the Asia-Pacific Sustainability Expo debuts. Green-collar openings surge to 22,111 (＋46%); 777 sustainability reports.",

"一則貼文說永續工作<em>「錢少事多、做的都是文書、還要被說是漂綠幫兇」</em>，底下幾百則附和。<br><br>你一邊看，一邊在加班。": "A post says sustainability work is <em>\"low pay, endless tasks, all paperwork, and you still get called a greenwashing accomplice\"</em> — hundreds of agreeing comments underneath.<br><br>You read it while working overtime.",
"一千萬。不夠退休，但足夠讓你第一次<em>可以不用把「薪水」放在做決定的第一順位</em>。": "NT$10M. Not enough to retire on, but enough that for the first time <em>salary doesn't have to be the first thing you weigh in a decision</em>.",
"一場演講結束，一個大學生跑來說：<em>「我就是看你的文章才決定念環境的。」</em><br><br>你愣了一下——你從來不知道自己影響過誰。": "After a talk, a college student comes up to you: <em>\"Your articles are why I chose environmental studies.\"</em><br><br>You freeze for a second — you never knew you had influenced anyone.",
"一場颱風打斷的供應鏈": "The Typhoon That Broke the Supply Chain",
"一天幾十萬個包裹。減碳的戰場在最後一哩路和那些紙箱裡。": "Hundreds of thousands of parcels a day. The decarbonization fight is in the last mile and in those cardboard boxes.",
"一家 B 型企業找你。<em>薪水比外面低一截，但整間公司的存在就是為了做好事</em>。面試官說：我們要圈粉的不只是客戶，還有員工。": "A B Corp reaches out. <em>The pay is a notch below market, but the entire company exists to do good</em>. The interviewer says: we're not just trying to win over customers — we're trying to win over employees.",
"一家企業的永續部門找上機構，說想做「地方共好」的專案，預算不小。<br><br>": "A company's sustainability department approaches the organization about a \"local shared prosperity\" project. The budget is not small.<br><br>",
"一家企業的永續部門找上機構，說想做「地方共好」的專案，預算不小。<br><br>對方開口問的第一個問題是：<em>「你們可以幫我們算社會影響力嗎？我們報告書要用。」</em><br><br>你聽得懂那句話背後要的是什麼。你也知道，那筆錢可以讓兩個班多開一年。": "A company's sustainability department approaches the organization about a \"local shared prosperity\" project. The budget is not small.<br><br>The first thing they ask is: <em>\"Can you work out the social impact for us? We need it for our report.\"</em><br><br>You understand what that question is really after. You also know that money would keep two classes running for another year.",
"一家媒體轉載了那篇，還來邀你寫專欄。": "A media outlet republished the piece, and invited you to write a column.",
"一家碳管理系統商私訊你：<em>一篇業配三萬塊</em>，只要你說「我自己也在用」。<br><br>你沒有在用。": "A carbon management software vendor DMs you: <em>thirty thousand for one sponsored post</em> — all you have to say is \"I use it myself.\"<br><br>You don't.",
"一年": "One year",
"一年一度的續案審查到了。<br><br>簡報要交、KPI 要填：辦了幾場活動、觸及幾個青年、帶動幾筆投資。<em>你真正做的事——陪一個返鄉青年撐過第一年、把一條排水溝的問題吵到公所處理——沒有一格放得下。</em>": "The annual grant renewal review is here.<br><br>Slides to submit, KPIs to fill in: how many events held, how many youths reached, how many investments brought in. <em>The things you actually did — helping one returning youth survive his first year, fighting until the township office fixed a drainage ditch — don't fit in any of the boxes.</em>",
"一年一標的日子": "Life on a One-Year Grant",
"一年下來存了幾萬塊。時間換錢，很公平。": "A year of it saved you a few tens of thousands. Time for money. Fair enough.",
"一年內走了三個。離職面談他們都說「想換個環境」，<em>但你知道真正的原因是薪水跟看不到未來</em>。": "Three people gone in a year. In the exit interviews they all said \"looking for a change of environment,\" <em>but you know the real reasons are the pay and the future they couldn't see</em>.",
"一年賣出十億杯。塑膠杯與封膜是永續部門每天被罵的原因。": "A billion cups a year. Plastic cups and seal film are why sustainability gets yelled at daily.",
"一整年的永續成果，要濃縮成五分鐘，<em>而且前面的議程一定會超時</em>。": "A full year of sustainability work, condensed into five minutes — <em>and the agenda ahead of you is guaranteed to run over</em>.",
"一整年的減碳成果，要濃縮成五分鐘。<em>而且前面那個議程一定會超時</em>。": "A whole year of decarbonization results, condensed into five minutes. <em>And the agenda item before yours will definitely run over</em>.",
"一旦開始就回不去了：曝光最快，也會解鎖只有創作者才遇得到的事": "Once you start there's no going back: fastest exposure, and it unlocks things only creators run into",
"一條街的改變": "One Street, Changed",
"一次": "once",
"一篇評論在你的同溫層瘋傳，標題點名了你：<em>「那些進了體制的永續人，還記得自己為什麼出發嗎？」</em><br><br>底下留言有當年跟你一起舉牌的老戰友。你的手指在鍵盤上停了很久。<br><br>而現實是：你手上正有一個案子，黨團要你「先放一放」。": "An op-ed goes viral in your echo chamber, and the headline names you: <em>\"Those sustainability people who went inside the system — do they still remember why they started?\"</em><br><br>In the comments is an old comrade who once held protest signs beside you. Your fingers hover over the keyboard for a long time.<br><br>And the reality: there's a bill in your hands right now that the party caucus wants you to \"set aside for the moment.\"",
"一級專責單位，直接對高層報告。制度完整，什麼都碰得到。": "A first-tier dedicated unit reporting straight to the top. Processes are complete; you touch everything.",
"一般費率每噸三百元。客戶打來的第一句話是：「怎麼樣可以少繳一點？」": "The general rate is NT$300 per tonne. The first thing clients say when they call: \"How do we pay less?\"",
"一趟下來，人脈和案子都有進展。你發現中部的機會比你想的多。": "One trip, and both the contacts and the projects moved forward. You found central Taiwan had more opportunities than you thought.",
"一輪敬酒下來，手機多了二十個聯絡人。更值錢的是——<em>哪家公司在找人、開什麼條件、要求什麼，你一個晚上全問到了</em>。": "One round of toasts, and your phone had twenty new contacts. More valuable still — <em>which companies are hiring, what they're offering, what they require: you got it all in one night</em>.",
"一通電話就接到案子，還是急件，報價可以開高一點。": "One phone call landed a project — a rush job, too, so the quote could go a little higher.",
"一開始你以為自己是去「做好事」。第三個月你才弄懂那套規則：<em>成績沒到、行為登記不好看，教練就不讓你上場</em>。": "At first you thought you were going there to \"do good.\" It took until the third month to work out the rule: <em>if the grades aren't there, or the conduct record doesn't look good, the coach doesn't let you on the field</em>. ",
"一間綠色智庫在找研究員：做政策研究、跑淨零路徑模型、當政府與產業之間的橋。<em>看得到全局，但碰不到執行；影響力很大，薪水很普通</em>。": "A green think tank is hiring researchers: policy research, net-zero pathway modeling, being the bridge between government and industry. <em>You see the whole board but never touch execution; the influence is large, the salary ordinary</em>.",
"一項一項比對到底": "Cross-check every single item",
"一項關鍵技術突然成熟，整條減碳路徑要重算。": "A key technology matures overnight. The entire decarbonization pathway has to be recalculated.",
"三個人分掉所有的事。你什麼都碰得到，但沒有一項碰得夠深。": "Three people splitting everything. You get to touch it all, but nothing deeply enough.",
"三個月後，那條街有了六家店掛上「在地食材」的牌子。報導來拍的那天，老闆把你拉進鏡頭裡。<em>這種成就感，做報告書的年代沒有過。</em>": "Three months later, six shops on that street had hung up \"local ingredients\" signs. The day the reporters came to film, the owner pulled you into the frame. <em>This kind of fulfillment never existed in your report-writing years.</em>",
"三個案子都準時交了。客戶滿意，你回家躺了兩天，週一照常上班。": "All three projects were delivered on time. The clients were satisfied. You went home and lay flat for two days, then showed up Monday as usual.",
"三個行業別都對照一遍": "Map against all three industry standards",
"三十幾家銀行、加上證券與保險一起比，<em>只有前百分之二十會被公布名字</em>。這不是一條及格線，這是一場錦標賽——你可以進步很多，然後還是輸。<br><br>": "Thirty-odd banks, plus securities firms and insurers, all ranked together — <em>only the top twenty percent get their names published</em>. This isn't a pass mark, it's a tournament: you can improve a great deal and still lose.<br><br>",
"三天課、兩萬八，公司不出錢。<em>上完有證書，而現在市場很吃這張</em>。": "Three days of class, NT$28,000, and the company won't pay. <em>You get a certificate at the end, and right now the market eats this one up</em>.",
"三天課，台灣 ESG 職缺最常見的加分證照。": "A three-day course; the most common bonus credential in Taiwanese ESG job ads.",
"三年前你經手的那本報告書，被媒體點名<em>數據與實際排放落差過大</em>。<br><br>你早就離開那間公司了，但你的名字在致謝頁上。": "The report you handled three years ago gets named by the media: <em>the gap between the data and actual emissions is too large</em>.<br><br>You left that company long ago, but your name is on the acknowledgments page.",
"三年後你在新聞上看到他們募到 A 輪。你不確定該不該後悔。": "Three years later you saw the news: they raised their Series A. You weren't sure whether you should regret it.",
"三百萬（高階組）": "NT$3 million a year (senior track)",
"上一個案子月初結案，下一個還沒談成。<em>行事曆空白得讓人心慌</em>，帳單卻照樣進來。": "The last project closed at the start of the month; the next one isn't signed yet. <em>The calendar is blank enough to be frightening</em>, and the bills keep arriving anyway.",
"上一次你認真想「怎麼真的減碳」是什麼時候？<em>你想不起來。</em><br><br>": "When was the last time you seriously thought about how to actually cut emissions? <em>You can't remember.</em><br><br>",
"上前敘舊，把這條線重新接起來": "Walk Over, Catch Up, Reconnect the Line",
"上完課、寫完考古題，你以為跟初級一樣。<br><br>結果考卷發下來，一半是要推導的計算題——<em>通過率明顯掉下來了</em>。這張證照開始有點意義的同時，也開始有點難。": "You took the course, worked the past papers, and assumed it would go like the entry level.<br><br>Then the paper landed in front of you: half of it calculations you have to derive — <em>the pass rate has clearly dropped</em>. The moment this credential starts to mean something is also the moment it starts to be hard.",
"上游材料廠。景氣循環很兇，好的時候賺翻、壞的時候整年放無薪假。": "Upstream materials plant. Violent cycles: minting money in the good years, unpaid leave all year in the bad ones.",
"上線": "Live",
"上過法庭": "Been to Court",
"上過那條船": "Been on That Boat",
"下到前線": "Went to the Floor",
"下屬比你強": "Your Report Is Better Than You",
"下次小心一點": "Be more careful next time",
"不上了": "Skip the course",
"不再只問你排多少，而是問治理、策略、風險管理、指標目標。<em>整份問卷的骨架換了</em>。": "It no longer just asks how much you emit — it asks about governance, strategy, risk management, metrics and targets. <em>The skeleton of the whole questionnaire has changed</em>.",
"不再只問政策：材料循環率、產品壽命、可維修性、再生料比例、重複使用模式的營收占比，全部要數字。": "No longer just asking about policies: material circularity rate, product lifespan, repairability, recycled content, share of revenue from reuse models — all of it in numbers.",
"不再賣比率": "No Longer Sells Ratios",
"不分區立委": "Party-list legislator",
"不只是發錢": "More Than a Payout",
"不可取代": "Irreplaceable",
"不回去，但接他們的案子": "Don't go back, but take their projects",
"不回應，繼續寫": "Don't respond, keep writing",
"不好不壞，跟大多數人一樣。": "Not good, not bad — same as most people.",
"不想當合夥人": "Passed on Partner",
"不指望他，自己全包做完": "Don't count on him, do it all yourself",
"不接不熟的業配": "No Random Sponsors",
"不接做不完的案": "Won't Overcommit",
"不換，把現在這塊做到沒有人比你熟": "Stay, and know this piece better than anyone",
"不敢推掉任何一個，因為你永遠不知道下個月還有沒有。<em>三個客戶的交期只差一週</em>。": "You don't dare turn any of them down, because you never know if next month will bring any. <em>Three clients' deadlines are one week apart</em>.",
"不是因為你比別人聰明，是因為別人都跑去做熱門產業了，而你留下來，把這裡的每一條管線、每一份排放源清冊都摸過一遍。": "Not because you're smarter than anyone else. Because everyone else went off to the hot sectors, and you stayed, and worked your way through every pipeline and every emission-source inventory in the place.",
"不是有人趕你，是每一次會議的眼神都在告訴你該走了。你開始整理東西。": "no one drives you out; it's the eyes in every meeting telling you it's time to go. You started packing your things.",
"不會分事": "Can't Delegate",
"不爆肝、不失去生活，薪水過得去就好": "No burnout, keep a life, a salary that's good enough",
"不爭了，把現有的做好": "Stop fighting, do the current work well",
"不爭定義，但把 B 做成真的 C": "Don't argue the definition — turn the B into a real C",
"不爭而得": "Wins Without Fighting",
"不爭，把現有的做好": "Don't Compete; Do What You Have Well",
"不玩虛的": "No Fluff",
"不用寫報告書，但要交 SBTi": "No Report Required, But SBTi Is Due",
"不申請，直接繳。行政成本更低": "Don't apply, just pay. Less admin overhead",
"不給人，給你 AI": "No Headcount, Just AI",
"不考，把時間拿去做專案": "Skip it, spend the time on projects",
"不舉手": "Keep your hand down",
"不要只是把數字寫得好看": "Not just make the numbers look good",
"不走，留在現在的位子": "Stay in the Seat You Have",
"不追流量，繼續寫給該看的人": "Skip the clicks, write for your readers",
"不退：把它列進重大風險，一路吵到董事會": "Don't Back Down: List It as a Material Risk and Fight It to the Board",
"不過你有一半時間在外面跑，實作的時間被吃掉了。": "But half your time went to running around outside, and the hours for hands-on work got eaten away.",
"不過為了寫計畫書，你把那個「總有一天要做」的夢想第一次完整地寫了下來。<em>它現在有名字了。</em>": "But to write the proposal, you put that \"someday\" dream down in full for the first time. <em>It has a name now.</em>",
"不鏽鋼世家": "The Stainless Steel Dynasty",
"世界安靜了。但那句話你想了好幾天。": "The world went quiet. But you thought about that line for days.",
"世界很大，選一個地方鑽進去。": "The world is wide. Pick one corner and burrow in.",
"中小企業買不到綠電": "SMEs Can't Buy Green Power",
"中後段": "Mid-to-Lower Tier",
"中文": "中文",
"中段": "Mid-pack",
"中級沒有你想的好過": "Intermediate Is Harder Than You Thought",
"中途被抽去支援別的專案，這塊只做了一半，等於白忙。": "You got pulled midway to prop up another project. This piece ended up half-done — which is to say, for nothing.",
"中過千萬發票": "Won the 10M Invoice",
"中部戰場": "Central Taiwan Front",
"主動出擊：做一份「兩家制度整併建議」給新東家": "Pitch the new owners an integration plan",
"主動揭露那件事，並把法遵設成內部報獎門檻": "Disclose it, and make compliance a bar for entering awards",
"主動聯絡以前的客戶": "Reach out to past clients",
"主動說明當時的限制": "Explain the constraints you faced",
"主導 MSCI／EcoVadis／CDP／Sustainalytics 評比問卷、RE100、英文可獨立主持會議": "Lead MSCI / EcoVadis / CDP / Sustainalytics rating questionnaires; RE100; able to chair meetings in English",
"主導查證員課程": "Lead Verifier Training",
"主張先改配方與替代燃料": "Push reformulation and alternative fuels first",
"主打機隊汰換的減碳效益": "Lead with fleet-renewal carbon savings",
"主機預留改裝空間，先配高效螺槳與節能舵。不帥，但在規範未定的年代，彈性本身就是價值。": "The main engines left room for retrofit; for now, high-efficiency propellers and energy-saving rudders. Not cool. But in an era of unsettled rules, flexibility is itself the value.",
"主管休假，這個案子交給你。客戶窗口比你資深十年，開口就是三個你沒聽過的名詞。": "Your manager is on leave, so the case is yours. The client contact has ten years' seniority on you and opens with three terms you've never heard.",
"主管問你：<em>要訂一個 SBTi 等級、外部會盯的目標，還是訂一個穩穩達得到的？</em>": "Your manager asks: <em>set an SBTi-grade target that outsiders will watch, or one you can safely hit?</em>",
"主管室傳下來一句話：<em>我們要進那個聯盟。</em><br><br>": "Word comes down from the executive floor: <em>we're joining that alliance.</em><br><br>",
"主管室傳下來一句話：<em>我們要進那個聯盟。</em><br><br>主管機關找了幾家金控組成永續金融的先行者聯盟，五大議題：綠色採購、投融資與議合、資訊揭露、協助與推廣、國際接軌。<br><br>新聞稿發得很漂亮。你翻遍文件，發現一件事：<em>五大議題底下，沒有一個數字目標，也沒有一個期限。</em><br><br>而現在，寫出那些 KPI 的人是你。": "Word comes down from the executive floor: <em>we're joining that alliance.</em><br><br>The regulator has pulled together a handful of financial holding companies to form the Sustainable Finance Pioneer Alliance, built on five themes: green procurement, investment and lending with engagement, disclosure, support and outreach, and international alignment.<br><br>The press release is beautiful. You read every document and find one thing: <em>under all five themes there is not a single numeric target, and not one deadline.</em><br><br>And now, the person writing those KPIs is you.",
"主管很高興：「那我們是不是可以少做很多事？」": "Your manager is delighted: \"So we can do a lot less now, right?\"",
"主管把試算表推回來：「這個減量幅度不好看，<em>你想辦法讓它變成負的</em>。」<br><br>他沒有說要造假。他說的是「想辦法」。": "Your manager pushes the spreadsheet back: \"This reduction doesn't look good. <em>Find a way to make it negative</em>.\"<br><br>He didn't say falsify it. He said \"find a way.\"",
"主管機關找了幾家金控組成永續金融的先行者聯盟，五大議題：綠色採購、投融資與議合、資訊揭露、協助與推廣、國際接軌。<br><br>": "The regulator has pulled together a handful of financial holding companies to form the Sustainable Finance Pioneer Alliance, built on five themes: green procurement, investment and lending with engagement, disclosure, support and outreach, and international alignment.<br><br>",
"主管機關要求提交 IFRS 永續揭露準則的<em>導入計畫與執行進度表</em>，而且百億以上和五十到百億的版本還不一樣。<br><br>手上這家剛好卡在分界線附近。": "The regulator requires submission of an <em>adoption plan and implementation timeline</em> for the IFRS sustainability disclosure standards — and the version for companies above NT$10 billion differs from the one for NT$5–10 billion.<br><br>The company you're handling sits right near the line.",
"主管機關辦了 IFRS S2 的揭露實作工作坊，免費，但<em>要請一整天假，而且報名秒殺</em>。": "The regulator runs a hands-on IFRS S2 disclosure workshop — free, but <em>it takes a full day of leave, and registration sells out in seconds</em>.",
"主管機關釋出了一份對照工具：<em>現行永續資訊裡，哪些可以直接沿用到 IFRS S2</em>。<br><br>你花了一個下午比對，發現原本做的 TCFD 有七成能接上——真正要補的是那三成。": "The regulator releases a mapping tool: <em>which parts of current sustainability disclosures carry straight over to IFRS S2</em>.<br><br>You spend an afternoon comparing and find 70% of your existing TCFD work connects — what actually needs filling is the other 30%.",
"主管沉默了三秒，說：「我幫你爭取。」下個月調薪令下來了。": "Your manager was silent for three seconds, then said, \"I'll fight for you.\" The raise order came down the next month.",
"主管說公司可以補助訓練費，<em>但要簽兩年的服務約</em>。中途離職要照比例賠回來。": "Your manager says the company can subsidize the training fee, <em>but you'd sign a two-year service bond</em>. Leave early and you pay it back pro rata.",
"主管說撐三個月就補人。第五個月你放棄問了。": "Your manager said hold on three months and there'd be a new hire. By the fifth month, you stopped asking.",
"主管說：「今年預算已經定了，明年再看看。」你點點頭走出會議室。": "Your manager said, \"This year's budget is already set. We'll look at it next year.\" You nodded and walked out of the meeting room.",
"主管說：報告書和國際評鑑，<em>今年我們自己做</em>。預算砍了，但事情一件都沒少。": "Your manager says: the report and the international ratings — <em>this year we do them ourselves</em>. The budget was cut. The work wasn't, not one piece of it.",
"主管說：年底報告書要有社會面的數字。<em>「社區關係改善了多少」要怎麼寫成一個數字？</em>": "Your manager says the year-end sustainability report needs social-side numbers. <em>How do you write \"how much community relations improved\" as a number?</em>",
"主管說：這個你順便做一下，應該不會花很多時間。<em>那是一份完整的 CDP 問卷</em>。": "Your manager says: do this one on the side, it shouldn't take much time. <em>It's a full CDP questionnaire</em>.",
"主管說：這個專案不用做太深，<em>做出來能拍照、能寫進報告書</em>就好。": "Your manager says: don't go too deep on this one — as long as <em>it photographs well and fits in the sustainability report</em>, that's enough.",
"主管講得很好。你在旁邊做筆記，也記下了自己缺的是什麼。": "Your manager presented beautifully. You took notes on the side — including notes on what you were missing.",
"九月，TISFD 正式啟動。氣候有 TCFD、自然有 TNFD，現在<em>「人」也要被放進財務揭露</em>——不平等、勞動條件、社區衝擊，都要談風險、機會、衝擊與依賴。<br><br>架構一樣是四支柱。一百多個組織連署支持。": "In September, TISFD formally launches. Climate had TCFD, nature had TNFD, and now <em>\"people\" go into financial disclosure too</em> — inequality, labor conditions, community impacts, all framed as risks, opportunities, impacts, and dependencies.<br><br>The framework is the same four pillars. Over a hundred organizations sign on in support.",
"九月，TNFD 發布最終建議。架構跟 TCFD 幾乎一樣，但把「氣候」換成「自然」，還多了一個 TCFD 沒有的東西：<em>依賴</em>。<br><br>方法叫 LEAP：定位、評估、鑑別、準備。": "In September, TNFD publishes its final recommendations. The framework is almost identical to TCFD, but swaps \"climate\" for \"nature\" — and adds something TCFD never had: <em>dependencies</em>.<br><br>The method is called LEAP: Locate, Evaluate, Assess, Prepare.",
"也跟著降價": "Cut your prices too",
"也開始找工作": "Start job hunting too",
"乾脆在南部辦自己的聚會": "Host your own meetups in the south",
"乾脆認養一個地方，自己當圈主": "Adopt a region, host your own circle",
"二十個人，一個下午。小而深，你反而更喜歡這種。": "Twenty people, one afternoon. Small and deep. You liked it better this way, actually.",
"二十幾歲那年，你拿了國家的錢去圓了一個夢。那趟旅程的東西，後來一直在你身上。": "In your twenties, you took the government's money and went to chase a dream. What that journey gave you never left.",
"二月歐盟正式通過：CSRD 門檻拉到員工千人＋營收 4.5 億歐元；盡職調查(CSDDD)更只留員工五千人＋營收 15 億歐元以上的巨型企業。<em>你們有一半原本要交的東西，突然不用交了</em>。": "In February, the EU formally passes it: the CSRD threshold rises to 1,000 employees plus 450 million euros in revenue; due diligence (CSDDD) keeps only giants above 5,000 employees and 1.5 billion euros. <em>Half of what you were supposed to file suddenly doesn't need filing</em>.",
"二月，歐盟拋出簡化草案，要把 CSRD／CSDDD 的適用範圍大砍。你手上正在準備歐盟要的揭露，<em>客戶卻開始問：那還要做嗎？</em>": "In February, the EU floats a simplification proposal to slash the scope of CSRD and CSDDD. You're in the middle of preparing the EU disclosures, <em>and clients start asking: so do we still have to do this?</em>",

"交出去了。這個問題會在你職涯裡再出現至少五次。": "You handed it in. This question will come back at least five more times in your career.",

"人力銀行上的職缺長出了新的名字：<em>氣候調適規劃師、營運韌性經理、轉型金融分析師</em>。<br><br>IPCC 說的那些「未來情境」開始變成保費、變成信用評等、變成董事會的議程。減碳的人還在，但預算的重心正在移動——<em>從「讓排放變少」，移向「讓公司在變熱的世界裡活下來」。</em>": "New names are sprouting on the job boards: <em>climate adaptation planner, operational resilience manager, transition finance analyst</em>.<br><br>The \"future scenarios\" the IPCC talked about are turning into insurance premiums, into credit ratings, into board agendas. The decarbonization people are still here, but the budget's center of gravity is moving — <em>from \"making emissions smaller\" toward \"keeping the company alive in a hotter world.\"</em>",

"今天有個大學生來信問你：「請問做永續每天都在做什麼？」你盯著那封信看了很久。": "Today a university student emails to ask: \"What does someone in sustainability actually do all day?\" You stare at that email for a long time.",
"今天財務又已讀不回，而申報死線剩兩週。": "Today Finance read it and didn't reply. The filing deadline is two weeks out.",
"今年不找顧問了": "No Consultants This Year",
"今年先不納入新併的廠": "Exclude the new plants this year",
"今年出版的報告書裡，<em>七成三取得了第三方確信</em>。客戶開始問：你們的數字有沒有人查過？": "Of the sustainability reports published this year, <em>73% obtained third-party assurance</em>. Clients start asking: has anyone checked your numbers?",
"今年勉強過關。明年客戶問起來，你答不出為什麼這題重要。": "This year you scraped by. Next year, when the client asks, you won't be able to say why this topic matters.",
"今年新增：": "New this year: ",
"今年準則更新、版面也要重做。<em>是認真重寫，還是沿用去年的架構改一改？</em>": "The standards updated this year, and the layout needs redoing too. <em>Rewrite it properly, or tweak last year's structure and move on?</em>",
"今年準時出版。查證那天有人問：你們的重大性議題怎麼一年沒變過？": "Published on time this year. On verification day, someone asked: how have your material topics not changed in a year?",
"今年照 300 繳。財務部把這筆錢記了下來，你知道明年他們會回來找你。": "You paid at 300 this year. Finance wrote the number down, and you know they'll come back for you next year.",
"今年的報告書變好看了。內容跟去年幾乎一樣。": "This year's sustainability report looks better. The content is almost identical to last year's.",
"今年的對外溝通少了一半。你有更多時間做實質的事——如果你真的拿去做的話。": "External communications dropped by half this year. You have more time for the substantive work — if you actually use it for that.",
"今年的數字漂亮多了。明年要納進來時，成長率會很難解釋。": "This year's numbers look much better. Next year, when it has to come into scope, the growth rate will be hard to explain.",
"今年的數字漂亮多了。明年要納進來的時候，成長率會很難解釋。": "This year's numbers look much better. Next year, when it has to be included, the growth rate will be hard to explain.",
"今年的案子排到年底，而且有兩家客戶是固定合作。<em>你第一次可以挑案子，而不是等案子</em>。": "This year's projects are booked through December, and two clients are now regulars. <em>For the first time, you get to choose projects instead of waiting for them</em>.",
"今年的永續尾牙辦在<em>台中</em>。中南部的廠務、供應鏈、在地顧問全來了——這是一條你在台北搆不太到的人脈。": "This year's sustainability year-end banquet is in <em>Taichung</em>. The facilities people, supply chain staff, and local consultants from central and southern Taiwan all come — a network you can't quite reach from Taipei.",
"今年的準則版本你沒跟上。不是不會做，是<em>做的是舊版的</em>——": "You didn't keep up with this year's version of the standards. It's not that you can't do the work — it's that <em>you're doing last version's work</em> — ",
"今年的溝通工作少了一半。你有更多時間做實質的事——如果你真的拿去做的話。": "This year's communications work dropped by half. You have more time for substantive things — if you actually use it that way.",
"今年的確信不再是「看一看」": "Assurance Is No Longer a Once-Over",
"今年第三個人遞辭呈。<em>離職面談每個人都說「想換個環境」</em>，但你知道真正的原因是薪水、是看不到未來、是這個部門在公司裡沒有份量。<br><br>而你就是那個部門的主管。": "The third resignation letter this year. <em>In the exit interviews, everyone says they \"want a change of scenery\"</em>, but you know the real reasons: the pay, the future nobody can see, the fact that this department carries no weight in the company.<br><br>And you are the head of that department.",
"今年要不要報獎": "Should You Enter the Awards This Year?",
"今年要不要訂一個硬的減量目標": "Should You Set a Hard Reduction Target?",
"今年過關了。但範疇三的數字會被年年比對，落差遲早要解釋。": "This year passed. But Scope 3 numbers get compared year after year, and sooner or later the gap will need explaining.",
"今年過關了。明年換人接手時，那些數字沒人說得清楚怎麼來的。": "This year passed. Next year, when someone else takes over, nobody will be able to explain where those numbers came from.",
"他上任三個月就走了。你們部門一年換了兩個主管。": "He left three months after taking the job. Your department went through two managers in one year.",
"他們很快就發了 offer。你突然發現自己是有選擇的——這個感覺比薪水本身更值錢。": "They sent an offer quickly. You suddenly discovered you have choices — a feeling worth more than the salary itself.",
"他們接手了。你發現自己在會議室裡越來越沒有發言權。": "They took over. You found yourself with less and less of a voice in the meeting room.",
"他們接手了對接的部分。你發現決定怎麼揭露的人，慢慢變成他們。": "They took over the interfacing. You noticed that the people deciding how to disclose were slowly becoming them.",
"他們點點頭，然後問你薪水多少。": "They nodded. Then they asked how much you make.",
"他其實不太懂永續，開會時常問一些很基本的問題。你花了很多時間在解釋。": "He doesn't really understand sustainability, and often asks very basic questions in meetings. You spend a lot of time explaining.",
"他問了一個問題：「那你會後悔嗎？」你想了很久才回答。": "He asked one question: \"So do you regret it?\" It took you a long time to answer.",
"他問你：「老師，我現在怎麼辦？」": "He asks you: \"Teacher, what do I do now?\"",
"他問完薪水就開始滑手機。剩下的二十分鐘你們聊了天氣。": "After asking about the salary he started scrolling his phone. For the remaining twenty minutes you talked about the weather.",
"他很感謝。三年後他成了某家公司的永續主管，記得你這份人情。": "He was grateful. Three years later he became a company's sustainability lead, and he remembered the favor.",
"他很挺你。第一次會議就替你把一個做不完的專案推掉了。": "He backs you. In his very first meeting, he pushed away an impossible project on your behalf.",
"他後來真的入行了，偶爾會傳訊息問你事情。不算什麼人脈，但你們成了會互相報職缺的那種關係。": "He really did enter the field, and messages you questions now and then. Not exactly a network. But you became the kind of people who send each other job openings.",
"他把重心全放在業務上，永續的預算被排到最後。": "He put all his weight on the business side. Sustainability's budget got queued last.",
"他真的轉了。兩年後他跟你說謝謝，也跟你抱怨了一模一樣的事。": "He really did switch. Two years later he thanked you — and complained to you about exactly the same things.",
"他聽完說：「可是我還是想試試看。」你想起自己當年也是這樣。": "He heard you out and said: \"But I still want to try.\" You remembered being exactly the same, back then.",
"他記得你當年犯過的每一個錯，也記得你哪裡做得好。「有缺人我第一個想到你。」<em>這句話半年後真的兌現了一次面試邀請。</em>": "He remembered every mistake you made back then, and everything you did well. \"When there's an opening, you're the first person I think of.\" <em>Six months later, that sentence actually cashed out as an interview invitation.</em>",
"他講了很多缺點。你聽完反而更想試試看。": "He listed a lot of downsides. Hearing them made you want to try even more.",
"他變本加厲，開始翻你三年前的貼文。你花了一個晚上讀自己以前寫的東西。": "He escalated, and started digging up your posts from three years ago. You spent an evening reading what you used to write.",
"他點點頭記下來了。這個慣例又往下傳了一代。": "He nodded and noted it down. The convention got passed down another generation.",
"以不分區立委身分進入國會": "Entered the Legislature as a party-list legislator",
"以前的主管打來：「我們今年人手不夠，<em>你要不要回來？薪水可以談</em>。」": "Your old manager calls: \"We're short-handed this year. <em>Want to come back? Salary's negotiable</em>.\"",
"以前的同事接不下一個案子，問你要不要接。<em>條件不錯，但那是他的客戶</em>。": "A former colleague can't take on a project and asks if you want it. <em>The terms are good, but it's his client</em>.",

"但你也很清楚：<em>待在同一組五年，你會變成那個「只會做這一塊」的人。</em><br><br>": "But you know the other thing too: <em>five years on the same team and you become the person who \"only does this one piece.\"</em><br><br>",
"但你剛把影響力管理的 ABC 分類讀完：A 是避免傷害、B 是造福利害關係人、C 是貢獻解方——<em>C 要證明「沒有你這件事就不會發生」</em>。<br><br>你們那個計畫，誠實講是 A，勉強算 B。": "But you've just finished reading the ABC classification in impact management: A is act to avoid harm, B is benefit stakeholders, C is contribute to solutions — <em>and C means proving \"without you, this would not have happened\"</em>.<br><br>Your programme, honestly, is an A. At a stretch, a B.",

"你一心二用，攤位顧了、案子也沒落下。只是品質你自己知道都打了折。": "You split your attention — covered the booth, kept the projects moving. You're the one who knows the quality of both took a cut.",
"你一開始就會講「治理—策略—風險—指標」那一套。<em>代價是沒有一塊是真的深，面試常被問：所以你最強的是什麼？</em>": "From day one you can speak the governance–strategy–risk–metrics language. <em>The price is that no part of it runs deep, and interviewers keep asking: so what are you actually best at?</em>",
"你三兩下就把新題組補完了，還順手寫成 SOP。分數不但沒掉，還往上走了一階。": "You knocked the new question set out in no time and wrote it into an SOP on your way through. The score did not just hold — it climbed a notch.",

"你上了一門課，也認識了幾個同行。": "You took a course and met a few peers.",
"你上了船，看了一整天他們怎麼工作。回來後你寫的那份報告，跟之前所有版本都不一樣。": "You got on the boat and watched a whole day of how they work. The report you wrote when you came back was unlike every version before it.",
"你不再焦慮了。有些工作的價值就是「每年都要有人把它做對」。<br><br>這樣想之後，日子好過很多。": "You stopped being anxious about it. Some jobs are valuable precisely because someone has to get them right every single year.<br><br>Once you saw it that way, the days got a lot easier.",
"你不再賭額度價格，改收專案輔導的服務費。不性感，但現金流穩定——很多同業就是這樣活下來的。": "You stopped betting on credit prices and switched to charging service fees for project advisory. Not sexy. But the cash flow is steady — plenty of peers survived exactly this way.",
"你不巴結也不得罪，安靜把事做好。少了一條捷徑，也少了一堆麻煩。": "You neither flattered nor offended — just quietly did the work well. One less shortcut. Also a lot less trouble.",
"你不想被機器綁架，堅持把報告寫給人讀。有溫度，但在初篩那關吃了一點虧。": "You didn't want to be held hostage by machines, and kept writing the report for people to read. It has warmth. It lost a little ground at the initial screening.",
"你不放心讓 AI 碰對外數字，繼續手工填。扎實，但你每年都在重複同樣的勞動。": "You didn't trust AI with external numbers, and kept filling by hand. Solid. But every year you repeat the same labor.",
"你不爭了。反正爭也爭不贏，不如把事情做好。<br><br>這個選擇讓你晚上睡得著，也讓你的薪水停在原地。": "You stopped fighting for it. You weren't going to win anyway, so you did the work well instead.<br><br>The choice let you sleep at night. It also left your salary exactly where it was.",
"你不表態，安靜把年度報告書交完。有人被留、有人被請走，而你的名字在名單邊緣。": "You took no position and quietly delivered the annual sustainability report. Some were kept, some were asked to leave. Your name sat at the edge of the list.",
"你不賭風向。你只知道，減下來的碳不會因為誰當選就變回去。": "You don't bet on the wind. You only know this: carbon that's been cut doesn't come back because of who wins an election.",
"你不辯解，直接去處理那幾件違規。隔年報告再出來時，你們不在名單上了。": "You didn't argue. You went and dealt with the violations. When the report came out again the next year, you weren't on the list.",
"你不追新技術，把手上能減的先減完。不性感，但每一噸都是真的。": "You didn't chase the new technology. You finished cutting what could be cut with what you had. Not sexy. But every tonne was real.",
"你不離職，先把本業和永續的交集做出來。這條路慢，但風險低。": "You didn't quit. You built the overlap between your day job and sustainability first. The road is slow, but the risk is low.",
"你主導了「零招募費」政策，連過去兩年離職的移工都追溯退費。花了很多錢、跑了很多趟，但暫扣令有機會解除，而且這件事本來就該做。": "You led the \"zero recruitment fee\" policy, with refunds reaching back even to migrant workers who'd left in the past two years. It cost a lot of money and a lot of trips. But the withhold release order has a chance of being lifted — and this was something that should have been done anyway.",
"你主張自主減量計畫應該有勞資協商——「沒有勞資協商，就沒有自主減量」。管理層很不習慣，但這是台灣最少被討論、卻最關鍵的一環。": "You argued that voluntary reduction plans should include labor-management negotiation — \"no labor negotiation, no voluntary reduction.\" Management found it deeply uncomfortable. But this is the piece Taiwan discusses least, and needs most.",
"你主張：有重大違規的那一年就不該去領獎。你替公司訂了自我約束的標準——有人說你自斷手腳，但這件事讓永續部門第一次有了「說不」的權力。": "You argued: in a year with a major violation, the company shouldn't go collect awards. You set a standard of self-restraint for the company — some said you were cutting off your own limbs, but for the first time, the sustainability department had the power to say \"no.\"",
"你交了能拍照的版本，也留了一份真的有做事的版本。後來那份派上了用場。": "You submitted the photogenic version, and kept a version with the real work in it. Later, the second one came in handy.",
"你交出去了，而且做得漂亮。這個案子成了你之後所有提案的代表作。": "You delivered it, and delivered it beautifully. That project became the calling card in every proposal you sent from then on.",
"你交出所有底稿、如實說明當年的壓力與判斷。最後判了緩刑——<em>你留下了紀錄，也留下了名字</em>。這件事會跟著你一輩子。": "You handed over every working paper and gave an honest account of the pressures and judgment calls of the time. The verdict came down as probation — <em>you're left with a record, and your name on it</em>. This will follow you for the rest of your life.",
"你什麼都沒說。但你開始把每次的工作紀錄留底。": "You said nothing. But you started keeping a copy of every work record.",
"你什麼都沒說。但那個數字一直在腦子裡。": "You said nothing. But that number stayed in your head.",
"你介紹給一家做得動的公司。他們記住了這份人情。": "You referred it to a firm that could handle it. They remembered the favor.",
"你以為會很閒，結果雜事把每一天都填滿了。年底回頭看，說不出自己做了什麼。": "You thought you'd have time to spare. Instead the errands filled every day. Looking back at year's end, you couldn't say what you'd done.",
"你以顧問身分接了他們的案。同一件事，你的報價是以前月薪的三倍。": "You took their project as a consultant. Same work — your quote was three times your old monthly salary.",
"你休了一個月。回來發現世界沒有你也轉得很好——有點傷人，也有點解脫。": "You took a month off. You came back to find the world turned just fine without you — it stung a little, and it freed you a little.",
"你休息了幾個月。回來時發現，這個圈子沒有人是不可取代的。": "You rested for a few months. When you came back, you found nobody in this circle is irreplaceable.",
"你促成研發與永續合作，用 AI 篩選低碳配方。這是你職涯裡最像在做未來的一年。": "You brought R&D and sustainability together, using AI to screen low-carbon formulations. Of your whole career, this was the year that felt most like working on the future.",
"你保住了最需要專業的那一塊，其他自己扛。這是務實的分配。": "You kept the help on the part that most needed expertise and carried the rest yourself. A pragmatic split.",
"你保住了自己的位子一陣子。他半年後跳槽，去了你們最大的客戶那邊。": "You kept your seat safe for a while. Six months later he jumped ship — to your biggest client.",
"你們一來一往聊了很久，最後他反而幫你解掉一個你卡了兩週的問題。": "You went back and forth for a long time — and in the end, he was the one who solved a problem you'd been stuck on for two weeks.",
"你們不是護國神山，排不到隊；你們也不是小廠，躲不掉客戶的問卷。<br><br>採購問你：「那我們到底要不要簽 PPA？一度五、六塊。」": "You aren't the guardian mountain of the nation, so there's no place in the queue for you; you aren't a small shop either, so you can't dodge the customer questionnaires.<br><br>Procurement asks: \"So do we sign a PPA or not? Five, six NT dollars a kilowatt-hour.\"",
"你們共用一個品牌對外接案。": "You took on projects under a shared brand.",
"你們後來斷斷續續通了幾年信。他畢業那年寄了論文給你。這件事比任何 KPI 都有份量。": "You kept writing to each other, on and off, for years. The year he graduated, he sent you his thesis. That carries more weight than any KPI.",
"你們從百分之一開始摻配，並誠實揭露這個比例。有人笑太少，但那是真的。": "You started blending at one percent, and disclosed that ratio honestly. Some laughed at how small it was. But it was real.",
"你們戰隊一路打進全國賽，<em>拿了冠軍</em>。<br><br>領獎那天你站在台上，覺得自己這輩子大概不會再這麼確定一件事了。": "Your team fought all the way to nationals — <em>and took the title</em>.<br><br>Standing on the stage that day, you thought you would probably never be this sure of anything again.",
"你們所可以在家上班。<em>省下通勤、穿睡褲開會、貓在鍵盤上走來走去</em>。很快樂，但你發現自己越來越習慣不進辦公室。": "Your firm allows work from home. <em>No commute, meetings in pajama pants, the cat walking back and forth across the keyboard</em>. It's lovely — and you notice you're getting more and more used to not going in.",
"你們所的客戶說：我們導了一套永續管理系統，<em>系統商自己有顧問團隊</em>，報告書和碳盤查他們都能做。<br><br>四大主導輔導市場的那幾年，好像正在過去。": "A client of your firm says: we've implemented a sustainability management system, and <em>the vendor has its own consulting team</em> — they can do the report and the GHG inventory both.<br><br>The years when the Big 4 dominated the advisory market seem to be passing.",
"你們拿了輔導資源，但沒有簽承諾。<br><br>學到了東西，也留了退路。大客戶那邊的窗口從此對你們客氣，但不熱絡。": "You took the coaching resources and signed no commitment.<br><br>You learned things, and you kept an exit. The contact at the big customer stayed polite with you after that, and never warm.",
"你們拿到了一座獎。新聞稿發了、大廳擺了。三個月後有人問你那個獎怎麼評的，你講不太出來。": "You won a trophy. The press release went out; it sits in the lobby. Three months later someone asked you how the award was judged, and you couldn't quite say.",
"你們拿到了綠建築標章。行銷部很開心，你知道那跟工地的日常還有距離。": "You got the green building certification. Marketing was thrilled. You know it's still some distance from daily life on the site.",
"你們早就做完了，現在做的是優化。安穩，但你的履歷停在同一個故事。": "You finished long ago; what's left is optimization. Steady — but your resume is stuck on the same story.",
"你們是「大」的那個。要挑哪幾家供應商一起進來，這件事落到你手上。<br><br>": "You're the \"big\" one. Choosing which suppliers come along lands on your desk.<br><br>",
"你們最大的品牌客戶宣布：明年起供應商一律要 EcoVadis 銀牌、要上 CDP、要有 SBTi 目標。<em>一家龍頭的要求，變成整個產業的門檻</em>。": "Your biggest brand customer announces: from next year, all suppliers need EcoVadis silver, need to report to CDP, need an SBTi target. <em>One industry leader's requirement becomes the whole industry's bar</em>.",
"你們沒有綁在一起，但互相補位。這個關係維持了很多年。": "You never tied yourselves together, but you covered for each other. The relationship lasted many years.",
"你們發了更正聲明，附上完整計算過程。罵聲持續了一週，但三個月後有人說：至少他們認了。": "You issued a correction with the full calculation attached. The criticism lasted a week. Three months later, someone said: at least they owned it.",
"你們的契約容量夠大，被「用電大戶條款」點名：<em>五年內要有一成的電來自再生能源</em>。四條路——自己蓋、裝儲能、買憑證，或直接繳代金了事。<br><br>而離岸風電的購電價格，這幾年從一度三塊一路漲到五、六塊。": "Your contracted capacity is big enough to be named under the \"major electricity user\" clause: <em>within five years, one-tenth of your power has to come from renewables</em>. Four routes — build your own, install storage, buy certificates, or just pay the in-lieu fee and be done with it.<br><br>Meanwhile, the purchase price of offshore wind has climbed these past few years from three dollars a kWh to five or six.",
"你們的水產供應鏈裡有遠洋漁船。<em>美國把台灣遠洋漁獲列進強迫勞動清單已經好幾次了</em>——扣薪、債務綁定、海上暴力的指控一直都在。": "Your seafood supply chain includes distant-water fishing vessels. <em>The US has put Taiwan's distant-water catch on its forced labor list more than once</em> — the allegations of withheld wages, debt bondage, and violence at sea have never gone away.",
"你們的碳排不在自己身上": "Your Emissions Aren't Yours",
"你們簽了五年的量，並在報告書上老實寫出「百分之二」。有人笑太少，但那是真的，而且是台灣自己做的。": "You signed for five years of volume, and honestly wrote \"two percent\" in the sustainability report. Some laughed at how small it was. But it was real, and Taiwan made it itself.",
"你們約在咖啡廳聊了半小時。他問的問題你三年前也問過，你講得很仔細。<em>之後就沒有再聯絡了</em>。": "You met at a café and talked for half an hour. The questions he asked, you'd asked three years ago too, so you answered carefully. <em>You never heard from each other again</em>.",
"你們聊了三小時，一半在抱怨客戶，一半在交換方法。回家的路上心情好很多。": "You talked for three hours — half complaining about clients, half trading methods. The ride home felt much lighter.",
"你們花了半小時把「完成」的定義寫清楚。後面就順了。": "You spent half an hour writing down what \"done\" means. Everything after that went smoothly.",
"你們訂了一批甲醇雙燃料船。這是二十年的賭注，而你在會議紀錄上簽了名。": "You ordered a batch of methanol dual-fuel ships. It's a twenty-year bet, and your name is signed in the meeting minutes.",
"你們認養了一塊火燒跡地，找了大學、林業單位和在地部落一起做六年復育。兩年後調查記錄到七十幾種原生植物、還拍到穿山甲——<em>這是你做過最不像永續工作、卻最像在做永續的一件事</em>。": "You adopted a burn-scarred site and brought in a university, the forestry agency, and the local Indigenous community for a six-year restoration. Two years in, the surveys recorded seventy-some native plant species — and caught a pangolin on camera. <em>Of everything you've done, this looked the least like sustainability work, and felt the most like doing sustainability</em>.",
"你們談好了轉介費。這個模式後來變成你們固定的合作方式。": "You agreed on a referral fee. The arrangement became your standing way of working together.",
"你們辦了植樹活動，照片很好看。三年後有人去看，發現存活率不到四成。": "You held a tree-planting event. The photos looked great. Three years later someone went to check: survival was under forty percent.",
"你們隔著人群點了頭。有些關係停在最好的時候，也是一種完整。": "You nodded to each other across the crowd. Some relationships stop at their best moment — that, too, is a kind of completeness.",
"你們默默調整了授信標準。做了，但沒有說——在這個年代，這其實是常態。": "You quietly adjusted the lending standards. Done, but not said — in this era, that's actually the norm.",
"你做了": "you put in",
"你做了 ": "you put in ",
"你做了一份三合一的對照表，把重疊與缺漏都標出來。這份表後來被拿去給董事會看。": "You made a three-in-one mapping table, marking every overlap and gap. It later got shown to the board.",
"你做了一份三年的成本推估。經營層第一次把碳當成預算科目來看。": "You built a three-year cost projection. For the first time, management looked at carbon as a budget line.",
"你做了一份三種燃料的比較。決策最後不是你做的，但那份分析被引用了很多次。": "You did a comparison of three fuels. The decision wasn't yours in the end. But that analysis got cited many times.",
"你做了一份區域環境負擔的分析，寫進報告書。沒有人要求你做，但這是「公正」兩個字第一次在你們公司變成數字。": "You did an analysis of regional environmental burden and wrote it into the sustainability report. Nobody asked you to. But it was the first time the word \"just\" became a number at your company.",
"你做了一份市場薪資比較帶去談。調幅不大，但永續職的升遷路徑第一次被寫進制度裡。": "You brought a market salary comparison to the negotiation. The raise wasn't big, but for the first time, a promotion path for sustainability roles was written into policy.",
"你做了一份市場薪資比較帶去談。調幅不大，但至少職級路徑被寫下來了。": "You brought a market salary comparison to the table. The raise wasn't big. But at least the career ladder got written down.",
"你做了一份缺口清單，把該補的證據列出來。今年沒送，但明年送出去的版本會好看很多。": "You made a gap list, laying out the evidence that needed filling. You didn't submit this year. But next year's submission will look a lot better.",
"你做了一張對照表。下次要跳槽，每一扇門背後的條件你都心裡有數。": "You made a comparison table. Next time you switch jobs, you'll know what's behind every door.",
"你做了一張對照表，後來全公司都在用。": "You made a mapping table. Later, the whole company was using it.",
"你做了一整年的專案，成果發表會上，掛名報告的是另一個人。": "You worked on the project all year. At the results presentation, the name on the report is someone else's.",
"你做了完整的技術與成本評估。水泥、鋼鐵這些卡了十年的排放，終於看得到路。": "You did a full technical and cost assessment. Cement, steel — emissions stuck for a decade — finally have a visible road.",
"你做了審慎的評估。技術可行不等於財務可行——這個判斷後來被證明是對的。": "You made a careful assessment. Technically feasible doesn't mean financially feasible — a judgment later proven right.",
"你做了新舊對照表，附了一頁說明。有人說你太龜毛，但查證那天沒人有意見。": "You made an old-versus-new comparison table with a page of notes attached. Some said you were too fussy. On verification day, nobody had objections.",
"你做了決定。": "You made your call.",
"你做了第一份身心健康調查。有人在匿名欄寫了很長一段話。": "You ran the first mental health survey. Someone wrote a very long paragraph in the anonymous field.",
"你做了第一個案子才發現：這行八成的時間在寫文件與跟主管機關來回，不是在減碳。但你成了少數真的跑完整個流程的人。": "It took doing the first project to learn: eighty percent of this business is writing documents and going back and forth with the regulator, not cutting carbon. But you became one of the few who has actually run the whole course.",
"你做出了第一張 SDGs 對照表。後來很多人跟你要檔案。": "You built the first SDGs mapping table. Later, a lot of people asked you for the file.",
"你做完了，也留了一份工時紀錄。年底檢討時，那份紀錄替你說了話。": "You finished it, and kept a record of the hours. At the year-end review, that record spoke for you.",
"你做完後把功勞算在他身上。他之後又轉了兩個案子給你。": "You did the work and let the credit go to him. He sent you two more projects after that.",
"你做的正好是這一塊": "This Happens to Be Your Area",
"你偶爾會覺得自己運氣不太好。": "Every so often you suspect your luck runs a little short.",
"你偶爾還是會在半夜醒來想工作的事。": "you still wake up at night sometimes, thinking about work.",
"你先找了別的工作：<strong>": "You took a different job first: <strong>",
"你先把自己公司查了一遍，發現派遣同仁的申訴管道形同虛設。修好那件事花了半年。": "You audited your own company first and found the grievance channel for dispatch workers existed in name only. Fixing that took half a year.",
"你先拿到入門的銅牌。更高的門檻，留給明年的自己。": "You got the entry-level bronze first. The higher bar, you left for next year's self.",
"你先是覺得是詐騙，然後把號碼一位一位對回去、對了七次。<br><br>": "Your first thought is that it's a scam. Then you check the number digit by digit, seven times over.<br><br>",
"你先查自己公司，才發現派遣同仁的申訴管道形同虛設、移工的仲介費有問題。修好那些花了半年，但你補上了最該補的洞。": "You audited your own company first — and found the dispatch workers' grievance channel existed in name only, and the migrant workers' broker fees had problems. Fixing those took half a year. But you patched the holes that most needed patching.",
"你先查自己公司，發現派遣同仁的申訴管道形同虛設。修好那件事花了半年，但你補上了最該補的洞。": "You audited your own company first, and found the dispatch workers' grievance channel existed in name only. Fixing it took half a year. But you patched the hole that most needed patching.",
"你先算了電力、鋼鐵、水泥三個產業。是個開始。": "You started with three sectors: power, steel, cement. It's a start.",
"你先認了太陽能、風電這些最沒爭議的。灰色地帶留給以後。": "You recognized the least controversial ones first — solar, wind. The gray areas, you left for later.",
"你免費做了一份交接懶人包給他。兩年後他跳到別家，第一個找的顧問是你。": "You made him a handover cheat sheet for free. Two years later he jumped to another company, and the first consultant he called was you.",
"你冷冷看著。熱過一次、冷過一次，你學會了不被任何一次風向牽著走。": "You watched coldly. Having been through one boom and one bust, you've learned not to be led by any single change in the wind.",
"你出了資、簽了名，名片換了。<strong>你成了合夥人。</strong>": "You put in the capital, signed your name, and got new business cards. <strong>You made partner.</strong>",
"你列了一張「AI 做不到的事」清單，一項一項講。半年後你拿到半個人力——約聘的。": "You made a list of \"things AI can't do\" and walked through it item by item. Six months later you got half a headcount — on contract.",
"你列了一張清單。主管愣了一下，說：那我們找顧問。": "You made a list. Your manager paused, then said: then we'll hire consultants.",
"你列了一張表比較兩條路。轉過去要降薪，但天花板高很多。": "You made a table comparing the two roads. Switching means a pay cut. But the ceiling is much higher.",
"你列出了查證會被開不符合、以及對外更正的風險。他沉默了很久，最後說：那就照原本的。": "You laid out the risks: a nonconformity at verification, a public correction. He was silent for a long time, then said: keep it as it was.",
"你列出缺口清單，排了一年的補齊時程。做完之後，導入計畫變成一份看得懂的專案，而不是一團焦慮。": "You listed the gaps and laid out a year-long schedule to close them. When it was done, the implementation plan was a legible project instead of a knot of anxiety.",
"你判斷 DEI 這個詞會退燒，但「人權盡職調查」不會——你把重心挪過去，剛好接上下一波。": "You judged that the word DEI would cool off, but \"human rights due diligence\" wouldn't — you shifted your weight over, just in time to catch the next wave.",
"你判斷下一波要來了，先把履歷更新好。撐過寒冬的人，在回暖時最有話語權。": "You judged the next wave was coming, and updated your résumé first. The people who survive the winter have the most say when the thaw comes.",
"你判斷併購後的組織會亂上兩年，決定先走。這不是逃，是止損。": "You judged the post-merger organization would be chaos for two years, and decided to leave first. Not an escape. A stop-loss.",
"你判斷寒冬還沒到底，先找個安穩的地方。": "You judged the winter hadn't hit bottom yet, and found somewhere stable first.",
"你判斷得很準：導入過 S1／S2 的人，正是企業現在最缺的。": "Your judgment was spot on: people who've implemented S1/S2 are exactly what companies lack most right now.",
"你判斷得沒錯，台灣兩年內都不會強制。只是等它強制的時候，你要從零開始。": "You judged right — Taiwan wouldn't mandate it for two years. Only, when it does, you'll be starting from zero.",
"你判斷得沒錯，時間確實還早。但到了 2026 年，會的人已經有人排在你前面。": "You judged right — it was still early. But by 2026, the people who knew it were already lined up ahead of you.",
"你判斷得沒錯，框架還要好幾年才會定案。只是等它定案時，先做的人已經有五年的案例。": "You judged right: the framework is still years from being finalized. It's just that by the time it is, the ones who started early will have five years of cases.",
"你判斷得沒錯，準則確實一直在變。但等你回頭要學時，會的人已經很多了。": "You judged right — the standards did keep changing. But by the time you turned back to learn them, plenty of people already knew.",
"你判斷得謹慎。技術確實還要一段時間才穩。": "You judged cautiously. The technology really does need more time to stabilize.",
"你判斷得謹慎。技術確實還要兩年才穩，但先跳的人已經卡到位子了。": "You judged cautiously. The technology really does need two more years to stabilize — but the ones who jumped first have already claimed the seats.",
"你判斷投入產出不划算，選擇不答。分數掉了幾分，而競爭對手那邊補上了。": "You judged the return not worth the effort and chose not to answer. The score dropped a few points — and your competitors picked them up.",
"你判斷方向不會變、只是範圍縮，該建的制度照建。後來證明你賭對了大半。": "You judged the direction wouldn't change — only the scope would shrink — and built the systems that needed building anyway. It later turned out you'd bet mostly right.",
"你判斷現在的量太小、價格太高。合理，但你們也錯過了跟本土供應鏈一起長大的機會。": "You judged the current volume too small, the price too high. Reasonable. But you also missed the chance to grow up alongside the local supply chain.",
"你判斷自己的價值在甲方會被看得更清楚。很多人是在這個路口離開四大的。": "You judged that your value would be seen more clearly on the client side. This is the crossroads where many people leave the Big Four.",
"你判斷買賣碳權治標不治本，把力氣留給實質減量。清醒，但也少了一項別人有的技能。": "You judged that trading credits treats the symptom, not the cause, and kept your effort for real reductions. Clear-eyed. But it's one skill others have that you don't.",
"你判斷輔導市場會被壓縮，決定先卡好甲方的位子。": "You judged that the advisory market would shrink, and decided to lock in a client-side seat first.",
"你判斷這個組織已經沒有你的位子。這不是失敗，是止損。": "You concluded this organization no longer had a place for you. That's not failure. That's cutting your losses.",
"你判斷還在草案階段，先不動。<br><br>這個判斷不算錯——只是兩年後真的定案時，你是從零開始的那一個。": "You judged it was still at draft stage and didn't move.<br><br>Not a wrong call — except that two years later, when it was finalized for real, you were the one starting from zero.",
"你利用午休和下班去搞懂別人在做什麼。累，但兩年後要跳槽時，你是唯一講得出全貌的人。": "You used lunch breaks and evenings to figure out what everyone else was doing. Tiring. But two years later, when it was time to move, you were the only one who could describe the whole picture.",
"你利用晚上上完了一門課。": "You finished a course in the evenings.",
"你利用晚上把影音看完。學到七成，少了現場問問題的那三成。": "You watched the recordings in the evenings. You got seventy percent of it — minus the thirty percent that comes from asking questions in the room.",
"你利用暑假上完一門課，摸到了碳盤查的門。履歷上多了一行。": "You finished a course over summer break and touched the door of GHG inventory. One more line on the résumé.",
"你利用通勤和週末上完了。沒有一張紙可以掛在履歷上，但下一次客戶問範疇三，你答得出來的層次不一樣了。": "You finished it on commutes and weekends. No paper to hang on your resume — but the next time a client asked about Scope 3, you answered on a different level.",
"你刪了。但截圖還在流傳，而且沒有你的後半段。": "You deleted it. But the screenshots kept circulating — without your second half.",
"你到了協理，往上看——<em>那個位子不存在</em>。<br><br>2022 年的調查說，台灣只有 9% 的企業專設永續長，金融業最高也才 16.7%。你們公司的 ESG 分數在後段，董事會的態度很明白：永續「有人管就好」，不需要一個 C 開頭的頭銜。<br><br>天花板不是你不夠好，是<em>這裡根本沒蓋那一層</em>。": "You've made director. You look up — <em>the seat above doesn't exist</em>.<br><br>A 2022 survey found only 9% of Taiwanese companies have a dedicated Chief Sustainability Officer; even finance, the highest, reaches just 16.7%. Your company's ESG score sits in the back of the pack, and the board's attitude is plain: sustainability just needs \"someone keeping an eye on it\" — no C-level title required.<br><br>The ceiling isn't that you're not good enough. It's that <em>this building never built that floor</em>.",
"你到職了。<br><br>年薪 <strong>": "You started the new job.<br><br>Salary: <strong>",
"你動用了信貸。這一年你學會了什麼叫現金流。": "You drew on a personal loan. That year, you learned what cash flow means.",
"你動用了所有人脈。": "You called in every contact you had.",
"你動用了所有關係，把這場鬥爭端上檯面。": "You called in every relationship you had and brought the fight into the open.",
"你十八歲，剛考上大學。": "You are 18, and you just got into university.",
"你升上去了，手下有兩個人。<em>沒有人教過你怎麼當主管</em>——你只會做事，不會分事。": "You got promoted. You have two people now. <em>Nobody ever taught you how to manage</em> — you know how to do the work, not how to divide it.",
"你協助整理了一部分。至少知道了那些問題在問什麼。": "You helped compile part of it. At least now you know what those questions are asking.",
"你原本只是請了長假，去山上住幾天。<br><br>": "You had only meant to take a long leave and spend a few days in the mountains.<br><br>",
"你原本只是請了長假，想去山上住幾天，把自己修好再回來。<br><br>": "You had only meant to take extended leave — a few days in the mountains, put yourself back together, come back.<br><br>",
"你去上了三天課。收穫最大的其實是午餐時間認識的那幾個人。": "You took the three-day course. The biggest gain was actually the few people you met at lunch.",
"你去了 <strong>": "You went to <strong>",
"你去了。回來後你替全公司上了三場課，順便把自己的位子坐穩了。": "You went. After you came back, you taught three sessions for the whole company — and settled your own seat while you were at it.",
"你去了一趟他們的廠。真實數字比原本高四成。難看，但真實。": "You visited their plant. The real number was forty percent higher than reported. Ugly, but real.",
"你去了一趟山上，手機沒訊號。回來後你把兩個一直不想做的專案退掉了。": "You went up into the mountains, no phone signal. When you came back, you dropped the two projects you'd never wanted to do.",
"你去了一間跟永續毫無關係的公司。後來發現那段經驗很有用。": "You went to a company that had nothing to do with sustainability. Later, that experience turned out to be very useful.",
"你去了工廠、看了宿舍、跟移工談過。有幾件事帳面上永遠看不到——你要求他們限期改善。": "You went to the factory, saw the dormitories, talked with the migrant workers. Some things never show up on paper — you gave them a deadline to fix them.",
"你去了新廠區。離總部遠了，但你手上第一次有完整的一塊地盤。": "You went to the new site. Farther from headquarters — but for the first time, you hold a complete piece of territory.",
"你去了第一場聚會，發現原來附近就有這麼多同溫層。<em>孤軍奮戰的感覺，第一次鬆動了</em>。": "You went to the first meetup and found this many kindred people had been nearby all along. <em>The feeling of fighting alone loosened, for the first time</em>.",
"你去了製造業。安全，也少了點什麼。": "You went into manufacturing. Safe. And something was missing.",
"你去做了沒有人想做的那一塊：把社會面的指標、資料來源、衡量方法從零建起來。<br><br>第一年名次沒進去。第二年進去了，而且你們的 S 是同業裡最高的——<em>因為別人還在對著空白發呆。</em>": "You took on the piece nobody wanted: building the social indicators, the data sources and the measurement methods from zero.<br><br>The first year you didn't place. The second year you did, and your S was the highest among your peers — <em>because everyone else was still staring at a blank page.</em>",
"你去年說要開始找工作。今年，你真的遞了辭呈——<em>接下來要換一份工作了</em>。": "Last year you said you'd start looking. This year, you actually handed in your resignation — <em>time for the next job</em>.",
"你去提案，走進會議室才發現坐在對面的是<em>當年一起熬夜趕報告書的同梯</em>。<br><br>他現在是這家公司的永續主管。你們有五年沒見了。": "You go in to pitch, and only inside the meeting room do you see who's sitting across the table: <em>the batchmate who pulled all-nighters on sustainability reports with you back in the day</em>.<br><br>He's this company's head of sustainability now. It's been five years.",
"你去看了考試簡章，也問了在裡面的學長。最後沒有轉，但知道了還有這條路。": "You read the exam brochure and asked a senior who was already inside. In the end you didn't switch. But now you know the road exists.",
"你去跟採購窗口談，附上你們已經做過的第三方確信報告。<br><br>對方同意讓你們用既有報告替代自評表。<em>一句話省下三週——只是你得敢開口。</em>": "You went to their procurement contact and brought along the third-party assurance report you already had.<br><br>They agreed to let it stand in for the self-assessment form. <em>One sentence saved three weeks — you just had to be willing to ask.</em>",
"你參考了三家同業的段落，拼出一份看起來完整的回覆。": "You borrowed passages from three peer companies and pieced together a reply that looked complete.",
"你參與了一個二十年的購電案。價格鎖在那裡，好壞二十年後才知道——但至少你們搶到了量，這在缺綠電的台灣就是護城河。": "You worked on a twenty-year power purchase deal. The price is locked in; good or bad, you'll know in twenty years — but at least you secured the volume, and in green-power-starved Taiwan, that's a moat.",
"你參與了一紙二十年的綠電轉供合約。量鎖住了，資料中心成了公司對外最好的名片。": "You worked on a twenty-year green power supply contract. The volume is locked in, and the data center became the company's best calling card.",
"你參與了整條示範線的規劃。它只佔淨零路徑的一小塊，而且貴得嚇人——但製程排放這件事，沒有捷徑。": "You worked on planning the entire demonstration line. It covers only a small slice of the net-zero pathway, and it's terrifyingly expensive — but with process emissions, there are no shortcuts.",
"你參與了示範計畫。短期看不到成果，但你站進了那個圈子。": "You joined the pilot program. No results to show in the short term. But you stepped into that circle.",
"你參與了第一批示範。十年前寫在路徑圖上那句「氫能煉鋼」，你活著看到它落地。": "You joined the first batch of demonstrations. The phrase \"hydrogen steelmaking,\" written on a roadmap ten years ago — you lived to see it land.",
"你參與了調查。找到了人，也失去了幾個原本會跟你講真話的同事。": "You took part in the investigation. They found the person. You lost a few colleagues who used to tell you the truth.",
"你參與了長期購電案，也跟廠務把冰水主機重調——省下來的電比買到的還多。": "You worked on the long-term power purchase, and re-tuned the chillers with facilities — the power saved was more than the power bought.",
"你又把": "You deepened ",
"你受的是世界頂尖的環境訓練。<em>回台灣做的第一件事，卻可能是核對供應商的電費單。</em>": "You have had world-class environmental training. <em>The first thing you do back in Taiwan may be checking suppliers' electricity bills.</em>",
"你只講了三件事：花了多少、省了多少、明年要做什麼。董事長點了頭。": "You said only three things: what it cost, what it saved, what comes next year. The chairman nodded.",
"你只負責這一塊": "You Only Handle This Piece",
"你同學的起薪是你的兩倍，有些人已經在傳他們的識別證照片。<br><br>": "Your classmates are starting on double that, and some are already passing round photos of their badges.<br><br>",
"你含糊帶過。那段影片後來在群組裡流傳了一陣子。": "You glossed over it. The clip circulated in the group chats for a while afterward.",
"你告訴自己再撐一下。這句話你已經對自己說了兩年。": "You told yourself to hold on a little longer. You've been telling yourself that for two years.",
"你和事務所談出一個最小範圍。意見書拿到了，涵蓋的內容比外界以為的少很多。": "You negotiated the smallest possible scope with the firm. You got the opinion letter, and it covers far less than anyone outside would assume.",
"你和品保、廠務一起盤點，最後從冰水主機與空調著手，冷鏈完全沒動。省了一成的電。": "You went through it with QA and facilities, and ended up starting with the chillers and HVAC — the cold chain untouched. Ten percent off the electricity.",
"你和會計部一起重建了整套時程與內控。從此永續不再是年底才動的事。": "You and accounting rebuilt the whole timeline and internal controls. From then on, sustainability was no longer something that only moved at year-end.",
"你問了一個沒有人想問的問題：這些資料保存多久、會被用來做什麼。HR 說會回覆你，然後就沒有然後了。": "You asked the question nobody wanted to ask: how long is this data kept, and what will it be used for. HR said they'd get back to you, and then nothing.",
"你喜歡一個人決定所有事。代價是所有事都要你決定。": "You like deciding everything alone. The price is that everything needs you to decide it.",
"你回了一千多字，講了機會也講了坑。半年後他傳來一張 offer 的截圖。": "You replied with over a thousand words — the opportunities and the pitfalls both. Half a year later he sent you a screenshot of an offer.",
"你回了三行。他說謝謝，然後就沒有下文了。": "You replied in three lines. He said thanks, and that was the end of it.",
"你回了信說最近走不開，留了聯絡方式。<br><br>獵頭說：「有需要隨時找我。」": "You wrote back saying you couldn't get away right now, and left your contact info.<br><br>The headhunter said, \"Call me whenever you need.\"",
"你回了謝謝但不合適。那個帳號的可信度，是你唯一真正的資產。": "You replied thanks, but not a fit. That account's credibility is your only real asset.",
"你回到了受雇的世界。有勞健保、有年終，也有回不去的自由。": "You went back to the world of employment. Health insurance, a year-end bonus — and a freedom you can't get back.",
"你回到原本的位子上班。名片沒換，但整個圈子都知道你「差一點」——<em>這件事有時是資產，有時是標籤。</em>": "You went back to your old desk. The business card didn't change, but the whole circle knows you \"almost made it\" — <em>sometimes that's an asset, sometimes it's a label.</em>",
"你回絕了。<br><br>機構少了一筆錢，你也少了一次麻煩。<em>幾年後你在報告書上看到別家做的同類專案，照片裡的孩子笑得很開。</em>": "You turned it down.<br><br>The organization was one grant short, and you were one headache short. <em>Years later you saw the same kind of project from another company in a report, the kids in the photo smiling wide.</em>",
"你在": "At ",
"你在 ": "At age ",

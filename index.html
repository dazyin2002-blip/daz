"你沒有講漂亮話，你講的是「這個產業為什麼真的很難減」。<br><br>台下有人猛點頭——他們每天都在這個難處裡。散場後排隊來要名片的，是同業的廠長，不是記者。": "You didn't give them the polished version. You talked about why this industry is genuinely hard to decarbonize.<br><br>People in the audience nodded hard — they live inside that difficulty every day. Afterwards the queue for your card was plant managers from the industry, not reporters.",
"你沒有走捷徑。數字是慢慢做出來的，碳也是慢慢減下來的。": "You took no shortcuts. The numbers were earned slowly, and the carbon came down slowly.",
"你沒有跑場，只跟三個前輩聊了整晚。他們把各家公司的門檻、雷區、誰好相處，一項一項講給你聽。": "You didn't work the room. You talked with three veterans all night. They walked you through each company's bar, its landmines, who's easy to work with — item by item.",
"你沒有跟這個字綁死。你把同一套能力接到人權、供應鏈、營運韌性上——做的事沒少，只是換了件衣服。": "You never chained yourself to the word. You plugged the same skills into human rights, supply chain, operational resilience — the work didn't shrink. It just changed clothes.",
"你沒有跟高層辯論用詞，你直接把計畫改了：改去做沒有人在做、也沒有人願意做的那一塊。<br><br>一年後，那個宣稱終於變成真的。": "You didn't argue wording with leadership. You changed the programme instead, and pointed it at the part nobody was doing and nobody wanted to do.<br><br>A year later, the claim was finally true.",
"你沒有跳。兩年後他們募到資，你有點感慨，但知道那不是你的路。": "You didn't jump. Two years later they closed their funding round. It stirred something in you. But you know that wasn't your road.",
"你沒聽過它，但全球一半的手機裡有它的零件。品牌客戶的要求一層層壓下來。": "You have never heard of it, but its parts are in half the world's phones. Brand client demands come down layer by layer.",
"你沒買。房價後來又漲了一波，但你保留了選擇的自由。": "You didn't buy. Prices climbed another round afterward. But you kept your freedom to choose.",
"你活下來了，但不算輕鬆。<br><br>": "You survived, though not comfortably.<br><br>",
"你活下來了，但復健花了很久很久。等你能重新坐回辦公桌前，": "You survived, but rehab took a long, long time. By the time you could sit back down at a desk, ",
"你深耕熟悉的領域。安全，但市場正在往別的方向跑。": "You went deeper in the field you knew. Safe. But the market was running the other way.",
"你減下了一些碳。不多，但每一噸都經得起查。": "You cut some carbon. Not much — but every tonne stands up to an audit.",
"你準備了一份「我能為新集團做什麼」的簡報，直接找上決策者。": "You prepared a deck titled \"what I can do for the new group\" and went straight to the decision-makers.",
"你準時下班了一整年。在這個行業裡不容易。": "You left work on time for a whole year. Not easy in this industry.",
"你為了一個還沒收尾的專案留下來。錢不是這份工作的重點——雖然你偶爾希望它是。": "You stayed for a project that wasn't finished yet. Money isn't the point of this job — though occasionally you wish it were.",
"你為了寫那份新聞稿，把客戶的報告書從頭讀完。這是你第一次接觸這個世界。": "To write that press release, you read the client's sustainability report from the beginning. It was your first contact with this world.",
"你照實填了。客戶回信說沒關係，但明年會再問一次。": "You filled it in truthfully. The client wrote back: that's fine — but we'll ask again next year.",
"你照樣填了報名表。獎盃擺在大廳，跟去年那座長得一模一樣。": "You filled out the entry form anyway. The trophy sits in the lobby, identical to last year's.",
"你照規定做完了。剛剛好，不多不少。": "You did what the rules required. Exactly that. No more, no less.",
"你熟練、可靠，但你做的事 AI 三小時就能做完。明年的組織圖上，你的職位被畫上了問號。": "You're skilled and reliable. But what you do, AI can finish in three hours. On next year's org chart, there's a question mark drawn over your position.",
"你熟練、快速、可靠。但明年的預算表上，你的職位變成了「檢討項目」。": "You were skilled, fast, reliable. But on next year's budget sheet, your position became an \"item under review.\"",
"你熬了兩個晚上補齊佐證。下次你會先準備好。": "You stayed up two nights filling in the supporting evidence. Next time, you'll have it ready first.",
"你熬了兩週把每一筆對回原始單據。查證那天，老師只問了三個問題。": "You ground through two weeks matching every entry back to its original documents. On verification day, the verifier asked only three questions.",
"你現在年薪": "Right now you're earning ",
"你用 AI 產了一段法規說明，讀起來很順。<em>但它引用了一個不存在的條號</em>。<br><br>差點就這樣送出去了。": "You used AI to generate a regulatory explanation, and it reads smoothly. <em>But it cites an article number that doesn't exist</em>.<br><br>It almost went out like that.",
"你用 AI 補一半，自己補另一半。事情做完了，代價寫在你的健檢報告上。": "You covered half the gap with AI and the other half yourself. The work got done. The cost is written in your health checkup report.",
"你用 LEAP 的前兩步做了一份粗略盤點。有個雛形，隨時可以往下深挖。": "You used the first two steps of LEAP to do a rough assessment. There's a skeleton now, ready to dig deeper any time.",
"你用去年的數字乘上成長率補完。申報準時，沒有人發現。<br><br><em>明年這個時候，你還是會寄出八十七封信。</em>": "You filled the gaps with last year's numbers times a growth rate. The filing went in on time and nobody noticed.<br><br><em>This time next year, you'll still be sending eighty-seven emails.</em>",
"你用同業比較、法規趨勢和機構投資人的意見書堆出一份提案。董事會「原則同意研議」——在這家公司的語言裡，這已經是很大的一步。<em>那個位子開始有輪廓了，而離它最近的人是你。</em>": "You stacked up a proposal out of peer comparisons, regulatory trends, and institutional investors' opinion letters. The board \"agrees in principle to study the matter\" — in this company's language, that's already a big step. <em>The seat is starting to take shape, and the person standing closest to it is you.</em>",
"你用它做了一個內部工具，主管拿去跟高層報告。那次之後你的能見度不太一樣了。": "You used it to build an internal tool, and your manager took it to senior management. After that, your visibility wasn't quite the same.",
"你用支援的名義過去做了兩個案子。學到一點皮毛，也沒得罪任何人。這是所裡最常見的做法——<em>兩邊都沾，兩邊都不深。</em>": "You went over on a support basis and did two projects. You picked up a little, and offended nobody. It's the most common move in the firm — <em>a foot in both, deep in neither.</em>",
"你用財務聽得懂的語言重寫了一次：投入多少、省下多少、回收期幾年。<br><br>財務長看完只說了一句：「這個怎麼沒有早點給我看。」<em>從那年起，你的預算不用再用拜託的。</em>": "You rewrote it in a language finance understands: money in, money saved, payback period.<br><br>The CFO read it and said one thing: \"Why am I only seeing this now?\" <em>From that year on, your budget stopped being a favour you had to ask for.</em>",
"你用進步幅度談判——不是跟那些護國神山比，是跟去年的自己比。這個框架讓經營層第一次覺得永續是划算的投資。": "You negotiated on improvement — not against the silicon giants, but against last year's self. That framing made management see sustainability as a worthwhile investment for the first time.",
"你申請補一個人。上面回：<em>「這些事 AI 不是都能做了嗎？」</em><br><br>於是你沒有拿到人力，拿到的是一筆軟體授權預算。": "You request one more headcount. The answer from above: <em>\"Can't AI do all of this now?\"</em><br><br>So you don't get a person. You get a software licensing budget.",
"你申請調去廠端。同事覺得你瘋了——但從此你講的每一句減碳都有工單撐著，產業的門對你越開越大。": "You requested a transfer to the plant. Your colleagues thought you were crazy — but from then on, every word you said about cutting carbon had a work order behind it, and the industry's doors kept opening wider.",
"你留下來。總部的案子比較大、比較亮，也比較擠。": "You stayed. Headquarters projects are bigger, shinier — and more crowded.",
"你留下來了。三年後所裡提到這個題目，第一個想到的名字是你——<em>深度是有價格的，代價是廣度。</em>": "You stayed. Three years on, when this topic comes up in the firm, yours is the first name anyone thinks of — <em>depth has a price, and the price is breadth.</em>",
"你留下來了。公司加了薪留你——你知道這是那通電話換來的。": "You stayed. The company raised your pay to keep you — and you know that phone call is what bought it.",
"你留下來了。幾年後你偶爾會想起那個沒去的選項。": "You stayed. Years later, you still think sometimes about the option you didn't take.",
"你留下來收拾。有些同事沒有。": "You stayed to clean up. Some of your colleagues did not.",
"你留到最後，把災損、對外說明和員工的資遣文件一份一份收好。<em>公司沒能撐過去，但你讓它倒得清楚。</em>": "You stayed to the end, filing away the damage assessments, the public statements, and the employees' severance papers one by one. <em>The company didn't make it — but you made sure it went down with everything accounted for.</em>",
"你留到關門那天，把所有底稿整理好交給接手的人。沒有人付你這段時間的錢，但你睡得著。": "You stayed until the day the doors closed, organizing every working paper and handing it to whoever came next. Nobody paid you for that time. But you can sleep.",
"你留在台灣。<br><br>幾年前有過一次外派的機會，你沒有去。偶爾看到當年同事在曼谷、在阿姆斯特丹發的照片，你會想一下那條沒走的路。": "You stayed in Taiwan.<br><br>Years ago there was a chance to go abroad; you didn't take it. Now and then you see old colleagues' photos from Bangkok, from Amsterdam, and think for a moment about the road not taken.",
"你留在學校，接了<strong>大學社會責任（USR）</strong>計畫的助理。<br><br>": "You stayed at school and became an assistant on a <strong>University Social Responsibility (USR)</strong> project.<br><br>",
"你留在綠能圈。薪水沒漲，但你看著它十年後又活過來。": "You stayed in the green energy world. Your salary didn't move, but you watched it come back to life ten years later.",
"你留守顧著手上的案子。那兩個名額後來成了他們履歷上的亮點。": "You stayed behind to watch your projects. Those two slots became the highlights of other people's resumes.",
"你當作沒看到，隔週照常更新。爭議自己散了。": "You pretended not to see it and posted as usual the next week. The controversy dissolved on its own.",
"你當年下到前線。有人說你繞了遠路，但你比誰都懂這個產業真正怎麼運作。": "Back then, you went down to the front lines. Some said you took the long way around — but you understand better than anyone how this industry really runs.",
"你當週就投了履歷。現實一點沒有錯——後面的人領不到最後兩個月的薪水。": "You sent out resumes that same week. Nothing wrong with being practical — the people who stayed never got their last two months' pay.",
"你發了三次開會通知。<em>會議室裡只有你和一個代理出席的實習生</em>。": "You sent the meeting notice three times. <em>The room holds you and one intern attending on someone else's behalf</em>.",
"你發了八封信，回了三封，成了一件。人脈在這種時候才知道值多少。": "You sent eight emails. Three replied. One turned into work. Times like this are when you learn what a network is worth.",
"你發了十二封，兩封回信都說「今年預算收緊，明年再說」。": "You sent twelve emails. The two replies both said \"budgets are tight this year — let's talk next year.\"",
"你發現「懂這個產業的永續顧問」在市場上是有價的，而且沒有替代品。<em>冷門不是劣勢，是護城河。</em>": "You discovered that a sustainability consultant who understands this industry has a price in the market, and no substitute. <em>Unfashionable isn't a weakness. It's a moat.</em>",
"你發現上游的供應商、下游的品牌商都在找懂永續的人。市場比你以為的大。": "You found that upstream suppliers and downstream brands were all looking for people who understood sustainability. The market was bigger than you thought.",
"你發現不是他們不配合，是根本沒有人告訴他們為什麼要做。你重寫了一份說明。": "You realized it wasn't that they wouldn't cooperate — nobody had ever told them why it mattered. You rewrote the explanation.",
"你發現他們有一段數據明顯有問題。你沒有說出去，但心裡踏實了一點。": "You found a stretch of their data that was clearly wrong. You didn't tell anyone. But you felt a little steadier inside.",
"你發現自己過去十年寫的每一份報告書，都在為這個位子做準備——<em>只是沒有一份報告書教你怎麼被罵。</em>": "You realized that every report you'd written over the past ten years had been preparing you for this seat — <em>except no report ever taught you how to be yelled at.</em>",
"你發現，接不接得到案，跟你認識多少人有關。": "You find that whether the work comes depends on how many people you know.",
"你的": "Your ",
"你的 Email（想收到更新通知再填）": "Your email (only if you want update notifications)",
"你的一年": "Your year",
"你的主管皺了眉。但你晚上睡得著。": "Your manager frowned. But you sleep at night.",
"你的健檢報告上有幾行紅字。": "Your health report has a few lines in red. ",
"你的名字開始出現在政府的委辦報告和公聽會上。你影響的是規則本身——只是那影響很慢才看得見。": "Your name started appearing in government-commissioned reports and at public hearings. What you influence now is the rules themselves — it just takes a long time for that influence to show.",
"你的報價往上跳了一級。現在客戶找你，是衝著 <strong>": "Your rates jumped a tier. Clients now come to you for <strong>",
"你的大學入學年份，會落在 <strong>2010 到 2020</strong> 之間——這十一年，正好涵蓋台灣永續產業": "Your university entry year will land somewhere between <strong>2010 and 2020</strong> — eleven years that happen to carry Taiwan's sustainability industry ",
"你的成績單很好看。這在大公司書審時，是你唯一能拿出來的東西。": "Your transcript looks great. In a big company's paper screening, it's the only thing you have to show.",
"你的提案過了。<br><br>接下來一年你邊上班邊執行計畫，把構想做成了看得見摸得著的東西。": "Your proposal made it.<br><br>For the next year you ran the project alongside your day job, turning the idea into something you could see and touch.",
"你的時間要放在哪裡？": "Where do you put your time?",
"你的簡報被主辦方放上官網。半年後有人跟你說：我看過你那份。": "The organizers put your slides on their website. Half a year later, someone told you: I've seen that deck of yours.",
"你的號召力是真的：因為你，有一群人走進了這個行業。這件事不會出現在任何報表上，但它可能是你做過最永續的事。": "Your pull is real: because of you, a whole group of people walked into this industry. It will never show up in any report — but it may be the most sustainable thing you ever did.",
"你的貼文引戰了": "Your Post Started a Fight",
"你的身體已經在抗議了，只是你還沒聽。": "Your body is already protesting. You just haven't been listening.",
"你的體力快見底了。<em>再撐下去，垮的會是你自己。</em>": "Your stamina is nearly gone. <em>Push on like this, and the thing that collapses will be you.</em>",
"你直接約了對方談。": "You went to them directly and asked to talk.",
"你相信碳費會漲、市場會活。也許會，只是不知道是哪一年。": "You believe the carbon fee will rise and the market will come alive. Maybe it will. You just don't know which year.",
"你看了別人的街道怎麼種樹、別人的超市怎麼標碳足跡，然後有幾天，你成功地什麼都沒有想。<br><br>": " You watched how other people's streets plant trees and how their supermarkets label carbon footprints — and then, for a few days, you successfully thought about nothing at all.<br><br>",
"你看得懂財報、也看得懂授信邏輯。永續資訊財務化之後，這個底子突然很值錢。": "You can read financial statements, and you can read credit logic. Once sustainability information got financialized, that foundation suddenly became worth a lot.",
"你看得懂財報，也看得懂範疇三。IFRS S 上路後，這個組合突然變得很值錢。": "You can read financial statements, and you can read Scope 3. Once IFRS S took effect, that combination suddenly became worth a lot.",
"你真正會做的事（": "What you can actually do (",
"你真的把碳減下來了。不是報告書上的數字，是實際少排出去的那些——沒有人幫你辦頒獎典禮，但那些噸數是真的。": "You actually brought the carbon down. Not numbers in a report — emissions that genuinely never happened. Nobody threw you an award ceremony, but those tonnes are real.",
"你真的減下了碳。<br><br>不是報告書上的數字，是實際少排出去的那些。沒有人幫你辦頒獎典禮，但你自己算得出來。": "You actually brought the carbon down.<br><br>Not numbers in a report — emissions that genuinely never happened. Nobody threw you an award ceremony, but you can run the math yourself.",
"你真的遞了辭呈，搬進了新辦公室。這裡沒有「做永續是不是漂綠」的內耗，因為那就是本業。錢少一點，但你睡得好。": "You actually handed in your resignation and moved into the new office. There's no internal hand-wringing here over \"is our sustainability work greenwashing\" — because it is the business. Less money. Better sleep.",
"你研究所念的": "Your grad-school training in ",
"你私訊過去，他已讀不回。": "You sent a direct message. Read, no reply.",
"你突然想起來：<em>已經好幾個月沒有陌生訊息問你怎麼進永續了</em>。<br><br>前幾年一週一個。這是個很小、但很真實的指標。": "It suddenly occurs to you: <em>it's been months since a stranger messaged asking how to get into sustainability</em>.<br><br>A few years back it was one a week. It's a small indicator, but a real one.",
"你笑而不語。大家反而更願意跟你講真話——因為你不會抖出去。": "You smiled and said nothing. People became more willing to tell you the truth — because you won't spill it.",
"你第一次發現世界很大，也第一次發現英文真的要用。": "You discovered for the first time that the world is big — and for the first time that English really gets used.",
"你第一次真正理解自己在做的事有多急。這個感覺會撐你很多年。": "For the first time, you truly understood how urgent your work was. That feeling will carry you for many years.",
"你答不上來。他接著說了一句你之後很多年都會想起的話：<em>「不同機構的 SROI 比率，本來就不能互相比較。」</em>": "You have no answer. Then he says something you'll still be thinking about years later: <em>\"SROI ratios from different organizations were never meant to be compared with each other.\"</em>",
"你算了一下存款、算了一下藥費，也算了一下自己還剩多少力氣。<br><br>": "You counted your savings, counted the cost of the medication, and counted how much strength you had left.<br><br>",
"你算了一下：這個月你寄出去 <em>八十七封信</em>，收到回覆的有二十三封。<br><br>": "You did the math: this month you sent out <em>eighty-seven emails</em> and got twenty-three replies.<br><br>",
"你算了一下：這個月你寄出去 <em>八十七封信</em>，收到回覆的有二十三封。<br><br>你沒有考核權，也不是誰的主管。你能做的只有拜託、追蹤、再拜託。而每個部門看到你的信，第一個反應都是「又來了」。<br><br>今天財務又已讀不回，而申報死線剩兩週。": "You did the math: this month you sent out <em>eighty-seven emails</em> and got twenty-three replies.<br><br>You have no say in anyone's performance review and you're nobody's manager. All you can do is ask, chase, and ask again. And every department's first reaction to your name in the inbox is \"here we go again.\"<br><br>Today Finance read it and didn't reply. The filing deadline is two weeks out.",
"你算完才發現：公司的排放<em>八成在原料與包裝，只有兩成在自己的工廠</em>。<br><br>而你去年做的所有減碳專案，都在那兩成裡面。": "Only after finishing the math do you see it: <em>eighty percent of the company's emissions sit in raw materials and packaging, only twenty in its own plants</em>.<br><br>And every reduction project you ran last year lives inside that twenty.",
"你算得出來，也做得出來。減量不是簡報，是工程。": "You can run the numbers, and you can build the thing. Reduction isn't a slide deck — it's engineering.",
"你簽了十年 PPA。單價比台電貴，但你替公司鎖住了一件會越來越難買的東西。": "You signed a ten-year PPA. The unit price is higher than Taipower's, but you locked in something that will only get harder to buy.",
"你簽了約。從那天起，要不要離職這個問題變得複雜很多。": "You signed the contract. From that day on, the question of whether to quit got much more complicated.",
"你約了時間，把話說開。": "You booked a time and cleared the air.",
"你給了幾個建議、推薦了廠商。他很感謝，你也想起了那年拿冠軍的晚上。": "You offered a few suggestions and recommended some vendors. He was grateful, and you found yourself remembering the night you won the championship.",
"你繼續做你熟悉的那一塊。安穩，也侷限。": "You kept doing the part you knew. Steady, and confining.",
"你繼續投。": "You kept applying.",
"你翻了 beta 版框架，看得半懂。但你記住了一個詞：依賴。企業不只影響自然，也依賴自然。": "You flipped through the beta framework, half understanding it. But one word stuck: dependency. Companies don't just affect nature — they depend on it.",
"你翻了一輪職缺，發現寫法變了：<em>半導體業要有 CDP 或 EcoVadis 經驗，金融業要做過 DJSI 或熟悉 TNFD</em>。<br><br>「具備永續相關經驗」那種寫法，已經不見了。": "You scroll through a round of job listings and notice the wording has changed: <em>semiconductor wants CDP or EcoVadis experience, finance wants DJSI or familiarity with TNFD</em>.<br><br>The old \"sustainability-related experience preferred\" phrasing is gone.",
"你翻了三份指引、問了兩個查證員。答案沒有標準版，但你從此知道邊界怎麼談。": "You went through three guidance documents and asked two verifiers. There was no standard answer. But from then on, you knew how a boundary gets negotiated.",
"你翻了國際勞工組織的指引和歐盟的轉型基金。台灣有原則、有法條，就是沒有那筆錢——這個落差你記下來了。": "You went through the ILO guidance and the EU's transition funds. Taiwan has the principles and the statutes — just not the money. You wrote that gap down.",
"你翻了幾份國際銀行的政策文件。那是你第一次意識到，碳會變成錢的問題。": "You went through a few international banks' policy documents. It was the first time you realized carbon would become a question of money.",
"你老實跟其中一個說做不完，推薦了同業。對方反而更信任你。": "You told one of them honestly that you couldn't finish it, and recommended a peer. They trusted you more for it.",
"你考上<strong>": "You got into <strong>",
"你考上了哪裡？": "Where did you get in?",
"你考了": "You collected ",
"你考了 ": "You collected ",
"你考過了。<strong>": "You passed. <strong>",
"你考過了。這張證書值不值錢，完全看你接下來坐在哪個位子上。": "You passed. Whether the certificate is worth anything depends entirely on which seat you sit in next.",
"你考過了初級。門檻不高，但面試時每個 HR 都看得懂。": "You passed the entry-level exam. The bar isn't high, but every HR person in an interview can read it.",
"你考過了第一級，也開始準備獨立完成一份能通過查證的報告。台灣走這條路的人不到十個。": "You passed Level 1, and started preparing to complete a report that can pass verification on your own. Fewer than ten people in Taiwan have gone down this road.",
"你聯絡了兩位研究生態的老師，談成了一個小型合作案。專業補上了，人脈也補上了。": "You reached out to two ecology professors and landed a small collaboration. The expertise gap closed. So did the network gap.",
"你聽了一晚上，覺得有趣，但沒有留下什麼。": "You listened all evening. Interesting, but nothing stayed with you.",
"你聽得懂那句話背後要的是什麼。你也知道，那筆錢可以讓兩個班多開一年。": "You understand what that question is really after. You also know that money would keep two classes running for another year.",
"你能把一份三百頁的報告，講成董事會聽得懂的五分鐘。": "You can take a three-hundred-page report and turn it into five minutes the board actually understands.",
"你能把不確定性做成一套方法。<em>只是「首席未來學家」這種職位，台灣還沒發明出來。</em>": "You can turn uncertainty into a method. <em>It is just that Taiwan has not invented a position called Chief Futurist yet.</em>",
"你能把氣候情境真的算成數字，而不是抄範本。<em>只是金融的永續職缺少、集中在台北的總部，離實際減碳也遠。</em>": "You can turn climate scenarios into real numbers instead of copying a template. <em>It is just that sustainability roles in finance are few, concentrated in Taipei headquarters, and a long way from any actual decarbonization.</em>",
"你能把環境問題翻譯成錢的問題——這正是最缺的翻譯。": "You can translate environmental problems into money problems — and that is exactly the translation nobody has.",
"你自己刷了卡。錢少了，但你隨時可以走。": "You swiped your own card. Less money — but you can leave any time.",
"你自己撞了半年才搞懂。也是一種學法，只是比較痛。": "You bumped into walls for half a year before you figured it out. That's a way of learning too. Just a more painful one.",
"你自願扛下跨組協調。累，但你看得到全貌——而看得到全貌的人，才有機會坐上去。": "You volunteered to carry the cross-team coordination. Exhausting — but you could see the whole picture, and only people who see the whole picture get a shot at the seat above.",
"你舉手了。<br><br>職稱換成永續專員，年薪 <strong>": "You raised your hand.<br><br>Your title changed to Sustainability Associate, salary <strong>",
"你花了一個晚上想清楚自己的方向。省下了兩萬八，也省下六個月。": "You spent one evening getting clear on your direction. You saved twenty-eight thousand, and six months.",
"你花了一個週末寫下自己會什麼、想做什麼。清單比你以為的短，也比你以為的具體。": "You spent a weekend writing down what you can do and what you want to do. The list was shorter than you thought, and more concrete.",
"你花了一小時釐清交付項目，才給數字。客戶反而更信任你。": "You spent an hour clarifying the deliverables before giving a number. The client trusted you more for it.",
"你花了一年建立資料庫，把授信部位的碳排算出來。那個數字讓經營層安靜了很久。": "You spent a year building the database and calculated the carbon in the lending portfolio. That number kept management quiet for a long time.",
"你花了一年，帶著一間從沒做過永續的工廠交出第一份 SBT 承諾書。老闆說：本來以為是被逼的，做完發現電費真的降了。": "You spent a year walking a factory that had never done sustainability through its first SBT commitment letter. The owner said: I thought we were being forced into this — then we finished, and the power bill really did drop.",
"你花了三個月備課。第一期收了兩百個學生，其中有人後來真的入行了。": "You spent three months preparing the course. The first cohort took two hundred students, and some of them later really did enter the field.",
"你花了三個月弄懂利害關係人訪談、成果指標、財務代理指標與影響力歸因。這是你第一次覺得 S 面向也可以很硬。": "You spent three months getting your head around stakeholder interviews, outcome indicators, financial proxies, and impact attribution. It was the first time the S felt like hard skills to you.",
"你花了三個月把 S1 讀透，發現重點不在永續，在「連結」。這個理解讓你比同業早了兩年。": "You spent three months reading S1 through, and found the point wasn't sustainability — it was \"connectivity.\" That understanding put you two years ahead of your peers.",
"你花了三個月補回這個缺口。業績保住了。": "You spent three months closing the gap. The revenue survived.",
"你花了三個月，把他從什麼都不懂帶到能自己看懂盤查表。兩年後他成了那家公司第一位永續主管，第一個找的顧問是你。": "You spent three months taking him from knowing nothing to reading the inventory sheets himself. Two years later he became that company's first sustainability manager. The first consultant he called was you.",
"你花了三個週末搞懂。痛苦，但從此你知道自己的錢去了哪裡。": "You spent three weekends figuring it out. Painful — but from then on, you knew where your money went.",
"你花了三週從原始單據重算。順便建了一份交接文件，這樣下一個人不會再遇到。": "You spent three weeks recalculating from the original receipts. While you were at it, you built a handover document, so the next person won't have to.",
"你花了兩個下午分別談。難堪，但兩個人都知道自己缺什麼——這比那個甲重要。": "You spent two afternoons talking with each of them separately. Awkward. But both of them now know what they lack — which matters more than the top grade.",
"你花了兩個禮拜查資料把它填完。從那天起，公司內部認定這是你的事。": "You spent two weeks researching and filled it all in. From that day on, the company decided this was your job.",
"你花了兩個週末讀完，一次就過。門檻不高，但少了它有些門開不了。": "You read it over two weekends and passed on the first try. The bar isn't high — but without it, some doors don't open.",
"你花了兩年建的資料收集表、指標對應表、部門填報流程——<em>有一大半突然不需要了</em>。<br><br>": "The collection templates, the indicator mapping, the departmental reporting flow you spent two years building — <em>over half of it is suddenly unnecessary</em>.<br><br>",
"你花了兩週補齊。報告書延後一個月出。但那份報告書是乾淨的。": "You spent two weeks filling the gaps. The sustainability report came out a month late. But it was clean.",
"你花了兩週跑遍所有部門。效率很差，但下一次開會人來了。": "You spent two weeks visiting every department. Terribly inefficient. But at the next meeting, people showed up.",
"你花了半年上完四門課、考過認證。從此你講重大性的時候，沒有人質疑你。": "You spent half a year finishing four courses and passing the certification. From then on, when you talked about materiality, nobody questioned you.",
"你花了半年啃 IPCC 圖資、學著把百年重現期洪水套上廠區座標。第一版粗糙，但它是<em>你們自己的</em>——明年準則改版，你不用再等報價單。": "You spent six months chewing through IPCC map data, learning to overlay the hundred-year flood onto the plants' coordinates. The first version was rough, but it was <em>your own</em> — when the standard updates next year, you won't be waiting on a consultant's quote.",
"你花了半年建立化學品資料庫。過程很痛，但後來每一次客戶稽核你都不用重做。": "You spent half a year building the chemicals database. It hurt. But afterward, you never had to redo it for a single customer audit.",
"你花了半年把每個數字的來源、經手人、修改紀錄都留下來。<br><br>確信那兩週，會計師抽了十二筆，你十二筆都調得出來。<em>那是你這一行做過最不浪漫、也最專業的一件事。</em>": "You spent half a year recording the source, the handler and the revision history behind every number.<br><br>During the two assurance weeks the auditors sampled twelve items, and you produced all twelve. <em>The least romantic and most professional thing you have ever done in this field.</em>",
"你花了半年跨部門要資料、補文件、寫英文說明。分數公布那天，經營層第一次認真看永續這件事——<em>而他們發現，你只是把本來就有做的事寫出來而已</em>。": "You spent half a year chasing data across departments, filling document gaps, writing English explanations. The day the scores came out, management took sustainability seriously for the first time — <em>and they realized all you'd done was write down what the company was already doing</em>.",
"你花了半年，真的幫他們減下來了。省的碳費比你的年薪多。": "You spent half a year and actually got their emissions down. The carbon fee they saved was more than your annual salary.",
"你花兩週真的把它用過一輪，寫了篇有優點也有缺點的評測。廠商臉色有點難看，讀者倒是很買單。": "You spent two weeks actually using it, then wrote a review with the strengths and the flaws both. The vendor's face soured a little. The readers bought in.",
"你花半年做出減量計畫，把費率從 300 談到 100。省下的碳費，比整個部門的年度預算還多。": "You spent half a year building the reduction plan, and negotiated the rate from 300 down to 100. The carbon fee you saved was more than the whole department's annual budget.",
"你落選了。": "You lost the election. ",
"你表態了，然後在最後一輪被刷下來。<em>在這裡，表態過又沒上的人是待不住的</em>——": "You put your name forward, and got cut in the final round. <em>Here, people who declared themselves and didn't make it can't stay</em> — ",
"你表明不想走業務線。對方點頭了，也很誠實地說：<em>「那你就到經理為止。」</em>": "You made it clear you didn't want the sales track. They nodded, and told you honestly: <em>\"Then manager is as far as you go.\"</em>",
"你被分到<strong>": "You were assigned to <strong>",
"你被分到哪一組？": "Which group are you assigned to?",
"你被延攬進了內閣。專業進了體制，體制也磨了你的專業——這筆帳，要很多年後才算得清。": "You were recruited into the cabinet. Your expertise entered the system, and the system ground down your expertise — an account that takes many years to settle.",
"你被排在名單的第十四位。開票那晚算下來，政黨票分到第九席就停了。<br><br>": "They ranked you fourteenth on the list. On election night the math came in: the party votes ran out at seat nine.<br><br>",
"你要冷媒填充紀錄、員工通勤數據、外購電力明細。三個部門三種回覆，都是「這個我們沒有在記」。": "You need refrigerant refill records, employee commuting data, purchased-electricity details. Three departments, three replies, all of them \"we don't keep track of that.\"",
"你要幫人打考績了": "You're Writing Performance Reviews Now",
"你要更新一項指標，翻開去年的底稿——<em>沒有計算過程，沒有出處，只有一個數字</em>。<br><br>寫的人已經離職了。": "You go to update an indicator and open last year's working papers — <em>no calculation, no source, just a number</em>.<br><br>The person who wrote it has left the company.",
"你要請育嬰留停。<em>公司對這件事的態度，會誠實反映它的永續做得多真</em>。": "You're about to apply for parental leave. <em>How the company treats this will honestly reflect how real its sustainability is</em>.",
"你覺得用不到。兩年後你要報進階課程時，發現它是必要條件。": "You figured you wouldn't need it. Two years later, when you went to register for the advanced course, it turned out to be a prerequisite.",
"你訂了回程的單程機票。<br><br>海外那幾年讓你看過別人怎麼做，履歷也亮了一階。<em>但台灣的法規和圈子往前跑了幾年，你要重新接上。</em>": "You booked a one-way ticket home.<br><br>Those years overseas showed you how others do it, and your resume gained a shine. <em>But Taiwan's regulations and circles ran a few years ahead without you — now you have to plug back in.</em>",
"你訂了機票，決定用一趟旅行把自己修好。<br><br>結果第四天你在異國的旅館裡發燒到 39 度，": "You booked a flight, deciding a trip would put you back together.<br><br>On day four you were running a 39-degree fever in a foreign hotel room,",
"你訪了客戶、員工、供應商、在地社區。有些答案跟高層想的完全不一樣——那才是重點。": "You interviewed customers, employees, suppliers, the local community. Some answers were nothing like what senior management assumed — which is exactly the point.",
"你評估投入產出後建議延後。判斷不算錯，只是兩年後同業都做了，你們變成落後的那個。": "You weighed cost against benefit and recommended postponing. Not a wrong call — except two years later your peers had all done it, and you were the one behind.",
"你試著讓 AI 產出報告書的一個章節。<em>三十秒，寫得比你的初稿還順</em>。你盯著螢幕看了很久。": "You try having AI generate a chapter of the sustainability report. <em>Thirty seconds, and it reads smoother than your first draft</em>. You stare at the screen for a long time.",
"你認真回了三百字。他回了一個貼圖，然後就沒有下文了。": "You wrote a careful three-hundred-word reply. He sent back a sticker, and that was the end of it.",
"你認真回了三百字。他沒有再出現。": "You wrote a careful three-hundred-word reply. He never showed up again.",
"你認識了一整條中部的永續生態圈。他們做的是最靠近工廠的永續，跟台北的簡報世界很不一樣。": "You met a whole sustainability ecosystem in central Taiwan. Their work is the kind closest to the factory floor — very different from Taipei's world of slide decks.",
"你認識的人裡，這一年走了三個。<em>一個去了半導體做製程，一個去了外商的永續供應鏈，一個乾脆去念了金融的研究所</em>。<br><br>群組裡有人問：我們當初為什麼進來的？": "Three people you know left this year. <em>One went into semiconductors to do process engineering, one went to sustainable supply chain at a multinational, one just went off to grad school in finance</em>.<br><br>Someone in the group chat asks: why did we get into this in the first place?",
"你認養了自己縣市那一圈，開始揪聚會、排講者。累，但你成了那個把人聚起來的人。": "You adopted your own county's circle — organizing meetups, lining up speakers. Tiring. But you became the one who brings people together.",
"你誠實跟查證員說了。他說：那我們就開一條不符合事項。": "You told the verifier honestly. He said: then we'll raise a nonconformity.",
"你說了謝謝就走了。回程的高鐵上，你一直在想那句話。": "You said thank you and left. On the high-speed rail home, you kept thinking about that sentence.",
"你說今年沒空。能見度是別人的事，那年你把一條產線的蒸汽系統重做了——<em>沒有人替你鼓掌，但那是真的減下來的。</em>": "You said you couldn't make it this year. Visibility was somebody else's business; that year you rebuilt the steam system on one production line — <em>nobody applauded, but those tonnes actually came off.</em>",
"你說最近排不開。他也沒再問過。": "You said your schedule was full. He never asked again.",
"你說服主管把美編發包出去。省下的六週，你拿去做了一次真正的減量盤點。<br><br><em>報告書變薄了，裡面的東西變重了。</em>": "You talked your manager into outsourcing the layout. The six weeks you saved went into a real abatement review.<br><br><em>The report got thinner. What was in it got heavier.</em>",
"你說服老闆花錢請顧問，自己全程跟。第二年你就能自己做了——這筆錢花得比想像中值得。": "You convinced the boss to pay for a consultant, and followed the whole engagement yourself. By the second year you could do it on your own — the money was worth more than expected.",
"你說謝謝，但現在這樣挺好的。": "You said thanks, but things are good as they are.",
"你說：你說得對，是我記錯了。散場後那個人跑來加你聯絡方式。": "You said: you're right, I misremembered. After the session, that person came up to exchange contacts.",
"你調了三個月，把單位產出的用電降了百分之九。那時你不知道這叫節能減碳。": "You spent three months tuning and cut electricity per unit of output by nine percent. You didn't know back then that this was called energy saving and carbon reduction.",
"你調整了幾個財務代理指標，比值從 3.1 變成 5.8。技術上都站得住腳。": "You adjusted a few financial proxies. The ratio went from 3.1 to 5.8. Technically, it all holds up.",
"你調整了段落結構與標記方式，讓機器抓得到重點。分數真的動了。": "You adjusted the paragraph structure and the tagging so machines could catch the point. The scores actually moved.",
"你談了一個好聚好散，拿了一筆離職金。戰略性撤退，有時候比死守聰明。": "You negotiated a clean parting and took a severance payment. A strategic retreat is sometimes smarter than holding the line.",
"你談成了。加了一成，但工作量是兩倍。你自己算過，其實不划算。": "You closed the deal. Ten percent more pay, twice the workload. You did the math yourself — it doesn't actually add up.",
"你談掉了競業條款，加薪也打了折。<br><br>年薪 <strong>": "You negotiated away the non-compete, and the raise shrank with it.<br><br>Salary: <strong>",
"你請了三天假、刷了卡。回來的第二個月，就有獵頭因為這張證書找上你。": "You took three days of leave and swiped your card. Two months after you got back, a headhunter came calling because of that certificate.",
"你請了三輪手搖飲。資料到手了，人情也欠下了。": "You bought three rounds of bubble tea. The data was in hand. So were the favors you now owe.",
"你請了假、找了理財顧問、換了一支不會被工作訊息吵醒的手機。": "You took leave, found a wealth adviser, and got a phone that work messages could no longer wake up. ",
"你請了假陪他跑了三個地方，最後他去念了體育相關的技職科系，半工半讀。<br><br>幾年後他回來當助理教練，順便幫你帶課輔。<em>你沒有讓一個孩子變成明星，你讓他有了第二條路。</em>": "You took leave and went with him to three places; in the end he enrolled in a sports-related vocational programme and worked his way through it.<br><br>A few years later he came back as an assistant coach, and helped with the tutoring while he was at it. <em>You didn't turn a kid into a star. You gave him a second road.</em>",
"你請了半天假去面試。對方問的問題很表面，聊完你反而更確定現在的位子沒那麼糟。": "You took a half day off for the interview. Their questions were shallow, and by the end you were more certain your current seat isn't so bad.",
"你請了留停，回來後發現位子被「調整」了：專案分給了別人，你被安排去做「比較不吃緊」的事。": "You took the leave. When you came back, your seat had been \"adjusted\": the projects had been handed to someone else, and you'd been assigned the \"less pressing\" work.",
"你請了長假出去走走。回來時整個人是輕的。": "You took a long leave and went traveling. When you came back, you felt light.",
"你講了四十分鐘。三年後他成了某家公司的窗口，第一個想到的合作對象是你。": "You talked for forty minutes. Three years later he became a company's point of contact, and the first partner he thought of was you.",
"你講了實話。老闆沒有回應，但隔年他問的問題變了。": "You told the truth. The boss didn't respond. But the next year, his questions changed.",
"你講了工時、講了薪水、講了很多是在做揭露不是在減碳。他後來沒有轉。": "You told him about the hours, the pay, and how much of it is disclosure rather than cutting carbon. He didn't switch in the end.",
"你講到第八頁被打斷。散會後主管說：下次講重點就好。": "You got cut off on page eight. After the meeting, your manager said: next time, just the point.",
"你講完了，台下鼓掌。散場時沒有人來找你，你自己收好筆電回公司。": "You finished; the audience applauded. When it let out, nobody came to find you. You packed up your laptop and went back to the office.",
"你講得太快，Q&A 有人問了一個你答不出來的問題。回家的路上你一直重播那一段。": "You spoke too fast, and in the Q&A someone asked a question you couldn't answer. On the way home you kept replaying that part.",
"你講得太直白，他好像被嚇到了。之後你們就沒再聊過這件事。": "You put it too bluntly, and it seemed to scare him. You never talked about it again.",
"你講得很坦白，包含那間公司不太好的部分。他後來說幸好有問。": "You spoke frankly, including the parts of that company that aren't so good. He later said he was glad he asked.",
"你講得結結巴巴，但講完了。客戶說：Thanks, that was clear.": "You stumbled through it, but you got through it. The client said: Thanks, that was clear.",
"你謝謝他們，選了薪水高的那個。偶爾你會想起那場很不一樣的面試。": "You thanked them and took the higher salary. Now and then you think back to that very different interview.",
"你讀了半年的文獻與案例。這個技能沒有證照可以證明，但公司離不開你。": "You read the literature and case studies for half a year. No certificate can prove this skill. But the company can't do without you.",
"你讀到一篇同行寫的文章，標題是<em>「先顧好自己，才能發揮影響力」</em>。裡面講顧問團隊加班是常態、企業裡一人當十人用——<em>做永續的工作，本身卻很不永續</em>。<br><br>你一邊點頭，一邊還在回加班的訊息。": "You read a piece by a peer titled <em>\"Take care of yourself first, then have impact.\"</em> It describes consulting teams where overtime is the norm, in-house roles where one person does the work of ten — <em>sustainability jobs that are themselves deeply unsustainable</em>.<br><br>You nod along while replying to overtime messages.",
"你變成少數同時懂「美國在退、歐洲在推」的人。跨國公司最需要的就是這種能導航矛盾的人。": "You became one of the few who understands both at once — America pulling back, Europe pushing forward. What multinationals need most is exactly this kind of person, someone who can navigate the contradiction.",
"你變成帶 AI 團隊的人，一個人的產出頂過去一整組。": "You became the one who leads an AI team. One person's output now matches what a whole group used to produce.",
"你讓 AI 產出報告書的一個章節，<em>三十秒，比你的初稿還順</em>。但它引用了一個不存在的條號。": "You have AI generate a chapter of the sustainability report. <em>Thirty seconds, and smoother than your own draft</em>. But it cites a provision number that doesn't exist.",
"你讓他們正常下班，自己做到凌晨。撐得了一次，撐不了每次。": "You let them leave on time and worked into the small hours yourself. You can hold that once. Not every time.",
"你讓他去報告、替他要資源。兩年後他升了經理，逢人就說是你帶的。": "You let him give the presentations and asked for resources on his behalf. Two years later he made manager, and tells everyone you trained him.",
"你買了高鐵回數票。累，但你在台北的位子沒有消失。": "You bought a high-speed rail multi-ride pass. Tiring. But your seat in Taipei never disappeared.",
"你賭的是品質會帶來回頭客。有些年份這招有效，有些年份數字就是不夠看。": "Your bet was that quality would bring repeat clients. Some years the bet paid off. Some years the numbers just weren't enough.",
"你走到了台灣以外。<br><br>那個在課堂上聽別人講國際趨勢的學生，現在自己就是那個講的人。": "You made it beyond Taiwan.<br><br>The student who once sat in class listening to someone else explain international trends is now the one doing the explaining.",
"你走的是影響力與國際組織這條線。<em>在台灣企業端很難變現，但 TISFD、人權、公正轉型來的時候，會的人只有你。</em>": "You are on the line that runs through impact work and international organizations. <em>Hard to cash in on the Taiwanese corporate side — but when TISFD, human rights and just transition arrive, you are the only one who knows how.</em>",
"你越來越常出現在合照裡，越來越少出現在數據表裡。": "You appeared more and more in the group photos, and less and less in the data sheets.",
"你趕在漲勢前鎖了一批。財務部念了你很久，兩年後他們不念了。": "You locked in a batch before the price run-up. Finance grumbled at you for a long time. Two years later, they stopped.",
"你跑遍了所有部門。下一次開會來了五個人，其中三個中途離席。": "You made the rounds of every department. Five people came to the next meeting. Three left partway through.",
"你跑遍每一家子公司談、排替代人力、做成效追蹤。第一年就有兩千人請了志工假——這件事後來被寫進報告書的封面故事。": "You visited every subsidiary to talk it through, arranged cover staffing, tracked the outcomes. In the first year, two thousand people took volunteer leave — it later became the cover story of the sustainability report.",
"你跟人資、工會、地方政府一起，替受影響的員工排了轉職路徑與再培訓。有人轉去了新的燃氣機組，有人去了光電維運。<em>沒有人上新聞，但每個人都有下一步。</em>": "Together with HR, the union, and the local government, you laid out transition paths and retraining for the affected workers. Some moved to the new gas units; some went to solar O&M. <em>Nobody made the news. But everybody had a next step.</em>",
"你跟產銷單位合作，做出第一個低碳原料的商品上架。從產地到貨架，你第一次看見整條鏈。": "You worked with the production and sales units to put the first low-carbon-ingredient product on shelves. From farm to shelf, you saw the whole chain for the first time.",
"你跟老闆算了一筆帳：自己做要花的錢、買不到的綠電、遲早會被要求的數據。<br><br>簽了。兩年後你們是同規模廠商裡唯一有第三方查證的一家——<em>訂單反而變多了。</em>": "You ran the numbers for the boss: what doing it alone would cost, the renewable power you couldn't buy, the data you'd be asked for sooner or later.<br><br>You signed. Two years later you were the only manufacturer your size with third-party verification — <em>and the orders went up, not down.</em>",
"你跟著大家打了兩週電話。交期救回來了，檢討會開完，結論是「持續關注」。<em>下一場颱風已經在生成。</em>": "You spent two weeks on the phones along with everyone else. The delivery dates were saved; the review meeting ended with \"continue to monitor.\" <em>The next typhoon is already forming.</em>",
"你轉到了": "You moved over to ",
"你轉到了<strong>": "You moved to the <strong>",
"你轉到了法遵。永續變成履歷上的一段經歷。": "You moved to compliance. Sustainability became a line on your resume.",
"你轉去做減量專案。辛苦，但踏實。": "You moved to reduction projects. Hard work, but solid ground.",
"你轉去做碳。安全，但你放掉了自己真正在乎的那塊。": "You moved over to carbon. Safe. But you let go of the piece you actually cared about.",
"你辭了工作，把積蓄押進一場選戰。開票那晚，你在競選總部看著自己的票數一格一格往上爬。<br><br>": "You quit your job and staked your savings on a campaign. On election night, you stood in your headquarters watching your count climb one tick at a time.<br><br>",
"你退回手寫。慢，但你確定每個字都是你自己負責的。": "You went back to writing it yourself. Slow — but you're sure every word is one you answer for.",
"你送了 SBT 申請，審了十四個月才過。從此每一年的減量都有人在看。": "You submitted the SBT application. It took fourteen months of review to pass. From then on, every year's reductions have someone watching.",
"你這份工作，其實是在催資料": "Your Job Is Actually Chasing Data",
"你這幾年主力就在社會面、多元共融。<em>現在總部從美國發話：這類專案全部暫停、預算歸零</em>。你的位子，第一次感覺到晃。": "Your main work these past years has been the social side — diversity and inclusion. <em>Now word comes down from US headquarters: all such projects suspended, budgets zeroed</em>. For the first time, your seat feels wobbly.",
"你這輩子沒中過任何獎。": "You have never won anything in your life.",
"你這週的工作是：對齊圖表、統一字級、跟設計公司來回改第七版、校對錯字。<br><br>": "This week's work: aligning charts, standardizing font sizes, going seven rounds with the design agency, proofreading typos.<br><br>",
"你這週的工作是：對齊圖表、統一字級、跟設計公司來回改第七版、校對錯字。<br><br>上一次你認真想「怎麼真的減碳」是什麼時候？<em>你想不起來。</em><br><br>今天有個大學生來信問你：「請問做永續每天都在做什麼？」你盯著那封信看了很久。": "This week's work: aligning charts, standardizing font sizes, going seven rounds with the design agency, proofreading typos.<br><br>When was the last time you seriously thought about how to actually cut emissions? <em>You can't remember.</em><br><br>Today a university student emails to ask: \"What does someone in sustainability actually do all day?\" You stare at that email for a long time.",

"你進去了。這裡沒有「做永續是不是漂綠」的內耗，因為那就是本業。錢少一點，但你睡得好。": "You got in. There's no internal grinding here over \"is our sustainability just greenwashing\" — because sustainability is the business. A little less money. But you sleep well.",

"你遞了辭呈。<br><br>接下來幾個月，你第一次在平日下午出門散步。也第一次在半夜醒來想著存款還夠撐多久。": "You handed in your resignation.<br><br>In the months that followed, you took your first weekday-afternoon walks — and woke for the first time in the middle of the night, counting how long the savings would last.",
"你遞了辭呈，沒有下一份工作。這是你這輩子最勇敢也最害怕的決定。": "You handed in your resignation with no next job lined up. It was the bravest and most frightening decision of your life.",
"你選了一個合作社試辦，做出全台第一份該作物的碳足跡。之後其他產區照著做。": "You picked one cooperative for a pilot and produced Taiwan's first carbon footprint for that crop. The other growing regions followed it afterward.",
"你選了主要業務那一個。合理，但另外兩塊的重大議題沒有被談到。": "You chose the one for the main business. Reasonable — but the material topics of the other two never got discussed.",
"你選了佔比最高的三類，一家一家帶。第一年只做到四成，但那四成是真的。": "You picked the three highest-share categories and walked them through, company by company. The first year covered only forty percent. But that forty percent was real.",
"你選了做得到的那一版。費率降了，執行進度報告每年四月底要交——<em>沒做到就當年失去優惠</em>，這條線你記得很牢。": "You went with the version you could actually deliver. The rate came down, and a progress report is due every year by the end of April — <em>miss it and you lose the discount for that year</em>. That line you remember very well.",
"你選了嚴格的那個版本。多做了三個月，但隔年資本額真的過了百億——剛好準備好了。": "You chose the stricter version. It took three extra months — but the next year, capital really did cross ten billion, and you were exactly ready.",
"你選了阻力最小的兩項。成果發表會上數字很好看，綠色採購成長了六成。<br><br><em>沒有人問，為什麼退不退煤這件事，聯盟從來沒有寫進承諾裡。</em>": "You picked the two with the least resistance. The numbers looked good at the results event: green procurement up sixty percent.<br><br><em>Nobody asked why coal phaseout never made it into the alliance's commitments.</em>",
"你選擇把熟的事做深。揭露永遠有人要做——只是你注意到，這幾年部門的新預算，越來越常撥給隔壁那個叫「韌性」的團隊。": "You chose to go deeper in what you knew. Disclosure will always need doing — you just noticed that in recent years, the department's new budget keeps going to that team next door called \"resilience.\"",
"你選擇繼續做看得到成果的事。智庫的宏觀視野很誘人，但你喜歡把東西真的做出來。": "You chose to keep doing work with visible results. The think tank's macro view was tempting. But you like actually making things real.",

"你開始把自己放進經營會議，而不是等著被交辦。這條路慢，但天花板最高——<em>從今以後，升遷的邏輯站在你這邊</em>。": "You started putting yourself into management meetings instead of waiting for assignments. It's a slow road, but the ceiling is the highest — <em>from now on, the logic of promotion is on your side</em>.",

function screenIntro(){
  applyLangChrome();
  if(LANG==='en') return screenIntroEN();
  app.innerHTML = `<div class="panel panel-pad fade" style="max-width:720px">
    <span class="eyebrow">台灣永續職涯模擬</span>
    <h2 class="card-title" style="font-size:27px">你十八歲，剛考上大學。</h2>
    <div class="card-body">
      這是一款<em>以真實世界的統計與數據推估</em>建構的永續人森模擬器。<br>
      裡面的法規時程、每年的職缺數量、各產業的薪資級距、各公司的 ESG 評分、AI 的成熟曲線，都是照著公開資料與方法學走的；
      每一年會發生什麼事，也大多是那一年真的發生過的事——從碳費、IFRS S，到歐盟 Omnibus 與反 ESG 逆風。<br><br>
      你的大學入學年份，會落在 <strong>2010 到 2020</strong> 之間——這十一年，正好涵蓋台灣永續產業
      從無人聞問、到法規推著跑、到全民搶進、再到第一次逆風的完整週期。<br><br>
      <em>你會在哪一年入學，決定不了。</em>而那一年是哪一年，會改變後面的一切。
    </div>
    <div class="opts"><button class="btn" onclick="startSetup()">開始</button></div>
    <hr class="rule">
    <p class="note">一局約 10–15 分鐘。法規時程、職缺數量與薪資級距皆參考公開資料校準（金管會永續發展路徑圖、環境部與人力銀行的綠領人才就業趨勢報告、上市公司薪資揭露資訊）。公司名稱、人物與情節皆為虛構。</p>
    ${versionBlock()}
  </div>`;
}

function nameGo(){
  const inp=document.getElementById('pname');
  S.playerName = (inp && inp.value.trim().slice(0,12)) || '';
  // 隨機分配 MBTI（四軸各 50/50），如同分發學校
  S.mbti = MBTI_AX.map(function(ax){ return rnd()<0.5 ? ax.a : ax.b }).join('');
  S.mbtiAx = {};
  MBTI_AX.forEach(function(ax){ S.mbtiAx[ax.k] = S.mbti.indexOf(ax.a)>=0 ? ax.a : ax.b });
  // 先天配置（item 3）：性格決定起手的能力分布與際遇傾向
  if(mbtiHas('E')){ relAdd(3) } else { S.sp+=2; S.dom+=1 }            // E 人脈廣；I 深耕專注
  if(mbtiHas('S')){ S.D+=3; S.E+=1 } else { S.G+=3; S.S+=1 }         // S 吃數據與盤查；N 看策略與願景
  if(mbtiHas('T')){ S.G+=2; S.D+=1 } else { S.S+=3 }                 // T 邏輯治理；F 天生社會面
  if(mbtiHas('J')){ S.uniScore=(S.uniScore||0)+4 } else { S.luck=Math.min(20,S.luck+2) }  // J 履歷整齊；P 際遇彈性
  seedBox.textContent='SEED '+S.seed.toString(36).toUpperCase();
  screenReveal();
}

function uniPick(y,i){
  const u=UNI[y-1], o=u.o[i], out={};
  let r=o.r;
  if(o.e.intern){
    if(rnd() < S.school.intern + (S.uniScore||0)*0.006){ S.internOK=true; relAdd(2); S.D+=3; S.uniScore=(S.uniScore||0)+13;
      r='你拿到了一份永續相關的實習。三個月下來，主管說：「畢業後要不要回來？」' }
    else { relAdd(1); S.dom+=2; S.uniScore=(S.uniScore||0)+4;
      r='投了十七封，面試三次，最後去了一間跟永續無關的公司實習。至少學到了怎麼在辦公室生存。' }
  }
  if(o.e.ball){
    /* 台東偏鄉球隊課輔（去識別化）：課輔不是善事，是小孩能不能上場的資格條件 */
    S.ballYrs = 2; S.uniFun = S.uniFun || 'ball';
    relAdd(3); S.S += 6; S.soc = (S.soc||0) + 3; S.cash = Math.round(S.cash - 6); S.uniScore=(S.uniScore||0)+3;
    if(!S.traits.includes('陪過一支球隊')) S.traits.push('陪過一支球隊');
    r = '你每個週末搭四個多小時的車往南，到一個鎮上的球隊帶課輔。<br><br>'
      + '一開始你以為自己是去「做好事」。第三個月你才弄懂那套規則：<em>成績沒到、行為登記不好看，教練就不讓你上場</em>。'
      + '所以你教的不是數學，是<strong>他們能不能繼續打球</strong>。<br><br>'
      + '計畫的補助款裡，「課業輔導費」和「選手營養費」是並排的兩行——<em>在公文上，書本跟球棒本來就綁在一起。</em><br><br>'
      + '兩年下來你認識了每一個孩子的家裡有誰、誰在等誰下班、誰的阿嬤住多遠。'
      + '車錢花掉不少，你也很久沒有睡過完整的週末。';
    delete o.e.ball;
  }
  if(o.e.gaming){
    const g = GAMING_OUTCOMES[Math.floor(rnd()*GAMING_OUTCOMES.length)];
    S.uniFun = g.id;
    if(g.trait && !S.traits.includes(g.trait)) S.traits.push(g.trait);
    r = g.r;
    Object.keys(g.e).forEach(function(k){ o.e[k] = (o.e[k]||0) + g.e[k] });
    delete o.e.gaming;
  }
  if(o.e.cert){ S.certs.push(o.e.cert) }
  if(o.cert){ S.certs.push(o.cert) }
  const d = apply(o.e, out);
  S.ledger.push({y:S.year, t:`${u.t}：${o.l}`, p:''});
  S.year++; S.age++;
  if(o.e.grad){
    S.gradPath=o.e.grad;
    if(o.e.grad==='work'){ showOutcome(r||'你做了決定。', d, ()=>screenJobHunt(), out.extra); return; }
    if(o.e.grad==='usr'){
      const emp = EMP.find(function(e){ return e.id==='usr' });
      S.emp=emp; S.inESG=true; S.domName='學校'; S.dom+=2; relAdd(5); S.S+=4; S.soc=(S.soc||0)+2;
      S.pay = Math.round(calcPay(emp,0));
      if(!S.traits.includes('從 USR 出發')) S.traits.push('從 USR 出發');
      S.ledger.push({y:S.year,t:'留在學校做 USR 計畫',p:S.pay,mark:1});
      return showOutcome('你留在學校，接了<strong>大學社會責任（USR）</strong>計畫的助理。<br><br>'
        + '帶學生下鄉、陪社區開會、跑地方創生、寫計畫結案報告。<em>年薪 '+S.pay+' 萬——這一行最低的一群</em>。<br><br>'
        + '但你認識了整個地方：里長、小農、returning 青年、公部門承辦、還有一群願意為了一件事熬夜的學生。<em>這些人脈之後會用很久。</em>',
        [['年薪',S.pay],['關係力',5],['社會力',4]], function(){ S.phase='career'; yearStart() });
    }
    if(o.e.grad==='ball'){
      /* 留在台東：全遊戲最低的起薪，但那是一條真的有人走的路 */
      const emp = EMP.find(function(e){ return e.id==='ngo_edu' });
      S.emp=emp; S.inESG=true; S.domName='偏鄉教育'; S.dom+=3; relAdd(4);
      S.S+=6; S.soc=(S.soc||0)+5; S.ngoEdu=1;
      S.pay = Math.round(calcPay(emp,0));
      if(!S.traits.includes('留在台東')) S.traits.push('留在台東');
      S.ledger.push({y:S.year,t:'畢業後留在台東的課輔機構',p:S.pay,mark:1});
      return showOutcome('你沒有回西部。<br><br>'
        + '機構的主任問你要不要留下來當專職課輔老師的時候，其實沒有給你什麼條件——'
        + '<em>月薪從兩萬六起跳，做滿一年評核後三萬</em>，一年十二個月，另外一年四千塊的書籍費。年薪 <strong>'+S.pay+' 萬</strong>。<br><br>'
        + '你同學的起薪是你的兩倍，有些人已經在傳他們的識別證照片。<br><br>'
        + '但你知道一件他們不知道的事：<em>你走的時候，會有幾個孩子真的少掉一個大人。</em><br><br>'
        + '這份工作靠計畫補助活著——一年一標，錢是綁定用途的，行政人事最難編。你在第一個月就學會了核銷。',
        [['年薪',S.pay],['社會力',6],['社會影響力',5]], function(){ S.phase='career'; yearStart() });
    }
    // 念研究所（不論國內外）→ 先決定要念什麼（item 1）
    showOutcome(r||'你決定繼續念。', d, ()=>screenGradField(o.e.grad), out.extra);
    return;
  }
  showOutcome(r, d, ()=>screenUni(y+1), out.extra);
}

    + '<div class="card-body" style="font-size:15px">這一行對科系「幾乎不設限」，但對你帶進來的<em>視角</em>很挑。'
    + '<br><span style="color:var(--ink-3)">技術軸（算得出來）、制度軸（講得成合規與財務）、人的洞察（處理得了人）——'
    + '只有一軸的人會卡在天花板。冷門科系不是比較弱，是<em>起步慢、後期解鎖別人碰不到的題目</em>。</span>'
    + (ovs?'<br><br><span style="color:var(--ink-3)">出國：英文與國際視野是硬優勢，回台後最順的是外商與國際線；但你會少掉兩年台灣的人脈與實習，而這一行的圈子很小。學費與生活費是真的貴。</span>':'')
    + '</div>'
    + '<div class="grid">'+cards+'</div></div>');
}
function pickGradField(i, ovsFlag){
  const kind = ovsFlag ? 'ovs' : 'grad';
  const f = (kind==='ovs' ? GRAD_OVERSEAS : GRAD_FIELDS)[i];
  S.gradField = f.id; S.gradFieldName = f.n;
  Object.keys(f.s).forEach(function(k){ S[k]+=f.s[k] });
  S.dom += (f.dom||0);
  S.uniScore = (S.uniScore||0) + (f.uni||0);
  if(!S.traits.includes(f.n)) S.traits.push(f.n);
  let txt, d;
  if(kind==='ovs'){
    const enGain=f.en||5, cost=f.cost||90;
    S.year+=1; S.age+=1; S.en+=enGain; S.cash-=cost; S.uniScore=(S.uniScore||0)+4; S.rel=Math.max(0,S.rel-2);   // 海外碩士本身不算「站上國際舞台」，要真的外派/外商/國際組織才算
    if(!S.traits.includes('海外碩士')) S.traits.push('海外碩士');
    if(!S.traits.includes('國際線')) S.traits.push('國際線');
    S.ledger.push({y:S.year,t:'海外碩士（'+f.dest+'・'+f.n+'）回國',p:'',mark:1});
    txt = '你飛到<strong>'+f.dest+'</strong>念了<strong>'+f.n+'</strong>。<br><br>'+f.m
        + '<br><br>英文變好了、看事情的角度變寬了，存款也見底了（學費加生活費約 '+cost+' 萬）。'
        + '<em>但台灣這兩年的法規和人脈都往前跑了，回來你得重新排隊。</em>';
    d = Object.keys(f.s).map(function(k){ return [({E:'環境力',S:'社會力',G:'治理力',D:'揭露力'})[k], f.s[k]] });
    d.push(['英文',enGain],['存款',-cost]);
  } else {
    S.year+=2; S.age+=2; relAdd(2); S.uniScore=(S.uniScore||0)+8;
    S.ledger.push({y:S.year,t:'研究所畢業（'+f.n+'）',p:'',mark:1});
    txt = '兩年後，你從<strong>'+f.n+'</strong>畢業。<br><br>'+f.m
        + '<br><br>同學和指導教授成了你在這一行的第一批人脈——在台灣，這個網絡的價值常常被低估。';
    d = Object.keys(f.s).map(function(k){ return [({E:'環境力',S:'社會力',G:'治理力',D:'揭露力'})[k], f.s[k]] });
  }
  showOutcome(txt, d, function(){ screenJobHunt() });
}

/* ============ 通用結果畫面 ============ */
function showOutcome(text, deltas, next, extra){
  const chips = (deltas||[]).map(([k,v])=>{
    const num = typeof v==='number';
    const up = num ? v>0 : String(v).startsWith('+');
    return `<span class="chip ${up?'up':'down'}">${k} ${num?(v>0?'+'+v:v):v}</span>`;
  }).join('');
  shell(`<div class="panel panel-pad fade">
    <div class="outcome">${text}${extra?'<br><br>'+extra:''}</div>
    ${chips?`<div class="deltas">${chips}</div>`:''}
    <div class="opts"><button class="btn" id="nx">繼續</button></div>
  </div>`);
  document.getElementById('nx').onclick = next;
}

/* ============ 求職 ============ */

/* ===== 業界頂尖：不是有能力就進得去 ===== */
/* 頂尖企業：履歷硬還不夠，要有人內推、市場很熱、或實習卡位（使用者需求 item 4） */
const ELITE = ['gg','fa','tree','fbrand','saus','telco1','telco2','sky','retail2','fin4','cem','stl'];
function resumeScore(){ return cw() + (S.uniScore||0) + Math.floor(S.luck*0.4) }
function gradHard(){ const f=S.gradField&&(gradFieldById(S.gradField)||gradOverseasById(S.gradField)); return f?(f.hard||0):0 }
function canReachEmp(e, m){
  const r = resumeScore();
  const bar = e.bar + deptBarMod(e) + gradHard();
  if(ELITE.indexOf(e.id) >= 0){
    if(r < bar + 2) return false;                    // 硬門檻：履歷要比一般人硬一截
    return (S.rel >= 7) || (m >= 78) || S.internOK;  // 還要有人內推、市場缺人、或實習卡到位
  }
  return r >= bar - 6;
}
function eliteBlockedNote(m){
  const blocked = EMP.filter(function(e){
    return ELITE.indexOf(e.id)>=0 && resumeScore() >= e.bar+2 && !(S.rel>=7 || m>=78 || S.internOK);
  });
  if(!blocked.length) return '';
  return '<br><br><em>你的條件其實搆得上 ' + blocked[0].n + ' 那一級的公司，但履歷投進去就沒有下文了。'
       + '那種位子多半是內部推薦先填掉的。</em>';
}
function gradOffers(){
  const m = mk(S.year)[1];
  const out = [];
  if(S.internOK){
    const cands = EMP.filter(function(e){ return e.bar<=46 && !e.big4 && ELITE.indexOf(e.id)<0 });
    if(cands.length) out.push({k:'intern', emp:pick(cands)});
  }
  if(rnd() < S.school.big4 + (m>=55?.12:0) + (S.uniScore||0)*0.005){
    out.push({k:'emp', emp:pickBig4()});
  }
  const pool = EMP.filter(function(e){
    return !e.big4 && e.ind!=='ngo' && canReachEmp(e,m) && (!out.length || out.every(function(x){ return !x.emp || x.emp.id!==e.id }));
  });
  const work = pool.slice();
  let n = Math.min(work.length, m>=70 ? 3 : 2);
  while(n-- > 0 && work.length){
    out.push({k:'emp', emp: work.splice(Math.floor(rnd()*work.length),1)[0]});
  }
  if(S.en>=6) out.push({k:'emp', emp:EMP.find(function(e){ return e.id==='ngo' })});
  out.push({k:'detour'});
  return out;
}
function screenJobHunt(){
  const m = mk(S.year)[1];
  S._grad = gradOffers();
  const rows = S._grad.map(function(of,i){
    if(of.k==='detour'){
      return '<button class="opt" onclick="doHunt('+i+')"><span class="lab">先找別的工作，之後再說</span>'
        + '<span class="hint">累積本業年資，日後轉入永續不吃虧。這是很多人真正走過的路。</span></button>';
    }
    const e = of.emp;
    const est = Math.round(calcPay(e,0) * (of.k==='intern'?0.95:1));
    const badge = ELITE.indexOf(e.id)>=0 ? ' <span class="tag">頂尖</span>' : '';
    const lab = of.k==='intern' ? ('回實習的公司報到：'+e.n) : e.n;
    return '<button class="opt" onclick="doHunt('+i+')"><span class="lab">'+lab+badge+'</span>'
      + '<span class="hint">'+empMeta(e)+'　起薪約 <b>'+est+' 萬</b>'
      + (of.k==='intern'?'　免面試，但起薪略低':'')+'<br>'+e.f+'</span></button>';
  }).join('');
  shell('<div class="strip">'
    + '<div class="cell"><span class="k">西元</span><span class="v mono">'+S.year+'</span></div>'
    + '<div class="cell"><span class="k">年齡</span><span class="v mono">'+S.age+'</span></div>'
    + '<div class="cell"><span class="k">履歷強度</span><span class="v mono">'+resumeScore()+'</span></div>'
    + '<div class="cell"><span class="k">市場熱度</span><span class="v mono">'+m+'</span></div>'
    + '</div>'
    + '<div class="panel panel-pad fade">'
    + '<span class="eyebrow">畢業求職</span>'
    + '<h2 class="card-title">'+S.year+' 年，你開始找工作。</h2>'
    + '<div class="card-body">'+jobFlavor(m)+eliteBlockedNote(m)+'</div>'
    + '<div class="opts">'+rows+'</div></div>');
}
function doHunt(i){
  const of = S._grad[i], m = mk(S.year)[1];
  if(of.k==='detour'){
    const d = pick(DETOUR);
    S.emp = {id:d.id,n:d.n,ind:d.ind,tier:'中後段',mult:d.mult,bar:0,burn:1.0,pre:5,f:d.f};
    S.inESG=false; S.prevJob=d.id;
    S.pay = Math.round(LEVELS[0].base*(IND[d.ind]?IND[d.ind].c:1)*d.mult*(.85+m/280));
    S.domName = IND[d.ind].n; S.dom += 4;
    S.ledger.push({y:S.year,t:'進入 '+d.n+'（非永續）',p:S.pay,mark:1});
    return showOutcome('你先找了別的工作：<strong>'+d.n+'</strong>。'+d.f
      + '<br><br>年薪 '+S.pay+' 萬。永續年資從今天起還是零，但總年資開始累積——<em>這在幾年後會值錢</em>。',
      [['年薪',S.pay]], function(){ S.phase='career'; yearStart() });
  }
  const emp = of.emp;
  S.emp=emp; S.inESG=true; S.domName=IND[emp.ind].n; S.dom+=3;
  S.pay = Math.round(calcPay(emp,0) * (of.k==='intern'?0.95:1));
  const tz = teamSize(emp);
  const teamLine = tz ? '<br><br>永續團隊 <strong>'+teamWord(tz)+'</strong>。'+teamNote(tz) : '';
  const dp = deptOf(emp);
  const deptLine = dp ? '<br>永續隸屬 <strong>'+dp.n+'</strong>。'+dp.d : '';
  const note = of.k==='intern' ? '實習轉正。免了面試，也免了比較。'
    : emp.big4 ? ('你進了四大的'+emp.n+'。同期二十個人，五年後剩三個。')
    : emp.id==='ngo'  ? '薪水低到你沒好意思跟家裡講。但你每天起床都知道自己在幹嘛。'
    : ELITE.indexOf(emp.id)>=0 ? '你進去了。同梯的人履歷都很嚇人，你花了半年才不覺得自己是誤闖的。'
    : '你拿到了 offer。';
  S.ledger.push({y:S.year,t:'入職 '+emp.n+'・'+LEVELS[0].t,p:S.pay,mark:1});
  showOutcome('<strong>'+emp.n+'</strong>（'+IND[emp.ind].n+'・'+emp.tier+'）<br>'+emp.f
    + deptLine + teamLine + '<br><br>'+note+'年薪 <strong>'+S.pay+' 萬</strong>。',
    [['年薪',S.pay]], function(){ S.phase='career'; if(emp.big4) return screenBig4Group(); yearStart() });
}

function jobFlavor(m){
  if(m<20) return '你在 104 上搜「永續」，幾乎搜不到——因為這個字還沒被發明成職稱。<em>這個行業還沒開始</em>。跳出來的是環安衛、環工，還有幾間大公司掛在公關部底下的「CSR 專員」。你想做的那件事，現在還沒有名字。';
  if(m<40) return '報告書的需求撐起了第一批職缺。多數是「CSR 專員」，工作內容寫得含糊，面試官自己也說不太清楚要你做什麼。';
  if(m<60) return '職缺開始正式化了，「永續專員」「ESG 專員」的職稱出現在標題上。金融業也開始找人。';
  if(m<85) return '每個月有兩萬多個綠領職缺。<em>只要會做溫盤，履歷丟出去就有回音</em>。你的同學有人一年跳兩次。';
  return '市場最熱的時候。職缺多，競爭者也多——人人都想做 ESG。差異化靠的是技能組合，不是入行速度。';
}
/* ============ 年度循環 ============ */
function bigYear(y){ return [2014,2022,2024,2026,2030].indexOf(y)>=0 }

/* ============ 突發結局：人生不會讓你穩穩玩到四十歲 ============
   35 歲之後風險升高：健康、意外、被 AI 取代、頓悟出走。
   endEarly() 直接中止這一局，結局畫面會說明是怎麼結束的。 */
function endEarly(tag, title, body){
  S.endedEarly = tag;
  S.earlyTitle = title;
  S.earlyBody = body;
  if(!S.traits.includes(title)) S.traits.push(title);
  S.ledger.push({y:S.year, t:'【'+title+'】這一局在這裡結束', p:'', mark:1});
  return ending();
}
/* 每年開始時擲一次：年紀越大、體力越差，越可能出事 */
function rollLifeShock(){
  if(S.endedEarly) return false;
  if(S.age < 33) return false;
  /* 這些是「人生突然轉彎」，不該是常態。玩家實測顯示原本的機率讓半數的局提早結束，
     所以基礎值大幅調低——只有真的把自己操壞的人，才會明顯感受到風險上升。 */
  const late = S.age >= 35;
  let p = late ? 0.016 : 0.006;
  if(S.burn >= 75) p += 0.030;
  if((S.highBurnYrs||0) >= 4) p += 0.026;
  if(S.health) p += 0.012;
  if(rnd() > p) return false;

  const pool = [];
  // 早衰 → 被迫提早退休
  if((S.highBurnYrs||0) >= 4 || S.burn >= 78 || (S.collapses||0) >= 2){
    pool.push(function(){
      return endEarly('retire', '提早退休',
        '你在會議中途站起來，然後又坐下——<em>眼前黑了三秒</em>。<br><br>'
        + '這次醫生沒有給你「注意休息」這種建議，他直接問：「你還要做多久？」<br><br>'
        + '你算了一下存款、算了一下藥費，也算了一下自己還剩多少力氣。<br><br>'
        + '<strong>你在 ' + S.age + ' 歲提早離開了職場。</strong>不是因為財富自由，是因為身體不讓你繼續。'
        + '這個行業講了十幾年的永續，你自己的那一份，先用完了。');
    });
  }
  // 意外：車禍
  pool.push(function(){
    S.cash = Math.round(S.cash - 40); S.health++;
    return endEarly('accident', '那場車禍',
      '一個再普通不過的通勤早晨，一輛違規左轉的車。<br><br>'
      + '你活下來了，但復健花了很久很久。等你能重新坐回辦公桌前，'
      + '<em>這個行業已經往前走了兩年，而你的身體回不到從前</em>。<br><br>'
      + '你在 ' + S.age + ' 歲那年離開了原本的軌道。有時候人生的轉折跟你的努力沒有關係。');
  });
  // 被自己做的 AI 取代（外商追蹤滑鼠那條線的終點）
  if(S.year >= 2029 && (S.aifill || S.aiWatched)){
    pool.push(function(){
      return endEarly('replaced', '被自己養的 AI 取代',
        '總部說要「提升效率」，於是在每個人的電腦裝了行為追蹤——滑鼠軌跡、切換視窗的頻率、'
        + '你打一份報告花多久。他們說這是為了找出流程瓶頸。<br><br>'
        + '兩年後，一個以你的操作紀錄訓練出來的代理人上線了。<em>它的工作習慣跟你一模一樣，因為它就是學你的</em>。<br><br>'
        + '裁員名單公布那天，你在自己的信箱裡看到那封信。附件是一份很體面的資遣方案，'
        + '寄件者是那套系統的自動排程。<br><br>'
        + '<strong>你在 ' + S.age + ' 歲被自己教出來的東西取代。</strong>');
    });
  }
  // 頓悟出走（罕見）
  if(S.burn >= 55 || (S.gw||0) >= 3){
    pool.push(function(){
      return endEarly('awaken', '出家六十天',
        '你原本只是請了長假，去山上住幾天。<br><br>'
        + '第一週你還在看手機。第二週你開始睡得著。第三週，'
        + '有人問你：「你做那些事，是為了讓世界變好，還是為了證明自己有用？」<br><br>'
        + '你想了很久，久到那六十天就這樣過去了。<br><br>'
        + '<strong>你沒有再回去上班。</strong>後來有人在山下的社區看過你，'
        + '在教孩子認植物。<em>你算過的碳都留在報告書裡，而你把自己留了下來。</em>');
    });
  }
  if(!pool.length) return false;
  pool[Math.floor(rnd()*pool.length)]();
  return true;
}

/* ===== 中獎（使用者需求 7）=====
   極罕見。這一行講了十幾年「創造價值」，結果讓你財富自由的是一張兩百塊的彩券。 */
function rollWindfall(){
  if(S.windfall || S.age < 24) return false;
  if(rnd() > 0.004) return false;
  S.windfall = 1;
  if(rnd() < 0.25){
    S.cash += 20000;
    return endEarly('lotto', '財富自由（但不是靠永續）',
      '那天你在超商買咖啡，順手花兩百塊帶了一張。<br><br>'
      + '對獎的時候你把號碼看了七次，然後把手機拿給旁邊的人幫你再看一次。<br><br>'
      + '<strong>兩億。</strong><br><br>'
      + '你請了假、找了理財顧問、換了一支不會被工作訊息吵醒的手機。'
      + '交接那天，同事問你以後要做什麼，你說還沒想好。<br><br>'
      + '<em>你花了十幾年跟人解釋什麼叫「長期價值」，最後讓你自由的是一張兩百塊的彩券。</em>'
      + '有時候你還是會點開產業新聞——只是現在，你是那個可以純粹因為想做才做的人。');
  }
  const wc = CARDS.find(function(c){ return c.id==='wf_invoice' });
  if(!wc) return false;
  S.cardsLeft--; S.used[wc.id]=1; S.yearUsed[wc.id]=1;
  showCard(wc);
  return true;
}

function yearStart(){
  if(S.age>=40) return ending();
  if(rollLifeShock()) return;          // 人生突然轉彎（35+ 機率升高）
  S.cardsLeft = 2;   // 一年兩張，避免單局太冗長
  S.yearUsed = {};          // 同一年不重複抽同一張卡
  if(rollWindfall()) return;           // 中獎（極罕見）
  // 公司命運事件
  const f = S.emp && S.emp.fortune ? FORTUNE[S.emp.fortune] : null;
  if(f && f.yrs.includes(S.year) && !S.used['F'+S.emp.fortune+S.year]){
    S.used['F'+S.emp.fortune+S.year]=1; S.cardsLeft++; return fortuneCard(f);
  }
  /* 走到集團永續長的門口是極罕見的事——一旦真的走到了，就不該再被抽卡機率擋掉 */
  if(!S.used['t_apex'] && S.emp && S.emp.apex && S.level>=4 && !S.apexTitle
     && S.esgYrs>=10 && S.rel>=12 && (S.G||0)>=55){
    const ac = CARDS.find(function(c){ return c.id==='t_apex' });
    if(ac){ S.cardsLeft--; S.used[ac.id]=1; S.yearUsed[ac.id]=1; return showCard(ac) }
  }
  /* 四大待到第三年，一定會有人來問你要不要換組（使用者需求 2）——這是所裡的常態，不該靠運氣抽到 */
  if(S.emp && S.emp.big4 && S.big4Grp && S.esgYrs>=3 && !S.used['b4_switch'] && (S.grpSwitches||0)<2){
    const sc = CARDS.find(function(c){ return c.id==='b4_switch' });
    if(sc){ S.cardsLeft--; S.used[sc.id]=1; S.yearUsed[sc.id]=1; return showCard(sc) }
  }
  /* 駐站的年度生死線：續案審查每年必來（第二年起），不靠隨機抽 */
  if(S.emp && S.emp.id==='place' && (S.placeYrs||0)>=1){
    const rc = CARDS.find(function(c){ return c.id==='rv_renew' });
    if(rc){ S.cardsLeft--; S.used[rc.id]=(S.used[rc.id]||0)+1; S.yearUsed[rc.id]=1; return showCard(rc); }
  }

function eligible(c){

  if(S.yearUsed[c.id]) return false;          // 本年度已抽過

  if(isFreelance() && ORG_ONLY.indexOf(c.id)>=0) return false;   // 接案沒有同事與主管

   你想去的地方，會決定你比較常遇到什麼事——不是因為世界變了，
   是因為你會走進那些場合、接那些電話、被那種人記住。
   標記方式：卡片自身的效果傾向（e 內的欄位）決定它屬於哪一類。 */
const GOAL_TILT = {
  cso:    {G:1, rel:1, path:1, leave:1},
  money:  {pay:1, cash:1, hunt:1, quota:1},
  impact: {co2:1, E:1, esg:1, esgDim:1},
  found:  {found:1, adv:1, selfBrand:1, bizfail:1},
  human:  {burn:1, sp:1, health:1, parental:1},
  intl:   {en:1, intl:1, abroad:1}

function goalWeight(c){
  const t = S.goal && GOAL_TILT[S.goal.id];
  if(!t || !c.o) return 1;
  for(let i=0;i<c.o.length;i++){
    const e = c.o[i].e; if(!e) continue;
    for(const k in t){ if(e[k]) return 1.55 }    // 這張卡摸得到你要的東西
  }
  return 0.92;
}
function drawCard(){
  if(S.cardsLeft<=0) return midYear();
  const pool = CARDS.filter(eligible);
  if(!pool.length){ return midYear() }
  S.cardsLeft--;
  const wt = pool.map(function(c){
    let w = c.w * goalWeight(c);
    /* 抽過的卡再出現時權重折半，重複感會低很多（使用者需求 4） */
    const seen = S.used[c.id]||0;
    if(seen>0) w *= Math.pow(0.45, seen);
    return w;
  });
  let tot=0; wt.forEach(function(w){ tot+=w });
  let r=rnd()*tot, chosen=pool[0];
  for(let i=0;i<pool.length;i++){ r-=wt[i]; if(r<=0){ chosen=pool[i]; break } }
  S.used[chosen.id]=(S.used[chosen.id]||0)+1;
  S.yearUsed[chosen.id]=1;
  showCard(chosen);
}

function pickVariant(id,i){
  const list = OUTCOME_VARIANTS[id+':'+i];
  if(!list || !list.length) return null;
  let tot=0; list.forEach(function(x){ tot += (x.w||1) });
  let r = rnd()*tot;
  for(let k=0;k<list.length;k++){ r -= (list[k].w||1); if(r<=0) return list[k] }

/* 性格對能力配置與卡片結果的連動（item 3, 7）：每一軸都在某處發酵 */
function mbtiTilt(e, isPlan){
  if(mbtiHas('E') && e.rel>0) e.rel += 1;                     // E：社交收穫多
  if(mbtiHas('I') && e.rel>0 && (e.burn||0)>0) e.burn += 2;   // I：社交耗電
  if(mbtiHas('I') && (e.sp||0)>0) e.sp += 1;                  // I：獨處深耕
  if(mbtiHas('S') && (e.E||e.D)){ if(e.E) e.E+=1; else if(e.D) e.D+=1; }  // S：吃數據，盤查揭露上手
  if(mbtiHas('N') && e.G) e.G += 1;                           // N：看策略，治理有感
  if(mbtiHas('T') && e.G) e.G += 1;                           // T：邏輯，方法學與治理
  if(mbtiHas('F') && e.S) e.S += 1;                           // F：重人，社會面天生在行
  if(isPlan && mbtiHas('J')){ e.sp=(e.sp||0)+1; if(e.G) e.G += 1; }   // J：善規劃
  if(isPlan && mbtiHas('P') && (e.burn||0)>0) e.burn += 2;    // P：被時程追著跑
  return e;
}
function cardPick(id,i){
  const c=CARDS.find(x=>x.id===id), o=c.o[i], out={};
  const e=Object.assign({},o.e);
  const v = pickVariant(id,i);
  if(v && v.e){ Object.keys(v.e).forEach(function(k){ e[k]=(e[k]||0)+v.e[k] }) }
  /* 相關科系在對應議題上有天然優勢：別人要從頭學的，你只是換個名詞 */
  let boonNote = '';
  const GRAD_BOON = {g_env:'env',g_acc:'acc',g_mba:'biz',g_law:'law',g_fin:'acc',
    g_gender:'soc',g_anthro:'soc',g_sts:'soc',g_pa:'soc',g_comm:'com',
    g_eco:'sci',g_atmos:'sci',g_urban:'sci',g_sust:'biz',g_energy:'env',g_data:'acc',g_future:'biz',
    o_uk_env:'law',o_uk_biz:'biz',o_nl_gov:'soc',o_nl_econ:'acc',o_nordic_env:'env',o_nordic_energy:'env',
    o_us_climate:'biz',o_us_env:'sci',o_us_finmba:'acc',o_jp_env:'env',o_intdev:'soc',o_circular:'sci',
    o_marine:'sci',o_futures:'biz'};
  const gradBoon = S.gradField && GRAD_BOON[S.gradField];
  if(c.boon && ((S.major && S.major.id===c.boon) || gradBoon===c.boon)){
    ['E','S','G','D'].forEach(function(k){ if(e[k]>0) e[k]+=2 });
    e.sp=(e.sp||0)+1;
    boonNote = (gradBoon===c.boon && S.gradFieldName)
      ? '你研究所念的' + S.gradFieldName + '在這裡派上了用場——別人要從頭讀方法學，你只是換一套名詞。'
      : '你的' + S.major.n.split('／')[0] + '底子在這裡派上了用場——'
        + '同事要從頭讀方法學的東西，對你來說只是換一套名詞。';
  }
  /* MBTI 連動（item 3, 7）：性格讓同一張卡對不同人產生不同結果 */
  mbtiTilt(e, c.plan);
  if(mbtiHas('S') && (e.E||0)>0 && c.pool==='p') e.E += 1;       // S：數據實作上手快
  if(mbtiHas('F') && (e.S||0)>0) e.S += 1;                       // F：人的議題天生在行
  if(mbtiHas('T') && (e.co2||0)>0) e.co2 += 0;                   // （保留鉤子）
  if(mbtiHas('F') && (e.soc||0)>0) e.soc += 1;                   // F：社會影響力放大
  let sc = FULL_WEIGHT.indexOf(id)>=0 ? 1 : CARD_SCALE;
  if((o.e.burn||0) >= 10) sc *= staminaPenalty();   // 體力不夠時，硬撐的收穫會縮水
  ['E','S','G','D'].forEach(function(k){ if(e[k]) e[k]=Math.max(1,Math.round(e[k]*sc)) });
  if(e.rel) e.rel = e.rel>0 ? Math.max(1,Math.round(e.rel*0.7)) : e.rel;
  const d=apply(e,out);
  const vtrait = (v && v.trait) || o.trait;
  if(vtrait && !S.traits.includes(vtrait)) S.traits.push(vtrait);
  if(o.cert && !S.certs.includes(o.cert)){ S.certs.push(o.cert); const cf=CERTS.find(x=>x.id===o.cert); if(cf){S[cf.stat]+=cf.gain} }
  if(S.joinFlag){ S.joinFlag=0; S.inESG=true; S.esgYrs=0; d.push(['轉入永續','✓']) }
  S.evOut={t:(v && v.r) || o.r, d:d, extra:[out.extra, boonNote].filter(Boolean).join('<br><br>')};
  if(S.cardsLeft>0 && !S.quitFlag) return drawCard();
  midYear();
}

function fortunePick(leave){
  const f=S._f, d=[];
  if(f.t==='boom'){
    if(leave){ S.hunt=2; d.push(['獵頭視窗','開啟']);
      S.evOut={t:'你把履歷更新了。在一間正紅的公司做永續，這一年你的電話特別多。',d:d}; return midYear() }
    const b=ri(f.bonus[0],f.bonus[1]);
    const cash=Math.round(S.pay/12*b*.6);
    S.cash+=cash; S.pay=Math.round(S.pay*(1+f.pay));
    d.push(['年終',b+' 個月'],['存款','+'+cash+' 萬'],['年薪','+'+Math.round(f.pay*100)+'%']);
    S.ledger.push({y:S.year,t:`${S.emp.n} 大年，年終 ${b} 個月`,p:S.pay,mark:1});
    S.evOut={t:`年終 ${b} 個月。你把數字截圖傳給家人，他們回了一串驚嘆號。`,d:d}; midYear();
  } else {
    if(leave){ S.hunt=2; S.burn=Math.max(0,S.burn-10); d.push(['壓力','-10']);
      S.evOut={t:'你決定不陪這艘船沉下去。',d:d}; return midYear() }
    S.burn+=15; S.riskAcc+=f.risk||0; d.push(['壓力','+15']);
    if(!S.traits.includes('共患難')) S.traits.push('共患難');
    S.ledger.push({y:S.year,t:`${S.emp.n} 遇到寒冬，你留下來了`,p:S.pay});
    S.evOut={t:'你留下來收拾。有些同事沒有。',d:d}; midYear();
  }
}

   真實的四大永續團隊會分線：金融組（PCAF／評鑑／責任投資）、
   非金融組（報告書／評比／治理）、碳組（盤查／查證／CBAM／路徑），
   綠色所另有供應鏈組（供應商稽核／範疇三／循環經濟）。
   分到哪一組，決定你這幾年學得到什麼。 */

 {id:'fin', n:'金融組', tilt:'G', d:'服務金控、銀行、投信。做投融資碳排、永續金融評鑑、責任投資與綠色商品。',

  skills:['gri','mat','ifrss','rating','strat','sasb','bodedu']},
 {id:'carbon', n:'碳組', tilt:'E', d:'專做碳：組織盤查、產品碳足跡、查證、CBAM、淨零路徑。技術最硬，AI 最難取代。',

];
function big4GroupsFor(emp){
  return BIG4_GROUPS.filter(function(g){ return !g.only || (emp && g.only.indexOf(emp.firm)>=0) });
}
function big4GrpById(id){ for(const g of BIG4_GROUPS) if(g.id===id) return g; return null }

function skillById(id){ for(const k of SKILLS) if(k.id===id) return k; return null }
function hasSkill(id){ return !!(S.skills && S.skills[id]) }
function skillLevel(id){ return (S.skills && S.skills[id]) || 0 }
function skillCount(){ return S.skills ? Object.keys(S.skills).length : 0 }
/* 學會一項技能（可重複精進，最高 3 級） */
function learnSkill(id, note){
  const k = skillById(id); if(!k) return null;
  S.skills = S.skills || {};
  const before = S.skills[id] || 0;
  if(before >= 3) return null;
  S.learnedThisYear = 1;      // 今年有跟上（不會觸發準則退化）
  S.skills[id] = before + 1;
  S[k.stat] = (S[k.stat]||0) + (before===0 ? 4 : 2);   // 第一次學收穫最大
  if(before===0 && k.rare<=2){ S.rareSkills = (S.rareSkills||0) + 1 }
  return {k:k, lv:S.skills[id], first:before===0, note:note||''};
}
/* 這一年的專案，會讓你學到哪些技能（依部門/公司/年份決定可學清單） */
function skillsForFocus(focusKey){
  const y = S.year, out = [];
  const push = function(id, fromYear){ if(!fromYear || y>=fromYear) out.push(id) };
  if(focusKey==='E'){ push('ghg'); push('lca'); push('sbti',2021); push('path',2021); push('cbam',2023); push('ppa',2020); push('casset',2024); push('ghgver'); push('adapt',2023); }
  if(focusKey==='D'){ push('gri'); push('mat'); push('tcfd',2017); push('ifrss',2024); push('sasb',2019); push('rating'); push('assure'); push('platform',2023); }
  if(focusKey==='S'){ push('ssc'); push('saudit'); push('scope3',2022); push('circ',2020); push('hrdd',2023); push('sroi',2020); push('mineral',2021); }
  if(focusKey==='G'){ push('strat'); push('clgov'); push('scen',2019); push('gov'); push('bodedu',2020); push('tax',2024); push('esgdd',2021); push('icp',2022); push('esgpay',2024); push('aigov',2026); }
  // 金融業／金融組專屬
  if(S.emp && (S.emp.ind==='fin' || S.big4Grp==='fin')){ push('pcaf',2022); push('pri'); push('gbond',2020); push('gproduct',2021); push('twfin',2023); }
  // 自然議題：科系或已有基礎才碰得到
  if(S.major && S.major.id==='sci' || hasSkill('ghg')) push('tnfd',2023);
  return out.filter(function(id){ return skillLevel(id) < 3 });
}

function pickBig4Group(i){
  const g = S._grpList[i];

  if(!S.traits.includes(g.n)) S.traits.push(g.n);
  S[g.tilt] = (S[g.tilt]||0) + 3;
  const first = learnSkill(g.skills[0]);
  S.ledger.push({y:S.year,t:S.emp.n+'：分到'+g.n,p:''});

/* ===== 能力開發不一定成功（item 6）=====
   同樣投一年進碳盤查，有人做成專家，有人只是在旁邊看顧問做。
   影響因素：做過幾次、團隊多大（分工太細只碰得到一角）、體力、關係力（太常在外面跑）。 */
function skillOutcome(p){
  if(p.g!=='專業') return {q:1,note:''};
  const times = (S.projCount && S.projCount[p.k]) || 0;
  const tsz = teamSize(S.emp);
  let fail = 0.34;
  fail -= Math.min(0.24, times*0.10);          // 做過越多次越上手
  if(tsz>=8) fail += 0.12;                     // 大團隊：你只負責其中一小塊
  if(tsz===0) fail -= 0.04;                    // 接案：全都得自己扛，反而學得到
  if(S.emp && S.emp.ind==='cons') fail -= 0.08;// 顧問業天天做，熟得快
  if(stamina()<40) fail += 0.12;               // 體力見底，學不進去
  if(S.rel>=13) fail += 0.08;                  // 太常在外面跑，實作時間被吃掉
  if(mbtiHas('S') && (p.k==='E'||p.k==='D')) fail -= 0.06;  // 實感型吃數據
  if(mbtiHas('N') && (p.k==='G')) fail -= 0.06;             // 直覺型看策略
  fail = Math.max(0.05, Math.min(0.55, fail));
  const r = rnd();
  if(r < fail) return {q:0.4, note:pick([
    '只是這一年你多半在旁邊看顧問做，流程跟著跑完了，細節始終沒真的搞懂。',
    '案子是結了，但關鍵的判斷都是別人下的。你學到的比預期少很多。',
    '中途被抽去支援別的專案，這塊只做了一半，等於白忙。',
    '資料一直要不到，時間全花在追人身上，真正的方法學沒碰到多少。'])};
  if(r > 0.90) return {q:1.6, note:'而且你這次是真的打通了——從資料源頭到對外說明，整條你都講得清楚。'};
  return {q:1, note:''};
}

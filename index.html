.opts{display:flex; flex-direction:column; gap:9px; margin-top:20px}
.opt{display:block; width:100%; text-align:left; cursor:pointer;

.opt .hint{display:block; font-size:12.5px; color:var(--ink-3); margin-top:2px}

.btn{cursor:pointer; font:inherit; font-weight:500; border-radius:3px; padding:11px 22px;

.btn:focus-visible{outline:2px solid var(--accent); outline-offset:2px}

.outcome{margin-top:18px; padding:15px 18px; border-left:3px solid var(--accent);

.stat .val{font-size:12.5px; font-weight:600; flex:0 0 26px; text-align:right}

.kv{display:flex; justify-content:space-between; gap:10px; padding:5px 0; font-size:13.5px; border-bottom:1px dotted var(--line)}

.kv .k{color:var(--ink-3)}
.kv .v{font-weight:600; text-align:right}

.pick .m{font-size:11.5px; color:var(--accent); margin-top:7px; letter-spacing:.02em}

/* ---- MBTI 選擇 ---- */
.mbti-row{margin-bottom:9px}
.mbti-pair{display:grid; grid-template-columns:1fr 1fr; gap:9px}

.mbti-b b{font-family:"JetBrains Mono",monospace; color:var(--accent); font-size:15px; margin-right:4px}

.mbti-b.on{background:var(--accent-wash); border-color:var(--accent)}

.fbfield{width:100%; margin-top:8px; padding:11px 13px; font:inherit; font-size:14.5px; color:var(--ink);

.verdict{font-family:"Noto Serif TC",Georgia,serif; font-size:19px; line-height:1.9; margin:0 0 4px}

function deptOf(emp){ return (emp && DEPT[emp.dept]) || null }

/* ===== 公司 ESG 評分（item 6）=====
   仿 CSA／DJSI 的做法：0–100、產業相對、底部很重（多數落在 25–45，頂標才 70+）。
   分數會隨「年份（法規推著跑）」與「有人投入去做」而緩步上升——這也是為什麼
   你進去做實事，公司的評分會慢慢往上爬。基準值 esg0 存在各公司資料裡。 */
function industryPush(emp, y){
  // 指標品牌帶動 + 產業成熟度：越成熟的產業，同儕被逼著往上跑（item 8）
  const yrsIn = Math.max(0, (y + indMat(emp.ind)) - 2018);
  return Math.min(14, yrsIn * 0.9);   // 產業成熟帶動，但收斂上限讓頂標仍有層次
}
/* ===== 公司 ESG 三面向與評比參與（item 1, 2）=====
   真實世界最大的分數落差不是「做得好不好」，而是<有沒有填那份問卷>：
   有參與評比的重工業（水泥、鋼鐵、航空）常在 84-90，
   不參與的科技或食品大廠只拿到 30-40 的公開資訊評分，未受評的中小企業則根本沒有分數。
   這也給了玩家一個真實的槓桿：把一家沒在做評比的公司推上評比，分數會跳一大階。 */
function csaState(emp){
  if(!emp || !emp.esg) return null;
  if(S && S.csaFlip && S.csaFlip[emp.id]) return 1;   // 玩家推動公司開始參與
  return emp.csa;
}
function esgDims(emp, y){
  if(!emp || !emp.esg) return null;
  y = y || (S && S.year) || 2024;
  const push = industryPush(emp, y);
  const st = csaState(emp);
  const boost = (S && S.esgBoost && S.esgBoost[emp.id]) || 0;
  const bd = (S && S.esgBoostDim && S.esgBoostDim[emp.id]) || {};
  const out={};
  ['e','s','g'].forEach(function(k){
    let v = emp.esg[k] + push + boost*0.5 + (bd[k]||0);
    if(st===0) v *= 0.62;                 // 沒參與評比：只拿得到公開資訊的分數
    else if(st===1 && emp.csa===0) v *= 1.0;  // 玩家推動後，回到實際水準
    out[k]=Math.max(3, Math.min(95, Math.round(v)));
  });
  return out;
}
function companyESG(emp, y){
  const st = csaState(emp);
  if(st===-1) return null;                // 未受評
  const d = esgDims(emp, y);
  if(!d) return null;
  return Math.round((d.e + d.s + d.g)/3);
}
/* 職缺的面向（item 2）：分數高、有制度的公司職缺分得細；
   分數低或沒在做評比的公司，一個人要包 E、S、G 全部。 */
function roleFocus(emp){
  const st = csaState(emp), sc = companyESG(emp, S.year);
  if(st===-1 || sc===null || sc<50 || st===0) return {k:'all', n:'全包'};
  const d = esgDims(emp, S.year);
  const tz = teamSize(emp);
  if(tz<=3) return {k:'all', n:'全包'};
  // 團隊夠大 → 依公司最強的面向給你一塊專職
  const arr=[['e','環境面（碳與能源）','E'],['s','社會面（供應鏈與人）','S'],['g','治理面（法遵與評比）','G']];
  arr.sort(function(a,b){ return d[b[0]]-d[a[0]] });
  const pickd = arr[0];
  return {k:pickd[0], n:pickd[1], stat:pickd[2]};
}
function esgBand(v){
  if(v==null) return '';
  if(v>=70) return '領先';
  if(v>=55) return '優等';
  if(v>=42) return '中段';
  if(v>=30) return '待加強';
  return '後段';
}
/* 永續掛在哪個部門 → 影響進入門檻（科系對口好進、總經理室難進） */
function deptBarMod(e){
  const dp = deptOf(e); if(!dp) return 0;
  let mod = (dp.hard||0)*4;
  if(S && S.major && dp.fav.indexOf(S.major.id)>=0) mod -= 5;
  return mod;
}
/* 公司的加入門檻／要求：關係力夠高、或參加過永續尾牙才看得到（item 6） */
function reqKnown(e){
  if(!e || !e.req) return false;
  return S.rel>=8 || !!S.galaSeen || (S.knownReq && S.knownReq[e.id]);
}
/* 職缺卡片上的一行公司資訊：產業・層級・ESG 評分・永續隸屬・要求 */
function empMeta(e){
  const dp = deptOf(e), esg = companyESG(e, S.year), st = csaState(e), d = esgDims(e, S.year);
  let s = IND[e.ind].n + '・' + e.tier;
  if(esg!=null){
    s += '　ESG <b>'+esg+'</b>（'+esgBand(esg)+'）';
    if(d) s += ' <span style="color:var(--ink-3)">E'+d.e+'/S'+d.s+'/G'+d.g+'</span>';
    if(st===0) s += ' <span style="color:var(--warn)">未參與評比</span>';
  } else {
    s += '　ESG <span style="color:var(--ink-3)">未受評</span>';
  }
  const rf = roleFocus(e);
  s += '<br>職缺型態 <b>'+(rf.k==='all'?'全包（E／S／G 一人扛）':rf.n)+'</b>';
  if(dp) s += '　永續隸屬 '+dp.n;
  if(e.req){ s += '　｜加入要求：' + (reqKnown(e) ? e.req : '<span style="color:var(--ink-3)">門檻不明（關係力高或參加永續尾牙可得知）</span>'); }
  return s;
}

/* 四大：只以顏色代稱，畫面與程式碼皆不出現任何事務所本名 */
function isBig4(e){ return !!(e && e.big4) }
const BIG4 = ['b4y','b4o','b4g','b4b'];
/* 四大四間出現機率相同 */
function pickBig4(){
  const w = {b4y:3, b4o:3, b4g:3, b4b:3};
  const ids = BIG4.slice(); let tot=0; ids.forEach(function(k){ tot+=w[k] });
  let r=rnd()*tot;
  for(const k of ids){ r-=w[k]; if(r<=0) return EMP.find(function(e){ return e.id===k }) }
  return EMP.find(function(e){ return e.id==='b4y' });
}

/* ===== 真實薪資分布（item 4）=====
   來源：業界公開的永續職涯薪資調查。
   永續年資 0-2 年 中位 75 萬／3-5 年 中位 85 萬／6-11 年 中位 135 萬；
   全體分布（人數）：50↓12、50-70:37、70-90:40、90-110:17、110-130:11、130-150:6、150-200:8、200↑6。
   遊戲用它來（a）校準職級基準（b）在結局告訴玩家「你在真實分布裡的位置」。 */
const REAL_SALARY_BUCKETS = [
 {hi:50,  n:12}, {hi:70,  n:37}, {hi:90,  n:40}, {hi:110, n:17},
 {hi:130, n:11}, {hi:150, n:6},  {hi:200, n:8},  {hi:9999,n:6}
];
const REAL_MEDIAN_BY_ESGYRS = [[2,75],[5,85],[11,135]];
function realMedianFor(yrs){
  for(const [y,m] of REAL_MEDIAN_BY_ESGYRS){ if(yrs<=y) return m }
  return 135;
}
function salaryPercentile(pay){
  const tot = REAL_SALARY_BUCKETS.reduce(function(a,b){return a+b.n},0);
  let below=0, prevHi=0;
  for(const b of REAL_SALARY_BUCKETS){
    if(pay < b.hi){
      const span=b.hi-prevHi, into=Math.max(0,pay-prevHi);
      below += b.n * (span>0? into/span : 0);
      break;
    }
    below += b.n; prevHi=b.hi;
  }
  return Math.max(1, Math.min(99, Math.round(below/tot*100)));
}

/* ===== 薪資天花板 =====
   這一行真實的薪資是有頂的：職級 × 產業係數決定上限，超過的部分視為一次性獎金，
   隔年會被拉回。沒有這道閘門，靠跳槽複利可以滾到不合理的數字。 */
function payCap(){
  const lv = LEVELS[Math.max(0,Math.min(LEVELS.length-1,S.level))];
  const ind = (S.emp && IND[S.emp.ind]) || {c:1};
  let c = lv.cap * Math.min(1.35, Math.max(0.85, ind.c));
  if(isFreelance()) c = lv.cap * 1.18;      // 接案：沒有職級紅利，但接得動就有
  if(!S.inESG) c = 235;                      // 非永續職另計
  if(S.polit) c = 260;                       // 公職薪資法定，不套企業職級天花板
  return Math.round(c);
}
function clampPay(){
  const cap = payCap();
  if(S.pay > cap){
    S.pay = Math.round(cap + (S.pay - cap) * 0.25);   // 溢出的部分逐年回歸
    if(S.pay > cap*1.12) S.pay = Math.round(cap*1.12);
  }
  return S.pay;
}

/* ============ 薪資 ============ */
function calcPay(emp, level){
  const ind = IND[emp.ind]||{c:1};
  const m = mk(S.year)[1];
  const tenureBonus = Math.min(.35, (S.workYrs - S.esgYrs) * .05);
  let p = LEVELS[level].base * ind.c * emp.mult * (.80 + m/250) * (1+tenureBonus);
  p *= (0.94 + rnd()*0.16);
  return Math.round(p);
}
function tryPromote(){
  if(!S.emp) return false;          // 收攤／離職當年沒有雇主，不做升遷判定
  if(S.polit) return false;         // 公職的升遷是選票與內閣改組決定的，不走企業職級
  const nxt = LEVELS[S.level+1];
  if(!nxt) return false;
  const n = nxt.need;
  /* 四大的升遷是有時程表的（item 6，對齊真實調查）：
     顧問 →約2年→ 資深顧問 →再2-3年→ 副理／經理。制度化，但上面越來越窄。 */
  const b4 = S.emp && S.emp.big4;
  const needYr = b4 ? [0,2,5,9,13][S.level+1] : n.yr;
  const needCw = b4 ? Math.round(n.cw*0.88) : n.cw;
  if(cw()>=needCw && S.esgYrs>=needYr && (!n.G||S.G>=n.G) && (!n.rel||S.rel>=n.rel)){
    let pr = .30 + S.luck*.010 + S.rel*.008 + (S.level===3?.06:0);
    if(S.crossTitle) pr += .14;      // 本業 x 永續 = 不可取代
    if(S.stampPath==='strategy') pr += .12;   // 破關後走策略線 → 升遷邏輯站你這邊
    if(S.stampPath==='stall') pr -= .12;      // 停在原地 → 難再往上
    if(isAdrift()) pr -= .22;        // 全方位但無定位
    /* 位子是有限的：協理以上，小公司根本沒有那麼多層 */
    if(S.level>=3 && S.emp && S.emp.tier==='中後段' && !S.crossTitle) pr *= 0.45;
    if(S.level>=3 && isFreelance()) pr *= 0.6;
    if(b4 && S.level<=2) pr += .14;     // 四大前段升遷制度化，快而穩
    if(b4 && S.level>=3) pr -= .10;     // 但協理以上位子少，多數人在這裡離開
    /* 永續長普及率（item 8）：2022 年僅 9% 企業專設永續長（金融 16.7% 最高）。
       ESG 分數低的公司，多半連這個位子都沒有——天花板不是你，是組織圖。 */
    if(S.level===3 && !b4 && S.emp.esg){
      const sc = companyESG(S.emp, S.year) || 0;
      const need = S.emp.ind==='fin' ? 50 : 58;
      if(sc < need) pr *= 0.30;
    }
    if(rnd() < pr){
      S.level++; S.pay = Math.max(S.pay, calcPay(S.emp,S.level)); clampPay();
      return true;
    }
  }
  return false;
}


/* ===== 定位系統 =====
   源自業界觀察：「外面的人想進來，裡面的人想出去」——資深者在廣闊議題中失去焦點。
   出路不是更全方位，而是「本業 × 永續」的跨領域組合。 */
function topStat(){
  const a=[['E',S.E],['S',S.S],['G',S.G],['D',S.D]].sort((x,y)=>y[1]-x[1]);
  return a[0];
}

/* ===== 永續團隊人數 =====
   由公司層級、產業成熟度與年份共同決定。
   一人部門什麼都碰但碰不深；大團隊分工細，你只會很懂一塊。 */
function teamSize(emp){
  if(!emp) return 0;
  if(emp.id==='free') return 0;
  if(emp.ind==='cons') return 30;
  const my = S.year + indMat(emp.ind);
  let base = my<2015 ? 0.6 : my<2019 ? 1.2 : my<2022 ? 2.2 : my<2025 ? 4.5 : 6.5;
  if(emp.tier==='龍頭') base *= 2.4;
  else if(emp.tier==='外商') base *= 0.8;
  else if(emp.tier==='中後段') base *= 0.7;
  else if(emp.tier==='公部門') base *= 2.0;
  /* ESG 評分越高的公司，通常真的養得起越大的團隊（item 5）。
     但有特例：分數低卻剛被客戶逼著擴編、或分數高卻只靠兩個人硬撐。 */
  const esg = companyESG(emp, S.year);
  if(esg!=null){
    base *= (0.55 + esg/70);
    if(emp.leanTeam) base *= 0.45;     // 特例：分數好看，但實際上人很少
  }
  return Math.max(1, Math.round(base));
}
function teamWord(n){
  if(n<=1) return '一人部門';
  if(n<=3) return String(n)+' 人小組';
  if(n<=8) return String(n)+' 人團隊';
  if(n<=20) return String(n)+' 人部門';
  return String(n)+' 人以上';
}
function teamNote(n){
  if(n<=1) return '整件事都是你的。沒有人可以問，也沒有人跟你搶。';
  if(n<=3) return '三個人分掉所有的事。你什麼都碰得到，但沒有一項碰得夠深。';
  if(n<=8) return '開始有分工了。你負責的那一塊會越做越熟。';
  if(n<=20) return '分工很細。你很懂自己那一塊，但公司的全貌只有主管看得到。';
  return '大到你不會認識所有同事。要出頭得先在內部被看見。';
}

/* ============ 完整英文版：翻譯字典與渲染攔截 ============
   TR 以「中文原文 → 英文」對照。渲染時在唯一的出口統一替換，
   沒有翻到的字串會原樣保留（fallback 中文），因此可以分批補譯而不會壞掉。
   台灣在地梗保留原味，必要時在英文裡加一句括號說明。 */
const TR = {};
let TR_KEYS = [];
function trRegister(map){
  Object.keys(map).forEach(function(k){ TR[k] = map[k] });
  TR_KEYS = Object.keys(TR).sort(function(a,b){ return b.length - a.length });   // 長字串優先，避免部分覆蓋
}
function tr(str){
  if(LANG!=='en' || !str) return str;
  return TR[str] || str;
}
/* 把整段 HTML 裡已知的中文片語換成英文（長的先換） */
function localizeHTML(html){
  if(LANG!=='en' || !html || !TR_KEYS.length) return html;
  let out = html;
  for(let i=0;i<TR_KEYS.length;i++){
    const k = TR_KEYS[i];
    if(out.indexOf(k) >= 0) out = out.split(k).join(TR[k]);
  }
  return out;
}

"★ TCFD 氣候相關財務揭露建議書發布，把氣候從 CSR 議題變成財務議題。資本額 50–100 億公司納入編製範圍。年底台灣永續指數發布。": "★ TCFD publishes its recommendations on climate-related financial disclosure, turning climate from a CSR topic into a financial one. Companies capitalized at NT$5–10 billion are brought into the reporting scope. The Taiwan Sustainability Index launches at year end.",
"★ 全體上市櫃公司揭露 IFRS 永續資訊，含溫室氣體盤查及確信。查驗證機構人力需求高峰。三張揭露框架至此到齊：氣候看 S2、自然看 TNFD、人看 TISFD。": "★ All listed and OTC companies disclose IFRS sustainability information, including GHG inventory and assurance. Demand for verification and assurance body staff peaks. The three disclosure frameworks are now complete: S2 for climate, TNFD for nature, TISFD for people.",
"★ 碳費三項子法八月底公告、費率十月底拍板：一般費率每噸 300 元。台灣碳權交易所國內減量額度 10 月上路。年底永續經濟活動認定指引出到第二版，涵蓋的金融機構授信餘額從 28.4% 拉到 64.3%。永續經濟活動認定指引出到第二版。TCFD 任務結束，監測責任移交 ISSB——會 TCFD 的人得改口說 S2 了。九月 TISFD 正式啟動，把「不平等與人」納入財務揭露。GCSF 主軸轉向「公正、有序、公平的轉型」。當年出版報告書中 73.2% 取得第三方確信。": "★ The three carbon fee sub-regulations are announced at the end of August and the rates settled at the end of October: a general rate of NT$300 per tonne. The Taiwan Carbon Solution Exchange launches domestic offset credits in October. By year end the Sustainable Economic Activities Guidelines reach their second edition, lifting covered lending balances at financial institutions from 28.4% to 64.3%. The Sustainable Economic Activities Guidelines reach their second edition. TCFD's mandate ends and monitoring passes to the ISSB—people who knew TCFD now have to say S2 instead. TISFD formally launches in September, bringing \"inequality and people\" into financial disclosure. GCSF's theme shifts to \"A Just, Orderly and Equitable Transition.\" Of the sustainability reports published that year, 73.2% obtained third-party assurance.",
"★ 碳費費率 1/1 生效（一般 300 元／噸，有自主減量計畫可享 50 或 100 元優惠費率）。資本額 20 億以下上市櫃納入，全體上市櫃都要編永續報告書。<br>歐盟二月拋出 <em>Omnibus 簡化草案</em>，要大砍 CSRD／CSDDD 的適用範圍——歐洲客戶問的問題，一夜之間從「你們揭露了嗎」變成「這還要不要做」。美國那邊反 ESG 聲浪同步升溫。全球企業永續論壇（GCSF）今年主軸轉向「邁向自然正向未來」。綠領職缺 29,305 個。": "★ Carbon fee rates take effect 1/1 (general rate NT$300／tonne; NT$50 or NT$100 preferential rates with an approved voluntary reduction plan). Listed and OTC companies capitalized under NT$2 billion are brought in — every listed and OTC company must now produce a sustainability report.<br>In February the EU floats its <em>Omnibus simplification proposal</em>, set to slash the scope of CSRD／CSDDD—overnight, the question from European customers goes from \"have you disclosed?\" to \"do we still have to do this?\" Anti-ESG noise in the US rises in step. The Global Corporate Sustainability Forum (GCSF) shifts this year's theme to \"Toward a Nature-Positive Future.\" 29,305 green-collar job openings.",
"★ 總統宣示 2050 淨零。COP26 上 IFRS 基金會宣布成立 ISSB；同年 TNFD 自然相關財務揭露工作小組成立——氣候之後，下一個是自然。綠領職缺跳到 15,109 個，一年增三成六。": "★ The President declares net zero by 2050. At COP26 the IFRS Foundation announces the creation of the ISSB; the same year the Taskforce on Nature-related Financial Disclosures (TNFD) is set up—after climate, nature is next. Green-collar openings jump to 15,109, up 36% in a year.",
"★ 聯合國 SDGs 發布、巴黎協定通過。溫室氣體減量及管理法施行。全台出版 384 本報告書。": "★ The UN releases the SDGs; the Paris Agreement is adopted. The GHG Reduction and Management Act takes effect. 384 sustainability reports published nationwide.",
"★ 路徑圖目標年：全體上市櫃完成溫室氣體盤查。IFRS S 第二階段：資本額 50–100 億的 107 家公司適用，年報與財報同時申報。範疇三最快自本年起強制揭露。TISFD 首個公開版框架問世，國際客戶的問卷開始出現「人」的欄位。<br>台灣的總量管制與交易（ETS）試行計畫已經排定 2028 年啟動，碳交所的交易平台先行上線——碳有價正要從「繳費」走向「交易」，會算碳的人開始學怎麼買賣碳。會做溫盤的人也開始變多。": "★ Roadmap target year: all listed and OTC companies complete their GHG inventory. IFRS S phase two: 107 companies capitalized at NT$5–10 billion are covered, filing sustainability information together with the financial statements. Scope 3 disclosure becomes mandatory from this year at the earliest. TISFD's first public framework arrives, and \"people\" columns start showing up in international customers' questionnaires.<br>Taiwan's cap-and-trade (ETS) pilot is already scheduled to start in 2028, with the carbon exchange's trading platform going live first—priced carbon is moving from \"paying a fee\" to \"trading,\" and people who can count carbon start learning how to buy and sell it. People who can run a GHG inventory are getting more common too.",
"★ 金管會發布「公司治理 3.0—永續發展藍圖」，ESG 正式進入監理語彙。疫情把「韌性」與「供應鏈斷鏈」推上檯面；歐盟、日韓、中國接連宣布淨零承諾。CSR 報告書辦法修訂，氣候風險成為必要揭露。綠領職缺 11,131 個。": "★ The FSC issues \"Corporate Governance 3.0—Sustainable Development Roadmap\" and ESG formally enters the regulator's vocabulary. The pandemic pushes \"resilience\" and \"supply chain disruption\" to the front; the EU, Japan, Korea and China announce net zero pledges one after another. The CSR reporting rules are amended and climate risk becomes a required disclosure. 11,131 green-collar job openings.",
"★ 食品、化工、金融與資本額百億以上公司強制編製 CSR 報告書。永續職缺第一次真正出現。": "★ Food, chemicals, financials and companies capitalized at NT$10 billion or more must now produce CSR reports. Sustainability job openings appear for real for the first time.",
"★★ 準則大爆發的一年：ISSB 六月正式發布 IFRS S1／S2；TNFD 九月發布最終建議 v1.0，把 TCFD 的四支柱從氣候擴大到自然；金管會八月發布我國接軌藍圖，採直接採用。同年一月氣候變遷因應法三讀、二月公布施行（2050 淨零正式入法，碳費有了法源），八月環境部升格、十月 CBAM 進入過渡期、台灣碳權交易所成立並開國際碳權交易。GCSF 主軸「全球變遷中的加速轉型」。報告書首度破千，1,006 本。": "★★ The year the standards exploded: the ISSB formally releases IFRS S1／S2 in June; TNFD publishes final recommendations v1.0 in September, widening TCFD's four pillars from climate to nature; the FSC issues Taiwan's convergence roadmap in August, opting for direct adoption. The same year, the Climate Change Response Act clears its third reading in January and is promulgated in February (2050 net zero written into law, the carbon fee gets its legal basis); in August the Ministry of Environment is upgraded, in October CBAM enters its transition period, and the Taiwan Carbon Solution Exchange is founded and opens trading in international carbon credits. GCSF's theme: \"Accelerating Transformation in a Changing World.\" Sustainability reports top a thousand for the first time — 1,006.",
"★★ 碳費首度開徵，240 家企業、461 座工廠五月底前繳費，首輪收了 49.7 億。IFRS S1／S2 第一階段上路：資本額百億以上 119 家（含 14 家金控、24 家本國銀行）適用，永續資訊與財報同規格。CBAM 正式徵收；台灣碳費理論上可扣抵，但歐盟尚未認可我國碳價，實際上抵不到。ETS 試行平台預計下半年上線。<br>歐盟 Omnibus <em>二月正式通過</em>：CSRD 適用家數大砍（門檻拉到員工千人＋營收 4.5 億歐元）、盡職調查只留最大型企業。美國退出巴黎協定生效、SEC 提案廢止氣候揭露規則——「漂綠」變成「漂靜」，做還是照做，只是不敢大聲說。顧問圈的關注重心換了邊：人權與勞動的討論度首度超過淨零。綠領職缺 29,733 個，技能缺口 23 萬人，但徵才明顯轉為「低招募、低解僱」。": "★★ The carbon fee is collected for the first time: 240 companies and 461 plants pay by the end of May, NT$4.97 billion in the first round. IFRS S1／S2 phase one begins: 119 companies capitalized above NT$10 billion (including 14 financial holding companies and 24 domestic banks) are covered, with sustainability information held to the same standard as the financial statements. CBAM starts charging for real; Taiwan's carbon fee is deductible in theory, but the EU has yet to recognize our carbon price, so in practice it isn't. The ETS pilot platform is expected to go live in the second half.<br>The EU Omnibus <em>formally passes in February</em>: the number of companies in CSRD scope is slashed (threshold raised to 1,000 employees ＋ €450 million revenue) and due diligence is left to the largest firms only. The US withdrawal from the Paris Agreement takes effect and the SEC proposes repealing its climate disclosure rule—\"greenwashing\" becomes \"greenhushing\": the work still gets done, just not out loud. The consulting crowd's centre of gravity switches sides — human rights and labour outpace net zero in airtime for the first time. 29,733 green-collar openings and a skills gap of 230,000 people, but hiring has clearly turned to \"low hiring, low firing.\"",
"★★ 金管會發布永續發展路徑圖：2027 全體上市櫃完成溫盤、2029 完成確信。CSR 報告書正式更名永續報告書。ISSB 發布 S1／S2 徵求意見稿，TNFD beta 框架陸續問世。氣候變遷因應法草案在立法院闖關，2050 淨零入法與碳費法源就差臨門一腳。全球企業永續論壇（GCSF）主軸「邁向淨零之路」，亞太永續博覽會首度登場。綠領職缺暴增至 22,111 個（＋46%），報告書 777 本。": "★★ The FSC issues the Sustainable Development Roadmap: all listed and OTC companies complete GHG inventory by 2027 and assurance by 2029. CSR reports are formally renamed sustainability reports. The ISSB publishes the S1／S2 exposure drafts and TNFD beta frameworks roll out one after another. The Climate Change Response Act draft fights its way through the Legislative Yuan — writing 2050 net zero into law and giving the carbon fee a legal basis are one step away. The Global Corporate Sustainability Forum (GCSF) takes \"Path to Net Zero\" as its theme, and the Asia-Pacific Sustainability Expo debuts. Green-collar openings surge to 22,111 (＋46%); 777 sustainability reports.",

function nameGo(){
  const inp=document.getElementById('pname');
  S.playerName = (inp && inp.value.trim().slice(0,12)) || '';
  // 隨機分配 MBTI（四軸各 50/50），如同分發學校
  S.mbti = MBTI_AX.map(function(ax){ return rnd()<0.5 ? ax.a : ax.b }).join('');
  S.mbtiAx = {};
  MBTI_AX.forEach(function(ax){ S.mbtiAx[ax.k] = S.mbti.indexOf(ax.a)>=0 ? ax.a : ax.b });
  // 先天配置（item 3）：性格決定起手的能力分布與際遇傾向
  if(mbtiHas('E')){ S.rel+=3 } else { S.sp+=2; S.dom+=1 }            // E 人脈廣；I 深耕專注
  if(mbtiHas('S')){ S.D+=3; S.E+=1 } else { S.G+=3; S.S+=1 }         // S 吃數據與盤查；N 看策略與願景
  if(mbtiHas('T')){ S.G+=2; S.D+=1 } else { S.S+=3 }                 // T 邏輯治理；F 天生社會面
  if(mbtiHas('J')){ S.uniScore=(S.uniScore||0)+4 } else { S.luck=Math.min(20,S.luck+2) }  // J 履歷整齊；P 際遇彈性
  seedBox.textContent='SEED '+S.seed.toString(36).toUpperCase();
  screenReveal();
}

function uniPick(y,i){
  const u=UNI[y-1], o=u.o[i], out={};

    if(rnd() < S.school.intern + (S.uniScore||0)*0.006){ S.internOK=true; S.rel+=2; S.D+=3; S.uniScore=(S.uniScore||0)+13;
      r='你拿到了一份永續相關的實習。三個月下來，主管說：「畢業後要不要回來？」' }
    else { S.rel+=1; S.dom+=2; S.uniScore=(S.uniScore||0)+4;
      r='投了十七封，面試三次，最後去了一間跟永續無關的公司實習。至少學到了怎麼在辦公室生存。' }
  }
  if(o.e.gaming){
    const g = GAMING_OUTCOMES[Math.floor(rnd()*GAMING_OUTCOMES.length)];
    S.uniFun = g.id;
    if(g.trait && !S.traits.includes(g.trait)) S.traits.push(g.trait);
    r = g.r;
    Object.keys(g.e).forEach(function(k){ o.e[k] = (o.e[k]||0) + g.e[k] });
    delete o.e.gaming;
  }
  if(o.e.cert){ S.certs.push(o.e.cert) }
  if(o.cert){ S.certs.push(o.cert) }
  const d = apply(o.e, out);
  S.ledger.push({y:S.year, t:`${u.t}：${o.l}`, p:''});
  S.year++; S.age++;
  if(o.e.grad){
    S.gradPath=o.e.grad;
    if(o.e.grad==='work'){ showOutcome(r||'你做了決定。', d, ()=>screenJobHunt(), out.extra); return; }
    if(o.e.grad==='usr'){
      const emp = EMP.find(function(e){ return e.id==='usr' });
      S.emp=emp; S.inESG=true; S.domName='學校'; S.dom+=2; S.rel=Math.min(20,S.rel+5); S.S+=4; S.soc=(S.soc||0)+2;
      S.pay = Math.round(calcPay(emp,0));

      S.ledger.push({y:S.year,t:'留在學校做 USR 計畫',p:S.pay,mark:1});
      return showOutcome('你留在學校，接了<strong>大學社會責任（USR）</strong>計畫的助理。<br><br>'
        + '帶學生下鄉、陪社區開會、跑地方創生、寫計畫結案報告。<em>年薪 '+S.pay+' 萬——這一行最低的一群</em>。<br><br>'
        + '但你認識了整個地方：里長、小農、returning 青年、公部門承辦、還有一群願意為了一件事熬夜的學生。<em>這些人脈之後會用很久。</em>',
        [['年薪',S.pay],['關係力',5],['社會力',4]], function(){ S.phase='career'; yearStart() });

    showOutcome(r||'你決定繼續念。', d, ()=>screenGradField(o.e.grad), out.extra);

function showOutcome(text, deltas, next, extra){

/* ===== 業界頂尖：不是有能力就進得去 ===== */
/* 頂尖企業：履歷硬還不夠，要有人內推、市場很熱、或實習卡位（使用者需求 item 4） */
const ELITE = ['gg','fa','tree','fbrand','saus','telco1','telco2','sky','retail2','fin4','cem','stl'];
function resumeScore(){ return cw() + (S.uniScore||0) + Math.floor(S.luck*0.4) }
function gradHard(){ const f=S.gradField&&(gradFieldById(S.gradField)||gradOverseasById(S.gradField)); return f?(f.hard||0):0 }
function canReachEmp(e, m){
  const r = resumeScore();
  const bar = e.bar + deptBarMod(e) + gradHard();
  if(ELITE.indexOf(e.id) >= 0){
    if(r < bar + 2) return false;                    // 硬門檻：履歷要比一般人硬一截
    return (S.rel >= 7) || (m >= 78) || S.internOK;  // 還要有人內推、市場缺人、或實習卡到位
  }
  return r >= bar - 6;
}
function eliteBlockedNote(m){
  const blocked = EMP.filter(function(e){
    return ELITE.indexOf(e.id)>=0 && resumeScore() >= e.bar+2 && !(S.rel>=7 || m>=78 || S.internOK);
  });
  if(!blocked.length) return '';
  return '<br><br><em>你的條件其實搆得上 ' + blocked[0].n + ' 那一級的公司，但履歷投進去就沒有下文了。'
       + '那種位子多半是內部推薦先填掉的。</em>';
}
function gradOffers(){
  const m = mk(S.year)[1];
  const out = [];
  if(S.internOK){
    const cands = EMP.filter(function(e){ return e.bar<=46 && !e.big4 && ELITE.indexOf(e.id)<0 });
    if(cands.length) out.push({k:'intern', emp:pick(cands)});
  }
  if(rnd() < S.school.big4 + (m>=55?.12:0) + (S.uniScore||0)*0.005){
    out.push({k:'emp', emp:pickBig4()});
  }
  const pool = EMP.filter(function(e){
    return !e.big4 && e.ind!=='ngo' && canReachEmp(e,m) && (!out.length || out.every(function(x){ return !x.emp || x.emp.id!==e.id }));
  });
  const work = pool.slice();
  let n = Math.min(work.length, m>=70 ? 3 : 2);
  while(n-- > 0 && work.length){
    out.push({k:'emp', emp: work.splice(Math.floor(rnd()*work.length),1)[0]});
  }
  if(S.en>=6) out.push({k:'emp', emp:EMP.find(function(e){ return e.id==='ngo' })});
  out.push({k:'detour'});
  return out;
}

function doHunt(i){

    + deptLine + teamLine + '<br><br>'+note+'年薪 <strong>'+S.pay+' 萬</strong>。',

function jobFlavor(m){
  if(m<20) return '你在 104 上搜「永續」，幾乎搜不到——因為這個字還沒被發明成職稱。<em>這個行業還沒開始</em>。跳出來的是環安衛、環工，還有幾間大公司掛在公關部底下的「CSR 專員」。你想做的那件事，現在還沒有名字。';
  if(m<40) return '報告書的需求撐起了第一批職缺。多數是「CSR 專員」，工作內容寫得含糊，面試官自己也說不太清楚要你做什麼。';
  if(m<60) return '職缺開始正式化了，「永續專員」「ESG 專員」的職稱出現在標題上。金融業也開始找人。';
  if(m<85) return '每個月有兩萬多個綠領職缺。<em>只要會做溫盤，履歷丟出去就有回音</em>。你的同學有人一年跳兩次。';
  return '市場最熱的時候。職缺多，競爭者也多——人人都想做 ESG。差異化靠的是技能組合，不是入行速度。';
}
/* ============ 年度循環 ============ */
function bigYear(y){ return [2014,2022,2024,2026,2030].indexOf(y)>=0 }

/* ============ 突發結局：人生不會讓你穩穩玩到四十歲 ============
   35 歲之後風險升高：健康、意外、被 AI 取代、頓悟出走。
   endEarly() 直接中止這一局，結局畫面會說明是怎麼結束的。 */
function endEarly(tag, title, body){
  S.endedEarly = tag;
  S.earlyTitle = title;
  S.earlyBody = body;
  if(!S.traits.includes(title)) S.traits.push(title);
  S.ledger.push({y:S.year, t:'【'+title+'】這一局在這裡結束', p:'', mark:1});
  return ending();
}
/* 每年開始時擲一次：年紀越大、體力越差，越可能出事 */
function rollLifeShock(){
  if(S.endedEarly) return false;
  if(S.age < 33) return false;
  const late = S.age >= 35;
  let p = late ? 0.045 : 0.018;
  if(S.burn >= 75) p += 0.05;
  if((S.highBurnYrs||0) >= 4) p += 0.04;
  if(S.health) p += 0.02;
  if(rnd() > p) return false;

  const pool = [];
  // 早衰 → 被迫提早退休
  if((S.highBurnYrs||0) >= 4 || S.burn >= 78 || (S.collapses||0) >= 2){
    pool.push(function(){
      return endEarly('retire', '提早退休',
        '你在會議中途站起來，然後又坐下——<em>眼前黑了三秒</em>。<br><br>'
        + '這次醫生沒有給你「注意休息」這種建議，他直接問：「你還要做多久？」<br><br>'
        + '你算了一下存款、算了一下藥費，也算了一下自己還剩多少力氣。<br><br>'
        + '<strong>你在 ' + S.age + ' 歲提早離開了職場。</strong>不是因為財富自由，是因為身體不讓你繼續。'
        + '這個行業講了十幾年的永續，你自己的那一份，先用完了。');
    });
  }
  // 意外：車禍

function yearStart(){
  if(S.age>=40) return ending();
  if(rollLifeShock()) return;          // 人生突然轉彎（35+ 機率升高）
  S.cardsLeft = 2;   // 一年兩張，避免單局太冗長
  S.yearUsed = {};          // 同一年不重複抽同一張卡
  // 公司命運事件
  const f = S.emp && S.emp.fortune ? FORTUNE[S.emp.fortune] : null;
  if(f && f.yrs.includes(S.year) && !S.used['F'+S.emp.fortune+S.year]){
    S.used['F'+S.emp.fortune+S.year]=1; S.cardsLeft++; return fortuneCard(f);
  }
  /* 駐站的年度生死線：續案審查每年必來（第二年起），不靠隨機抽 */
  if(S.emp && S.emp.id==='place' && (S.placeYrs||0)>=1){
    const rc = CARDS.find(function(c){ return c.id==='rv_renew' });
    if(rc){ S.cardsLeft--; S.used[rc.id]=(S.used[rc.id]||0)+1; S.yearUsed[rc.id]=1; return showCard(rc); }
  }
  drawCard();
}
const DISABLED_CARDS={x_deck:1,q_fin_eval:1,m_greenwash:1,n_scope:1,p_s3:1};
function eligible(c){
  if(DISABLED_CARDS[c.id]) return false;   // 主題已由 FOCUS_CARDS 涵蓋，停用重複卡
  if(S.yearUsed[c.id]) return false;          // 本年度已抽過
  /* 你根本沒在做永續，就不該抽到「查證老師來了」這種卡。
     非永續職只會遇到：本業卡(nonEsg)、與工作無關的人生卡(LIFE_ANY)。 */
  if(!S.inESG && !c.nonEsg && LIFE_ANY.indexOf(c.id) < 0) return false;
  if(isFreelance() && ORG_ONLY.indexOf(c.id)>=0) return false;   // 接案沒有同事與主管
  if(!isFreelance() && c.freeOnly) return false;                 // 接案專屬事件
  if(c.selfOnly && !S.selfBrand) return false;                   // 創作者專屬事件（item 7）
  if(c.yr && !c.yr.includes(S.year)) return false;
  if(!c.yr && c.pool==='h') return false;
  if(S.used[c.id] && !c.rep) return false;
  if(c.cond){ try{ if(!c.cond(S)) return false }catch(e){ return false } }
  return true;
}
function drawCard(){
  if(S.cardsLeft<=0) return midYear();
  const pool = CARDS.filter(eligible);
  if(!pool.length){ return midYear() }
  S.cardsLeft--;
  let tot=0; pool.forEach(c=>tot+=c.w);
  let r=rnd()*tot, chosen=pool[0];
  for(const c of pool){ r-=c.w; if(r<=0){ chosen=c; break } }
  S.used[chosen.id]=(S.used[chosen.id]||0)+1;
  S.yearUsed[chosen.id]=1;
  showCard(chosen);
}

const CARD_SCALE = 0.5;   // 每年多張卡 → 單張增益縮放，避免數值通膨
const FULL_WEIGHT = ['m_stamp','m_ceiling','m_escape','m_sysvendor','m_teamsplit','m_seed','m_noconsult','h27','h30','h26'];
function pickVariant(id,i){
  const list = OUTCOME_VARIANTS[id+':'+i];
  if(!list || !list.length) return null;
  let tot=0; list.forEach(function(x){ tot += (x.w||1) });
  let r = rnd()*tot;
  for(let k=0;k<list.length;k++){ r -= (list[k].w||1); if(r<=0) return list[k] }
  return list[0];
}
/* 性格對能力配置與卡片結果的連動（item 3, 7）：每一軸都在某處發酵 */
function mbtiTilt(e, isPlan){
  if(mbtiHas('E') && e.rel>0) e.rel += 1;                     // E：社交收穫多
  if(mbtiHas('I') && e.rel>0 && (e.burn||0)>0) e.burn += 2;   // I：社交耗電
  if(mbtiHas('I') && (e.sp||0)>0) e.sp += 1;                  // I：獨處深耕
  if(mbtiHas('S') && (e.E||e.D)){ if(e.E) e.E+=1; else if(e.D) e.D+=1; }  // S：吃數據，盤查揭露上手
  if(mbtiHas('N') && e.G) e.G += 1;                           // N：看策略，治理有感
  if(mbtiHas('T') && e.G) e.G += 1;                           // T：邏輯，方法學與治理
  if(mbtiHas('F') && e.S) e.S += 1;                           // F：重人，社會面天生在行
  if(isPlan && mbtiHas('J')){ e.sp=(e.sp||0)+1; if(e.G) e.G += 1; }   // J：善規劃
  if(isPlan && mbtiHas('P') && (e.burn||0)>0) e.burn += 2;    // P：被時程追著跑
  return e;
}
function cardPick(id,i){
  const c=CARDS.find(x=>x.id===id), o=c.o[i], out={};
  const e=Object.assign({},o.e);
  const v = pickVariant(id,i);
  if(v && v.e){ Object.keys(v.e).forEach(function(k){ e[k]=(e[k]||0)+v.e[k] }) }
  /* 相關科系在對應議題上有天然優勢：別人要從頭學的，你只是換個名詞 */
  let boonNote = '';
  const GRAD_BOON = {g_env:'env',g_acc:'acc',g_mba:'biz',g_law:'law',g_fin:'acc',
    g_gender:'soc',g_anthro:'soc',g_sts:'soc',g_pa:'soc',g_comm:'com',
    g_eco:'sci',g_atmos:'sci',g_urban:'sci',g_sust:'biz',g_energy:'env',g_data:'acc',g_future:'biz',
    o_uk_env:'law',o_uk_biz:'biz',o_nl_gov:'soc',o_nl_econ:'acc',o_nordic_env:'env',o_nordic_energy:'env',
    o_us_climate:'biz',o_us_env:'sci',o_us_finmba:'acc',o_jp_env:'env',o_intdev:'soc',o_circular:'sci',
    o_marine:'sci',o_futures:'biz'};
  const gradBoon = S.gradField && GRAD_BOON[S.gradField];
  if(c.boon && ((S.major && S.major.id===c.boon) || gradBoon===c.boon)){
    ['E','S','G','D'].forEach(function(k){ if(e[k]>0) e[k]+=2 });
    e.sp=(e.sp||0)+1;
    boonNote = (gradBoon===c.boon && S.gradFieldName)
      ? '你研究所念的' + S.gradFieldName + '在這裡派上了用場——別人要從頭讀方法學，你只是換一套名詞。'
      : '你的' + S.major.n.split('／')[0] + '底子在這裡派上了用場——'
        + '同事要從頭讀方法學的東西，對你來說只是換一套名詞。';
  }
  /* MBTI 連動（item 3, 7）：性格讓同一張卡對不同人產生不同結果 */
  mbtiTilt(e, c.plan);
  if(mbtiHas('S') && (e.E||0)>0 && c.pool==='p') e.E += 1;       // S：數據實作上手快
  if(mbtiHas('F') && (e.S||0)>0) e.S += 1;                       // F：人的議題天生在行
  if(mbtiHas('T') && (e.co2||0)>0) e.co2 += 0;                   // （保留鉤子）
  if(mbtiHas('F') && (e.soc||0)>0) e.soc += 1;                   // F：社會影響力放大
  let sc = FULL_WEIGHT.indexOf(id)>=0 ? 1 : CARD_SCALE;
  if((o.e.burn||0) >= 10) sc *= staminaPenalty();   // 體力不夠時，硬撐的收穫會縮水
  ['E','S','G','D'].forEach(function(k){ if(e[k]) e[k]=Math.max(1,Math.round(e[k]*sc)) });
  if(e.rel) e.rel = e.rel>0 ? Math.max(1,Math.round(e.rel*0.7)) : e.rel;
  const d=apply(e,out);
  const vtrait = (v && v.trait) || o.trait;
  if(vtrait && !S.traits.includes(vtrait)) S.traits.push(vtrait);
  if(o.cert && !S.certs.includes(o.cert)){ S.certs.push(o.cert); const cf=CERTS.find(x=>x.id===o.cert); if(cf){S[cf.stat]+=cf.gain} }
  if(S.joinFlag){ S.joinFlag=0; S.inESG=true; S.esgYrs=0; d.push(['轉入永續','✓']) }
  S.evOut={t:(v && v.r) || o.r, d:d, extra:[out.extra, boonNote].filter(Boolean).join('<br><br>')};
  if(S.cardsLeft>0 && !S.quitFlag) return drawCard();
  midYear();
}
function fortuneCard(f){
  const boom = f.t==='boom';
  shell(header()+`<div class="panel panel-pad fade">
    <span class="eyebrow">${S.emp.n} ・ ${boom?'公司起飛了':'公司出事了'}</span>
    <h2 class="card-title">${f.ttl}</h2>
    <div class="card-body">${f.txt}</div>
    <div class="opts">${boom
      ? `<button class="opt" onclick="fortunePick(1)"><span class="lab">趁高點去談別的機會</span><span class="hint">市場記得你在一間紅公司</span></button>
         <button class="opt" onclick="fortunePick(0)"><span class="lab">留下來，領這一年的年終</span><span class="hint">現金入袋</span></button>`
      : `<button class="opt" onclick="fortunePick(0)"><span class="lab">共體時艱</span><span class="hint">留下來收拾</span></button>
         <button class="opt" onclick="fortunePick(1)"><span class="lab">先跑</span><span class="hint">現實一點</span></button>`}</div>
  </div>`);
  S._f=f;
}
function fortunePick(leave){
  const f=S._f, d=[];
  if(f.t==='boom'){
    if(leave){ S.hunt=2; d.push(['獵頭視窗','開啟']);
      S.evOut={t:'你把履歷更新了。在一間正紅的公司做永續，這一年你的電話特別多。',d:d}; return midYear() }
    const b=ri(f.bonus[0],f.bonus[1]);
    const cash=Math.round(S.pay/12*b*.6);
    S.cash+=cash; S.pay=Math.round(S.pay*(1+f.pay));
    d.push(['年終',b+' 個月'],['存款','+'+cash+' 萬'],['年薪','+'+Math.round(f.pay*100)+'%']);
    S.ledger.push({y:S.year,t:`${S.emp.n} 大年，年終 ${b} 個月`,p:S.pay,mark:1});
    S.evOut={t:`年終 ${b} 個月。你把數字截圖傳給家人，他們回了一串驚嘆號。`,d:d}; midYear();
  } else {
    if(leave){ S.hunt=2; S.burn=Math.max(0,S.burn-10); d.push(['壓力','-10']);
      S.evOut={t:'你決定不陪這艘船沉下去。',d:d}; return midYear() }
    S.burn+=15; S.riskAcc+=f.risk||0; d.push(['壓力','+15']);
    if(!S.traits.includes('共患難')) S.traits.push('共患難');
    S.ledger.push({y:S.year,t:`${S.emp.n} 遇到寒冬，你留下來了`,p:S.pay});
    S.evOut={t:'你留下來收拾。有些同事沒有。',d:d}; midYear();
  }
}

function skillById(id){ for(const k of SKILLS) if(k.id===id) return k; return null }
function hasSkill(id){ return !!(S.skills && S.skills[id]) }
function skillLevel(id){ return (S.skills && S.skills[id]) || 0 }
function skillCount(){ return S.skills ? Object.keys(S.skills).length : 0 }
/* 學會一項技能（可重複精進，最高 3 級） */
function learnSkill(id, note){
  const k = skillById(id); if(!k) return null;
  S.skills = S.skills || {};
  const before = S.skills[id] || 0;
  if(before >= 3) return null;
  S.skills[id] = before + 1;
  S[k.stat] = (S[k.stat]||0) + (before===0 ? 4 : 2);   // 第一次學收穫最大
  if(before===0 && k.rare<=2){ S.rareSkills = (S.rareSkills||0) + 1 }
  return {k:k, lv:S.skills[id], first:before===0, note:note||''};
}
/* 這一年的專案，會讓你學到哪些技能（依部門/公司/年份決定可學清單） */
function skillsForFocus(focusKey){
  const y = S.year, out = [];
  const push = function(id, fromYear){ if(!fromYear || y>=fromYear) out.push(id) };
  if(focusKey==='E'){ push('ghg'); push('lca'); push('sbti',2021); push('path',2021); push('cbam',2023); push('ppa',2020); push('casset',2024); push('ghgver'); push('adapt',2023); }
  if(focusKey==='D'){ push('gri'); push('mat'); push('tcfd',2017); push('ifrss',2024); push('sasb',2019); push('rating'); push('assure'); push('platform',2023); }
  if(focusKey==='S'){ push('ssc'); push('saudit'); push('scope3',2022); push('circ',2020); push('hrdd',2023); push('sroi',2020); push('mineral',2021); }
  if(focusKey==='G'){ push('strat'); push('clgov'); push('scen',2019); push('gov'); push('bodedu',2020); push('tax',2024); push('esgdd',2021); push('icp',2022); push('esgpay',2024); push('aigov',2026); }
  // 金融業／金融組專屬
  if(S.emp && (S.emp.ind==='fin' || S.big4Grp==='fin')){ push('pcaf',2022); push('pri'); push('gbond',2020); push('gproduct',2021); push('twfin',2023); }
  // 自然議題：科系或已有基礎才碰得到
  if(S.major && S.major.id==='sci' || hasSkill('ghg')) push('tnfd',2023);
  return out.filter(function(id){ return skillLevel(id) < 3 });
}


/* ===== 進四大要分組（使用者需求）===== */
function screenBig4Group(){
  const list = big4GroupsFor(S.emp);
  const cards = list.map(function(g,i){
    const sk = g.skills.map(function(id){ const k=skillById(id); return k?k.n:'' }).filter(Boolean).slice(0,4).join('、');
    return '<button class="pick" onclick="pickBig4Group('+i+')">'
      + '<span class="t">'+g.n+'</span>'
      + '<span class="d">'+g.d+'</span>'
      + '<span class="m">主要練到：'+sk+'</span></button>';
  }).join('');
  shell('<div class="panel panel-pad fade">'
    + '<span class="eyebrow">'+S.emp.n+' ・ 你被分到哪一組？</span>'
    + '<h2 class="card-title">分組決定你這幾年學得到什麼。</h2>'
    + '<div class="card-body" style="font-size:15px">四大的永續團隊是分線作戰的。'
    + '<span style="color:var(--ink-3)">同樣待三年，金融組出來的人跟碳組出來的人，履歷長得完全不一樣——'
    + '而你未來跳去哪一種公司，很大一部分是這一刻決定的。</span></div>'
    + '<div class="grid">'+cards+'</div></div>');
  S._grpList = list;
}
function pickBig4Group(i){
  const g = S._grpList[i];
  S.big4Grp = g.id; S.big4GrpName = g.n;
  if(!S.traits.includes(g.n)) S.traits.push(g.n);
  S[g.tilt] = (S[g.tilt]||0) + 3;
  const first = learnSkill(g.skills[0]);
  S.ledger.push({y:S.year,t:S.emp.n+'：分到'+g.n,p:''});
  showOutcome('你被分到<strong>'+g.n+'</strong>。<br><br>'+g.d
    + (first ? '<br><br>第一個月，你就被丟去做<strong>'+first.k.n+'</strong>——邊做邊學，這一行都是這樣開始的。' : ''),
    [[({E:'環境力',S:'社會力',G:'治理力',D:'揭露力'})[g.tilt], 3]],
    function(){ yearStart() });
}

 {k:'E',g:'專業',l:'碳盤查與減量專案',h:'技術含量高，AI 最難取代',e:{E:7,co2:1}},

/* ===== 能力開發不一定成功（item 6）=====
   同樣投一年進碳盤查，有人做成專家，有人只是在旁邊看顧問做。
   影響因素：做過幾次、團隊多大（分工太細只碰得到一角）、體力、關係力（太常在外面跑）。 */
function skillOutcome(p){
  if(p.g!=='專業') return {q:1,note:''};
  const times = (S.projCount && S.projCount[p.k]) || 0;
  const tsz = teamSize(S.emp);
  let fail = 0.34;
  fail -= Math.min(0.24, times*0.10);          // 做過越多次越上手
  if(tsz>=8) fail += 0.12;                     // 大團隊：你只負責其中一小塊
  if(tsz===0) fail -= 0.04;                    // 接案：全都得自己扛，反而學得到
  if(S.emp && S.emp.ind==='cons') fail -= 0.08;// 顧問業天天做，熟得快
  if(stamina()<40) fail += 0.12;               // 體力見底，學不進去
  if(S.rel>=13) fail += 0.08;                  // 太常在外面跑，實作時間被吃掉
  if(mbtiHas('S') && (p.k==='E'||p.k==='D')) fail -= 0.06;  // 實感型吃數據
  if(mbtiHas('N') && (p.k==='G')) fail -= 0.06;             // 直覺型看策略
  fail = Math.max(0.05, Math.min(0.55, fail));
  const r = rnd();
  if(r < fail) return {q:0.4, note:pick([
    '只是這一年你多半在旁邊看顧問做，流程跟著跑完了，細節始終沒真的搞懂。',
    '案子是結了，但關鍵的判斷都是別人下的。你學到的比預期少很多。',
    '中途被抽去支援別的專案，這塊只做了一半，等於白忙。',
    '資料一直要不到，時間全花在追人身上，真正的方法學沒碰到多少。'])};
  if(r > 0.90) return {q:1.6, note:'而且你這次是真的打通了——從資料源頭到對外說明，整條你都講得清楚。'};
  return {q:1, note:''};
}

  shell(header()+`<div class="panel panel-pad fade">

    <div class="grouplab">專業</div>
    <div class="opts">${PROJ.filter(p=>p.g==='專業').map(p=>`<button class="opt" onclick="projPick(${PROJ.indexOf(p)})"><span class="lab">${p.l}</span><span class="hint">${p.h}</span></button>`).join('')}</div>
    ${S.selfBrand
      ? `<div class="grouplab">經營自己</div><p class="note">你的帳號已經在跑了——更新、回訊息、接邀約已經是日常的一部分，不必再特別把一整年壓在上面。<em>它會自己長，也會自己找麻煩上門。</em></p>`

  </div>`);
}
function projPick(i){
  const p=PROJ[i];
  S._focusP = p;
  if(p.g==='專業' && FOCUS_CARDS[p.k] && FOCUS_CARDS[p.k].length){
    const pool = FOCUS_CARDS[p.k].filter(function(c){ return !c.cond || c.cond(S) });
    const use = pool.length ? pool : FOCUS_CARDS[p.k];
    S._focusCard = use[Math.floor(rnd()*use.length)];
    return renderFocusCard();
  }
  applyProject(p, Object.assign({},p.e), '', null);   // 經營自己：維持即時處理
}
function renderFocusCard(){
  const c=S._focusCard, p=S._focusP, pb=pendingBlock();
  shell(header()+`<div class="panel panel-pad fade">
    ${pb}<span class="eyebrow">${p.l} ・ 今年實際落到你手上的事</span>
    <h2 class="card-title">${c.t}</h2>
    <div class="card-body">${c.x}</div>
    <div class="opts">${c.o.map(function(o,idx){ return `<button class="opt" onclick="focusPick(${idx})"><span class="lab">${o.l}</span>${o.h?`<span class="hint">${o.h}</span>`:''}</button>` }).join('')}</div>
  </div>`);
}
function focusPick(oi){
  const c=S._focusCard, p=S._focusP, o=c.o[oi];
  applyProject(p, Object.assign({},o.e), o.r||'', o.trait);
}
/* 把「今年壓在哪」的選擇，走完能力／團隊／技能成敗／公司 ESG 的完整流程 */
function applyProject(p, e, resultNote, trait){
  const out={}; const tsz = teamSize(S.emp);
  if(p.k==='D') S.stamps.report=1;
  if(p.k==='E') S.stamps.ghg=1;
  if(p.k==='S') S.stamps.social=1;
  if(p.g==='經營自己'){ S.selfYrs=(S.selfYrs||0)+1;
    if(S.selfYrs>=3 && !S.traits.includes('圈子裡的人')) S.traits.push('圈子裡的人'); }
  if(S.rel>=12){ e.sp=(e.sp||0)-1; if(e.co2) e.co2=0 }
  if(p.k==='R3' && !S.selfBrand){
    S.selfBrand=1;
    if(!S.traits.includes('開始寫了')) S.traits.push('開始寫了');
  }
  mbtiTilt(e, !!S._focusCard);   // 焦點卡也吃性格連動
  /* 這一年學到的具體技能（依焦點方向、年份、公司與四大組別）*/
  let learned = null;
  if(p.g==='專業'){
    let pool = skillsForFocus(p.k);
    const grp = S.big4Grp && big4GrpById(S.big4Grp);
    if(grp){ const pref = grp.skills.filter(function(id){ return pool.indexOf(id)>=0 }); if(pref.length && rnd()<0.6) pool = pref; }
    if(pool.length){
      // 越稀缺的技能越晚才學得到（要先有基礎）
      const eligible = pool.filter(function(id){
        const k = skillById(id); if(!k) return false;
        if(k.rare<=1) return S.esgYrs>=6 || skillCount()>=6;
        if(k.rare<=2) return S.esgYrs>=3 || skillCount()>=3;
        return true;
      });
      const use = eligible.length ? eligible : pool;
      learned = learnSkill(use[Math.floor(rnd()*use.length)]);
    }
  }
  const so = skillOutcome(p);
  if(so.q!==1){ ['E','S','G','D'].forEach(function(k){ if(e[k]) e[k]=Math.max(1,Math.round(e[k]*so.q)) }); }
  /* 邊際遞減：同一項能力越高，再往上長越慢（你已經是專家，多做一年學不到多少新的）*/
  ['E','S','G','D'].forEach(function(k){
    if(e[k]>0){ const cur=S[k]||0; const f = cur>=120?0.25 : cur>=95?0.45 : cur>=75?0.65 : cur>=55?0.85 : 1;
      e[k]=Math.max(1, Math.round(e[k]*f)); }
  });
  S.projCount[p.k]=(S.projCount[p.k]||0)+1;
  if(p.g==='專業' && tsz>0){
    if(tsz<=2){
      if(e[p.k]) e[p.k] = Math.max(1, e[p.k]-2);
      ['E','S','G','D'].forEach(function(k){ if(k!==p.k) e[k]=(e[k]||0)+2 });
    } else if(tsz>=8){
      if(e[p.k]) e[p.k] += 3;
    }
  }
  if(trait && !S.traits.includes(trait)) S.traits.push(trait);
  apply(e,out);
  const dp = deptOf(S.emp);
  if(dp && !isFreelance()){ S[dp.tilt]=(S[dp.tilt]||0)+1; if(dp.board && S.level>=1) S.G+=1; }
  if(S.emp && S.emp.esg && !isFreelance()){
    const id=S.emp.id, cur=companyESG(S.emp,S.year);
    let gain = p.g==='專業' ? 1.1 : 0.4;
    if(cur!==null){ gain *= cur<45 ? 1.9 : cur<60 ? 1.3 : cur<75 ? 0.8 : 0.45 }
    if(so.q<1) gain *= 0.5;
    S.esgBoost[id]=Math.min(22,(S.esgBoost[id]||0)+gain);
    if(p.g==='專業'){
      const dimOf={E:'e',S:'s',G:'g',D:'g'}, dk=dimOf[p.k];
      if(dk){ const b=S.esgBoostDim[id]||(S.esgBoostDim[id]={}); b[dk]=Math.min(20,(b[dk]||0)+gain*0.8) }
    }
    S.esgLift=(S.esgLift||0)+gain;
    /* 年復一年真的在做減量 → 累積實質減碳（讓「真正減下碳」這個目標有機會達成）*/
    if(p.k==='E' && so.q>=1){ S.co2 += 1; }
  }
  const chips=(out.d||[]);
  const learnNote = learned
    ? (learned.first
        ? `<br><br>這一年你第一次真的學會了<strong>${learned.k.n}</strong>${learned.k.rare<=2?'——這是連四大都沒幾家在做的東西':''}。`
        : `<br><br>你又把<strong>${learned.k.n}</strong>練深了一層（Lv.${learned.lv}）。`)
    : '';
  S.projNote = (resultNote ? resultNote+' ' : `這一年你壓在<strong>${p.l}</strong>上。`) + learnNote
    + (so.note ? so.note : '')
    + (S.rel>=12 ? '不過你有一半時間在外面跑，實作的時間被吃掉了。' : '');
  yearEnd();
}

/* ============ 年末結算 ============ */
function yearEnd(){
  // 年資
  S.workYrs++; if(S.inESG) S.esgYrs++; if(S.freelance) S.freeYrs++;
  /* 國際資歷：待在外商／國際組織或在海外工作的年數 */
  if((S.emp && S.emp.intl) || S.abroad) S.intlYrs = (S.intlYrs||0) + 1;
  if(S.bond>0) S.bond--;
  if(S.cash<0){                                   // 負債：有利息、有壓力，但不會無限滾大
    S.cash = Math.max(-180, Math.round(S.cash*1.02));
    S.burn = Math.min(100, S.burn + (S.cash<-80?5:3));
  }
  if(S.inESG && S.level>=2 && !isFreelance()) S.G += 2;   // 帶人、跑法遵、進董事會報告，治理力自然累積
  if(isFreelance()){                                      // 接案收入靠案源，人脈決定波動下緣
    const swing = 0.88 + rnd()*0.38 + Math.min(.18, S.rel*.012);
    S.pay = Math.round(S.pay * Math.min(1.35, Math.max(0.78, swing)));
  }
  const cross = checkCross();
  // burnout 自然變化
  /* 當到主管，體力掉得更快：會議、擔責、幫下屬擋事（item 12）*/
  const lvBurn = (S.inESG && !isFreelance()) ? S.level*1.7 : 0;
  S.burn = Math.max(0, S.burn + Math.round((S.emp?S.emp.burn:1)*6 + lvBurn) - 4);
  // 存款
  S.cash = Math.round(S.cash + S.pay*(isFreelance()?0.20:0.12));
  const events=[];
  /* ===== 年度考績 A／B／C（使用者需求）=====
     看你今年的投入、能見度、體力與運氣。C 連兩年會被盯上。 */
  if(S.inESG && S.emp && !isFreelance()){
    let gs = 50 + (S.luck*1.1) + (S.rel*0.8) + Math.min(30, cw()*0.10) - Math.max(0, (S.burn-60)*0.6);
    if(S.projPushed) gs += 10;                      // 今年選了「全力推動」
    if(S.aifill) gs += 4;
    if(S.big4Grp) gs += 2;
    gs += ri(-12, 12);
    const g = gs >= 78 ? 'A' : gs >= 46 ? 'B' : 'C';
    S.grades.push(g);
    if(g==='A'){
      S.gradeC = 0;
      const bonus = Math.round(S.pay * 0.06);
      S.cash += bonus;
      events.push('年度考績 <strong>A</strong>。獎金多了 '+bonus+' 萬，主管在會議上點名說你這一年很不一樣。');
      if(S.grades.filter(function(x){return x==='A'}).length>=3 && !S.traits.includes('連年拿A')) S.traits.push('連年拿A');
    } else if(g==='C'){
      S.gradeC++;
      /* 考績不好是會扣薪的（使用者需求）：C 扣 3%，連兩年 C 扣 6% ＋ 績效改善計畫 */
      if(S.gradeC>=2){
        S.pay = Math.round(S.pay*0.94);
        S.riskAcc += 0.28;
        events.push('年度考績又是 <strong>C</strong>。調薪單上是<em>負的：-6%</em>，而且人資找你談了一次「績效改善計畫」——這個詞你聽過，通常不是好事。');
        if(!S.traits.includes('被績效改善過')) S.traits.push('被績效改善過');
      } else {
        S.pay = Math.round(S.pay*0.97);
        events.push('年度考績 <strong>C</strong>。評語寫得很客氣，但薪水單很誠實：<em>年薪被調降了 3%</em>。');
      }
    } else {
      S.gradeC = 0;
      events.push('年度考績 <strong>B</strong>。不好不壞，跟大多數人一樣。');
    }
  }
  /* ===== 長期高工時 → 早衰（使用者需求）===== */
  if(S.burn>=72){ S.highBurnYrs = (S.highBurnYrs||0) + 1; }
  else if(S.burn<50){ S.highBurnYrs = Math.max(0, (S.highBurnYrs||0) - 1); }
  if(S.highBurnYrs===5 && !S.traits.includes('早衰')){
    S.traits.push('早衰'); S.health++;
    events.push('健檢報告一年比一年長。醫生說了一句你記很久的話：<em>「你的身體年齡比實際年齡大了十歲。」</em>');
  }
  /* ===== 產業風險：金融惡鬥、電子景氣循環（使用者需求）===== */
  if(S.emp && !isFreelance() && S.inESG){
    if(S.emp.ind==='fin' && rnd() < 0.16 + S.rel*0.004){
      S.burn = Math.min(100, S.burn + 10);
      events.push('金控內部又一輪人事角力。<em>你不在牌桌上，卻要陪著熬夜做被拿去互相攻防的簡報。</em>');
    }
    if(S.emp.ind==='elec' || S.emp.ind==='semi'){
      const r = rnd();
      if(r < 0.13){
        events.push('景氣反轉，訂單掉了三成。<em>今年沒有年終</em>——公告貼出來那天，辦公室安靜得聽得見空調聲。');
        S.cash = Math.round(S.cash - S.pay*0.06);
      } else if(r < 0.19){
        events.push('公司爆出關鍵技術外洩，有同事被查出把資料帶去對岸。<em>調查拖了半年，年終砍半</em>，每個人的電腦都被裝了新的監控軟體。');
        S.cash = Math.round(S.cash - S.pay*0.04);
        S.burn = Math.min(100, S.burn + 6);
      }
    }
  }
  S.projPushed = 0;
  // 四大顏色所的特色（item 15）＋ AI 填答系統（item 17）
  if(S.emp && !isFreelance()){
    if(S.emp.wfh) S.burn = Math.max(0, S.burn-4);              // 在家上班少一點通勤耗損
    if(S.emp.profitShare){                                      // 藍色所：分潤
      const mm = mk(S.year)[1];
      const bonus = Math.round(S.pay*(mm>=70?0.10:0.05));
      if(bonus>0){ S.cash += bonus; events.push('藍色所的分潤下來了，帳戶多了 '+bonus+' 萬。'); }
    }
  }
  if(S.aifill && S.inESG){ S.burn = Math.max(0, S.burn-5); S.D += 1; S.G += 1; }
  /* 2026 起，會不會用 AI 做應用拉出差別：用的人省時、產能高、被看見；不用的人在 AI 成熟後被稀釋 */
  if(S.inESG && !isFreelance() && aiLv(S.year)>=5){
    if(S.aifill){
      S.aiEdge=(S.aiEdge||0)+1;
      if(S.aiEdge===2 && !S.traits.includes('AI 加成的人')) S.traits.push('AI 加成的人');
    } else if(aiLv(S.year)>=6 && S.D > cw()*0.40){
      events.push('會議上有人問：這些報告書的活，AI 不是都能做了嗎？<em>你開始感覺到自己被稀釋。</em>');
      S.burn=Math.min(100,S.burn+3);
    }
  }
  /* 帳號會自己長：能見度與號召力持續累積，但也持續吃掉一點體力（item 7）*/
  if(S.selfBrand){ S.rel=Math.min(20,S.rel+1); S.adv=(S.adv||0)+1; S.burn=Math.min(100,S.burn+2); }  // AI 填答系統：省時、順便長揭露與治理
  /* ===== 過勞崩潰（item 7：做永續，人生也要永續）=====
     體力見底（burn 破表）時，身體替你做決定：強制休養、留下代價。 */
  if(S.burn>=100){
    S.collapses=(S.collapses||0)+1; S.health++;
    S.burn=56; S.sp=Math.max(0,S.sp-1); S.pay=Math.round(S.pay*0.98);
    if(!S.traits.includes('過勞崩潰')) S.traits.push('過勞崩潰');
    events.push('<strong>你在辦公室昏倒了。</strong>身體替你做了那個你一直不肯做的決定：停下來。被送醫、強制休養——這一年的考評不用看了。<em>做永續，別忘了自己的人生也要永續。</em>');
  } else if(S.burn>=88){
    events.push('你的體力快見底了。<em>再撐下去，垮的會是你自己。</em>');
  }
  // 破關後選的路，一路發酵（item 5）
  if(S.inESG && !isFreelance()){
    if(S.stampPath==='field') S.dom += 1;                 // 下到前線：產業專業持續累積
    if(S.stampPath==='transform' && S.aifill) S.G += 1;   // 轉型辦公室 × AI：治理力加成
    if(S.stampPath==='transform' && aiLv(S.year)>=6) S.G += 1;
  }
  // 升遷
  if(cross){ events.push(`有人在會議上說：【這件事找你最快】——你的定位成形了：<strong>${cross[0]}</strong>。${cross[1]}`) }
  if(S.inESG && tryPromote()){
    events.push(isFreelance()
      ? `你的報價往上跳了一級。現在客戶找你，是衝著 <strong>${LEVELS[S.level].t}</strong> 的經驗來的，年收入約 ${S.pay} 萬。`
      : `升上 <strong>${LEVELS[S.level].t}</strong>，年薪調整為 ${S.pay} 萬。`);
  }
  else if(S.inESG){
    const damp = S.pay>=260 ? 0.35 : S.pay>=180 ? 0.6 : 1;   // 越接近天花板，調薪越小
    const mNow = mk(S.year)[1], mLabel = mk(S.year)[2];
    const cooling = (mLabel==='逆風初起'||mLabel==='逆風退潮'||mLabel==='泡沫消風'||mLabel==='AI擠壓');
    /* 時代紅利／寒冬（item 11）：狂飆年代加薪快，逆風年代凍薪甚至減薪 */
    let era = mNow>=84 ? 1.7 : mNow>=68 ? 1.15 : mNow>=56 ? 0.85 : 0.55;
    if(cooling) era = Math.min(era, 0.8);       // 逆風／泡沫／AI：加薪幅度被壓住
    let inc=1+(0.013+rnd()*0.013+S.luck*0.0005)*damp*era;
    if(cooling && rnd()<0.22){ inc = 0.985; }   // 消風年代：預算縮手，可能被凍薪甚至微減
    /* 把公司 ESG 分數拉起來的人，加薪談得比較動（item 2）——
       尤其在原本分數難看的公司，進步幅度是最好講的故事。 */
    const lift = (S.emp && S.esgBoost && S.esgBoost[S.emp.id]) || 0;
    if(lift>=6) inc += 0.012;
    if(lift>=12) inc += 0.012;
    if(aiLv(S.year)>=5 && S.D>cw()*0.42 && !S.traits.includes('駕馭工具的人') && !S.aifill) inc-=0.022;   // AI 成熟＋純揭露＋不用工具 → 加薪被壓
    if(aiLv(S.year)>=5 && (S.aifill || S.traits.includes('駕馭工具的人'))) inc+=0.014;                      // 會用 AI 做應用的人 → 加薪較好
    S.pay=Math.round(S.pay*Math.max(1,inc)) }
  else { S.pay=Math.round(S.pay*(1+0.012+rnd()*0.013)) }
  clampPay();   // 薪資天花板：擋住跳槽複利失控
  if(S.abroad){
    S.abroadYrs++;
    /* 海外的變數不是努力能擋的：政策轉向、簽證抽籤、外籍員額 */
    const kick = 0.06 + (S.year>=2025?0.05:0);   // 反移民風向年代風險更高
    if(rnd()<kick){
      S.abroad=0; S.emp=null; S.quitFlag=1; S.cash+=15;
      events.push('政策轉向，公司縮減外籍員額——<em>你的簽證不再續</em>。拿了一筆離職金，你有九十天離境。');
      if(!S.traits.includes('被政策請回')) S.traits.push('被政策請回');
    } else if(S.abroadYrs>=2 && !S.traits.includes('國際線')){ S.traits.push('國際線'); }
  }
  // 「開始找工作」的後果：隔一年真的要離職（item 1）
  if(S.leaveNext && S.year>S.leaveNext && !isFreelance()){
    S.leaveNext=0; S.quitFlag=1;
    events.push('你去年說要開始找工作。今年，你真的遞了辭呈——<em>接下來要換一份工作了</em>。');
  }
  // 裁員風險
  if(S.riskAcc>0 && rnd()<S.riskAcc){ S.riskAcc=0; S.quitFlag=1; S.cash+=20;
    events.push('公司做了組織調整。你的名字在名單上。'); }
  // 機會
  const offers=[];
  const m=mk(S.year)[1];
  const huntP = Math.min(.45, .05 + S.rel*.015 + S.luck*.006 + Math.max(0,(cw()-40))*.005 + m/2000 + (S.hunt?.25:0) + (S.crossTitle?.10:0) - (isAdrift()?.12:0));
  if(S.inESG && !isFreelance() && S.esgYrs>=2 && rnd()<huntP) offers.push('hunt');
  const poachP = Math.min(.38,(.03 + S.dom*.015 + S.rel*.01)*(m>=70?2:1));
  if(S.inESG && !isFreelance() && S.esgYrs>=3 && rnd()<poachP) offers.push('poach');
  if(!S.inESG && S.year>=2014 && rnd()< .18+m/300) offers.push('switch');
  // 證照機會
  let certOffer=null;
  if(S.workYrs%2===0){
    const avail = CERTS.filter(c=>!S.certs.includes(c.id) && S.cash>=c.cost+3
      && S.year>=(c.from||0)                            // 證照要到實際開辦年份才會出現（已查證）
      && (c.id!=='sv2' || S.certs.includes('sv1')));   // 社會價值 LV2 要先有 LV1（item 6）
    if(avail.length) certOffer = pick(avail);
  }
  S.hunt = Math.max(0,S.hunt-1);
  S.ledger.push({y:S.year, t:(S.emp?S.emp.n:'')+(S.inESG?'・'+LEVELS[S.level].t:'・非永續職'), p:S.pay});
  renderYearEnd(events, offers, certOffer);
}
/* 時代感（item 11）：讓玩家「感覺到」現在是紅利年代還是寒冬 */

  if(label==='逆風退潮'||label==='泡沫消風') return '<em>泡沫正在消風</em>——職缺數字看起來還在，但每一個都更難拿。預算縮手、專案暫停、greenhushing 盛行。<em>低招募、低解僱</em>，卡在位子上的人不敢動，想進來的人進不來。<br>';

  if(m>=68) return '市場還在成長，機會比人多。<br>';
  return '市場熱度回穩，好位子要靠實力和人脈搶。<br>';
}
function burnWord(){
  if(S.burn>=90) return '你的身體已經在抗議了，只是你還沒聽。';
  if(S.burn>=80) return '你已經很久沒有睡飽了。';
  if(S.burn>=60) return '你最近常在通勤時發呆。';
  if(S.burn>=40) return '有點累，但還撐得住。';
  if(S.burn>=20) return '節奏還算正常。';
  return '你這陣子過得不錯。';
}

    /* 海外工作（item 5）：英文＋台灣產業經驗是門票；移民與各國法規決定路順不順 */
    if(!S.abroad && S.inESG && !isFreelance() && S.en>=8 && S.esgYrs>=4 && S.dom>=8 && rnd()<0.22)
      opts.push({k:'goabroad',l:'一個海外的職缺找上你',h:'薪水翻倍、簽證未知。你在台灣'+S.domName+'累積的經驗，是他們要的'});
    opts.push({k:'quitblind',l:'裸辭',h:'壓力歸零，存款和起薪都要付代價'});
    if(S.age<=34 && S.workYrs>=2 && !S.studied) opts.push({k:'study',l:'辭職出國念研究所',h:'兩年，學費不便宜；可申請獎學金。用在地年資換英文與視野'});
    if(S.burn>=25) opts.push({k:'rest',l:(S.burn>=70?'⚠ 該停了：請長假把自己修好':'請長假，把自己修好'),h:'體力大幅回復，年度考評會難看一點——但你不會垮'});
    opts.push({k:'stay',l:'再做一年',h:''});
  }
  S._certOffer=certOffer;
  const pn=S.projNote; S.projNote='';
  const pb=pendingBlock();
  shell(header()+`<div class="panel panel-pad fade">
    ${pb}<span class="eyebrow">${S.year} 年末 ・ 結算</span>
    <h2 class="card-title">又一年過去了。</h2>
    <div class="card-body">
      ${pn?pn+'<br><br>':''}
      ${events.length?events.join('<br>')+'<br><br>':''}
      ${eraWord()}${burnWord()}${S.health?' 你的健檢報告上有幾行紅字。':''}
      ${S.inESG?'':' 你還沒有做永續，但年資在累積。'}
    </div>
    <div class="opts">${opts.map(o=>`<button class="opt" onclick="yePick('${o.k}')"><span class="lab">${o.l}</span>${o.h?`<span class="hint">${o.h}</span>`:''}</button>`).join('')}</div>
  </div>`);
}

  }
  if(k==='cert'){
    const c=S._certOffer; S.cash=Math.round(S.cash-c.cost); S.certs.push(c.id); S[c.stat]+=c.gain;
    const fit = c.tw ? 1 : (c.fit && S.emp && c.fit.includes(S.emp.ind) ? 1 : (c.fit? (rnd()<.4?.4:0) : 1));
    const eff = c.pay * fit;
    S.pay = Math.round(S.pay*(1+eff));
    d=[[({E:'環境力',S:'社會力',G:'治理力',D:'揭露力'})[c.stat], c.gain],['存款',-c.cost]];
    if(eff>0) d.push(['年薪','+'+Math.round(eff*100)+'%']);
    if(c.tw) txt=`你考過了。<strong>${c.n}</strong>。<br><br>履歷上多了一行，HR 看得懂、會勾選。加薪幅度不大——大家都有的時候，它就不是差異化了。`;
    else if(fit===1) txt=`你考過了。<strong>${c.n}</strong>。<br><br>難，而且貴。但你剛好在用得上它的位子上——下一次調薪，主管拿它當理由。`;
    else if(fit>0) txt=`你考過了。<strong>${c.n}</strong>。<br><br>花了 ${c.cost} 萬和三個月的晚上。跟你現在的工作只沾得上一點邊，但至少你懂了那套語言。`;
    else txt=`你考過了。<strong>${c.n}</strong>。<br><br>花了 ${c.cost} 萬和三個月的晚上。<em>然後它就躺在抽屜裡</em>——公司只要你把去年的報告書更新一下。`;
    return showOutcome(txt,d,()=>nextYear());
  }
  if(k==='quitblind'||k==='jobless'){
    S.quitFlag=0; S.jobless=1; S.burn=Math.max(0,S.burn-45); S.cash=Math.round(S.cash-S.pay*0.25);
    S.emp=null; S.inESG=S.inESG;
    S.ledger.push({y:S.year,t:'離職。沒有下一份工作。',p:''});
    return showOutcome('你遞了辭呈。<br><br>接下來幾個月，你第一次在平日下午出門散步。也第一次在半夜醒來想著存款還夠撐多久。',
      [['壓力','-45']], ()=>{S.year++;S.age++; if(S.age>=40)return ending(); rehire()});
  }
  if(k==='findnow'){ S.quitFlag=0; S.emp=null; S.year++; S.age++; if(S.age>=40) return ending(); return rehire() }
  if(k==='study'){
    S.quitFlag=0; S.studied=1; S.emp=null; S.jobless=0;
    let cost = 80 + ri(0,25);
    if(S.cash < cost){ cost = Math.round(cost*0.72); }   // 半工半讀、申請補助，代價是更累
    /* 獎學金（item 5）：學海飛颺等官方獎助——名目上最高 30 萬，多數人實拿 8–13 萬 */
    let sch = 0;
    if(rnd() < 0.32 + (S.en>=6?0.10:0) + S.luck*0.008){
      sch = rnd()<0.12 ? 30 : 8+ri(0,5);
      S.scholarship = sch; cost = Math.max(20, cost - sch);
      if(!S.traits.includes('拿過獎學金')) S.traits.push('拿過獎學金');
    }
    S.cash = Math.round(S.cash - cost); S.en += 5; S.E+=4; S.S+=4; S.G+=4; S.D+=4; S.rel += 2;
    S.burn = Math.max(0, S.burn-35) + (S.cash<0?12:0);
    S.year += 2; S.age += 2; S.workYrs += 2;
    if(!S.traits.includes('海外碩士')) S.traits.push('海外碩士');
    S.ledger.push({y:S.year,t:'辭職出國念書，兩年後回來'+(sch?'（獲獎學金 '+sch+' 萬）':''),p:'',mark:1});
    const schTxt = sch ? (sch>=30
      ? `<br><br>你申請到了整包的官方獎學金——<strong>${sch} 萬</strong>，等於少扛半年的生活費。寫申請書那幾個晚上，值了。`
      : `<br><br>你申請到了 <strong>${sch} 萬</strong>的獎學金。不夠付學費，但夠付幾個月的房租——出國這種事，每一筆都算。`) : '';
    const txt = (S.cash<0
      ? `你把工作辭了，飛出去念書。<br><br>學費加生活費 ${cost} 萬，存款見底還借了一些。兩年後你帶著一張文憑、變好的英文，和<em>零在地年資</em>回到台灣。`
      : `你把工作辭了，飛出去念書。<br><br>兩年，花了 ${cost} 萬。回來時你的英文變好了、看事情的角度變寬了，但台灣的法規和人脈都往前跑了兩年。`) + schTxt;
    if(S.age>=40) return ending();
    return showOutcome(txt, sch?[['英文',5],['獎學金','+'+sch+' 萬'],['存款',-cost],['壓力',-35]]:[['英文',5],['存款',-cost],['壓力',-35]], ()=>rehire());
  }
  if(k==='hunt' || k==='poach'){
    S._offers = genOffers(k); S._otype = k;
    if(!S._offers.length) return nextYear();
    return offerScreen();
  }
  if(k==='switch'){
    S.inESG=true; S.esgYrs=Math.min(S.esgYrs, 1);
    S.level = Math.max(0, S.level - 1);   // 回鍋退一階，不是砍到底
    const bonus=Math.min(.35,(S.workYrs)*.05);
    S.pay=Math.round(LEVELS[0].base*(IND[S.emp.ind]?IND[S.emp.ind].c:1)*S.emp.mult*(.85+mk(S.year)[1]/250)*(1+bonus));
    if(!S.traits.includes('本行加值')) S.traits.push('本行加值');
    let carryMsg='', carryD=[['年薪',S.pay],['產業專業','保留']];
    const cy = S.prevJob && CARRY[S.prevJob];
    if(cy && !S.carried){
      S.carried=1;
      S.E+=cy.E; S.S+=cy.S; S.G+=cy.G; S.D+=cy.D;
      if(!S.traits.includes(cy.t)) S.traits.push(cy.t);
      ['E','S','G','D'].forEach(function(k){ if(cy[k]) carryD.push([({E:'環境力',S:'社會力',G:'治理力',D:'揭露力'})[k], cy[k]]) });
      carryMsg = '<br><br>' + cy.m;
    }
    S.ledger.push({y:S.year,t:'內部轉調，開始做永續',p:S.pay,mark:1});
    return showOutcome(`你舉手了。<br><br>職稱換成永續專員，年薪 <strong>${S.pay} 萬</strong>——比純新鮮人高，因為你的 ${S.workYrs} 年本業年資是有價的。<em>換領域不是從零開始。</em>${carryMsg}`,
      carryD,()=>nextYear());
  }
}

/* ===== 產生工作機會清單 =====
   可及範圍由綜合戰力決定；關係力高時，有機會拿到原本搆不到的位子 */
function offerPay(emp, type){
  if(type==='poach') return Math.round(S.pay*(1.10+rnd()*0.11));
  return Math.round(calcPay(emp, S.level)*(1.06+rnd()*0.10));
}
function genOffers(type){
  const base = EMP.filter(function(e){ return !S.emp || e.id!==S.emp.id });
  const reach = cw() + 8 + Math.floor(S.luck*0.6);
  let pool = base.filter(function(e){
    if(e.bar > reach) return false;
    if(ELITE.indexOf(e.id)>=0) return S.rel>=9 || mk(S.year)[1]>=78;   // 頂尖公司始終要人脈或熱市場
    return true;
  });
  if(type==='poach' && S.emp){
    const same = pool.filter(function(e){ return e.ind===S.emp.ind });
    if(same.length) pool = same;
  }
  if(!pool.length) pool = base.filter(function(e){ return e.bar <= 30 });
  const n = Math.min(pool.length, S.rel>=10 ? 3 : 2);
  const chosen = [];
  const work = pool.slice();
  while(chosen.length < n && work.length){
    chosen.push(work.splice(Math.floor(rnd()*work.length),1)[0]);
  }
  const list = chosen.map(function(e){ return {emp:e, np:offerPay(e,type), lucky:false} });
  /* 關係力帶來的意外機會：超出目前能力範圍的位子 */
  if(S.rel>=11 && rnd() < 0.14 + S.rel*0.018){
    const up = base.filter(function(e){ return e.bar > reach && e.bar <= reach+24 });
    if(up.length){
      const lucky = up[Math.floor(rnd()*up.length)];
      list.unshift({emp:lucky, np:Math.round(offerPay(lucky,'hunt')*1.06), lucky:true});
    }
  }
  return list;
}
function offerScreen(){
  const type=S._otype, list=S._offers;
  const rows = list.map(function(of,i){
    const e=of.emp, cross = S.emp && e.ind!==S.emp.ind;
    return `<button class="opt" onclick="takeOffer(1,${i})">
      <span class="lab">${e.n}${of.lucky?' <span class="tag">意外的機會</span>':''}</span>
      <span class="hint">${empMeta(e)}　年薪 <b>${of.np} 萬</b>${cross?'　跨產業，專業折損四成':'　同產業，專業完整帶走'}<br>${e.f}</span>
    </button>`;
  }).join('');
  const luckyNote = list.some(function(x){return x.lucky})
    ? '<br><br><em>其中一個位子，照你現在的資歷本來排不上。是有人在裡面替你說了話。</em>' : '';
  shell(header()+`<div class="panel panel-pad fade">
    <span class="eyebrow">${type==='hunt'?'獵頭帶來的選項':'同業來挖你'}</span>
    <h2 class="card-title">有 ${list.length} 個位子在等你回覆。</h2>
    <div class="card-body" style="font-size:15px">
      你現在年薪 ${S.pay} 萬。能談到什麼樣的位子，看你這些年累積了什麼。${luckyNote}
      ${type==='poach'?'<br><br>人資都補了同一句：「不過我們要簽兩年競業條款。」':''}
    </div>
    <div class="opts">
      ${rows}
      ${type==='poach'?'<button class="opt" onclick="takeOffer(2,0)"><span class="lab">談掉競業條款再去</span><span class="hint">加薪打折，換自由</span></button>':''}
      <button class="opt" onclick="takeOffer(0,0)"><span class="lab">全部婉拒，留在原地</span></button>
    </div>
  </div>`);
}
function takeOffer(v, idx){
  const type=S._otype;
  const of = S._offers[idx||0];
  const emp = of.emp, np = of.np;
  if(!v){
    if(type==='poach'){ S.pay=Math.round(S.pay*1.07);
      return showOutcome('你留下來了。公司加了薪留你——你知道這是那通電話換來的。',[['年薪','+7%']],()=>nextYear()) }
    return showOutcome('你回了信說最近走不開，留了聯絡方式。<br><br>獵頭說：「有需要隨時找我。」',[['關係力',1]],()=>{S.rel=Math.min(20,S.rel+1);nextYear()});
  }
  const cross = S.emp && emp.ind!==S.emp.ind;
  if(cross){ S.dom=Math.round(S.dom*0.6); S.domName=IND[emp.ind].n }
  else { S.dom+=2 }
  S.pay = v===2 ? Math.round(np*0.88) : np;
  if(S.bond>0){ const fine=Math.round(4*S.bond); S.cash=Math.round(S.cash-fine); S.bondFine=fine; S.bond=0 }
  const leftOrange = S.emp && S.emp.quitStress;   // 橘色所：離職會有壓力
  /* 四大的職級到了企業端常常接不過去（item 6）：
     顧問經理≠企業經理，除非去的是中後段／小公司。 */
  let b4Drop = 0;
  if(S.emp && S.emp.big4 && S.level>=2 && emp.tier!=='中後段' && !emp.big4){
    if(rnd() < 0.72){ b4Drop = 1; S.level = Math.max(1, S.level-1); }
  }
  S.emp=emp; S.inESG=true; S.freelance=0; S.burn=Math.max(0,S.burn-8);
  if(leftOrange){ S.burn=Math.min(100,S.burn+12); if(!S.traits.includes('離開橘色所')) S.traits.push('離開橘色所'); }
  if(v===1&&type==='poach'){ S.compete=2 }
  if(of.lucky && !S.traits.includes('被人拉了一把')) S.traits.push('被人拉了一把');
  S.ledger.push({y:S.year,t:`跳槽到 ${emp.n}`,p:S.pay,mark:1});
  const fineTxt = (S.bondFine ? `<br><br>你還沒跑完服務約，賠了 <strong>${S.bondFine} 萬</strong>違約金。公司出的那筆訓練費，最後還是你自己付了。` : '')
    + (b4Drop ? `<br><br><em>不過職級沒有接過去</em>——你在事務所是${LEVELS[S.level+1].t}，到了企業端從 <strong>${LEVELS[S.level].t}</strong> 開始。顧問的經理和企業的經理，管的不是同一件事。` : '');
  S.bondFine=0;
  showOutcome((v===2
      ? `你談掉了競業條款，加薪也打了折。<br><br>年薪 <strong>${S.pay} 萬</strong>。你留住了自由。`
      : `你到職了。<br><br>年薪 <strong>${S.pay} 萬</strong>。${type==='poach'?'接下來兩年，你哪裡都不能去。':''}`)+fineTxt,
    [['年薪',S.pay]],()=>nextYear());
}
function rehireReach(){
  return cw() + 6 + Math.floor(S.luck*0.5) - Math.round(S.jobless*7);
}
function rehireOffers(){
  const m = mk(S.year)[1], reach = rehireReach();
  let pool = EMP.filter(function(e){
    if(e.bar > reach) return false;
    if(ELITE.indexOf(e.id) >= 0) return S.rel>=9 || m>=78;
    if(S.emp && e.id===S.emp.id) return false;
    return true;
  });
  /* 市場冷、空窗久、履歷不夠硬 —— 有時候就是一個回音都沒有 */
  const callback = 0.38 + m/150 + S.rel*0.022 + S.luck*0.010 - S.jobless*0.075 - entryPenalty(S.year);
  if(rnd() > callback) return [];
  const n = Math.min(pool.length, m>=70 ? 3 : 2);
  const out = [], work = pool.slice();
  for(let i=0;i<n && work.length;i++){
    out.push(work.splice(Math.floor(rnd()*work.length),1)[0]);
  }
  return out;
}
function rehire(){
  const m = mk(S.year)[1];
  S._penalty = 1 - Math.min(.15, S.jobless*.05) - entryPenalty(S.year)*0.5;
  S._rehire = rehireOffers();
  const rows = S._rehire.map(function(e,i){
    const est = Math.round(calcPay(e, S.level) * S._penalty);
    return '<button class="opt" onclick="rehirePick(\'take\','+i+')"><span class="lab">'+e.n+'</span>'
      + '<span class="hint">'+empMeta(e)+'　年薪約 <b>'+est+' 萬</b><br>'+e.f+'</span></button>';
  }).join('');
  let lead;
  if(!S._rehire.length){
    lead = S.jobless>=2
      ? '<em>又是一年，一個面試都沒有。</em>投出去的履歷像丟進海裡。你開始懷疑自己是不是離開太久了。'
      : '你投了三十幾封，回信的只有兩家，聊完就沒有下文。<em>這一年，市場沒有你的位子。</em>';
  } else if(S.jobless>=2){
    lead = '空窗第 '+S.jobless+' 年。面試時每個人都會問：「這段時間你在做什麼？」你已經有一套講法了。';
  } else {
    lead = '休息了一陣子，該回去了。你把履歷更新到最新的版本。';
  }
  const opts = rows
    + '<button class="opt" onclick="rehirePick(\'wait\',0)"><span class="lab">再撐一年，繼續找</span>'
    + '<span class="hint">存款會少一截，起薪也會再打折</span></button>'
    + '<button class="opt" onclick="rehirePick(\'free\',0)"><span class="lab">開始接案</span>'
    + '<span class="hint">收入不穩，時間自己掌握。人脈決定你接不接得到</span></button>'
    + '<button class="opt" onclick="rehirePick(\'give\',0)"><span class="lab">先找份非永續的工作</span>'
    + '<span class="hint">永續年資停住，但至少有收入</span></button>';
  shell(header()+'<div class="panel panel-pad fade">'
    + '<span class="eyebrow">空窗期 ・ 市場熱度 '+m+'</span>'
    + '<h2 class="card-title">'+(S._rehire.length?'你在找下一份工作。':'沒有人回你。')+'</h2>'
    + '<div class="card-body">'+lead+'</div>'
    + '<div class="opts">'+opts+'</div></div>');
}
function rehirePick(k, idx){
  const m = mk(S.year)[1];
  if(k==='wait'){
    S.jobless++;
    S.cash = Math.round(S.cash - S.pay*0.22);
    S.burn = Math.max(0, S.burn - 6);
    S.year++; S.age++;
    if(S.age>=40) return ending();
    return rehire();
  }
  if(k==='give'){
    const d = pick(DETOUR);
    S.emp = {id:d.id,n:d.n,ind:d.ind,tier:'中後段',mult:d.mult,bar:0,burn:1.0,pre:5,f:d.f};
    S.inESG=false; S.jobless=0; S.prevJob=d.id;
    S.pay = Math.round(LEVELS[0].base*(IND[d.ind]?IND[d.ind].c:1)*d.mult*(.85+m/280)*(1+Math.min(.35,S.workYrs*.04)));
    S.domName = IND[d.ind].n; S.dom += 4;
    S.ledger.push({y:S.year,t:'轉去 '+d.n+'（非永續）',p:S.pay,mark:1});
    return showOutcome('你去了 <strong>'+d.n+'</strong>。'+d.f
      + '<br><br>年薪 '+S.pay+' 萬。永續年資停在這裡了——<em>但你沒有真的離開，只是先去別的地方等</em>。',
      [['年薪',S.pay]], function(){ nextYear() });
  }
  if(k==='free'){
    S.freelance=1; S.inESG=true; S.jobless=0;
    S.emp={id:'free',n:'自己接案',ind:'cons',tier:'自僱',mult:.9,bar:0,burn:.8,pre:5,f:'沒有年終，沒有勞健保補助，但也沒有人管你幾點下班。'};
    const seniority = 1 + Math.min(.55, S.esgYrs*.045) + Math.min(.30, S.rel*.018);
    S.pay=Math.round(LEVELS[Math.max(0,S.level)].base*.95*seniority*(0.85+rnd()*0.45));
    S.ledger.push({y:S.year,t:'開始接案',p:S.pay,mark:1});
    return showOutcome('你開始接案。<br><br>第一年年薪 <strong>'+S.pay+' 萬</strong>——接得到就有，接不到就沒有。<br><br>'
      + (S.rel>=12?'還好這些年認識的人夠多，案子沒斷過。':'你發現，接不接得到案，跟你認識多少人有關。'),
      [['年薪',S.pay]], function(){ nextYear() });
  }
  const emp = S._rehire[idx||0];
  S.emp=emp; S.inESG=true; S.freelance=0; S.jobless=0;
  S.pay=Math.round(calcPay(emp,S.level)*S._penalty*(S.traits.includes('海外碩士')&&!S.readjusted?0.95:1));
  if(S.traits.includes('海外碩士')&&!S.readjusted) S.readjusted=1;
  S.burn=Math.max(0,S.burn-5);
  S.ledger.push({y:S.year,t:'重新入職 '+emp.n,p:S.pay,mark:1});
  showOutcome('<strong>'+emp.n+'</strong>（'+IND[emp.ind].n+'・'+emp.tier+'）<br>'+emp.f
    + '<br><br>年薪 <strong>'+S.pay+' 萬</strong>。'+(S._penalty<1?'空窗讓起薪打了一點折，但你回來了。':''),
    [['年薪',S.pay]], function(){ nextYear() });
}

/* ============ 結局 ============ */
function goalMet(){
  const g=S.goal.id;
  if(g==='cso') return S.level>=4;
  if(g==='money') return S.pay>=200;
  if(g==='impact') return S.co2>=6;
  if(g==='found') return !!(S.foundFlag || (S.freelance && S.freeYrs>=3));
  if(g==='human') return S.burn<=28 && S.pay>=110 && !S.health;
  if(g==='intl') return !!(S.intlFlag || (S.emp&&S.emp.intl) || (S.intlYrs||0)>=3
      || (S.abroadYrs||0)>=2 || (S.en>=14&&S.traits.includes('海外碩士')&&(S.intlYrs||0)>=1));
  return false;
}

/* ===== 結語：這世界因為你而改變了多少（使用者需求 item 6）=====
   把三個影響力指標（實質減碳 co2／社會影響力 soc／號召 adv）＋公司 ESG 拉抬（esgLift）
   收斂成一段有理想性的結語。刻意不用分數呈現——這一段講的是意義，不是績效。 */
function legacyBlock(){
  const co2=S.co2||0, soc=S.soc||0, adv=S.adv||0, lift=Math.round(S.esgLift||0);
  const score = co2*2 + soc*1.5 + adv*1.5 + lift*0.6;
  const lines=[];

  if(co2>=8) lines.push('你真的把碳減下來了。不是報告書上的數字，是實際少排出去的那些——沒有人幫你辦頒獎典禮，但那些噸數是真的。');
  else if(co2>=4) lines.push('你減下了一些碳。不多，但每一噸都經得起查。');
  else if(co2<=-3) lines.push('回頭看，你有幾次把數字弄得比實際好看。沒有一次違法，每一次都有說得過去的理由——只是加起來，你自己知道那是什麼。');
  else lines.push('你在這個行業做了很多事。認真算的話，實際減下來的碳沒有你當初想像的多——這不完全是你的錯，這個行業有很長一段時間，要的就是把數字寫好看。');

  if(soc>=8) lines.push('你把「人」放回了這件事的中心：供應鏈裡的移工、被裁掉的同事、說不出話的社區。這些沒有指標可以量，但有人的生活因此不一樣。');
  else if(soc>=4) lines.push('你在社會面留下了一些東西——一套制度、一次稽核、一個真的被修好的申訴管道。');

  if(adv>=10) lines.push('而你帶進來的人，比你自己做的還多。你寫的東西、你回過的訊息、你陪著走過的後輩——<em>這個行業的下一棒，有一部分是你遞出去的</em>。');
  else if(adv>=5) lines.push('你影響了一些人。有人因為你的一句話轉了行，有人因為你的文章知道這條路存在。');

  if(lift>=12) lines.push('你待過的公司，因為你在裡面，評分和制度都往上走了一階。那不是你的名字，但那是你的手筆。');

  const verdict = score>=34
    ? '如果把你這二十二年攤開來看：<strong>這個世界因為你，確實有一點點不一樣了。</strong><br>不是因為你拿了什麼獎，是因為那些數字、那些人、那些制度，真的動了。'
    : score>=16
    ? '如果把你這二十二年攤開來看：<strong>你推動的事情不算驚天動地，但它們是真的。</strong><br>這個行業大部分的進展，本來就是靠這樣一點一點累積起來的。'
    : '如果把你這二十二年攤開來看：<strong>你留下的痕跡沒有你希望的那麼深。</strong><br>但你走過了——很多人連走都沒走。';

  return '<hr class="rule"><span class="eyebrow">這個世界，因為你改變了多少</span>'
    + '<div class="outcome" style="margin-top:12px">'
    + lines.map(function(x){ return '<p style="margin:0 0 10px">'+x+'</p>' }).join('')
    + '<p style="margin:14px 0 0">'+verdict+'</p>'
    + '<p style="margin:14px 0 0;color:var(--ink-3);font-size:14.5px">'
    + '這一行從來不是靠一個人改變世界的。它靠的是<em>很多個在四十歲那年還沒放棄的人</em>——而你是其中一個。</p>'
    + '</div>';
}

function resultSummary(){
  return `永續人森模擬器 ${GAME_VERSION} — ${playerRef()}（${S.mbti||'—'}）／${S.startYear} 入學／${S.goal.n} ${goalMet()?'達成':'未達成'}${S.endedEarly?'／提早結束:'+S.earlyTitle:''}／年薪 ${S.pay} 萬／${S.inESG?LEVELS[S.level].t:'非永續職'}／永續年資 ${S.esgYrs} 年／E${S.E} S${S.S} G${S.G} D${S.D}／減碳${S.co2} 社會${S.soc||0} 號召${S.adv||0}／SEED ${S.seed.toString(36).toUpperCase()}`;
}
/* ===== 結果回傳（item 13, 19）=====
   玩到結局「當下」就立刻記錄名字＋MBTI＋結果（不必等玩家離開、不必按鈕）。
   之後玩家若有寫回饋並按送出，才會再送一列含回饋。 */
function formActionUrl(){ return FEEDBACK_FORM.base.replace('/viewform','/formResponse'); }
function buildFormBody(includeFb){
  const f=FEEDBACK_FORM.fields, body=new URLSearchParams();
  if(FEEDBACK_FORM.extra) body.append(FEEDBACK_FORM.extra, '（遊戲自動回傳）');
  body.append(f.name, playerRef());
  body.append(f.mbti, S.mbti||'');
  body.append(f.result, resultSummary());
  if(includeFb){
    const t=(document.getElementById('fbText')||{}).value||'';
    const mail=(document.getElementById('fbMail')||{}).value||'';
    if(t) body.append(f.feedback, t);
    if(mail) body.append(f.email, mail);
  }
  return body;
}
function recordResult(includeFb){
  if(!FEEDBACK_FORM.CONFIGURED) return Promise.resolve();
  if(typeof fetch!=='function' || typeof URLSearchParams!=='function') return Promise.resolve();
  return fetch(formActionUrl(),{method:'POST',mode:'no-cors',keepalive:true,body:buildFormBody(includeFb)}).catch(function(){});
}
/* 遊戲結束當下自動記錄結果（每局一次） */
function autoRecordResult(){
  if(S._recorded) return; S._recorded = true;
  recordResult(false);
}
function submitFeedback(el){
  const t = (document.getElementById('fbText')||{}).value || '';
  const mail = (document.getElementById('fbMail')||{}).value || '';
  if(FEEDBACK_FORM.CONFIGURED){
    if(el){ el.disabled=true; el.textContent='送出中…'; }
    // 結果已在結局自動記錄；這裡只在「有寫東西」時補送一列含回饋
    const p = (t||mail) ? recordResult(true) : Promise.resolve();
    p.then(function(){ if(el) el.textContent='已送出，謝謝你！🌱'; });
  } else {
    const txt = resultSummary() + '\n\n回饋：' + t + (mail?('\nEmail：'+mail):'');
    if(navigator.clipboard) navigator.clipboard.writeText(txt);
    if(el) el.textContent='已複製回饋，貼給開發者即可';
  }
}
/* 產生一張結果圖，複製到剪貼簿（item 13） */
function copyResultImg(el){
  try{

    const bg=dark?'#15232A':'#FBFCFC', ink=dark?'#E3EAEA':'#15252B', sub=dark?'#A2B2B6':'#4B5D64', acc=dark?'#D6A342':'#8F6410', line=dark?'#293941':'#D1D9DA';
    x.fillStyle=bg; x.fillRect(0,0,W,H);
    x.fillStyle=acc; x.fillRect(70,70,86,44); x.fillStyle=bg; x.font='700 26px sans-serif'; x.textBaseline='middle'; x.fillText('Daz',86,93);

    x.fillStyle=sub; x.font='400 24px sans-serif'; x.fillText(playerRef()+(S.mbti?'　'+S.mbti:'')+'　'+S.startYear+' 入學 → '+S.year+'（四十歲）',72,170);
    x.strokeStyle=ink; x.lineWidth=3; x.beginPath(); x.moveTo(72,195); x.lineTo(W-72,195); x.stroke();
    x.fillStyle=goalMet()?acc:sub; x.font='700 40px "Noto Serif TC",serif';
    x.fillText(S.goal.n+'　'+(goalMet()?'達成':'未達成'),72,265);
    // 大數字
    const cells=[['年薪',S.pay+' 萬'],['職位',S.inESG?LEVELS[S.level].t:'非永續職'],['永續年資',S.esgYrs+' 年'],
      ['綜合戰力',String(cw())],['實質減碳',String(S.co2)],['存款',S.cash+' 萬']];
    let cx=72, cy=320, cwid=(W-144)/3;
    cells.forEach(function(c,i){
      const col=i%3, row=Math.floor(i/3);
      const px=72+col*cwid, py=cy+row*150;
      x.strokeStyle=line; x.lineWidth=1; x.strokeRect(px,py,cwid-14,132);
      x.fillStyle=sub; x.font='400 20px sans-serif'; x.fillText(c[0],px+18,py+42);
      x.fillStyle=ink; x.font='700 40px "Noto Serif TC",serif'; x.fillText(c[1],px+18,py+96);
    });
    // 能力條
    let by=660; x.fillStyle=sub; x.font='400 22px sans-serif'; x.fillText('能力分布',72,by);
    const bars=[['環境 E',S.E],['社會 S',S.S],['治理 G',S.G],['揭露 D',S.D]];
    bars.forEach(function(b,i){
      const py=by+34+i*54;
      x.fillStyle=sub; x.font='400 22px sans-serif'; x.fillText(b[0],72,py+22);
      x.fillStyle=line; x.fillRect(230,py,W-320,26);
      x.fillStyle=acc; x.fillRect(230,py,(W-320)*Math.min(1,b[1]/60),26);
      x.fillStyle=ink; x.font='600 22px sans-serif'; x.fillText(String(b[1]),W-78,py+22);
    });
    // 特質
    let ty=940; x.fillStyle=sub; x.font='400 22px sans-serif'; x.fillText('你成為了什麼樣的人',72,ty);
    x.font='400 24px sans-serif'; let tx=72; ty+=44;
    (S.traits.slice(0,14)).forEach(function(t){
      const w=x.measureText(t).width+34;
      if(tx+w>W-72){ tx=72; ty+=52 }
      x.strokeStyle=acc; x.strokeRect(tx,ty-26,w,38); x.fillStyle=acc; x.fillText(t,tx+17,ty);
      tx+=w+12;
    });
    x.fillStyle=sub; x.font='400 20px sans-serif';
    x.fillText('SEED '+S.seed.toString(36).toUpperCase()+'　・　sustalent　・　linkedin.com/in/dazyin',72,H-52);
    cv.toBlob(function(blob){
      if(navigator.clipboard && window.ClipboardItem){
        navigator.clipboard.write([new ClipboardItem({'image/png':blob})]).then(function(){
          if(el) el.textContent='已複製結果圖';
        }).catch(function(){ imgFallback(cv, el) });
      } else { imgFallback(cv, el) }
    },'image/png');
  }catch(e){ if(el) el.textContent='此瀏覽器不支援，改用結果文字'; }
}
function imgFallback(cv, el){
  // 不能寫剪貼簿時，開新分頁讓玩家自己長按／右鍵存圖
  try{ const w=window.open(); if(w){ w.document.write('<img src="'+cv.toDataURL('image/png')+'" style="max-width:100%">'); } if(el) el.textContent='已開圖，長按或右鍵存圖'; }
  catch(e){ if(el) el.textContent='請改用「複製結果文字」'; }
}
function copySeed(el){
  if(navigator.clipboard) navigator.clipboard.writeText(resultSummary());
  if(el) el.textContent='已複製結果文字';
}

function askRestart(){
  if(!S || S.phase==='setup'){ return startSetup() }
  const box=document.getElementById('app');
  if(document.getElementById('rsConfirm')) return;
  const d=document.createElement('div');
  d.id='rsConfirm';
  d.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:99;padding:20px';
  d.innerHTML='<div class="panel panel-pad" style="max-width:380px"><h3 style="font-family:\'Noto Serif TC\',serif;font-size:19px;margin:0 0 10px">要重新開始嗎？</h3>'
    +'<p class="note" style="margin:0 0 16px">目前這局會消失，換一個開局年份、一所新的學校、一組新的運氣。</p>'
    +'<div style="display:flex;gap:9px"><button class="btn" onclick="doRestart()">重新開始</button>'
    +'<button class="btn ghost" onclick="closeRestart()">繼續這局</button></div></div>';
  d.addEventListener('click',function(ev){ if(ev.target===d) closeRestart() });
  document.body.appendChild(d);
}
function closeRestart(){ const d=document.getElementById('rsConfirm'); if(d) d.remove() }
function doRestart(){ closeRestart(); startSetup() }

screenIntro();
</script>

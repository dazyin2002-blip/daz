body{

.wrap{max-width:1160px; margin:0 auto; padding:20px 18px 80px}

/* ---- masthead ---- */
.mast{display:flex; align-items:baseline; gap:14px; flex-wrap:wrap;

.mast h1{font-size:26px; font-weight:700; letter-spacing:.04em}
.mast .sub{font-size:12px; color:var(--ink-3); letter-spacing:.14em; text-transform:uppercase}
.mast .seed{margin-left:auto; font-size:11.5px; color:var(--ink-3); letter-spacing:.06em}

/* ---- layout ---- */
.stage{display:grid; grid-template-columns:1fr 330px; gap:26px; align-items:start}
@media (max-width:900px){ .stage{grid-template-columns:1fr; gap:20px} }

/* ---- panels ---- */
.panel{background:var(--surface); border:1px solid var(--line); border-radius:3px; box-shadow:var(--shadow)}
.panel-pad{padding:22px 24px}
@media (max-width:520px){ .panel-pad{padding:18px 16px} }

.eyebrow{font-size:11px; letter-spacing:.18em; text-transform:uppercase; color:var(--ink-3); font-weight:500}
.rule{height:1px; background:var(--line); border:0; margin:18px 0}

.strip{display:flex; align-items:center; gap:0; border:1px solid var(--line);
  border-radius:3px; overflow:hidden; margin-bottom:16px; background:var(--surface)}
.strip .cell{padding:9px 14px; border-right:1px solid var(--line); flex:0 0 auto}
.strip .cell:last-child{border-right:0; margin-left:auto}
.strip .k{font-size:10px; letter-spacing:.14em; text-transform:uppercase; color:var(--ink-3); display:block}
.strip .v{font-size:15px; font-weight:600}
@media (max-width:640px){ .strip{flex-wrap:wrap} .strip .cell{flex:1 1 33%; border-bottom:1px solid var(--line)} .strip .cell:last-child{margin-left:0} }

/* ---- card ---- */
.card-title{font-size:22px; font-weight:700; margin:6px 0 12px}
.card-body{font-size:16px; line-height:1.85; color:var(--ink)}
.card-body em{font-style:normal; background:var(--accent-wash); padding:0 3px; border-radius:2px}

.opts{display:flex; flex-direction:column; gap:9px; margin-top:20px}
.opt{display:block; width:100%; text-align:left; cursor:pointer;
  background:var(--surface-2); color:var(--ink); border:1px solid var(--line-2);
  border-radius:3px; padding:13px 16px; font:inherit; font-size:15px;

.opt:hover{background:var(--accent-wash); border-color:var(--accent)}
.opt:active{transform:translateY(1px)}
.opt:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
.opt .lab{font-weight:500}
.opt .hint{display:block; font-size:12.5px; color:var(--ink-3); margin-top:2px}

.btn{cursor:pointer; font:inherit; font-weight:500; border-radius:3px; padding:11px 22px;
  background:var(--ink); color:var(--ground); border:1px solid var(--ink); transition:opacity .13s}
.btn:hover{opacity:.86}
.btn:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
.btn.ghost{background:transparent; color:var(--ink); border-color:var(--line-2)}

/* ---- outcome ---- */
.outcome{margin-top:18px; padding:15px 18px; border-left:3px solid var(--accent);
  background:var(--accent-wash); font-family:"Noto Serif TC",Georgia,serif; font-size:16px; line-height:1.8}
.deltas{display:flex; flex-wrap:wrap; gap:7px; margin-top:13px}
.chip{font-size:11.5px; padding:2.5px 8px; border-radius:2px; border:1px solid var(--line-2);

.chip.up{color:var(--good); border-color:var(--good); background:var(--good-wash)}
.chip.down{color:var(--warn); border-color:var(--warn); background:var(--warn-wash)}

.stat .val{font-size:12.5px; font-weight:600; flex:0 0 26px; text-align:right}

.kv:last-child{border-bottom:0}
.kv .k{color:var(--ink-3)}
.kv .v{font-weight:600; text-align:right}

.lrow .yr{color:var(--ink-3); font-size:11px}
.lrow .ev{color:var(--ink-2); line-height:1.5; overflow-wrap:anywhere}
.lrow .pay{font-weight:600; white-space:nowrap}
.lrow.mark .ev{color:var(--ink); font-weight:500}

.restart{margin-left:12px; cursor:pointer; font:inherit; font-size:11.5px; letter-spacing:.04em;

.hud .h:last-child{border-right:0}

.hud .hv{font-size:14px; font-weight:600; font-family:"JetBrains Mono",monospace; font-variant-numeric:tabular-nums}

.meter{height:6px; background:var(--surface-3); border-radius:3px; overflow:hidden; margin-top:6px}

/* ---- setup grid ---- */
.grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(215px,1fr)); gap:11px; margin-top:16px}
.pick{cursor:pointer; text-align:left; background:var(--surface-2); border:1px solid var(--line-2);
  border-radius:3px; padding:15px 16px; font:inherit; color:var(--ink); transition:background .13s,border-color .13s}
.pick:hover{background:var(--accent-wash); border-color:var(--accent)}
.pick:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
.pick .t{font-weight:700; font-size:16px; font-family:"Noto Serif TC",serif}
.pick .d{font-size:12.5px; color:var(--ink-3); margin-top:5px; line-height:1.6}
.pick .m{font-size:11.5px; color:var(--accent); margin-top:7px; letter-spacing:.02em}

/* ---- ending ---- */
.verdict{font-family:"Noto Serif TC",Georgia,serif; font-size:19px; line-height:1.9; margin:0 0 4px}
.bigstat{display:grid; grid-template-columns:repeat(auto-fit,minmax(118px,1fr)); gap:1px;
  background:var(--line); border:1px solid var(--line); margin:20px 0}
.bigstat div{background:var(--surface); padding:14px 12px}
.bigstat .k{font-size:10.5px; letter-spacing:.13em; text-transform:uppercase; color:var(--ink-3)}
.bigstat .v{font-size:21px; font-weight:600; margin-top:3px}

.note{font-size:12.5px; color:var(--ink-3); line-height:1.7}
.tag{display:inline-block; font-size:10.5px; letter-spacing:.12em; text-transform:uppercase;

::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:var(--line-2); border-radius:5px}
::-webkit-scrollbar-track{background:transparent}

@media (prefers-reduced-motion:reduce){ *{transition:none !important; animation:none !important} }
.fade{animation:f .3s ease}
@keyframes f{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}

function aiLv(y){ if(y<2022) return 0; if(AI_ERA[y]) return AI_ERA[y].lvl; return y>2030?9:0 }
function aiNote(y){ return AI_ERA[y]?AI_ERA[y].n:'' }
/* 初階職缺被擠壓的程度：AI 成熟後逐年加重 */
function entryPenalty(y){ return Math.max(0,(aiLv(y)-4))*0.075 }

function trendOf(y){ const t = TREND[y] || (y>2035?'氣候調適與韌性需求持續上升。':''); const a=aiNote(y); return t + (a?'<br><span style="color:var(--ink-3)">AI ・ '+a+'</span>':''); }

/* ============ 狀態 ============ */
let S = null;
const app = document.getElementById('app');
const seedBox = document.getElementById('seedBox');

function cw(){ return S.E+S.S+S.G+S.D }

/* ============ 效果套用 ============ */
function apply(e, out){
  const d=[];
  const add=(k,v,lab)=>{ if(!v) return; d.push([lab||k, v]); };
  if(e.E){S.E+=e.E; add('E',e.E,'環境力')}
  if(e.S){S.S+=e.S; add('S',e.S,'社會力')}
  if(e.G){S.G+=e.G; add('G',e.G,'治理力')}
  if(e.D){S.D+=e.D; add('D',e.D,'揭露力')}
  if(e.rel){S.rel=Math.max(0,Math.min(20,S.rel+e.rel)); add('rel',e.rel,'關係力')}
  if(e.en){S.en+=e.en; add('en',e.en,'英文')}
  if(e.sp){S.sp+=e.sp}
  if(e.uni){S.uniScore=(S.uniScore||0)+e.uni}
  if(e.dom){S.dom=Math.max(0,S.dom+e.dom)}
  if(e.burn){S.burn=Math.max(0,Math.min(100,S.burn+e.burn)); if(e.burn<0) d.push(['喘了口氣',e.burn])}
  if(e.co2 && e.co2<0) S.gw=(S.gw||0)+1;   // 累積的漂綠紀錄
  if(e.co2){S.co2+=e.co2; if(e.co2>0) d.push(['實質減碳',e.co2]); else d.push(['實質減碳',e.co2])}
  if(e.cash){ const c=Math.round(e.cash); S.cash=Math.round(S.cash+c); add('cash',c,'存款(萬)') }
  if(e.pay){ S.pay=Math.round(S.pay*(1+e.pay)); d.push(['年薪', e.pay>0?'+'+Math.round(e.pay*100)+'%':Math.round(e.pay*100)+'%']) }
  if(e.risk){S.riskAcc+=e.risk}
  if(e.health){S.health++}
  if(e.hunt){S.hunt=2}
  if(e.quit){S.quitFlag=1}
  if(e.join){S.joinFlag=1}
  if(e.found){S.foundFlag=1}
  if(e.intl){S.intlFlag=1}
  if(e.gwrisk){ S.gw=(S.gw||0)+1 }
  if(e.bond){ S.bond=(S.bond||0)+e.bond; d.push(['服務約', e.bond+' 年']) }
  if(e.hunt2esg){
    const pool = EMP.filter(function(x){ return !x.big4 && x.ind!=='ngo' && ELITE.indexOf(x.id)<0 && x.bar<=cw()+14 });
    const emp = pool.length ? pool[Math.floor(rnd()*pool.length)] : EMP[0];
    const cy2 = S.prevJob && CARRY[S.prevJob];
    S.emp=emp; S.inESG=true; S.esgYrs=0; S.level=Math.max(0,S.level-1); S.domName=IND[emp.ind].n;
    S.pay = Math.round(calcPay(emp,0)*(1+Math.min(.35,S.workYrs*.05))*0.94);
    if(cy2 && !S.carried){
      S.carried=1; S.E+=cy2.E; S.S+=cy2.S; S.G+=cy2.G; S.D+=cy2.D;
      if(!S.traits.includes(cy2.t)) S.traits.push(cy2.t);
    }
    if(!S.traits.includes('本行加值')) S.traits.push('本行加值');
    d.push(['年薪', S.pay], ['轉入永續','✓']);
    out.extra = '你去了 <strong>'+emp.n+'</strong>，職稱是永續專員。降了一點薪，但你帶著'
              + S.workYrs + ' 年的本業經驗進來——' + (cy2 ? cy2.m : '這是別人沒有的底子。');
    S.ledger.push({y:S.year,t:'轉職進入 '+emp.n+'（永續）',p:S.pay,mark:1});
  }
  if(e.bizfail){
    S.freelance=0; S.freeYrs=0; S.foundFlag=0; S.emp=null; S.quitFlag=1;
    S.cash = Math.round(S.cash - 8);
    S.burn = Math.max(0, S.burn - 10);
    if(!S.traits.includes('收過攤')) S.traits.push('收過攤');
    d.push(['結束營業','—']);
    out.extra = '你把最後一個案子結清，寄了信給所有客戶，然後把公司的資料夾封存起來。'
              + '<br><br>失敗的不是能力，是現金流跟案源。這件事很多人做過，只是很少人講。';
    S.ledger.push({y:S.year,t:'結束接案／收掉公司',p:'',mark:1});
  }
  if(e.bigjob){
    if(S.luck + S.rel + ri(1,12) >= 26){
      const gain = Math.round(S.pay*0.9);
      S.cash += gain; S.pay = Math.round(S.pay*1.18);
      d.push(['入帳','+'+gain+' 萬'],['行情','+18%']);
      out.extra = '你交出去了，而且做得漂亮。這個案子成了你之後所有提案的代表作。';
      if(!S.traits.includes('接過大案')) S.traits.push('接過大案');
    } else {
      S.cash -= 12; S.burn += 12;
      d.push(['虧損','-12 萬']);
      out.extra = '交期沒守住，尾款被砍了三成。你學到一件事：<em>大案不是接不接得到，是撐不撐得住</em>。';
    }
  }
  if(e.backin){
    const emp = EMP[Math.floor(rnd()*EMP.length)];
    S.freelance=0; S.freeYrs=0; S.emp=emp; S.inESG=true;
    S.pay = Math.round(calcPay(emp, Math.max(1,S.level))*1.05);
    d.push(['年薪', S.pay]);
    out.extra = '你回到了受雇的世界。有勞健保、有年終，也有回不去的自由。';
    S.ledger.push({y:S.year,t:'結束接案，回任 '+emp.n,p:S.pay,mark:1});
  }
  if(e.crossjump){
    const fn = ['供應鏈永續','永續採購','人資與職安','轉型辦公室'][Math.floor(rnd()*4)];
    S.crossTitle = fn+'×ESG'; S.crossDesc='你把永續帶進了另一個職能，而不是留在永續部門裡。';
    if(!S.traits.includes(S.crossTitle)) S.traits.push(S.crossTitle);
    S.dom += 6; S.pay = Math.round(S.pay*1.10);
    d.push(['定位', S.crossTitle], ['年薪','+10%']);
    out.extra = '你轉到了'+fn+'。名片上沒有永續兩個字，但你做的還是同一件事——而且這次你有預算、有人、有決策權。';
  }
  if(e.luckroll){
    if(S.luck+ri(1,8)>=14){ S.rel+=2; S.pay=Math.round(S.pay*1.06); d.push(['運氣站在你這邊','+6% 年薪']) }
    else { S.burn+=12; d.push(['這次沒站在你這邊','+壓力']) }
  }
  if(e.relroll){
    if(S.rel+ri(1,8)>=13){ S.pay=Math.round(S.pay*.92); d.push(['轉調成功','-8% 年薪']); out.extra='人脈救了你一次。你換了個部門，薪水打了折，但沒有離開。' }
    else { S.quitFlag=1; S.cash+=25; d.push(['資遣費','+25 萬']); out.extra='你打了七通電話，沒有一個位子留給你。' }
  }
  if(e.payroll){
    if(S.rel+S.luck+ri(1,10)>=24){ S.pay=Math.round(S.pay*1.08); d.push(['談成了','+8% 年薪']); out.extra='主管沉默了三秒，說：「我幫你爭取。」下個月調薪令下來了。' }
    else { S.burn+=8; out.extra='主管說：「今年預算已經定了，明年再看看。」你點點頭走出會議室。' }
  }
  return d;
}

/* ============ 薪資 ============ */
function calcPay(emp, level){
  const ind = IND[emp.ind]||{c:1};
  const m = mk(S.year)[1];
  const tenureBonus = Math.min(.35, (S.workYrs - S.esgYrs) * .05);
  let p = LEVELS[level].base * ind.c * emp.mult * (.80 + m/250) * (1+tenureBonus);
  p *= (0.94 + rnd()*0.16);
  return Math.round(p);
}
function tryPromote(){
  if(!S.emp) return false;          // 收攤／離職當年沒有雇主，不做升遷判定
  const nxt = LEVELS[S.level+1];
  if(!nxt) return false;
  const n = nxt.need;
  if(cw()>=n.cw && S.esgYrs>=n.yr && (!n.G||S.G>=n.G) && (!n.rel||S.rel>=n.rel)){
    let pr = .42 + S.luck*.012 + S.rel*.010 + (S.level===3?.16:0);
    if(S.crossTitle) pr += .18;      // 本業 x 永續 = 不可取代
    if(isAdrift()) pr -= .22;        // 全方位但無定位
    if(rnd() < pr){
      S.level++; S.pay = Math.max(S.pay, calcPay(S.emp,S.level));
      return true;
    }
  }
  return false;
}

function uniPick(y,i){

  }
  if(o.e.cert){ S.certs.push(o.e.cert) }
  if(o.cert){ S.certs.push(o.cert) }
  const d = apply(o.e, out);
  S.ledger.push({y:S.year, t:`${u.t}：${o.l}`, p:''});
  S.year++; S.age++;
  if(o.e.grad){
    S.gradPath=o.e.grad;

    if(o.e.grad==='ovs'){ S.year+=1; S.age+=1; S.en+=5; S.E+=2;S.S+=2;S.G+=2;S.D+=2; S.cash-=60; S.uniScore=(S.uniScore||0)+16;

    showOutcome(r||'你做了決定。', d, ()=>screenJobHunt(), out.extra);

/* ============ 通用結果畫面 ============ */
function showOutcome(text, deltas, next, extra){
  const chips = (deltas||[]).map(([k,v])=>{
    const num = typeof v==='number';
    const up = num ? v>0 : String(v).startsWith('+');
    return `<span class="chip ${up?'up':'down'}">${k} ${num?(v>0?'+'+v:v):v}</span>`;
  }).join('');
  shell(`<div class="panel panel-pad fade">
    <div class="outcome">${text}${extra?'<br><br>'+extra:''}</div>
    ${chips?`<div class="deltas">${chips}</div>`:''}
    <div class="opts"><button class="btn" id="nx">繼續</button></div>
  </div>`);
  document.getElementById('nx').onclick = next;
}

const ELITE = ['gg','fa','tree','fbrand'];
function resumeScore(){ return cw() + (S.uniScore||0) + Math.floor(S.luck*0.4) }
function canReachEmp(e, m){
  const r = resumeScore();
  if(ELITE.indexOf(e.id) >= 0){
    if(r < e.bar + 2) return false;                  // 硬門檻：履歷要比一般人硬一截
    return (S.rel >= 7) || (m >= 78) || S.internOK;  // 還要有人內推、市場缺人、或實習卡到位
  }
  return r >= e.bar - 6;
}
function eliteBlockedNote(m){
  const blocked = EMP.filter(function(e){
    return ELITE.indexOf(e.id)>=0 && resumeScore() >= e.bar+2 && !(S.rel>=7 || m>=78 || S.internOK);
  });
  if(!blocked.length) return '';
  return '<br><br><em>你的條件其實搆得上 ' + blocked[0].n + ' 那一級的公司，但履歷投進去就沒有下文了。'
       + '那種位子多半是內部推薦先填掉的。</em>';
}
function gradOffers(){
  const m = mk(S.year)[1];
  const out = [];
  if(S.internOK){
    const cands = EMP.filter(function(e){ return e.bar<=46 && !e.big4 && ELITE.indexOf(e.id)<0 });
    if(cands.length) out.push({k:'intern', emp:pick(cands)});
  }
  if(rnd() < S.school.big4 + (m>=55?.12:0) + (S.uniScore||0)*0.005){
    out.push({k:'emp', emp:EMP.find(function(e){ return e.id==='big4' })});
  }
  const pool = EMP.filter(function(e){
    return !e.big4 && e.ind!=='ngo' && canReachEmp(e,m) && (!out.length || out.every(function(x){ return !x.emp || x.emp.id!==e.id }));
  });
  const work = pool.slice();
  let n = Math.min(work.length, m>=70 ? 3 : 2);
  while(n-- > 0 && work.length){
    out.push({k:'emp', emp: work.splice(Math.floor(rnd()*work.length),1)[0]});
  }
  if(S.en>=6) out.push({k:'emp', emp:EMP.find(function(e){ return e.id==='ngo' })});
  out.push({k:'detour'});
  return out;
}
function screenJobHunt(){

function doHunt(i){

  const emp = of.emp;

  S.ledger.push({y:S.year,t:'入職 '+emp.n+'・'+LEVELS[0].t,p:S.pay,mark:1});
  showOutcome('<strong>'+emp.n+'</strong>（'+IND[emp.ind].n+'・'+emp.tier+'）<br>'+emp.f
    + '<br><br>'+note+'年薪 <strong>'+S.pay+' 萬</strong>。',
    [['年薪',S.pay]], function(){ S.phase='career'; yearStart() });

function jobFlavor(m){
  if(m<20) return '你在 104 上搜「永續」，跳出來的多半是清潔隊和資源回收。<em>這個行業還沒開始</em>。有幾間大公司在找「CSR 專員」，掛在公關部底下。';
  if(m<40) return '報告書的需求撐起了第一批職缺。多數是「CSR 專員」，工作內容寫得含糊，面試官自己也說不太清楚要你做什麼。';
  if(m<60) return '職缺開始正式化了，「永續專員」「ESG 專員」的職稱出現在標題上。金融業也開始找人。';
  if(m<85) return '每個月有兩萬多個綠領職缺。<em>只要會做溫盤，履歷丟出去就有回音</em>。你的同學有人一年跳兩次。';
  return '市場最熱的時候。職缺多，競爭者也多——人人都想做 ESG。差異化靠的是技能組合，不是入行速度。';
}
/* ============ 年度循環 ============ */
function bigYear(y){ return [2014,2022,2024,2026,2030].indexOf(y)>=0 }
function yearStart(){
  if(S.age>=40) return ending();
  S.cardsLeft = bigYear(S.year) ? 3 : 2;
  S.yearUsed = {};          // 同一年不重複抽同一張卡
  // 公司命運事件
  const f = S.emp && S.emp.fortune ? FORTUNE[S.emp.fortune] : null;
  if(f && f.yrs.includes(S.year) && !S.used['F'+S.emp.fortune+S.year]){
    S.used['F'+S.emp.fortune+S.year]=1; S.cardsLeft++; return fortuneCard(f);
  }
  drawCard();
}
function eligible(c){
  if(S.yearUsed[c.id]) return false;          // 本年度已抽過
  if(isFreelance() && ORG_ONLY.indexOf(c.id)>=0) return false;   // 接案沒有同事與主管
  if(!isFreelance() && c.freeOnly) return false;                 // 接案專屬事件
  if(c.yr && !c.yr.includes(S.year)) return false;
  if(!c.yr && c.pool==='h') return false;
  if(S.used[c.id] && !c.rep) return false;
  if(c.cond){ try{ if(!c.cond(S)) return false }catch(e){ return false } }
  return true;
}
function drawCard(){
  if(S.cardsLeft<=0) return midYear();
  const pool = CARDS.filter(eligible);
  if(!pool.length){ return midYear() }
  S.cardsLeft--;
  let tot=0; pool.forEach(c=>tot+=c.w);
  let r=rnd()*tot, chosen=pool[0];
  for(const c of pool){ r-=c.w; if(r<=0){ chosen=c; break } }
  S.used[chosen.id]=(S.used[chosen.id]||0)+1;
  S.yearUsed[chosen.id]=1;
  showCard(chosen);
}

const CARD_SCALE = 0.5;   // 每年多張卡 → 單張增益縮放，避免數值通膨
const FULL_WEIGHT = ['m_stamp','m_ceiling','m_escape','m_sysvendor','m_teamsplit','m_seed','m_noconsult','h27','h30','h26'];
function pickVariant(id,i){
  const list = OUTCOME_VARIANTS[id+':'+i];
  if(!list || !list.length) return null;
  let tot=0; list.forEach(function(x){ tot += (x.w||1) });
  let r = rnd()*tot;
  for(let k=0;k<list.length;k++){ r -= (list[k].w||1); if(r<=0) return list[k] }
  return list[0];
}
function cardPick(id,i){
  const c=CARDS.find(x=>x.id===id), o=c.o[i], out={};
  const e=Object.assign({},o.e);
  const v = pickVariant(id,i);
  if(v && v.e){ Object.keys(v.e).forEach(function(k){ e[k]=(e[k]||0)+v.e[k] }) }
  /* 相關科系在對應議題上有天然優勢：別人要從頭學的，你只是換個名詞 */
  let boonNote = '';
  if(c.boon && S.major && S.major.id===c.boon){
    ['E','S','G','D'].forEach(function(k){ if(e[k]>0) e[k]+=2 });
    e.sp=(e.sp||0)+1;
    boonNote = '你的' + S.major.n.split('／')[0] + '底子在這裡派上了用場——'
             + '同事要從頭讀方法學的東西，對你來說只是換一套名詞。';
  }
  let sc = FULL_WEIGHT.indexOf(id)>=0 ? 1 : CARD_SCALE;
  if((o.e.burn||0) >= 10) sc *= staminaPenalty();   // 體力不夠時，硬撐的收穫會縮水
  ['E','S','G','D'].forEach(function(k){ if(e[k]) e[k]=Math.max(1,Math.round(e[k]*sc)) });
  if(e.rel) e.rel = e.rel>0 ? Math.max(1,Math.round(e.rel*0.7)) : e.rel;
  const d=apply(e,out);
  const vtrait = (v && v.trait) || o.trait;
  if(vtrait && !S.traits.includes(vtrait)) S.traits.push(vtrait);
  if(o.cert && !S.certs.includes(o.cert)){ S.certs.push(o.cert); const cf=CERTS.find(x=>x.id===o.cert); if(cf){S[cf.stat]+=cf.gain} }
  if(S.joinFlag){ S.joinFlag=0; S.inESG=true; S.esgYrs=0; d.push(['轉入永續','✓']) }
  S.evOut={t:(v && v.r) || o.r, d:d, extra:[out.extra, boonNote].filter(Boolean).join('<br><br>')};
  if(S.cardsLeft>0 && !S.quitFlag) return drawCard();
  midYear();
}

  const boom = f.t==='boom';
  shell(header()+`<div class="panel panel-pad fade">

    <h2 class="card-title">${f.ttl}</h2>

    <div class="opts">${boom
      ? `<button class="opt" onclick="fortunePick(1)"><span class="lab">趁高點去談別的機會</span><span class="hint">市場記得你在一間紅公司</span></button>
         <button class="opt" onclick="fortunePick(0)"><span class="lab">留下來，領這一年的年終</span><span class="hint">現金入袋</span></button>`

}
function fortunePick(leave){
  const f=S._f, d=[];
  if(f.t==='boom'){
    if(leave){ S.hunt=2; d.push(['獵頭視窗','開啟']);
      S.evOut={t:'你把履歷更新了。在一間正紅的公司做永續，這一年你的電話特別多。',d:d}; return midYear() }
    const b=ri(f.bonus[0],f.bonus[1]);
    const cash=Math.round(S.pay/12*b*.6);
    S.cash+=cash; S.pay=Math.round(S.pay*(1+f.pay));
    d.push(['年終',b+' 個月'],['存款','+'+cash+' 萬'],['年薪','+'+Math.round(f.pay*100)+'%']);
    S.ledger.push({y:S.year,t:`${S.emp.n} 大年，年終 ${b} 個月`,p:S.pay,mark:1});
    S.evOut={t:`年終 ${b} 個月。你把數字截圖傳給家人，他們回了一串驚嘆號。`,d:d}; midYear();
  } else {
    if(leave){ S.hunt=2; S.burn=Math.max(0,S.burn-10); d.push(['壓力','-10']);
      S.evOut={t:'你決定不陪這艘船沉下去。',d:d}; return midYear() }
    S.burn+=15; S.riskAcc+=f.risk||0; d.push(['壓力','+15']);
    if(!S.traits.includes('共患難')) S.traits.push('共患難');
    S.ledger.push({y:S.year,t:`${S.emp.n} 遇到寒冬，你留下來了`,p:S.pay});
    S.evOut={t:'你留下來收拾。有些同事沒有。',d:d}; midYear();
  }
}

function projPick(i){
  const p=PROJ[i], out={};
  if(p.k==='D') S.stamps.report=1;
  if(p.k==='E') S.stamps.ghg=1;
  if(p.k==='S') S.stamps.social=1;
  if(p.g==='經營自己'){ S.selfYrs=(S.selfYrs||0)+1;
    if(S.selfYrs>=3 && !S.traits.includes('圈子裡的人')) S.traits.push('圈子裡的人'); }
  const e=Object.assign({},p.e);
  if(S.rel>=12){ e.sp=(e.sp||0)-1; if(e.co2) e.co2=0 }
  apply(e,out);
  S.projNote = `這一年你壓在<strong>${p.l}</strong>上。` +
    (S.rel>=12 ? '不過你有一半時間在外面跑，實作的時間被吃掉了。' : '');
  yearEnd();
}

/* ============ 年末結算 ============ */
function yearEnd(){
  // 年資
  S.workYrs++; if(S.inESG) S.esgYrs++; if(S.freelance) S.freeYrs++;
  if(S.bond>0) S.bond--;
  if(S.cash<0){                                   // 負債：有利息、有壓力，但不會無限滾大
    S.cash = Math.max(-180, Math.round(S.cash*1.02));
    S.burn = Math.min(100, S.burn + (S.cash<-80?5:3));
  }
  if(S.inESG && S.level>=2 && !isFreelance()) S.G += 2;   // 帶人、跑法遵、進董事會報告，治理力自然累積
  if(isFreelance()){                                      // 接案收入靠案源，人脈決定波動下緣
    const swing = 0.88 + rnd()*0.38 + Math.min(.18, S.rel*.012);
    S.pay = Math.round(S.pay * Math.min(1.35, Math.max(0.78, swing)));
  }
  const cross = checkCross();
  // burnout 自然變化
  S.burn = Math.max(0, S.burn + Math.round((S.emp?S.emp.burn:1)*6) - 4);
  // 存款
  S.cash = Math.round(S.cash + S.pay*(isFreelance()?0.20:0.12));
  const events=[];
  // 升遷
  if(cross){ events.push(`有人在會議上說：【這件事找你最快】——你的定位成形了：<strong>${cross[0]}</strong>。${cross[1]}`) }
  if(S.inESG && tryPromote()){
    events.push(isFreelance()
      ? `你的報價往上跳了一級。現在客戶找你，是衝著 <strong>${LEVELS[S.level].t}</strong> 的經驗來的，年收入約 ${S.pay} 萬。`
      : `升上 <strong>${LEVELS[S.level].t}</strong>，年薪調整為 ${S.pay} 萬。`);
  }
  else if(S.inESG){
    const damp = S.pay>=260 ? 0.35 : S.pay>=180 ? 0.6 : 1;   // 越接近天花板，調薪越小
    let inc=1+(0.013+rnd()*0.013+S.luck*0.0005)*damp;
    if(aiLv(S.year)>=5 && S.D>cw()*0.42 && !S.traits.includes('駕馭工具的人')) inc-=0.016;
    S.pay=Math.round(S.pay*Math.max(1,inc)) }
  else { S.pay=Math.round(S.pay*(1+0.012+rnd()*0.013)) }
  // 裁員風險
  if(S.riskAcc>0 && rnd()<S.riskAcc){ S.riskAcc=0; S.quitFlag=1; S.cash+=20;
    events.push('公司做了組織調整。你的名字在名單上。'); }
  // 機會
  const offers=[];
  const m=mk(S.year)[1];
  const huntP = Math.min(.45, .05 + S.rel*.015 + S.luck*.006 + Math.max(0,(cw()-40))*.005 + m/2000 + (S.hunt?.25:0) + (S.crossTitle?.10:0) - (isAdrift()?.12:0));
  if(S.inESG && !isFreelance() && S.esgYrs>=2 && rnd()<huntP) offers.push('hunt');
  const poachP = Math.min(.38,(.03 + S.dom*.015 + S.rel*.01)*(m>=70?2:1));
  if(S.inESG && !isFreelance() && S.esgYrs>=3 && rnd()<poachP) offers.push('poach');
  if(!S.inESG && S.year>=2014 && rnd()< .18+m/300) offers.push('switch');
  // 證照機會
  let certOffer=null;
  if(S.workYrs%2===0){
    const avail = CERTS.filter(c=>!S.certs.includes(c.id) && S.cash>=c.cost+3);
    if(avail.length) certOffer = pick(avail);
  }
  S.hunt = Math.max(0,S.hunt-1);
  S.ledger.push({y:S.year, t:(S.emp?S.emp.n:'')+(S.inESG?'・'+LEVELS[S.level].t:'・非永續職'), p:S.pay});
  renderYearEnd(events, offers, certOffer);
}
function burnWord(){
  if(S.burn>=90) return '你的身體已經在抗議了，只是你還沒聽。';
  if(S.burn>=80) return '你已經很久沒有睡飽了。';
  if(S.burn>=60) return '你最近常在通勤時發呆。';
  if(S.burn>=40) return '有點累，但還撐得住。';
  if(S.burn>=20) return '節奏還算正常。';
  return '你這陣子過得不錯。';
}

  const opts=[];
  if(S.quitFlag){
    opts.push({k:'jobless',l:'先休息一陣子再找',h:'壓力大幅下降，空窗會影響下一份起薪'});

  } else {
    offers.forEach(o=>{
      if(o==='hunt') opts.push({k:'hunt',l:'獵頭來電：有個位子想找你談',h:'薪資落在上緣，免面試'});
      if(o==='poach') opts.push({k:'poach',l:'同業挖角：加薪但要簽競業',h:'產業專業完整保留'});
      if(o==='switch') opts.push({k:'switch',l:'公司開了永續的缺，內部轉調',h:'把本業年資帶進永續'});

    if(certOffer) opts.push({k:'cert',l:`去考「${certOffer.n}」`,h:`${certOffer.tw?'台灣':'國際'}證照・${certOffer.cost} 萬・${certOffer.d}`});
    opts.push({k:'quitblind',l:'裸辭',h:'壓力歸零，存款和起薪都要付代價'});
    if(S.age<=32 && S.esgYrs>=2 && S.cash>=55 && !S.studied) opts.push({k:'study',l:'辭職出國念研究所',h:'兩年、學費約 80 萬，用在地年資換英文與視野'});
    if(S.burn>=35) opts.push({k:'rest',l:'請長假，把自己修好',h:'體力大幅回復，年度考評會難看一點'});
    opts.push({k:'stay',l:'再做一年',h:''});
  }
  S._certOffer=certOffer;
  const pn=S.projNote; S.projNote='';
  const pb=pendingBlock();
  shell(header()+`<div class="panel panel-pad fade">
    ${pb}<span class="eyebrow">${S.year} 年末 ・ 結算</span>
    <h2 class="card-title">又一年過去了。</h2>
    <div class="card-body">
      ${pn?pn+'<br><br>':''}
      ${events.length?events.join('<br>')+'<br><br>':''}
      ${burnWord()}${S.health?' 你的健檢報告上有幾行紅字。':''}
      ${S.inESG?'':' 你還沒有做永續，但年資在累積。'}
    </div>
    <div class="opts">${opts.map(o=>`<button class="opt" onclick="yePick('${o.k}')"><span class="lab">${o.l}</span>${o.h?`<span class="hint">${o.h}</span>`:''}</button>`).join('')}</div>
  </div>`);
}
function nextYear(){ S.year++; S.age++; if(S.age>=40) return ending(); yearStart() }

function yePick(k){
  const out={}; let d=[], txt='';
  if(k==='stay'){ S.quitFlag=0; return nextYear() }
  if(k==='rest'){
    S.quitFlag=0;
    const rec = 30 + ri(0,15);
    S.burn = Math.max(0, S.burn - rec);
    S.pay = Math.round(S.pay*0.985); S.sp = Math.max(0,S.sp-1);
    if(S.burn<=20 && !S.traits.includes('懂得停下來')) S.traits.push('懂得停下來');
    return showOutcome('你把假請完了。<br><br>手機關掉兩個禮拜，回來時發現案子有人接手、世界沒有塌。年度考評上多了一句「本年度投入度略低」，你看了一眼，沒有很在意。',
      [['體力','+'+rec]], ()=>nextYear());
  }
  if(k==='cert'){
    const c=S._certOffer; S.cash=Math.round(S.cash-c.cost); S.certs.push(c.id); S[c.stat]+=c.gain;
    const fit = c.tw ? 1 : (c.fit && S.emp && c.fit.includes(S.emp.ind) ? 1 : (c.fit? (rnd()<.4?.4:0) : 1));
    const eff = c.pay * fit;
    S.pay = Math.round(S.pay*(1+eff));
    d=[[({E:'環境力',S:'社會力',G:'治理力',D:'揭露力'})[c.stat], c.gain],['存款',-c.cost]];
    if(eff>0) d.push(['年薪','+'+Math.round(eff*100)+'%']);
    if(c.tw) txt=`你考過了。<strong>${c.n}</strong>。<br><br>履歷上多了一行，HR 看得懂、會勾選。加薪幅度不大——大家都有的時候，它就不是差異化了。`;
    else if(fit===1) txt=`你考過了。<strong>${c.n}</strong>。<br><br>難，而且貴。但你剛好在用得上它的位子上——下一次調薪，主管拿它當理由。`;
    else if(fit>0) txt=`你考過了。<strong>${c.n}</strong>。<br><br>花了 ${c.cost} 萬和三個月的晚上。跟你現在的工作只沾得上一點邊，但至少你懂了那套語言。`;
    else txt=`你考過了。<strong>${c.n}</strong>。<br><br>花了 ${c.cost} 萬和三個月的晚上。<em>然後它就躺在抽屜裡</em>——公司只要你把去年的報告書更新一下。`;
    return showOutcome(txt,d,()=>nextYear());
  }
  if(k==='quitblind'||k==='jobless'){
    S.quitFlag=0; S.jobless=1; S.burn=Math.max(0,S.burn-45); S.cash=Math.round(S.cash-S.pay*0.25);
    S.emp=null; S.inESG=S.inESG;
    S.ledger.push({y:S.year,t:'離職。沒有下一份工作。',p:''});
    return showOutcome('你遞了辭呈。<br><br>接下來幾個月，你第一次在平日下午出門散步。也第一次在半夜醒來想著存款還夠撐多久。',
      [['壓力','-45']], ()=>{S.year++;S.age++; if(S.age>=40)return ending(); rehire()});
  }
  if(k==='findnow'){ S.quitFlag=0; S.emp=null; S.year++; S.age++; if(S.age>=40) return ending(); return rehire() }
  if(k==='study'){
    S.quitFlag=0; S.studied=1; S.emp=null; S.jobless=0;
    let cost = 80 + ri(0,25);
    if(S.cash < cost){ cost = Math.round(cost*0.72); }   // 半工半讀、申請補助，代價是更累

    S.cash = Math.round(S.cash - cost); S.en += 5; S.E+=4; S.S+=4; S.G+=4; S.D+=4; S.rel += 2;
    S.burn = Math.max(0, S.burn-35) + (S.cash<0?12:0);
    S.year += 2; S.age += 2; S.workYrs += 2;
    if(!S.traits.includes('海外碩士')) S.traits.push('海外碩士');
    S.ledger.push({y:S.year,t:'辭職出國念書，兩年後回來',p:'',mark:1});
    const txt = S.cash<0
      ? `你把工作辭了，飛出去念書。<br><br>學費加生活費 ${cost} 萬，存款見底還借了一些。兩年後你帶著一張文憑、變好的英文，和<em>零在地年資</em>回到台灣。`
      : `你把工作辭了，飛出去念書。<br><br>兩年，花了 ${cost} 萬。回來時你的英文變好了、看事情的角度變寬了，但台灣的法規和人脈都往前跑了兩年。`;
    if(S.age>=40) return ending();
    return showOutcome(txt, [['英文',5],['存款',-cost],['壓力',-35]], ()=>rehire());
  }
  if(k==='hunt' || k==='poach'){
    S._offers = genOffers(k); S._otype = k;
    if(!S._offers.length) return nextYear();
    return offerScreen();
  }
  if(k==='switch'){
    S.inESG=true; S.esgYrs=Math.min(S.esgYrs, 1);
    S.level = Math.max(0, S.level - 1);   // 回鍋退一階，不是砍到底
    const bonus=Math.min(.35,(S.workYrs)*.05);
    S.pay=Math.round(LEVELS[0].base*(IND[S.emp.ind]?IND[S.emp.ind].c:1)*S.emp.mult*(.85+mk(S.year)[1]/250)*(1+bonus));
    if(!S.traits.includes('本行加值')) S.traits.push('本行加值');
    let carryMsg='', carryD=[['年薪',S.pay],['產業專業','保留']];
    const cy = S.prevJob && CARRY[S.prevJob];
    if(cy && !S.carried){
      S.carried=1;
      S.E+=cy.E; S.S+=cy.S; S.G+=cy.G; S.D+=cy.D;
      if(!S.traits.includes(cy.t)) S.traits.push(cy.t);
      ['E','S','G','D'].forEach(function(k){ if(cy[k]) carryD.push([({E:'環境力',S:'社會力',G:'治理力',D:'揭露力'})[k], cy[k]]) });
      carryMsg = '<br><br>' + cy.m;
    }
    S.ledger.push({y:S.year,t:'內部轉調，開始做永續',p:S.pay,mark:1});
    return showOutcome(`你舉手了。<br><br>職稱換成永續專員，年薪 <strong>${S.pay} 萬</strong>——比純新鮮人高，因為你的 ${S.workYrs} 年本業年資是有價的。<em>換領域不是從零開始。</em>${carryMsg}`,
      carryD,()=>nextYear());
  }
}

/* ===== 產生工作機會清單 =====
   可及範圍由綜合戰力決定；關係力高時，有機會拿到原本搆不到的位子 */
function offerPay(emp, type){
  if(type==='poach') return Math.round(S.pay*(1.10+rnd()*0.11));
  return Math.round(calcPay(emp, S.level)*(1.06+rnd()*0.10));
}
function genOffers(type){
  const base = EMP.filter(function(e){ return !S.emp || e.id!==S.emp.id });
  const reach = cw() + 8 + Math.floor(S.luck*0.6);
  let pool = base.filter(function(e){
    if(e.bar > reach) return false;
    if(ELITE.indexOf(e.id)>=0) return S.rel>=9 || mk(S.year)[1]>=78;   // 頂尖公司始終要人脈或熱市場
    return true;
  });
  if(type==='poach' && S.emp){
    const same = pool.filter(function(e){ return e.ind===S.emp.ind });
    if(same.length) pool = same;
  }
  if(!pool.length) pool = base.filter(function(e){ return e.bar <= 30 });
  const n = Math.min(pool.length, S.rel>=10 ? 3 : 2);
  const chosen = [];
  const work = pool.slice();
  while(chosen.length < n && work.length){
    chosen.push(work.splice(Math.floor(rnd()*work.length),1)[0]);
  }
  const list = chosen.map(function(e){ return {emp:e, np:offerPay(e,type), lucky:false} });
  /* 關係力帶來的意外機會：超出目前能力範圍的位子 */
  if(S.rel>=11 && rnd() < 0.14 + S.rel*0.018){
    const up = base.filter(function(e){ return e.bar > reach && e.bar <= reach+24 });
    if(up.length){
      const lucky = up[Math.floor(rnd()*up.length)];
      list.unshift({emp:lucky, np:Math.round(offerPay(lucky,'hunt')*1.06), lucky:true});
    }
  }
  return list;
}
function offerScreen(){
  const type=S._otype, list=S._offers;
  const rows = list.map(function(of,i){
    const e=of.emp, cross = S.emp && e.ind!==S.emp.ind;
    return `<button class="opt" onclick="takeOffer(1,${i})">
      <span class="lab">${e.n}${of.lucky?' <span class="tag">意外的機會</span>':''}</span>
      <span class="hint">${IND[e.ind].n}・${e.tier}　年薪 <b>${of.np} 萬</b>${cross?'　跨產業，專業折損四成':'　同產業，專業完整帶走'}<br>${e.f}</span>
    </button>`;
  }).join('');
  const luckyNote = list.some(function(x){return x.lucky})
    ? '<br><br><em>其中一個位子，照你現在的資歷本來排不上。是有人在裡面替你說了話。</em>' : '';
  shell(header()+`<div class="panel panel-pad fade">
    <span class="eyebrow">${type==='hunt'?'獵頭帶來的選項':'同業來挖你'}</span>
    <h2 class="card-title">有 ${list.length} 個位子在等你回覆。</h2>
    <div class="card-body" style="font-size:15px">
      你現在年薪 ${S.pay} 萬。能談到什麼樣的位子，看你這些年累積了什麼。${luckyNote}
      ${type==='poach'?'<br><br>人資都補了同一句：「不過我們要簽兩年競業條款。」':''}
    </div>
    <div class="opts">
      ${rows}
      ${type==='poach'?'<button class="opt" onclick="takeOffer(2,0)"><span class="lab">談掉競業條款再去</span><span class="hint">加薪打折，換自由</span></button>':''}
      <button class="opt" onclick="takeOffer(0,0)"><span class="lab">全部婉拒，留在原地</span></button>
    </div>
  </div>`);
}
function takeOffer(v, idx){
  const type=S._otype;
  const of = S._offers[idx||0];
  const emp = of.emp, np = of.np;
  if(!v){
    if(type==='poach'){ S.pay=Math.round(S.pay*1.07);
      return showOutcome('你留下來了。公司加了薪留你——你知道這是那通電話換來的。',[['年薪','+7%']],()=>nextYear()) }
    return showOutcome('你回了信說最近走不開，留了聯絡方式。<br><br>獵頭說：「有需要隨時找我。」',[['關係力',1]],()=>{S.rel=Math.min(20,S.rel+1);nextYear()});
  }
  const cross = S.emp && emp.ind!==S.emp.ind;
  if(cross){ S.dom=Math.round(S.dom*0.6); S.domName=IND[emp.ind].n }
  else { S.dom+=2 }
  S.pay = v===2 ? Math.round(np*0.88) : np;
  if(S.bond>0){ const fine=Math.round(4*S.bond); S.cash=Math.round(S.cash-fine); S.bondFine=fine; S.bond=0 }
  S.emp=emp; S.inESG=true; S.freelance=0; S.burn=Math.max(0,S.burn-8);
  if(v===1&&type==='poach'){ S.compete=2 }
  if(of.lucky && !S.traits.includes('被人拉了一把')) S.traits.push('被人拉了一把');
  S.ledger.push({y:S.year,t:`跳槽到 ${emp.n}`,p:S.pay,mark:1});
  const fineTxt = S.bondFine ? `<br><br>你還沒跑完服務約，賠了 <strong>${S.bondFine} 萬</strong>違約金。公司出的那筆訓練費，最後還是你自己付了。` : '';
  S.bondFine=0;
  showOutcome((v===2
      ? `你談掉了競業條款，加薪也打了折。<br><br>年薪 <strong>${S.pay} 萬</strong>。你留住了自由。`
      : `你到職了。<br><br>年薪 <strong>${S.pay} 萬</strong>。${type==='poach'?'接下來兩年，你哪裡都不能去。':''}`)+fineTxt,
    [['年薪',S.pay]],()=>nextYear());
}
function rehireReach(){
  return cw() + 6 + Math.floor(S.luck*0.5) - Math.round(S.jobless*7);
}
function rehireOffers(){
  const m = mk(S.year)[1], reach = rehireReach();
  let pool = EMP.filter(function(e){
    if(e.bar > reach) return false;
    if(ELITE.indexOf(e.id) >= 0) return S.rel>=9 || m>=78;
    if(S.emp && e.id===S.emp.id) return false;
    return true;
  });
  /* 市場冷、空窗久、履歷不夠硬 —— 有時候就是一個回音都沒有 */
  const callback = 0.38 + m/150 + S.rel*0.022 + S.luck*0.010 - S.jobless*0.075 - entryPenalty(S.year);
  if(rnd() > callback) return [];
  const n = Math.min(pool.length, m>=70 ? 3 : 2);
  const out = [], work = pool.slice();
  for(let i=0;i<n && work.length;i++){
    out.push(work.splice(Math.floor(rnd()*work.length),1)[0]);
  }
  return out;
}
function rehire(){
  const m = mk(S.year)[1];
  S._penalty = 1 - Math.min(.15, S.jobless*.05) - entryPenalty(S.year)*0.5;
  S._rehire = rehireOffers();
  const rows = S._rehire.map(function(e,i){
    const est = Math.round(calcPay(e, S.level) * S._penalty);
    return '<button class="opt" onclick="rehirePick(\'take\','+i+')"><span class="lab">'+e.n+'</span>'
      + '<span class="hint">'+IND[e.ind].n+'・'+e.tier+'　年薪約 <b>'+est+' 萬</b><br>'+e.f+'</span></button>';
  }).join('');
  let lead;
  if(!S._rehire.length){
    lead = S.jobless>=2
      ? '<em>又是一年，一個面試都沒有。</em>投出去的履歷像丟進海裡。你開始懷疑自己是不是離開太久了。'
      : '你投了三十幾封，回信的只有兩家，聊完就沒有下文。<em>這一年，市場沒有你的位子。</em>';
  } else if(S.jobless>=2){
    lead = '空窗第 '+S.jobless+' 年。面試時每個人都會問：「這段時間你在做什麼？」你已經有一套講法了。';
  } else {
    lead = '休息了一陣子，該回去了。你把履歷更新到最新的版本。';
  }
  const opts = rows
    + '<button class="opt" onclick="rehirePick(\'wait\',0)"><span class="lab">再撐一年，繼續找</span>'
    + '<span class="hint">存款會少一截，起薪也會再打折</span></button>'
    + '<button class="opt" onclick="rehirePick(\'free\',0)"><span class="lab">開始接案</span>'
    + '<span class="hint">收入不穩，時間自己掌握。人脈決定你接不接得到</span></button>'
    + '<button class="opt" onclick="rehirePick(\'give\',0)"><span class="lab">先找份非永續的工作</span>'
    + '<span class="hint">永續年資停住，但至少有收入</span></button>';
  shell(header()+'<div class="panel panel-pad fade">'
    + '<span class="eyebrow">空窗期 ・ 市場熱度 '+m+'</span>'
    + '<h2 class="card-title">'+(S._rehire.length?'你在找下一份工作。':'沒有人回你。')+'</h2>'
    + '<div class="card-body">'+lead+'</div>'
    + '<div class="opts">'+opts+'</div></div>');
}
function rehirePick(k, idx){
  const m = mk(S.year)[1];
  if(k==='wait'){
    S.jobless++;
    S.cash = Math.round(S.cash - S.pay*0.22);
    S.burn = Math.max(0, S.burn - 6);
    S.year++; S.age++;
    if(S.age>=40) return ending();
    return rehire();
  }
  if(k==='give'){
    const d = pick(DETOUR);
    S.emp = {id:d.id,n:d.n,ind:d.ind,tier:'中後段',mult:d.mult,bar:0,burn:1.0,pre:5,f:d.f};
    S.inESG=false; S.jobless=0; S.prevJob=d.id;
    S.pay = Math.round(LEVELS[0].base*(IND[d.ind]?IND[d.ind].c:1)*d.mult*(.85+m/280)*(1+Math.min(.35,S.workYrs*.04)));
    S.domName = IND[d.ind].n; S.dom += 4;
    S.ledger.push({y:S.year,t:'轉去 '+d.n+'（非永續）',p:S.pay,mark:1});
    return showOutcome('你去了 <strong>'+d.n+'</strong>。'+d.f
      + '<br><br>年薪 '+S.pay+' 萬。永續年資停在這裡了——<em>但你沒有真的離開，只是先去別的地方等</em>。',
      [['年薪',S.pay]], function(){ nextYear() });
  }
  if(k==='free'){
    S.freelance=1; S.inESG=true; S.jobless=0;
    S.emp={id:'free',n:'自己接案',ind:'cons',tier:'自僱',mult:.9,bar:0,burn:.8,pre:5,f:'沒有年終，沒有勞健保補助，但也沒有人管你幾點下班。'};
    const seniority = 1 + Math.min(.55, S.esgYrs*.045) + Math.min(.30, S.rel*.018);
    S.pay=Math.round(LEVELS[Math.max(0,S.level)].base*.95*seniority*(0.85+rnd()*0.45));
    S.ledger.push({y:S.year,t:'開始接案',p:S.pay,mark:1});
    return showOutcome('你開始接案。<br><br>第一年年薪 <strong>'+S.pay+' 萬</strong>——接得到就有，接不到就沒有。<br><br>'
      + (S.rel>=12?'還好這些年認識的人夠多，案子沒斷過。':'你發現，接不接得到案，跟你認識多少人有關。'),
      [['年薪',S.pay]], function(){ nextYear() });
  }
  const emp = S._rehire[idx||0];
  S.emp=emp; S.inESG=true; S.freelance=0; S.jobless=0;
  S.pay=Math.round(calcPay(emp,S.level)*S._penalty*(S.traits.includes('海外碩士')&&!S.readjusted?0.95:1));
  if(S.traits.includes('海外碩士')&&!S.readjusted) S.readjusted=1;
  S.burn=Math.max(0,S.burn-5);
  S.ledger.push({y:S.year,t:'重新入職 '+emp.n,p:S.pay,mark:1});
  showOutcome('<strong>'+emp.n+'</strong>（'+IND[emp.ind].n+'・'+emp.tier+'）<br>'+emp.f
    + '<br><br>年薪 <strong>'+S.pay+' 萬</strong>。'+(S._penalty<1?'空窗讓起薪打了一點折，但你回來了。':''),
    [['年薪',S.pay]], function(){ nextYear() });
}

/* ============ 結局 ============ */
function goalMet(){
  const g=S.goal.id;
  if(g==='cso') return S.level>=4;
  if(g==='money') return S.pay>=200;
  if(g==='impact') return S.co2>=7;
  if(g==='found') return !!(S.foundFlag || (S.freelance && S.freeYrs>=3));
  if(g==='human') return S.burn<=28 && S.pay>=110 && !S.health;
  if(g==='intl') return !!(S.intlFlag || (S.emp&&S.emp.intl) || (S.en>=14&&S.traits.includes('海外碩士')));
  return false;
}
function ending(){
  const met = goalMet();
  const g = S.goal;
  let verdict='', body='';
  const yrs = S.esgYrs;
  if(met){
    const w = {
      cso:`你坐上了永續長的位子。<br><br>十八年前那個在 104 上搜「永續」只搜到清潔隊的大學生，現在要在董事會上解釋為什麼這筆減碳投資值得。`,
      money:`年薪 ${S.pay} 萬。<br><br>你證明了這件事：做永續，也可以把日子過好。這在你入行的那年，不是一個理所當然的結論。`,
      impact:`你真的減下了碳。<br><br>不是報告書上的數字，是實際少排出去的那些。沒有人幫你辦頒獎典禮，但你自己算得出來。`,
      found:`你有了自己的招牌。<br><br>接案、報價、被拒絕、再接案。沒有年終，沒有組織，只有你自己決定要不要接下一個漂綠的案子。`,
      human:`你還在。<br><br>四十歲，年薪 ${S.pay} 萬，準時下班，健檢沒有紅字。<em>這是這個行業裡最難的結局</em>，而你做到了。`,
      intl:`你走到了台灣以外。<br><br>那個在課堂上聽別人講國際趨勢的學生，現在自己就是那個講的人。`
    };
    verdict = w[g.id];
  } else {
    const l = {
      cso:`你沒有坐上永續長。<br><br>四十歲這年你是${LEVELS[S.level].t}，年薪 ${S.pay} 萬。這在圈子裡不算差——只是離那間辦公室還有兩階。<br><br>能走到那個位子的人本來就很少。你不是失敗，你只是活在真實的分布裡。`,
      money:`年薪 ${S.pay} 萬，沒有到兩百。<br><br>你做的每個決定當下都有它的道理。只是這個行業的薪資天花板，比外面想像的低一點。`,
      impact:`你寫了很多報告書。<br><br>認真算的話，實際減下來的碳沒有你預期的多。這不完全是你的錯——這個行業有很長一段時間，要的就是把數字寫得好看。`,
      found:`你沒有出去開自己的公司。<br><br>那個念頭出現過幾次，每次都被房貸、被小孩、被「再等一年」推遲。這也是一種選擇。`,
      human:`你活下來了，但不算輕鬆。<br><br>${S.health?'健檢報告上有幾行紅字，':''}${S.burn>=60?'你已經很久沒有睡飽。':'你偶爾還是會在半夜醒來想工作的事。'}四十歲，年薪 ${S.pay} 萬。`,
      intl:`你留在台灣。<br><br>幾年前有過一次外派的機會，你沒有去。偶爾看到當年同事在曼谷、在阿姆斯特丹發的照片，你會想一下那條沒走的路。`
    };
    verdict = l[g.id];
  }
  // 特質敘事
  const t=[];
  if(S.traits.includes('數字魔術師')&&S.co2<3) t.push('你很擅長讓數字變好看。這個能力讓你走得很順，也讓你在某些晚上睡不太著。');
  if(S.traits.includes('有所不為')) t.push('你婉拒過案子。那次之後主管對你的態度變了一點，但你一直記得自己為什麼要做這行。');
  if(S.traits.includes('論壇常客')) t.push('圈子裡人人都認識你。真正動手做過幾個完整專案，你自己心裡有數。');
  if(S.rel>=15) t.push(`關係力 ${S.rel}。你的手機裡有整個產業的電話——這是你最大的資產，也是你最大的機會成本。`);
  if(S.certs.length>=4) t.push(`你考了 ${S.certs.length} 張證照。有幾張真的幫上忙，有幾張到現在還躺在抽屜裡。`);
  if(!S.inESG) t.push('你最後沒有留在永續。這條路你走過一段，然後選了別的方向——這在真實世界裡非常常見。');
  if((S.gw||0)>=4) t.push('這些年你把數字弄好看過很多次。沒有一次違法，每一次都有說得過去的理由。只是加起來，你不太確定自己還記不記得當初為什麼要做這行。');
  else if((S.gw||0)>=2) t.push('你妥協過幾次。不多，但你都記得是哪幾次。');
  else if(S.co2>=5) t.push('你沒有走捷徑。數字是慢慢做出來的，碳也是慢慢減下來的。');

  const goalNote = met ? '達成' : '未達成';
  shell(`<div class="panel panel-pad fade">
    <span class="eyebrow">${S.startYear} 年入學 ・ ${S.year} 年 ・ 四十歲</span>
    <h2 class="card-title" style="font-size:26px">${S.goal.n} <span class="tag">${goalNote}</span></h2>
    <p class="verdict">${verdict}</p>
    ${t.length?`<hr class="rule">${t.map(x=>`<p class="verdict" style="font-size:16px;color:var(--ink-2)">${x}</p>`).join('')}`:''}
    <div class="bigstat">
      <div><div class="k">年薪</div><div class="v mono">${S.pay} 萬</div></div>
      <div><div class="k">職位</div><div class="v" style="font-size:16px">${S.inESG?LEVELS[S.level].t:'非永續職'}</div></div>
      <div><div class="k">永續年資</div><div class="v mono">${yrs} 年</div></div>
      <div><div class="k">綜合戰力</div><div class="v mono">${cw()}</div></div>
      <div><div class="k">實質減碳</div><div class="v mono">${S.co2}</div></div>
      <div><div class="k">存款</div><div class="v mono">${S.cash} 萬</div></div>
    </div>
    <span class="eyebrow">能力分布</span>
    <div class="stats" style="margin-top:10px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))">
      ${statBar(S.E,'環境 E',60)}${statBar(S.S,'社會 S',60)}${statBar(S.G,'治理 G',60)}${statBar(S.D,'揭露 D',60)}
    </div>
    ${S.traits.length?`<hr class="rule"><span class="eyebrow">你成為了什麼樣的人</span><div class="traits">${S.traits.map(x=>`<span class="trait">${x}</span>`).join('')}</div>`:''}
    <hr class="rule">
    <span class="eyebrow">職涯總帳 ・ ${S.startYear}–${S.year}</span>
    <div class="ledger" style="max-height:none;margin-top:8px">
      ${S.ledger.map(r=>`<div class="lrow ${r.mark?'mark':''}"><span class="yr mono">${r.y}</span><span class="ev">${r.t}</span><span class="pay mono">${r.p?r.p+'萬':''}</span></div>`).join('')}
    </div>
    <div class="opts" style="flex-direction:row;gap:10px;flex-wrap:wrap">
      <button class="btn" onclick="startSetup()">再玩一次</button>
      <button class="btn ghost" onclick="copySeed(this)">複製這局種子</button>
    </div>
    <hr class="rule">
    <p class="note">種子 <span class="mono">${S.seed.toString(36).toUpperCase()}</span>　你在 ${S.startYear} 年進大學。若換成別的年份，同樣的選擇會走出完全不同的人生——這是這款遊戲唯一想說的事。</p>
  </div>`);
}
function copySeed(el){
  const t=`永續人森 — ${S.startYear} 入學 / ${S.goal.n} ${goalMet()?'達成':'未達成'} / 年薪 ${S.pay} 萬 / ${S.inESG?LEVELS[S.level].t:'非永續職'} / SEED ${S.seed.toString(36).toUpperCase()}`;
  if(navigator.clipboard) navigator.clipboard.writeText(t);
  if(el) el.textContent='已複製';
}

function askRestart(){
  if(!S || S.phase==='setup'){ return startSetup() }
  const box=document.getElementById('app');
  if(document.getElementById('rsConfirm')) return;
  const d=document.createElement('div');
  d.id='rsConfirm';
  d.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:99;padding:20px';
  d.innerHTML='<div class="panel panel-pad" style="max-width:380px"><h3 style="font-family:\'Noto Serif TC\',serif;font-size:19px;margin:0 0 10px">要重新開始嗎？</h3>'
    +'<p class="note" style="margin:0 0 16px">目前這局會消失，換一個開局年份、一所新的學校、一組新的運氣。</p>'
    +'<div style="display:flex;gap:9px"><button class="btn" onclick="doRestart()">重新開始</button>'
    +'<button class="btn ghost" onclick="closeRestart()">繼續這局</button></div></div>';
  d.addEventListener('click',function(ev){ if(ev.target===d) closeRestart() });
  document.body.appendChild(d);
}
function closeRestart(){ const d=document.getElementById('rsConfirm'); if(d) d.remove() }
function doRestart(){ closeRestart(); startSetup() }

screenIntro();
</script>

</body>
</html>

      : `<div class="grouplab">經營自己</div>
    <div class="opts">${PROJ.filter(p=>p.g==='經營自己').map(p=>`<button class="opt" onclick="projPick(${PROJ.indexOf(p)})"><span class="lab">${p.l}</span><span class="hint">${p.h}</span></button>`).join('')}</div>`}
  </div>`);
}
function projPick(i){
  const p=PROJ[i];
  S._focusP = p;
  if(p.g==='專業' && FOCUS_CARDS[p.k] && FOCUS_CARDS[p.k].length){
    const pool = FOCUS_CARDS[p.k].filter(function(c){ return !c.cond || c.cond(S) });
    const base = pool.length ? pool : FOCUS_CARDS[p.k];
    /* 沒遇過的優先（使用者需求 4）：同一個方向選了十年，不該十年都在處理同一件事 */
    S.focusSeen = S.focusSeen || {};
    const fresh = base.filter(function(c){ return !S.focusSeen[c.t] });
    const use = fresh.length ? fresh : base;
    S._focusCard = use[Math.floor(rnd()*use.length)];
    S.focusSeen[S._focusCard.t] = 1;
    return renderFocusCard();
  }
  applyProject(p, Object.assign({},p.e), '', null);   // 經營自己：維持即時處理
}
function renderFocusCard(){
  const c=S._focusCard, p=S._focusP, pb=pendingBlock();
  shell(header()+`<div class="panel panel-pad fade">
    ${pb}<span class="eyebrow">${p.l} ・ 今年實際落到你手上的事</span>
    <h2 class="card-title">${c.t}</h2>
    <div class="card-body">${c.x}</div>
    <div class="opts">${c.o.map(function(o,idx){ return `<button class="opt" onclick="focusPick(${idx})"><span class="lab">${o.l}</span>${o.h?`<span class="hint">${o.h}</span>`:''}</button>` }).join('')}</div>
  </div>`);
}
function focusPick(oi){
  const c=S._focusCard, p=S._focusP, o=c.o[oi];
  applyProject(p, Object.assign({},o.e), o.r||'', o.trait);
}
/* 把「今年壓在哪」的選擇，走完能力／團隊／技能成敗／公司 ESG 的完整流程 */
function applyProject(p, e, resultNote, trait){
  const out={}; const tsz = teamSize(S.emp);
  if(p.k==='D') S.stamps.report=1;
  if(p.k==='E') S.stamps.ghg=1;
  if(p.k==='S') S.stamps.social=1;
  if(p.g==='經營自己'){ S.selfYrs=(S.selfYrs||0)+1;
    if(S.selfYrs>=3 && !S.traits.includes('圈子裡的人')) S.traits.push('圈子裡的人'); }
  if(S.rel>=12){ e.sp=(e.sp||0)-1; if(e.co2) e.co2=0 }
  if(p.k==='R3' && !S.selfBrand){
    S.selfBrand=1;
    if(!S.traits.includes('開始寫了')) S.traits.push('開始寫了');
  }
  mbtiTilt(e, !!S._focusCard);   // 焦點卡也吃性格連動
  /* 這一年學到的具體技能（依焦點方向、年份、公司與四大組別）*/
  let learned = null;
  if(p.g==='專業'){
    let pool = skillsForFocus(p.k);
    const grp = S.big4Grp && big4GrpById(S.big4Grp);
    if(grp){ const pref = grp.skills.filter(function(id){ return pool.indexOf(id)>=0 }); if(pref.length && rnd()<0.6) pool = pref; }
    if(pool.length){
      // 越稀缺的技能越晚才學得到（要先有基礎）
      const eligible = pool.filter(function(id){
        const k = skillById(id); if(!k) return false;
        if(k.rare<=1) return S.esgYrs>=6 || skillCount()>=6;
        if(k.rare<=2) return S.esgYrs>=3 || skillCount()>=3;
        return true;
      });
      const use = eligible.length ? eligible : pool;
      learned = learnSkill(use[Math.floor(rnd()*use.length)]);
    }
  }
  const so = skillOutcome(p);
  if(so.q!==1){ ['E','S','G','D'].forEach(function(k){ if(e[k]) e[k]=Math.max(1,Math.round(e[k]*so.q)) }); }
  /* 邊際遞減：同一項能力越高，再往上長越慢（你已經是專家，多做一年學不到多少新的）*/
  ['E','S','G','D'].forEach(function(k){
    if(e[k]>0){ const cur=S[k]||0; const f = cur>=120?0.25 : cur>=95?0.45 : cur>=75?0.65 : cur>=55?0.85 : 1;
      e[k]=Math.max(1, Math.round(e[k]*f)); }
  });
  S.projCount[p.k]=(S.projCount[p.k]||0)+1;
  if(p.g==='專業' && tsz>0){
    if(tsz<=2){
      if(e[p.k]) e[p.k] = Math.max(1, e[p.k]-2);
      ['E','S','G','D'].forEach(function(k){ if(k!==p.k) e[k]=(e[k]||0)+2 });
    } else if(tsz>=8){
      if(e[p.k]) e[p.k] += 3;
    }
  }
  if(trait && !S.traits.includes(trait)) S.traits.push(trait);
  apply(e,out);
  const dp = deptOf(S.emp);
  if(dp && !isFreelance()){ S[dp.tilt]=(S[dp.tilt]||0)+1; if(dp.board && S.level>=1) S.G+=1; }
  if(S.emp && S.emp.esg && !isFreelance()){
    const id=S.emp.id, cur=companyESG(S.emp,S.year);
    let gain = p.g==='專業' ? 1.1 : 0.4;
    if(cur!==null){ gain *= cur<45 ? 1.9 : cur<60 ? 1.3 : cur<75 ? 0.8 : 0.45 }
    if(so.q<1) gain *= 0.5;
    S.esgBoost[id]=Math.min(22,(S.esgBoost[id]||0)+gain);
    if(p.g==='專業'){
      const dimOf={E:'e',S:'s',G:'g',D:'g'}, dk=dimOf[p.k];
      if(dk){ const b=S.esgBoostDim[id]||(S.esgBoostDim[id]={}); b[dk]=Math.min(20,(b[dk]||0)+gain*0.8) }
    }
    S.esgLift=(S.esgLift||0)+gain;
    /* 年復一年真的在做減量 → 累積實質減碳（讓「真正減下碳」這個目標有機會達成）*/
    if(p.k==='E' && so.q>=1){ S.co2 += 1; }
  }
  const chips=(out.d||[]);
  const learnNote = learned
    ? (learned.first
        ? `<br><br>這一年你第一次真的學會了<strong>${learned.k.n}</strong>${learned.k.rare<=2?'——這是連四大都沒幾家在做的東西':''}。`
        : `<br><br>你又把<strong>${learned.k.n}</strong>練深了一層（Lv.${learned.lv}）。`)
    : '';
  S.projNote = (resultNote ? resultNote+' ' : `這一年你壓在<strong>${p.l}</strong>上。`) + learnNote
    + (so.note ? so.note : '')
    + (S.rel>=12 ? '不過你有一半時間在外面跑，實作的時間被吃掉了。' : '');
  yearEnd();
}

/* ============ 年末結算 ============ */
function yearEnd(){
  // 年資
  S.workYrs++; if(S.inESG) S.esgYrs++; if(S.freelance) S.freeYrs++;
  /* 國際資歷：待在外商／國際組織或在海外工作的年數 */
  if((S.emp && S.emp.intl) || S.abroad) S.intlYrs = (S.intlYrs||0) + 1;
  if(S.bond>0) S.bond--;
  if(S.cash<0){                                   // 負債：有利息、有壓力，但不會無限滾大
    S.cash = Math.max(-180, Math.round(S.cash*1.02));
    S.burn = Math.min(100, S.burn + (S.cash<-80?5:3));
  }
  if(S.inESG && S.level>=2 && !isFreelance()) S.G += 2;   // 帶人、跑法遵、進董事會報告，治理力自然累積
  if(isFreelance()){                                      // 接案收入靠案源，人脈決定波動下緣
    const swing = 0.88 + rnd()*0.38 + Math.min(.18, S.rel*.012);
    S.pay = Math.round(S.pay * Math.min(1.35, Math.max(0.78, swing)));
  }
  const cross = checkCross();
  // burnout 自然變化
  /* 當到主管，體力掉得更快：會議、擔責、幫下屬擋事（item 12）*/
  const lvBurn = (S.inESG && !isFreelance()) ? S.level*1.35 : 0;
  S.burn = Math.max(0, S.burn + Math.round((S.emp?S.emp.burn:1)*5 + lvBurn) - 6);
  // 存款
  S.cash = Math.round(S.cash + S.pay*(isFreelance()?0.20:0.12));
  const events=[];
  /* ===== 年度考績 A／B／C（使用者需求）=====
     看你今年的投入、能見度、體力與運氣。C 連兩年會被盯上。 */
  if(S.inESG && S.emp && !isFreelance()){
    /* 考績是「相對期待」而不是絕對能力：爬得越高，被要求的越多。
       （原本只加不減，導致中後期幾乎不可能拿到 C，扣薪機制形同虛設。） */
    let gs = 50 + (S.luck-10)*1.1 + (S.rel-6)*0.6 + Math.min(24, cw()*0.08)
             - S.level*4 - Math.max(0, (S.burn-55)*0.7);
    if(S.projPushed) gs += 10;                      // 今年選了「全力推動」
    if(S.aifill) gs += 4;
    if(S.big4Grp) gs += 2;
    if(S.gradeC>=1) gs += 4;                        // 被談過話之後，多數人會撐起來一點
    gs += ri(-13, 13);
    const g = gs >= 72 ? 'A' : gs >= 44 ? 'B' : 'C';
    S.grades.push(g);
    if(g==='A'){
      S.gradeC = 0;
      const bonus = Math.round(S.pay * 0.06);
      S.cash += bonus;
      events.push('年度考績 <strong>A</strong>。獎金多了 '+bonus+' 萬，主管在會議上點名說你這一年很不一樣。');
      if(S.grades.filter(function(x){return x==='A'}).length>=3 && !S.traits.includes('連年拿A')) S.traits.push('連年拿A');
    } else if(g==='C'){
      S.gradeC++;
      /* 考績不好是會扣薪的（使用者需求）：C 扣 3%，連兩年 C 扣 6% ＋ 績效改善計畫 */
      if(S.gradeC>=2){
        S.pay = Math.round(S.pay*0.94);
        S.riskAcc += 0.28;
        events.push('年度考績又是 <strong>C</strong>。調薪單上是<em>負的：-6%</em>，而且人資找你談了一次「績效改善計畫」——這個詞你聽過，通常不是好事。');
        if(!S.traits.includes('被績效改善過')) S.traits.push('被績效改善過');
      } else {
        S.pay = Math.round(S.pay*0.97);
        events.push('年度考績 <strong>C</strong>。評語寫得很客氣，但薪水單很誠實：<em>年薪被調降了 3%</em>。');
      }
    } else {
      S.gradeC = 0;
      events.push('年度考績 <strong>B</strong>。不好不壞，跟大多數人一樣。');
    }
  }
  /* ===== 長期高工時 → 早衰（使用者需求）===== */
  if(S.burn>=72){ S.highBurnYrs = (S.highBurnYrs||0) + 1; }
  else if(S.burn<50){ S.highBurnYrs = Math.max(0, (S.highBurnYrs||0) - 1); }
  if(S.highBurnYrs===5 && !S.traits.includes('早衰')){
    S.traits.push('早衰'); S.health++;
    events.push('健檢報告一年比一年長。醫生說了一句你記很久的話：<em>「你的身體年齡比實際年齡大了十歲。」</em>');
  }
  /* ===== 產業風險：金融惡鬥、電子景氣循環（使用者需求）===== */
  if(S.emp && !isFreelance() && S.inESG){
    if(S.emp.ind==='fin' && rnd() < 0.16 + S.rel*0.004){
      S.burn = Math.min(100, S.burn + 10);
      events.push('金控內部又一輪人事角力。<em>你不在牌桌上，卻要陪著熬夜做被拿去互相攻防的簡報。</em>');
    }
    if(S.emp.ind==='elec' || S.emp.ind==='semi'){
      const r = rnd();
      if(r < 0.13){
        events.push('景氣反轉，訂單掉了三成。<em>今年沒有年終</em>——公告貼出來那天，辦公室安靜得聽得見空調聲。');
        S.cash = Math.round(S.cash - S.pay*0.06);
      } else if(r < 0.19){
        events.push('公司爆出關鍵技術外洩，有同事被查出把資料帶去對岸。<em>調查拖了半年，年終砍半</em>，每個人的電腦都被裝了新的監控軟體。');
        S.cash = Math.round(S.cash - S.pay*0.04);
        S.burn = Math.min(100, S.burn + 6);
      }
    }
  }
  S.projPushed = 0;
  // 四大顏色所的特色（item 15）＋ AI 填答系統（item 17）
  if(S.emp && !isFreelance()){
    if(S.emp.wfh) S.burn = Math.max(0, S.burn-4);              // 在家上班少一點通勤耗損
    if(S.emp.profitShare){                                      // 藍色所：分潤
      const mm = mk(S.year)[1];
      const bonus = Math.round(S.pay*(mm>=70?0.10:0.05));
      if(bonus>0){ S.cash += bonus; events.push('藍色所的分潤下來了，帳戶多了 '+bonus+' 萬。'); }
    }
  }
  if(S.aifill && S.inESG){ S.burn = Math.max(0, S.burn-5); S.D += 1; S.G += 1; }
  /* 2026 起，會不會用 AI 做應用拉出差別：用的人省時、產能高、被看見；不用的人在 AI 成熟後被稀釋 */
  if(S.inESG && !isFreelance() && aiLv(S.year)>=5){
    if(S.aifill){
      S.aiEdge=(S.aiEdge||0)+1;
      if(S.aiEdge===2 && !S.traits.includes('AI 加成的人')) S.traits.push('AI 加成的人');
    } else if(aiLv(S.year)>=6 && S.D > cw()*0.40){
      events.push('會議上有人問：這些報告書的活，AI 不是都能做了嗎？<em>你開始感覺到自己被稀釋。</em>');
      S.burn=Math.min(100,S.burn+3);
    }
  }
  /* 帳號會自己長：能見度與號召力持續累積，但也持續吃掉一點體力（item 7）*/
  if(S.selfBrand){ relAdd(1); S.adv=(S.adv||0)+1; S.burn=Math.min(100,S.burn+2); }  // AI 填答系統：省時、順便長揭露與治理
  /* ===== 過勞崩潰（item 7：做永續，人生也要永續）=====
     體力見底（burn 破表）時，身體替你做決定：強制休養、留下代價。 */
  if(S.burn>=100){
    S.collapses=(S.collapses||0)+1; S.health++;
    S.burn=56; S.sp=Math.max(0,S.sp-1); S.pay=Math.round(S.pay*0.98);
    if(!S.traits.includes('過勞崩潰')) S.traits.push('過勞崩潰');
    events.push('<strong>你在辦公室昏倒了。</strong>身體替你做了那個你一直不肯做的決定：停下來。被送醫、強制休養——這一年的考評不用看了。<em>做永續，別忘了自己的人生也要永續。</em>');
  } else if(S.burn>=88){
    events.push('你的體力快見底了。<em>再撐下去，垮的會是你自己。</em>');
  }
  // 破關後選的路，一路發酵（item 5）
  if(S.inESG && !isFreelance()){
    if(S.stampPath==='field') S.dom += 1;                 // 下到前線：產業專業持續累積
    if(S.stampPath==='transform' && S.aifill) S.G += 1;   // 轉型辦公室 × AI：治理力加成
    if(S.stampPath==='transform' && aiLv(S.year)>=6) S.G += 1;
  }
  // 升遷
  if(cross){ events.push(`有人在會議上說：【這件事找你最快】——你的定位成形了：<strong>${cross[0]}</strong>。${cross[1]}`) }
  if(S.inESG && tryPromote()){
    events.push(isFreelance()
      ? `你的報價往上跳了一級。現在客戶找你，是衝著 <strong>${LEVELS[S.level].t}</strong> 的經驗來的，年收入約 ${S.pay} 萬。`
      : `升上 <strong>${LEVELS[S.level].t}</strong>，年薪調整為 ${S.pay} 萬。`);
  }
  else if(S.inESG){
    const damp = S.pay>=260 ? 0.35 : S.pay>=180 ? 0.6 : 1;   // 越接近天花板，調薪越小
    const mNow = mk(S.year)[1], mLabel = mk(S.year)[2];
    const cooling = (mLabel==='逆風初起'||mLabel==='逆風退潮'||mLabel==='泡沫消風'||mLabel==='AI擠壓');
    /* 時代紅利／寒冬（item 11）：狂飆年代加薪快，逆風年代凍薪甚至減薪 */
    let era = mNow>=84 ? 1.7 : mNow>=68 ? 1.15 : mNow>=56 ? 0.85 : 0.55;
    if(cooling) era = Math.min(era, 0.8);       // 逆風／泡沫／AI：加薪幅度被壓住
    let inc=1+(0.013+rnd()*0.013+S.luck*0.0005)*damp*era;
    if(cooling && rnd()<0.22){ inc = 0.985; }   // 消風年代：預算縮手，可能被凍薪甚至微減
    /* 把公司 ESG 分數拉起來的人，加薪談得比較動（item 2）——
       尤其在原本分數難看的公司，進步幅度是最好講的故事。 */
    const lift = (S.emp && S.esgBoost && S.esgBoost[S.emp.id]) || 0;
    if(lift>=6) inc += 0.012;
    if(lift>=12) inc += 0.012;
    if(aiLv(S.year)>=5 && S.D>cw()*0.42 && !S.traits.includes('駕馭工具的人') && !S.aifill) inc-=0.022;   // AI 成熟＋純揭露＋不用工具 → 加薪被壓
    if(aiLv(S.year)>=5 && (S.aifill || S.traits.includes('駕馭工具的人'))) inc+=0.014;                      // 會用 AI 做應用的人 → 加薪較好
    S.pay=Math.round(S.pay*Math.max(1,inc)) }
  else { S.pay=Math.round(S.pay*(1+0.012+rnd()*0.013)) }
  clampPay();   // 薪資天花板：擋住跳槽複利失控
  if(S.abroad){
    S.abroadYrs++;
    /* 海外的變數不是努力能擋的：政策轉向、簽證抽籤、外籍員額 */
    const kick = 0.06 + (S.year>=2025?0.05:0);   // 反移民風向年代風險更高
    if(rnd()<kick){
      S.abroad=0; S.emp=null; S.quitFlag=1; S.cash+=15;
      events.push('政策轉向，公司縮減外籍員額——<em>你的簽證不再續</em>。拿了一筆離職金，你有九十天離境。');
      if(!S.traits.includes('被政策請回')) S.traits.push('被政策請回');
    } else if(S.abroadYrs>=2 && !S.traits.includes('國際線')){ S.traits.push('國際線'); }
  }
  // 「開始找工作」的後果：隔一年真的要離職（item 1）
  if(S.leaveNext && S.year>S.leaveNext && !isFreelance()){
    S.leaveNext=0; S.quitFlag=1;
    events.push('你去年說要開始找工作。今年，你真的遞了辭呈——<em>接下來要換一份工作了</em>。');
  }
  // 裁員風險
  if(S.riskAcc>0 && rnd()<S.riskAcc){ S.riskAcc=0; S.quitFlag=1; S.cash+=20;
    events.push('公司做了組織調整。你的名字在名單上。'); }
  /* ===== 準則年年在變：不學就會退化（使用者需求）=====
     2022 之後這一行的準則、方法學、評比題組每年都在改版。
     一整年沒學到新東西，帳面能力不會馬上掉，但連續兩年就會開始鬆動。 */
  if(S.inESG && !isFreelance() && S.year>=2022){
    if(S.learnedThisYear){ S.staleYrs = 0 }
    else {
      S.staleYrs = (S.staleYrs||0) + 1;
      if(S.staleYrs >= 2){
        const arr=[['E',S.E],['S',S.S],['G',S.G],['D',S.D]].sort(function(a,b){return b[1]-a[1]});
        const k = arr[0][0], drop = Math.min(arr[0][1], S.staleYrs>=4 ? 3 : 2);
        if(drop>0){
          S[k] -= drop; S.decayed = (S.decayed||0) + drop;
          const kn = ({E:'環境力',S:'社會力',G:'治理力',D:'揭露力'})[k];
          events.push(S.staleYrs>=4
            ? '準則又改版了，而你已經<em>連續 '+S.staleYrs+' 年沒有真的學新東西</em>。開會時有人講的名詞你要偷查——'+kn+' <strong>-'+drop+'</strong>。'
            : '今年的準則版本你沒跟上。不是不會做，是<em>做的是舊版的</em>——'+kn+' <strong>-'+drop+'</strong>。');
          if(S.staleYrs>=4 && !S.traits.includes('停在舊版')) S.traits.push('停在舊版');
        }
      }
    }
  }
  S.learnedThisYear = 0;

  if(S.inESG && S.emp && S.emp.ind){
    S.indYrs = S.indYrs || {};
    S.indYrs[S.emp.ind] = (S.indYrs[S.emp.ind]||0) + 1;
    if(NICHE_IND.indexOf(S.emp.ind)>=0 && S.indYrs[S.emp.ind]===5 && !S.expertOf){
      S.expertOf = S.emp.ind;
      const nm = IND[S.emp.ind].n;
      S.dom += 6; relAdd(2);
      if(!S.traits.includes(nm+'的那個人')) S.traits.push(nm+'的那個人');
      events.push('你在'+nm+'做滿五年了。<br>這個產業的永續問題冷門到沒什麼人願意鑽——<em>而你現在是全台灣少數真的懂的人</em>。公會找你去講課，記者開始打電話來問。');
    }
  }
  // 機會
  const offers=[];
  const m=mk(S.year)[1];
  /* 冷門產業的專家反而更常被找：熱門產業人多，冷門產業只有你 */
  const nicheEdge = (S.emp && NICHE_IND.indexOf(S.emp.ind)>=0 && (S.indYrs&&S.indYrs[S.emp.ind]>=4))
    ? Math.min(.14, ((S.indYrs[S.emp.ind]-3) * .035)) : 0;

  const poachP = Math.min(.38,(.03 + S.dom*.015 + S.rel*.01)*(m>=70?2:1));
  if(S.inESG && !isFreelance() && S.esgYrs>=3 && rnd()<poachP) offers.push('poach');
  if(!S.inESG && S.year>=2014 && rnd()< .18+m/300) offers.push('switch');

    const avail = CERTS.filter(c=>!S.certs.includes(c.id) && S.cash>=c.cost+3
      && S.year>=(c.from||0)                            // 證照要到實際開辦年份才會出現（已查證）
      && (c.id!=='sv2' || S.certs.includes('sv1')));   // 社會價值 LV2 要先有 LV1（item 6）
    if(avail.length) certOffer = pick(avail);

  S.hunt = Math.max(0,S.hunt-1);
  S.ledger.push({y:S.year, t:(S.emp?S.emp.n:'')+(S.inESG?'・'+LEVELS[S.level].t:'・非永續職'), p:S.pay});

/* 時代感（item 11）：讓玩家「感覺到」現在是紅利年代還是寒冬 */

    S.burn = Math.max(0, S.burn-35) + (S.cash<0?12:0);
    S.year += 2; S.age += 2; S.workYrs += 2;
    if(!S.traits.includes('海外碩士')) S.traits.push('海外碩士');
    S.ledger.push({y:S.year,t:'辭職出國念書，兩年後回來'+(sch?'（獲獎學金 '+sch+' 萬）':''),p:'',mark:1});
    const schTxt = sch ? (sch>=30
      ? `<br><br>你申請到了整包的官方獎學金——<strong>${sch} 萬</strong>，等於少扛半年的生活費。寫申請書那幾個晚上，值了。`
      : `<br><br>你申請到了 <strong>${sch} 萬</strong>的獎學金。不夠付學費，但夠付幾個月的房租——出國這種事，每一筆都算。`) : '';
    const txt = (S.cash<0
      ? `你把工作辭了，飛出去念書。<br><br>學費加生活費 ${cost} 萬，存款見底還借了一些。兩年後你帶著一張文憑、變好的英文，和<em>零在地年資</em>回到台灣。`
      : `你把工作辭了，飛出去念書。<br><br>兩年，花了 ${cost} 萬。回來時你的英文變好了、看事情的角度變寬了，但台灣的法規和人脈都往前跑了兩年。`) + schTxt;
    if(S.age>=40) return ending();
    return showOutcome(txt, sch?[['英文',5],['獎學金','+'+sch+' 萬'],['存款',-cost],['壓力',-35]]:[['英文',5],['存款',-cost],['壓力',-35]], ()=>rehire());
  }
  if(k==='hunt' || k==='poach'){
    S._offers = genOffers(k); S._otype = k;
    if(!S._offers.length) return nextYear();
    return offerScreen();
  }
  if(k==='switch'){
    S.inESG=true; S.esgYrs=Math.min(S.esgYrs, 1);
    S.level = Math.max(0, S.level - 1);   // 回鍋退一階，不是砍到底
    const bonus=Math.min(.35,(S.workYrs)*.05);
    S.pay=Math.round(LEVELS[0].base*(IND[S.emp.ind]?IND[S.emp.ind].c:1)*S.emp.mult*(.85+mk(S.year)[1]/250)*(1+bonus));
    if(!S.traits.includes('本行加值')) S.traits.push('本行加值');
    let carryMsg='', carryD=[['年薪',S.pay],['產業專業','保留']];
    const cy = S.prevJob && CARRY[S.prevJob];
    if(cy && !S.carried){
      S.carried=1;
      S.E+=cy.E; S.S+=cy.S; S.G+=cy.G; S.D+=cy.D;
      if(!S.traits.includes(cy.t)) S.traits.push(cy.t);
      ['E','S','G','D'].forEach(function(k){ if(cy[k]) carryD.push([({E:'環境力',S:'社會力',G:'治理力',D:'揭露力'})[k], cy[k]]) });
      carryMsg = '<br><br>' + cy.m;
    }
    S.ledger.push({y:S.year,t:'內部轉調，開始做永續',p:S.pay,mark:1});
    return showOutcome(`你舉手了。<br><br>職稱換成永續專員，年薪 <strong>${S.pay} 萬</strong>——比純新鮮人高，因為你的 ${S.workYrs} 年本業年資是有價的。<em>換領域不是從零開始。</em>${carryMsg}`,
      carryD,()=>nextYear());
  }
}

/* ===== 產生工作機會清單 =====
   可及範圍由綜合戰力決定；關係力高時，有機會拿到原本搆不到的位子 */
function offerPay(emp, type){
  if(type==='poach') return Math.round(S.pay*(1.10+rnd()*0.11));
  return Math.round(calcPay(emp, S.level)*(1.06+rnd()*0.10));
}
function genOffers(type){
  const base = EMP.filter(function(e){ return !S.emp || e.id!==S.emp.id });
  const reach = cw() + 8 + Math.floor(S.luck*0.6);
  let pool = base.filter(function(e){
    if(e.bar > reach) return false;
    if(ELITE.indexOf(e.id)>=0) return S.rel>=9 || mk(S.year)[1]>=78;   // 頂尖公司始終要人脈或熱市場
    return true;
  });
  if(type==='poach' && S.emp){
    const same = pool.filter(function(e){ return e.ind===S.emp.ind });
    if(same.length) pool = same;
  }
  if(!pool.length) pool = base.filter(function(e){ return e.bar <= 30 });
  const n = Math.min(pool.length, S.rel>=10 ? 3 : 2);
  const chosen = [];
  const work = pool.slice();
  while(chosen.length < n && work.length){
    chosen.push(work.splice(Math.floor(rnd()*work.length),1)[0]);
  }
  const list = chosen.map(function(e){ return {emp:e, np:offerPay(e,type), lucky:false} });
  /* 關係力帶來的意外機會：超出目前能力範圍的位子 */
  if(S.rel>=11 && rnd() < 0.14 + S.rel*0.018){
    const up = base.filter(function(e){ return e.bar > reach && e.bar <= reach+24 });
    if(up.length){
      const lucky = up[Math.floor(rnd()*up.length)];
      list.unshift({emp:lucky, np:Math.round(offerPay(lucky,'hunt')*1.06), lucky:true});
    }
  }
  return list;
}
function offerScreen(){
  const type=S._otype, list=S._offers;
  const rows = list.map(function(of,i){
    const e=of.emp, cross = S.emp && e.ind!==S.emp.ind;
    return `<button class="opt" onclick="takeOffer(1,${i})">
      <span class="lab">${e.n}${of.lucky?' <span class="tag">意外的機會</span>':''}</span>
      <span class="hint">${empMeta(e)}　年薪 <b>${of.np} 萬</b>${cross?'　跨產業，專業折損四成':'　同產業，專業完整帶走'}<br>${e.f}</span>
    </button>`;
  }).join('');
  const luckyNote = list.some(function(x){return x.lucky})
    ? '<br><br><em>其中一個位子，照你現在的資歷本來排不上。是有人在裡面替你說了話。</em>' : '';
  shell(header()+`<div class="panel panel-pad fade">
    <span class="eyebrow">${type==='hunt'?'獵頭帶來的選項':'同業來挖你'}</span>
    <h2 class="card-title">有 ${list.length} 個位子在等你回覆。</h2>
    <div class="card-body" style="font-size:15px">
      你現在年薪 ${S.pay} 萬。能談到什麼樣的位子，看你這些年累積了什麼。${luckyNote}
      ${type==='poach'?'<br><br>人資都補了同一句：「不過我們要簽兩年競業條款。」':''}
    </div>
    <div class="opts">
      ${rows}
      ${type==='poach'?'<button class="opt" onclick="takeOffer(2,0)"><span class="lab">談掉競業條款再去</span><span class="hint">加薪打折，換自由</span></button>':''}
      <button class="opt" onclick="takeOffer(0,0)"><span class="lab">全部婉拒，留在原地</span></button>
    </div>
  </div>`);
}
function takeOffer(v, idx){
  const type=S._otype;
  const of = S._offers[idx||0];
  const emp = of.emp, np = of.np;
  if(!v){
    if(type==='poach'){ S.pay=Math.round(S.pay*1.07);
      return showOutcome('你留下來了。公司加了薪留你——你知道這是那通電話換來的。',[['年薪','+7%']],()=>nextYear()) }
    return showOutcome('你回了信說最近走不開，留了聯絡方式。<br><br>獵頭說：「有需要隨時找我。」',[['關係力',1]],()=>{relAdd(1);nextYear()});
  }
  const cross = S.emp && emp.ind!==S.emp.ind;
  if(cross){ S.dom=Math.round(S.dom*0.6); S.domName=IND[emp.ind].n }
  else { S.dom+=2 }
  S.pay = v===2 ? Math.round(np*0.88) : np;
  if(S.bond>0){ const fine=Math.round(4*S.bond); S.cash=Math.round(S.cash-fine); S.bondFine=fine; S.bond=0 }
  const leftOrange = S.emp && S.emp.quitStress;   // 橘色所：離職會有壓力
  /* 四大的職級到了企業端常常接不過去（item 6）：
     顧問經理≠企業經理，除非去的是中後段／小公司。 */
  let b4Drop = 0;
  if(S.emp && S.emp.big4 && S.level>=2 && emp.tier!=='中後段' && !emp.big4){
    if(rnd() < 0.72){ b4Drop = 1; S.level = Math.max(1, S.level-1); }
  }
  S.emp=emp; S.inESG=true; S.freelance=0; S.burn=Math.max(0,S.burn-8);
  if(leftOrange){ S.burn=Math.min(100,S.burn+12); if(!S.traits.includes('離開橘色所')) S.traits.push('離開橘色所'); }
  if(v===1&&type==='poach'){ S.compete=2 }
  if(of.lucky && !S.traits.includes('被人拉了一把')) S.traits.push('被人拉了一把');
  S.ledger.push({y:S.year,t:`跳槽到 ${emp.n}`,p:S.pay,mark:1});
  const fineTxt = (S.bondFine ? `<br><br>你還沒跑完服務約，賠了 <strong>${S.bondFine} 萬</strong>違約金。公司出的那筆訓練費，最後還是你自己付了。` : '')
    + (b4Drop ? `<br><br><em>不過職級沒有接過去</em>——你在事務所是${LEVELS[S.level+1].t}，到了企業端從 <strong>${LEVELS[S.level].t}</strong> 開始。顧問的經理和企業的經理，管的不是同一件事。` : '');
  S.bondFine=0;
  /* 中途跳進四大的人，一樣要被分組——原本只有應屆進去的人會分組，
     導致後來才進事務所的玩家永遠碰不到分組與換組的機制。 */
  const needGrp = emp.big4 && !S.big4Grp;
  showOutcome((v===2
      ? `你談掉了競業條款，加薪也打了折。<br><br>年薪 <strong>${S.pay} 萬</strong>。你留住了自由。`
      : `你到職了。<br><br>年薪 <strong>${S.pay} 萬</strong>。${type==='poach'?'接下來兩年，你哪裡都不能去。':''}`)+fineTxt,
    [['年薪',S.pay]], needGrp ? function(){ S._grpThenNext=1; screenBig4Group() } : function(){ nextYear() });
}
function rehireReach(){
  return cw() + 6 + Math.floor(S.luck*0.5) - Math.round(S.jobless*7);
}
function rehireOffers(){
  const m = mk(S.year)[1], reach = rehireReach();
  let pool = EMP.filter(function(e){
    if(e.bar > reach) return false;
    if(ELITE.indexOf(e.id) >= 0) return S.rel>=9 || m>=78;
    if(S.emp && e.id===S.emp.id) return false;
    return true;
  });
  /* 市場冷、空窗久、履歷不夠硬 —— 有時候就是一個回音都沒有 */
  const callback = 0.38 + m/150 + S.rel*0.022 + S.luck*0.010 - S.jobless*0.075 - entryPenalty(S.year);
  if(rnd() > callback) return [];
  const n = Math.min(pool.length, m>=70 ? 3 : 2);
  const out = [], work = pool.slice();
  for(let i=0;i<n && work.length;i++){
    out.push(work.splice(Math.floor(rnd()*work.length),1)[0]);
  }
  return out;
}
function rehire(){
  const m = mk(S.year)[1];
  S._penalty = 1 - Math.min(.15, S.jobless*.05) - entryPenalty(S.year)*0.5;
  S._rehire = rehireOffers();
  const rows = S._rehire.map(function(e,i){
    const est = Math.round(calcPay(e, S.level) * S._penalty);
    return '<button class="opt" onclick="rehirePick(\'take\','+i+')"><span class="lab">'+e.n+'</span>'
      + '<span class="hint">'+empMeta(e)+'　年薪約 <b>'+est+' 萬</b><br>'+e.f+'</span></button>';
  }).join('');
  let lead;
  if(!S._rehire.length){
    lead = S.jobless>=2
      ? '<em>又是一年，一個面試都沒有。</em>投出去的履歷像丟進海裡。你開始懷疑自己是不是離開太久了。'
      : '你投了三十幾封，回信的只有兩家，聊完就沒有下文。<em>這一年，市場沒有你的位子。</em>';
  } else if(S.jobless>=2){
    lead = '空窗第 '+S.jobless+' 年。面試時每個人都會問：「這段時間你在做什麼？」你已經有一套講法了。';
  } else {
    lead = '休息了一陣子，該回去了。你把履歷更新到最新的版本。';
  }
  const opts = rows
    + '<button class="opt" onclick="rehirePick(\'wait\',0)"><span class="lab">再撐一年，繼續找</span>'
    + '<span class="hint">存款會少一截，起薪也會再打折</span></button>'
    + '<button class="opt" onclick="rehirePick(\'free\',0)"><span class="lab">開始接案</span>'
    + '<span class="hint">收入不穩，時間自己掌握。人脈決定你接不接得到</span></button>'
    + '<button class="opt" onclick="rehirePick(\'give\',0)"><span class="lab">先找份非永續的工作</span>'
    + '<span class="hint">永續年資停住，但至少有收入</span></button>';
  shell(header()+'<div class="panel panel-pad fade">'
    + '<span class="eyebrow">空窗期 ・ 市場熱度 '+m+'</span>'
    + '<h2 class="card-title">'+(S._rehire.length?'你在找下一份工作。':'沒有人回你。')+'</h2>'
    + '<div class="card-body">'+lead+'</div>'
    + '<div class="opts">'+opts+'</div></div>');
}
function rehirePick(k, idx){
  const m = mk(S.year)[1];
  if(k==='wait'){
    S.jobless++;
    S.cash = Math.round(S.cash - S.pay*0.22);
    S.burn = Math.max(0, S.burn - 6);
    S.year++; S.age++;
    if(S.age>=40) return ending();
    return rehire();
  }
  if(k==='give'){
    const d = pick(DETOUR);
    S.emp = {id:d.id,n:d.n,ind:d.ind,tier:'中後段',mult:d.mult,bar:0,burn:1.0,pre:5,f:d.f};
    S.inESG=false; S.jobless=0; S.prevJob=d.id;
    S.pay = Math.round(LEVELS[0].base*(IND[d.ind]?IND[d.ind].c:1)*d.mult*(.85+m/280)*(1+Math.min(.35,S.workYrs*.04)));
    S.domName = IND[d.ind].n; S.dom += 4;
    S.ledger.push({y:S.year,t:'轉去 '+d.n+'（非永續）',p:S.pay,mark:1});
    return showOutcome('你去了 <strong>'+d.n+'</strong>。'+d.f
      + '<br><br>年薪 '+S.pay+' 萬。永續年資停在這裡了——<em>但你沒有真的離開，只是先去別的地方等</em>。',
      [['年薪',S.pay]], function(){ nextYear() });
  }
  if(k==='free'){
    S.freelance=1; S.inESG=true; S.jobless=0;
    S.emp={id:'free',n:'自己接案',ind:'cons',tier:'自僱',mult:.9,bar:0,burn:.8,pre:5,f:'沒有年終，沒有勞健保補助，但也沒有人管你幾點下班。'};
    const seniority = 1 + Math.min(.55, S.esgYrs*.045) + Math.min(.30, S.rel*.018);
    S.pay=Math.round(LEVELS[Math.max(0,S.level)].base*.95*seniority*(0.85+rnd()*0.45));
    S.ledger.push({y:S.year,t:'開始接案',p:S.pay,mark:1});
    return showOutcome('你開始接案。<br><br>第一年年薪 <strong>'+S.pay+' 萬</strong>——接得到就有，接不到就沒有。<br><br>'
      + (S.rel>=12?'還好這些年認識的人夠多，案子沒斷過。':'你發現，接不接得到案，跟你認識多少人有關。'),
      [['年薪',S.pay]], function(){ nextYear() });
  }
  const emp = S._rehire[idx||0];
  S.emp=emp; S.inESG=true; S.freelance=0; S.jobless=0;
  S.pay=Math.round(calcPay(emp,S.level)*S._penalty*(S.traits.includes('海外碩士')&&!S.readjusted?0.95:1));
  if(S.traits.includes('海外碩士')&&!S.readjusted) S.readjusted=1;
  S.burn=Math.max(0,S.burn-5);
  S.ledger.push({y:S.year,t:'重新入職 '+emp.n,p:S.pay,mark:1});
  showOutcome('<strong>'+emp.n+'</strong>（'+IND[emp.ind].n+'・'+emp.tier+'）<br>'+emp.f
    + '<br><br>年薪 <strong>'+S.pay+' 萬</strong>。'+(S._penalty<1?'空窗讓起薪打了一點折，但你回來了。':''),
    [['年薪',S.pay]], function(){ nextYear() });
}

/* ============ 結局 ============ */
function goalMet(){
  const g=S.goal.id;
  if(g==='cso') return S.level>=4;
  if(g==='money') return S.pay>=200;
  if(g==='impact') return S.co2>=6;
  if(g==='found') return !!(S.foundFlag || (S.freelance && S.freeYrs>=3));
  if(g==='human') return S.burn<=25 && S.pay>=120 && !S.health;
  if(g==='intl') return !!(S.intlFlag || (S.emp&&S.emp.intl) || (S.intlYrs||0)>=3
      || (S.abroadYrs||0)>=2 || (S.en>=14&&S.traits.includes('海外碩士')&&(S.intlYrs||0)>=1));
  return false;
}

/* ===== 結語：這世界因為你而改變了多少（使用者需求 item 6）=====
   把三個影響力指標（實質減碳 co2／社會影響力 soc／號召 adv）＋公司 ESG 拉抬（esgLift）
   收斂成一段有理想性的結語。刻意不用分數呈現——這一段講的是意義，不是績效。 */
function legacyBlock(){
  const co2=S.co2||0, soc=S.soc||0, adv=S.adv||0, lift=Math.round(S.esgLift||0);
  const score = co2*2 + soc*1.5 + adv*1.5 + lift*0.6;
  const lines=[];

  if(co2>=8) lines.push('你真的把碳減下來了。不是報告書上的數字，是實際少排出去的那些——沒有人幫你辦頒獎典禮，但那些噸數是真的。');
  else if(co2>=4) lines.push('你減下了一些碳。不多，但每一噸都經得起查。');
  else if(co2<=-3) lines.push('回頭看，你有幾次把數字弄得比實際好看。沒有一次違法，每一次都有說得過去的理由——只是加起來，你自己知道那是什麼。');
  else lines.push('你在這個行業做了很多事。認真算的話，實際減下來的碳沒有你當初想像的多——這不完全是你的錯，這個行業有很長一段時間，要的就是把數字寫好看。');

  if(soc>=8) lines.push('你把「人」放回了這件事的中心：供應鏈裡的移工、被裁掉的同事、說不出話的社區。這些沒有指標可以量，但有人的生活因此不一樣。');
  else if(soc>=4) lines.push('你在社會面留下了一些東西——一套制度、一次稽核、一個真的被修好的申訴管道。');

  if(adv>=10) lines.push('而你帶進來的人，比你自己做的還多。你寫的東西、你回過的訊息、你陪著走過的後輩——<em>這個行業的下一棒，有一部分是你遞出去的</em>。');
  else if(adv>=5) lines.push('你影響了一些人。有人因為你的一句話轉了行，有人因為你的文章知道這條路存在。');

  if(lift>=12) lines.push('你待過的公司，因為你在裡面，評分和制度都往上走了一階。那不是你的名字，但那是你的手筆。');

  const verdict = score>=34
    ? '如果把你這二十二年攤開來看：<strong>這個世界因為你，確實有一點點不一樣了。</strong><br>不是因為你拿了什麼獎，是因為那些數字、那些人、那些制度，真的動了。'
    : score>=16
    ? '如果把你這二十二年攤開來看：<strong>你推動的事情不算驚天動地，但它們是真的。</strong><br>這個行業大部分的進展，本來就是靠這樣一點一點累積起來的。'
    : '如果把你這二十二年攤開來看：<strong>你留下的痕跡沒有你希望的那麼深。</strong><br>但你走過了——很多人連走都沒走。';

  return '<hr class="rule"><span class="eyebrow">這個世界，因為你改變了多少</span>'
    + '<div class="outcome" style="margin-top:12px">'
    + lines.map(function(x){ return '<p style="margin:0 0 10px">'+x+'</p>' }).join('')
    + '<p style="margin:14px 0 0">'+verdict+'</p>'
    + '<p style="margin:14px 0 0;color:var(--ink-3);font-size:14.5px">'
    + '這一行從來不是靠一個人改變世界的。它靠的是<em>很多個在四十歲那年還沒放棄的人</em>——而你是其中一個。</p>'
    + '</div>';
}

function ending(){
  autoRecordResult();   // 遊戲結束當下就記錄名字＋MBTI＋結果（不必等玩家動作）

      money:`年薪 ${S.pay} 萬。<br><br>你證明了這件事：做永續，也可以把日子過好。這在你入行的那年，不是一個理所當然的結論。`,
      impact:`你真的減下了碳。<br><br>不是報告書上的數字，是實際少排出去的那些。沒有人幫你辦頒獎典禮，但你自己算得出來。`,
      found:`你有了自己的招牌。<br><br>接案、報價、被拒絕、再接案。沒有年終，沒有組織，只有你自己決定要不要接下一個漂綠的案子。`,

      cso:`你沒有坐上永續長。<br><br>四十歲這年你是${LEVELS[S.level].t}，年薪 ${S.pay} 萬。這在圈子裡不算差——只是離那間辦公室還有兩階。<br><br>能走到那個位子的人本來就很少：2022 年的調查裡，<em>台灣只有 9% 的企業專設永續長</em>——很多公司的組織圖上根本沒有那一層。你不是失敗，你只是活在真實的分布裡。`,
      money:`年薪 ${S.pay} 萬，沒有到兩百。<br><br>你做的每個決定當下都有它的道理。只是這個行業的薪資天花板，比外面想像的低一點。`,
      impact:`你寫了很多報告書。<br><br>認真算的話，實際減下來的碳沒有你預期的多。這不完全是你的錯——這個行業有很長一段時間，要的就是把數字寫得好看。`,
      found:`你沒有出去開自己的公司。<br><br>那個念頭出現過幾次，每次都被房貸、被小孩、被「再等一年」推遲。這也是一種選擇。`,

  if(!S.inESG) t.push('你最後沒有留在永續。這條路你走過一段，然後選了別的方向——這在真實世界裡非常常見。');
  if(S.stampPath==='strategy') t.push('集點集滿的那年，你選了最難走的策略線。回頭看，那是把你送上高處的決定。');
  else if(S.stampPath==='field') t.push('你當年下到前線。有人說你繞了遠路，但你比誰都懂這個產業真正怎麼運作。');

  if((S.adv||0)>=12) t.push('你的號召力是真的：因為你，有一群人走進了這個行業。這件事不會出現在任何報表上，但它可能是你做過最永續的事。');
  else if((S.soc||0)>=12) t.push('你在「人」的那一側留下了痕跡——供應商的工人、部落的窗口、團隊裡被你撐住的人。');
  if(S.collapses>=1) t.push('你垮過'+(S.collapses>1?(S.collapses+' 次'):'一次')+'。身體逼你停下來的那些日子提醒你：<em>做永續，自己的人生也要永續</em>，不然撐不到看見成果的那天。');

  if(S.traits.includes('當年說對的人')) t.push('那份沒人想看的情境分析，最後被海水親自查證了一次。你說對過一次——這個行業會一直記得。');
  if(S.youthFund) t.push('二十幾歲那年，你拿了國家的錢去圓了一個夢。那趟旅程的東西，後來一直在你身上。');
  if((S.gw||0)>=4) t.push('這些年你把數字弄好看過很多次。沒有一次違法，每一次都有說得過去的理由。只是加起來，你不太確定自己還記不記得當初為什麼要做這行。');

  else if(S.co2>=5) t.push('你沒有走捷徑。數字是慢慢做出來的，碳也是慢慢減下來的。');

  shell(`<div class="panel panel-pad fade">
    <span class="eyebrow">${playerRef()}${S.mbti?' ・ '+S.mbti:''} ・ ${S.startYear} 年入學 ・ 四十歲</span>
    <h2 class="card-title" style="font-size:26px">${S.goal.n} <span class="tag">${goalNote}</span></h2>
    <p class="verdict">${verdict}</p>
    ${t.length?`<hr class="rule">${t.map(x=>`<p class="verdict" style="font-size:16px;color:var(--ink-2)">${x}</p>`).join('')}`:''}
    <div class="bigstat">
      <div><div class="k">年薪</div><div class="v mono">${S.pay} 萬</div></div>
      <div><div class="k">職位</div><div class="v" style="font-size:16px">${S.inESG?LEVELS[S.level].t:'非永續職'}</div></div>
      <div><div class="k">永續年資</div><div class="v mono">${yrs} 年</div></div>
      <div><div class="k">綜合戰力</div><div class="v mono">${cw()}</div></div>
      <div><div class="k">實質減碳</div><div class="v mono">${S.co2}</div></div>
      <div><div class="k">社會影響力</div><div class="v mono">${S.soc||0}</div></div>
      <div><div class="k">永續影響力</div><div class="v mono">${S.adv||0}</div></div>
      <div><div class="k">存款</div><div class="v mono">${S.cash} 萬</div></div>
    </div>
    ${S.inESG?`<div class="outcome" style="margin:18px 0 0">
      對照真實世界：在業界的永續職涯薪資調查裡，你的年薪 <strong>${S.pay} 萬</strong>
      大約落在 <strong>PR${salaryPercentile(S.pay)}</strong>。
      <span style="color:var(--ink-3);font-size:14px">（該調查中，永續年資 0–2 年的中位數是 75 萬、3–5 年 85 萬、6–11 年 135 萬；
      你做了 ${S.esgYrs} 年。）</span>
    </div>`:''}
    <span class="eyebrow" style="display:block;margin-top:18px">能力分布</span>
    <div class="stats" style="margin-top:10px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))">
      ${statBar(S.E,'環境 E',60)}${statBar(S.S,'社會 S',60)}${statBar(S.G,'治理 G',60)}${statBar(S.D,'揭露 D',60)}
    </div>
    ${skillCount()?`<hr class="rule"><span class="eyebrow">你真正會做的事（${skillCount()} 項${S.rareSkills?'，其中 '+S.rareSkills+' 項是稀缺技能':''}）</span><div class="traits">${Object.keys(S.skills).map(function(id){const k=skillById(id);return k?`<span class="trait">${k.n}${S.skills[id]>1?' Lv'+S.skills[id]:''}</span>`:''}).join('')}</div>`:''}
    ${S.traits.length?`<hr class="rule"><span class="eyebrow">你成為了什麼樣的人</span><div class="traits">${S.traits.map(x=>`<span class="trait">${x}</span>`).join('')}</div>`:''}
    ${earlyBlock}
    ${legacyBlock()}
    <hr class="rule">
    <span class="eyebrow">職涯總帳 ・ ${S.startYear}–${S.year}</span>
    <div class="ledger" style="max-height:none;margin-top:8px">
      ${S.ledger.map(r=>`<div class="lrow ${r.mark?'mark':''}"><span class="yr mono">${r.y}</span><span class="ev">${r.t}</span><span class="pay mono">${r.p?r.p+'萬':''}</span></div>`).join('')}
    </div>
    <div class="opts" style="flex-direction:row;gap:10px;flex-wrap:wrap">
      <button class="btn" onclick="startSetup()">再玩一次</button>
      <button class="btn ghost" onclick="copyResultImg(this)">複製結果圖</button>
      <button class="btn ghost" onclick="copySeed(this)">複製結果文字</button>
    </div>
    <hr class="rule">
    <span class="eyebrow">留一句話給開發者</span>
    <p class="note" style="margin:6px 0 0">玩得如何？想吐槽、想許願、想被通知未來更新，都寫在這。留 Email 才收得到通知（可留白）。<br><span style="color:var(--ink-3)">※ 這一局的名字與結果會回傳給開發者做統計與改版參考；寫了回饋按「送出」會一起附上，不寫也沒關係。</span></p>
    <textarea class="fbfield" id="fbText" placeholder="想對開發者說的話……"></textarea>
    <input class="fbfield" id="fbMail" type="email" placeholder="你的 Email（想收到更新通知再填）">
    <div class="opts" style="flex-direction:row;gap:10px;flex-wrap:wrap;margin-top:12px">
      <button class="btn" onclick="submitFeedback(this)">送出回饋</button>
      <a class="btn ghost" href="${DEV_LINKEDIN}" target="_blank" rel="noopener" style="text-decoration:none;display:inline-block">開發者 Daz ・ LinkedIn ↗</a>
    </div>
    <hr class="rule">
    <p class="note">種子 <span class="mono">${S.seed.toString(36).toUpperCase()}</span>　你在 ${S.startYear} 年進大學。若換成別的年份，同樣的選擇會走出完全不同的人生——這是這款遊戲唯一想說的事。</p>
  </div>`);
}
function resultSummary(){
  return `永續人森模擬器 ${GAME_VERSION} — ${playerRef()}（${S.mbti||'—'}）／${S.startYear} 入學／${S.goal.n} ${goalMet()?'達成':'未達成'}${S.endedEarly?'／提早結束:'+S.earlyTitle:''}／年薪 ${S.pay} 萬／${S.inESG?LEVELS[S.level].t:'非永續職'}／永續年資 ${S.esgYrs} 年／E${S.E} S${S.S} G${S.G} D${S.D}／減碳${S.co2} 社會${S.soc||0} 號召${S.adv||0}／SEED ${S.seed.toString(36).toUpperCase()}`;
}
/* ===== 結果回傳（item 13, 19）=====
   玩到結局「當下」就立刻記錄名字＋MBTI＋結果（不必等玩家離開、不必按鈕）。
   之後玩家若有寫回饋並按送出，才會再送一列含回饋。 */
function formActionUrl(){ return FEEDBACK_FORM.base.replace('/viewform','/formResponse'); }
function buildFormBody(includeFb){
  const f=FEEDBACK_FORM.fields, body=new URLSearchParams();
  if(FEEDBACK_FORM.extra) body.append(FEEDBACK_FORM.extra, '（遊戲自動回傳）');
  body.append(f.name, playerRef());
  body.append(f.mbti, S.mbti||'');
  body.append(f.result, resultSummary());
  if(includeFb){
    const t=(document.getElementById('fbText')||{}).value||'';
    const mail=(document.getElementById('fbMail')||{}).value||'';
    if(t) body.append(f.feedback, t);
    if(mail) body.append(f.email, mail);
  }
  return body;
}
function recordResult(includeFb){
  if(!FEEDBACK_FORM.CONFIGURED) return Promise.resolve();
  if(typeof fetch!=='function' || typeof URLSearchParams!=='function') return Promise.resolve();
  return fetch(formActionUrl(),{method:'POST',mode:'no-cors',keepalive:true,body:buildFormBody(includeFb)}).catch(function(){});
}
/* 遊戲結束當下自動記錄結果（每局一次） */
function autoRecordResult(){
  if(S._recorded) return; S._recorded = true;
  recordResult(false);
}
function submitFeedback(el){
  const t = (document.getElementById('fbText')||{}).value || '';
  const mail = (document.getElementById('fbMail')||{}).value || '';
  if(FEEDBACK_FORM.CONFIGURED){
    if(el){ el.disabled=true; el.textContent='送出中…'; }
    // 結果已在結局自動記錄；這裡只在「有寫東西」時補送一列含回饋
    const p = (t||mail) ? recordResult(true) : Promise.resolve();
    p.then(function(){ if(el) el.textContent='已送出，謝謝你！🌱'; });
  } else {
    const txt = resultSummary() + '\n\n回饋：' + t + (mail?('\nEmail：'+mail):'');
    if(navigator.clipboard) navigator.clipboard.writeText(txt);
    if(el) el.textContent='已複製回饋，貼給開發者即可';
  }
}
/* 產生一張結果圖，複製到剪貼簿（item 13） */
function copyResultImg(el){
  try{
    const W=1080, H=1350, cv=document.createElement('canvas'); cv.width=W; cv.height=H;
    const x=cv.getContext('2d');
    const dark = window.matchMedia && window.matchMedia('(prefers-color-scheme:dark)').matches;
    const bg=dark?'#15232A':'#FBFCFC', ink=dark?'#E3EAEA':'#15252B', sub=dark?'#A2B2B6':'#4B5D64', acc=dark?'#D6A342':'#8F6410', line=dark?'#293941':'#D1D9DA';
    x.fillStyle=bg; x.fillRect(0,0,W,H);
    x.fillStyle=acc; x.fillRect(70,70,86,44); x.fillStyle=bg; x.font='700 26px sans-serif'; x.textBaseline='middle'; x.fillText('Daz',86,93);
    x.fillStyle=ink; x.font='700 46px "Noto Serif TC",serif'; x.textBaseline='alphabetic'; x.fillText('永續人森模擬器',180,105);
    x.fillStyle=sub; x.font='400 24px sans-serif'; x.fillText(playerRef()+(S.mbti?'　'+S.mbti:'')+'　'+S.startYear+' 入學 → '+S.year+'（四十歲）',72,170);
    x.strokeStyle=ink; x.lineWidth=3; x.beginPath(); x.moveTo(72,195); x.lineTo(W-72,195); x.stroke();
    x.fillStyle=goalMet()?acc:sub; x.font='700 40px "Noto Serif TC",serif';
    x.fillText(S.goal.n+'　'+(goalMet()?'達成':'未達成'),72,265);
    // 大數字
    const cells=[['年薪',S.pay+' 萬'],['職位',S.inESG?LEVELS[S.level].t:'非永續職'],['永續年資',S.esgYrs+' 年'],
      ['綜合戰力',String(cw())],['實質減碳',String(S.co2)],['存款',S.cash+' 萬']];
    let cx=72, cy=320, cwid=(W-144)/3;
    cells.forEach(function(c,i){
      const col=i%3, row=Math.floor(i/3);
      const px=72+col*cwid, py=cy+row*150;
      x.strokeStyle=line; x.lineWidth=1; x.strokeRect(px,py,cwid-14,132);
      x.fillStyle=sub; x.font='400 20px sans-serif'; x.fillText(c[0],px+18,py+42);
      x.fillStyle=ink; x.font='700 40px "Noto Serif TC",serif'; x.fillText(c[1],px+18,py+96);
    });
    // 能力條
    let by=660; x.fillStyle=sub; x.font='400 22px sans-serif'; x.fillText('能力分布',72,by);
    const bars=[['環境 E',S.E],['社會 S',S.S],['治理 G',S.G],['揭露 D',S.D]];
    bars.forEach(function(b,i){
      const py=by+34+i*54;
      x.fillStyle=sub; x.font='400 22px sans-serif'; x.fillText(b[0],72,py+22);
      x.fillStyle=line; x.fillRect(230,py,W-320,26);
      x.fillStyle=acc; x.fillRect(230,py,(W-320)*Math.min(1,b[1]/60),26);
      x.fillStyle=ink; x.font='600 22px sans-serif'; x.fillText(String(b[1]),W-78,py+22);
    });
    // 特質
    let ty=940; x.fillStyle=sub; x.font='400 22px sans-serif'; x.fillText('你成為了什麼樣的人',72,ty);
    x.font='400 24px sans-serif'; let tx=72; ty+=44;
    (S.traits.slice(0,14)).forEach(function(t){
      const w=x.measureText(t).width+34;
      if(tx+w>W-72){ tx=72; ty+=52 }
      x.strokeStyle=acc; x.strokeRect(tx,ty-26,w,38); x.fillStyle=acc; x.fillText(t,tx+17,ty);
      tx+=w+12;
    });
    x.fillStyle=sub; x.font='400 20px sans-serif';
    x.fillText('SEED '+S.seed.toString(36).toUpperCase()+'　・　sustalent　・　linkedin.com/in/dazyin',72,H-52);
    cv.toBlob(function(blob){
      if(navigator.clipboard && window.ClipboardItem){
        navigator.clipboard.write([new ClipboardItem({'image/png':blob})]).then(function(){
          if(el) el.textContent='已複製結果圖';
        }).catch(function(){ imgFallback(cv, el) });
      } else { imgFallback(cv, el) }
    },'image/png');
  }catch(e){ if(el) el.textContent='此瀏覽器不支援，改用結果文字'; }
}
function imgFallback(cv, el){
  // 不能寫剪貼簿時，開新分頁讓玩家自己長按／右鍵存圖
  try{ const w=window.open(); if(w){ w.document.write('<img src="'+cv.toDataURL('image/png')+'" style="max-width:100%">'); } if(el) el.textContent='已開圖，長按或右鍵存圖'; }
  catch(e){ if(el) el.textContent='請改用「複製結果文字」'; }
}
function copySeed(el){
  if(navigator.clipboard) navigator.clipboard.writeText(resultSummary());
  if(el) el.textContent='已複製結果文字';
}

function askRestart(){
  if(!S || S.phase==='setup'){ return startSetup() }
  const box=document.getElementById('app');
  if(document.getElementById('rsConfirm')) return;
  const d=document.createElement('div');
  d.id='rsConfirm';
  d.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:99;padding:20px';
  d.innerHTML='<div class="panel panel-pad" style="max-width:380px"><h3 style="font-family:\'Noto Serif TC\',serif;font-size:19px;margin:0 0 10px">要重新開始嗎？</h3>'
    +'<p class="note" style="margin:0 0 16px">目前這局會消失，換一個開局年份、一所新的學校、一組新的運氣。</p>'
    +'<div style="display:flex;gap:9px"><button class="btn" onclick="doRestart()">重新開始</button>'
    +'<button class="btn ghost" onclick="closeRestart()">繼續這局</button></div></div>';
  d.addEventListener('click',function(ev){ if(ev.target===d) closeRestart() });
  document.body.appendChild(d);
}
function closeRestart(){ const d=document.getElementById('rsConfirm'); if(d) d.remove() }
function doRestart(){ closeRestart(); startSetup() }

screenIntro();
</script>
